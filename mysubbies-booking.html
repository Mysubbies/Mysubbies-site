<style>
  :root {
    /* Navy/gold reskin (Aug 2026), Stage 3 -- see https://www.mysubbies.com.au/'s :root. */
    --ink: #151A26; --black: #14213D; --white: #FFFFFF; --paper: #F7F7F5;
    --stone: #6B7280; --stone-light: #9CA3AF; --line: #E7E7E4; --good: #2F7A50; --warn: #B0592E;
    --accent: #F5A623; --accent-dark: #D98E14; --accent-pale: #FDF0D9;
    --primary-light: #1F335A; --primary-pale: #E7EAF1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1, h2 { font-weight:800; letter-spacing:-0.02em; }
  a { color:inherit; text-decoration:none; }
  header { background: #fff; border-bottom:1px solid var(--line); }
  .navwrap { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { display:flex; align-items:center; gap:9px; }
  .logo-word { font-weight:800; font-size:19px; color:var(--black); }
  .logo-word .gold { color:#FF6A1A; }
  .backlink { font-size:13px; color:var(--stone); }
  .wrap { max-width:640px; margin:0 auto; padding:48px 24px 80px; }
  .quote-summary { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; display:flex; gap:14px; align-items:center; margin-bottom:32px; }
  .quote-summary .qicon { font-size:26px; }
  .quote-summary .qcat { font-weight:700; font-size:16px; }
  .quote-summary .qsub { font-size:13px; color:var(--stone); margin-top:2px; }
  .quote-summary .qprice { margin-left:auto; font-weight:800; font-size:18px; white-space:nowrap; }
  .quote-summary img { width:56px; height:56px; border-radius:10px; object-fit:cover; }
  h1.pagetitle { font-size:26px; margin-bottom:6px; }
  p.pagesub { color:var(--stone); font-size:14px; margin-bottom:28px; }
  .field { margin-bottom:16px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  input[type=text], input[type=email], input[type=password], input[type=tel] {
    width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; color:var(--ink);
    border:1.5px solid var(--line); border-radius:10px; padding:13px 14px; outline:none; background:#fff;
  }
  input:focus { border-color: var(--black); }
  input.field-invalid { border-color:#B4232C !important; background:#FDF3F2; }
  .field-error-label { color:#B4232C; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px) { .row2 { grid-template-columns:1fr; } }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 24px; border-radius:999px; font-size:15px; font-weight:600; cursor:pointer; border:none; width:100%; }
  /* Primary buttons -- bright orange app-wide (Sep 2026). Navy text for
     accessible contrast (white-on-orange falls short at button-label
     sizes). */
  .btn-black { background:#FF6A1A; color:var(--black); font-weight:700; }
  .btn-black:hover { background:#E85A0A; }
  .btn-ghost { background:none; color:var(--stone); font-weight:500; }
  .terms { display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--stone); margin:20px 0; cursor:pointer; }
  .terms input { margin-top:3px; }
  .error { display:flex; gap:8px; align-items:center; padding:12px 14px; border-radius:10px; background:#FDEDEA; color:var(--warn); font-size:13px; margin-bottom:16px; }
  .toggle-mode { text-align:center; font-size:13px; color:var(--stone); margin-top:14px; }
  .toggle-mode a { font-weight:600; color:var(--ink); text-decoration:underline; }
  .empty-state { text-align:center; padding:60px 20px; }
  .empty-state p { color:var(--stone); margin-bottom:24px; }
  .confirm { text-align:center; padding:40px 0; }
  .confirm .tick { width:56px; height:56px; border-radius:999px; background:#EAF5EE; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:26px; }
  .confirm h1 { margin-bottom:10px; }
  .confirm p { color:var(--stone); margin-bottom:28px; }
  .divider { border-top:1px solid var(--line); margin:24px 0; }

  .wrap { max-width:720px; padding:32px 24px 64px; }
  .booking-page-heading { margin-bottom:24px; }
  .booking-step { font-size:12px; font-weight:700; color:var(--stone); letter-spacing:.04em; margin-bottom:10px; }
  .booking-progress { display:flex; gap:6px; max-width:120px; margin-bottom:20px; }
  .booking-progress span { height:4px; flex:1; border-radius:4px; background:var(--black); }
  .booking-progress span:last-child { background:#FF6A1A; }
  h1.pagetitle { font-size:28px; line-height:1.2; letter-spacing:-.035em; margin-bottom:8px; }
  .booking-page-heading .pagesub { margin:0; }
  .quote-summary.booking-summary-card { display:block; padding:24px; border-color:#E4E7EC; border-radius:16px; margin-bottom:20px; box-shadow:0 3px 12px rgba(20,33,61,.025); }
  .btn-outline { border:1px solid #D0D5DD; background:white; color:var(--black); }
  .booking-details-card { display:block; background:white; border:1px solid #E4E7EC; border-radius:16px; padding:24px; }
  .booking-card-title { font-size:19px; font-weight:750; margin-bottom:6px; }
  .booking-details-card .pagesub { font-size:13px; line-height:1.65; margin-bottom:18px; }
  .booking-details-card label { font-size:12px; font-weight:600; }
  .booking-details-card input:not([type=checkbox]) { font-size:16px; border-width:1px; border-color:#D0D5DD; border-radius:9px; padding:11px 12px; }
  .booking-details-card input:focus-visible, .booking-quantity input:focus-visible { outline:3px solid rgba(255,106,26,.18); border-color:#FF6A1A; }
  .booking-details-card .btn { font-family:inherit; border-radius:10px; font-size:14px; }
  .booking-details-card .row2 { gap:12px; }
  .booking-details-card .field-note { font-size:12px; color:var(--stone); margin-top:6px; line-height:1.5; }
  .booking-details-card .toggle-mode { font-size:12px; }
  .booking-details-card .terms { font-size:12px; line-height:1.65; font-weight:400; }
  .booking-review-note { padding:12px 14px; background:#F8FAFC; border-radius:9px; font-size:12px; line-height:1.65; color:var(--stone); margin:16px 0; }
  button:focus-visible, summary:focus-visible { outline:3px solid rgba(255,106,26,.45); outline-offset:3px; }
  @media (max-width:520px) {
    .wrap { padding:24px 16px 40px; }
    .navwrap { padding:0 16px; height:60px; }
    h1.pagetitle { font-size:25px; }
    .booking-page-heading { margin-bottom:20px; }
    .quote-summary.booking-summary-card, .booking-details-card { padding:18px; border-radius:14px; }
    .booking-item-heading h3 { font-size:14px; }
    .booking-request-quote { max-width:100%; }
    .booking-cart-add:not(:empty) { padding:12px; }
  }

  .booking-optional-fields { margin:6px 0 18px; padding:12px; border:1px solid var(--line); border-radius:10px; }
  .booking-optional-fields > summary { font-size:12px; font-weight:600; cursor:pointer; }
  .booking-optional-fields[open] > summary { margin-bottom:16px; }
  .booking-timing-options { display:flex; gap:8px; margin-bottom:12px; }
  .booking-timing-options button { flex:1; padding:11px 8px; border:1px solid #D0D5DD; border-radius:9px; background:white; color:var(--black); font:600 12px 'Plus Jakarta Sans',sans-serif; cursor:pointer; }
  .booking-timing-options button[aria-pressed=true] { border-color:var(--black); background:#E7EAF1; }
  #bookingDateFields[hidden], #bookingCodeFields[hidden] { display:none; }
  .booking-details-card input[type=date], .booking-details-card select { width:100%; font:inherit; padding:11px; border:1px solid #D0D5DD; border-radius:9px; background:white; }
  .booking-email-code { background:#F8FAFC; border-radius:10px; padding:14px; margin-bottom:16px; font-size:12px; color:var(--stone); line-height:1.6; }
  .booking-email-code input { margin:8px 0; }
  .booking-code-resend { border:0; background:none; text-decoration:underline; color:var(--black); font:inherit; cursor:pointer; padding:8px 0; }
</style>

<body>

<header>
  <div class="navwrap">
    <a class="logo" href="https://www.mysubbies.com.au/">
      
      <div class="logo-word">My<span class="gold">Subbies</span></div>
    </a>
    <a class="backlink" href="https://www.mysubbies.com.au/">← Back to site</a>
  </div>
</header>

<div class="wrap" id="app"></div>

<script src="js/address-autocomplete.js"></script>
<script src="js/booking-cart.js"></script>
<script>
  function getJobs() { return JSON.parse(localStorage.getItem('mysubbies_jobs') || '[]'); }
  function saveJobs(jobs, syncJobs = jobs) {
    // Sep 2026 (founder report): a customer's accumulated job history
    // (each job can carry a photo) can push this array past the browser's
    // localStorage quota -- this threw uncaught here, which meant
    // createJob() aborted BEFORE reaching the Supabase sync below, leaving
    // a customer who had just been charged via Stripe with a raw "The
    // quota has been exceeded" browser error and no job record anywhere,
    // local or server. Same fix as saveRateCard() in
    // mysubbies-admin-portal.html: a local caching failure must never
    // block the real server record.
    try {
      localStorage.setItem('mysubbies_jobs', JSON.stringify(jobs));
    } catch (e) {
      console.error('localStorage quota exceeded saving jobs:', e);
    }
    // Fire-and-forget mirror to Supabase so this job is visible from any
    // device, not just this browser — see api/sync-jobs.js. Every page's
    // saveJobs() does this, so every mutation (not just creation) stays in
    // sync without each call site needing to know about the backend.
    getBookingAccessToken().then(token => token && fetch('/api/sync-jobs', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ role: 'customer', jobs: syncJobs }),
    })).catch(() => {});
  }
  function getCustomers() { return JSON.parse(localStorage.getItem('mysubbies_customers') || '{}'); }
  // Same quota-must-never-block-the-flow reasoning as saveJobs() above --
  // localStorage's quota is per-origin, not per-key, so a photo-heavy
  // mysubbies_jobs entry can leave no headroom for this unrelated write.
  function saveCustomers(c) {
    try { localStorage.setItem('mysubbies_customers', JSON.stringify(c)); }
    catch (e) { console.error('localStorage quota exceeded saving customers:', e); }
  }
  function getPendingQuote() { return JSON.parse(localStorage.getItem('mysubbies_pending_quote') || 'null'); }

  let quote = getPendingQuote();
  const app = document.getElementById('app');

  async function getBookingAccessToken() {
    if (!sb) return null;
    const { data } = await sb.auth.getSession();
    return data && data.session && data.session.access_token;
  }

  // Publishable keys are safe to expose client-side by design (unlike the
  // secret key, which only ever lives in Vercel env vars for /api
  // functions). Replace this with your real Stripe publishable key —
  // starts with pk_test_ in test mode, pk_live_ once you go live.
  const STRIPE_PUBLISHABLE_KEY = 'pk_live_51U2oWAPkdmC3yiOV5uqNifeP4xwEBgsu3oqdadRvsIpjuWbh1U0XpPTQBw7qUxHXAbb3MvcTG74g85HHqHsRKYTY00j0Up8qzb';
  const stripe = (typeof Stripe !== 'undefined' && !STRIPE_PUBLISHABLE_KEY.includes('REPLACE_ME'))
    ? Stripe(STRIPE_PUBLISHABLE_KEY) : null;

  // Same publishable/safe-to-expose category as the Stripe key above — this
  // is Supabase's "publishable" key, explicitly designed to be safe in
  // browser code as long as Row Level Security is on (it is; see
  // supabase/schema.sql and schema_v2_marketplace.sql). It can only ever do
  // what RLS policies allow, which for `customers` is "manage your own row,
  // once logged in" — nothing else.
  const SUPABASE_URL = 'https://yloiecuvrejaxxqvjglw.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dxp8_eCHY9nP1xF-LmxfuQ_h427tK3Y';
  const sb = (typeof window.supabase !== 'undefined')
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

  let mode = 'code'; // register, login or an existing authenticated session
  let sessionCustomer = null;
  let bookingCodeEmail = '';
  let bookingCodeRequestedAt = 0;
  let bookingAuthBusy = false;
  let jobType = 'private'; // or 'business'
  let bookingAddressAutocompleteAvailable = false;
  let bookingAddressSelection = null;

  function initBookingAddressAutocomplete() {
    const input = document.getElementById('fAddress');
    if (!input || !window.MySubbiesAddress) return;
    window.MySubbiesAddress.attach(input, {
      statusId: 'fAddressStatus',
      onSelect: selection => {
        bookingAddressSelection = selection;
        const suburbInput = document.getElementById('fSuburb');
        if (suburbInput && selection.suburb) suburbInput.value = selection.suburb;
      },
    }).then(state => { bookingAddressAutocompleteAvailable = !!state; });
  }
  function setJobType(type) {
    jobType = type;
    document.getElementById('jobTypePrivateBtn').className = 'btn ' + (type === 'private' ? 'btn-black' : 'btn-ghost');
    document.getElementById('jobTypeBusinessBtn').className = 'btn ' + (type === 'business' ? 'btn-black' : 'btn-ghost');
    document.getElementById('businessNameField').style.display = type === 'business' ? '' : 'none';
  }

  function renderGroupedItems(items) { return bookingCartMarkup(items); }

  function render() {
    if (!quote) {
      app.innerHTML = `
        <div class="empty-state">
          <h1 class="pagetitle">No job in progress</h1>
          <p>Head back to the site and get an instant price first — that quote carries through to this booking step.</p>
          <a class="btn btn-black" href="https://www.mysubbies.com.au/" style="max-width:280px;margin:0 auto;">Get an estimated price instantly →</a>
        </div>`;
      return;
    }

    app.innerHTML = `
      <div class="booking-page-heading"><p class="booking-step">Step 3 of 3 · Booking details</p><div class="booking-progress" aria-hidden="true"><span></span><span></span><span></span></div><h1 class="pagetitle">Complete your booking</h1><p class="pagesub">Review your job and confirm your details below.</p></div>
      <div class="quote-summary booking-summary-card">
        ${renderGroupedItems(quote.items || [])}
        ${quote.photoDataUrls && quote.photoDataUrls.length > 1 ? `
          <div style="display:flex;gap:8px;overflow-x:auto;padding-top:12px;margin-top:12px;border-top:1px solid var(--line);">
            ${quote.photoDataUrls.map(src => `<img src="${src}" style="width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0;" />`).join('')}
          </div>
        ` : ''}
      </div>

      <section class="booking-details-card">
      <h2 class="booking-card-title">${mode !== 'login' ? 'Contact & booking details' : 'Welcome back'}</h2>
      <p class="pagesub">${mode !== 'login' ? 'Add your contact details and preferred timing to confirm your job.' : 'Log in to continue and track this job under your existing account.'}</p>
      <div class="toggle-mode" style="margin:4px 0 16px;${sessionCustomer ? 'display:none;' : ''}">
        ${mode !== 'login' ? `Have a password? <a href="#" onclick="saveBookingDetails(); mode='login'; render(); return false;">Log in</a>` : `<a href="#" onclick="saveBookingDetails(); mode='code'; render(); return false;">Use an email code instead</a>`}
      </div>

      <div id="errorBox"></div>

      ${mode !== 'login' ? `
        <div class="field"><label>Your name</label><input type="text" id="fName" placeholder="e.g. Sarah Nguyen" /></div>
        <div class="row2">
          <div class="field"><label>Phone</label><input type="tel" id="fPhone" placeholder="04xx xxx xxx" /></div>
          <div class="field"><label>Suburb</label><input type="text" id="fSuburb" value="${quote.suburb || ''}" /></div>
        </div>
        <div class="field"><label>Address</label><input type="text" id="fAddress" placeholder="Start typing your street address" /><div class="field-note" id="fAddressStatus" style="font-size:11.5px;margin-top:6px;color:var(--stone);"></div></div>

        <details class="booking-optional-fields"><summary>Business details or referral code (optional)</summary>
        <div class="field">
          <label>Is this a business or private job?</label>
          <div style="display:flex;gap:8px;">
            <button type="button" id="jobTypePrivateBtn" class="btn ${jobType === 'private' ? 'btn-black' : 'btn-ghost'}" style="flex:1;" onclick="setJobType('private')">Private</button>
            <button type="button" id="jobTypeBusinessBtn" class="btn ${jobType === 'business' ? 'btn-black' : 'btn-ghost'}" style="flex:1;" onclick="setJobType('business')">Business</button>
          </div>
        </div>
        <div class="field" id="businessNameField" style="${jobType === 'business' ? '' : 'display:none;'}"><label>Business name <span style="color:var(--stone-light);font-weight:400;">(for your invoice)</span></label><input type="text" id="fBusinessName" placeholder="e.g. Nguyen Property Co" /></div>

        <div class="field"><label>Referral code <span style="color:var(--stone-light);font-weight:400;">(optional)</span></label><input type="text" id="fReferral" placeholder="Got a code from a friend?" /></div>
        </details>
      ` : ''}

      <div class="field"><label>Email</label><input type="email" id="fEmail" placeholder="you@example.com" /></div>
      ${sessionCustomer || mode === 'code' ? '' : `<div class="field"><label>${mode === 'register' ? 'Create a password to track your job' : 'Password'}</label><input type="password" id="fPassword" autocomplete="${mode === 'register' ? 'new-password' : 'current-password'}" placeholder="${mode === 'register' ? 'Choose a password' : 'Your password'}" /></div>`}

      <div class="field booking-timing"><label>When would you prefer?</label>
        <div class="booking-timing-options" role="group" aria-label="Preferred timing">
          <button type="button" data-timing="ASAP" onclick="chooseBookingTiming('ASAP')">ASAP</button><button type="button" data-timing="date" onclick="chooseBookingTiming('date')">Choose a date</button><button type="button" data-timing="Flexible" onclick="chooseBookingTiming('Flexible')">Flexible</button>
        </div>
        <div id="bookingDateFields" class="row2" hidden><div><label for="fPreferredDate">Preferred date</label><input type="date" id="fPreferredDate" onchange="updateBookingTiming()"></div><div><label for="fPreferredWindow">Time of day</label><select id="fPreferredWindow" onchange="updateBookingTiming()"><option>Any time</option><option>Morning</option><option>Afternoon</option></select></div></div>
        <input type="hidden" id="fTiming"><div class="field-note">This is your preference. Your contractor will confirm availability with you.</div>
      </div>
      ${mode === 'code' && !sessionCustomer ? `<div class="booking-email-code"><p>No password needed. We’ll email you a single-use code to verify your booking details.</p><div id="bookingCodeFields" hidden><label for="fBookingCode">Email verification code</label><input id="fBookingCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Enter the code from your email"><button type="button" class="booking-code-resend" onclick="requestBookingEmailCode()">Send a new code</button></div><p id="bookingCodeStatus" role="status"></p></div>` : ''}
      ${mode !== 'login' ? `
        <div style="background:var(--paper);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:var(--stone);line-height:1.5;">
          <strong style="color:var(--ink);">Cancellation:</strong> free if no contractor has accepted yet. Once accepted, cancelling may incur a fee reflecting work or materials already committed. <a href="mysubbies-faq.html" target="_blank" style="text-decoration:underline;">Read more</a>
        </div>
        <label class="terms"><input type="checkbox" id="fTerms" /> I have read and accept the MySubbies <a href="mysubbies-terms.html" target="_blank" style="text-decoration:underline;">Terms &amp; Conditions</a> and <a href="mysubbies-privacy-policy.html" target="_blank" style="text-decoration:underline;">Privacy Policy</a>, including how payment stages are tracked.</label>
      ` : '<div class="divider"></div>'}


      <p class="booking-review-note">We’ll review your booking before assigning a contractor. Nothing is payable now.</p>
      <div id="bookingError" role="alert"></div>
      <button class="btn btn-black" id="confirmFreeBooking" onclick="submitBooking()">${mode === 'code' && !sessionCustomer ? 'Continue with email code' : 'Confirm booking — $0 due today'}</button>

      </section>
    `;
    restoreBookingDetails();
    restoreBookingTiming();
    if (mode !== 'login') setTimeout(initBookingAddressAutocomplete, 0);
  }

  function showError(msg) {
    document.getElementById('errorBox').innerHTML = `<div class="error">⚠ ${msg}</div>`;
  }

  // Marks each empty required field with a red border and scrolls to the
  // first one, instead of leaving the customer to guess which of several
  // fields the generic error message was about.
  function highlightMissingFields(ids) {
    document.querySelectorAll('.field-invalid').forEach(el => el.classList.remove('field-invalid'));
    let first = null;
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el && !el.value.trim()) { el.classList.add('field-invalid'); if (!first) first = el; }
    });
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); first.focus(); }
    return first;
  }

  async function submitBooking() {
    if (!quote?.items?.length) { showError("Add a task to your cart before continuing."); return; }
    if (bookingCartPricingPending) { showError('Please wait for the updated price before confirming.'); return; }
    if (bookingTimingChoice === 'date' && (!document.getElementById('fPreferredDate').value || document.getElementById('fPreferredDate').value < document.getElementById('fPreferredDate').min)) { showError('Choose a preferred date today or later.'); return; }
    saveBookingDetails();
    if (quote.items.some(item => item.aiEstimated || item.needsSiteVisit)) { showError('This job needs review before quoting. Please submit it for a quote.'); return; }
    quote.urgency = document.getElementById('fTiming').value.trim() || quote.urgency || 'Flexible';
    localStorage.setItem('mysubbies_pending_quote', JSON.stringify(quote));
    if (sessionCustomer) {
      const value = id => document.getElementById(id).value.trim();
      if (!value('fName') || !value('fPhone') || !value('fSuburb') || !value('fAddress')) {
        showError('Please fill in the highlighted fields.'); highlightMissingFields(['fName','fPhone','fSuburb','fAddress']); return;
      }
      if (!document.getElementById('fTerms').checked) { showError('Please accept the Terms & Conditions to continue.'); return; }
      bookingAddressSelection = window.MySubbiesAddress && window.MySubbiesAddress.getSelection('fAddress');
      if (bookingAddressAutocompleteAvailable && !bookingAddressSelection) { showError('Please select your address from the suggestions.'); return; }
      if (jobType === 'business' && !value('fBusinessName')) { showError('Enter the business name for your invoice.'); return; }
      await beginBookingFlow({ ...sessionCustomer, name:value('fName'), phone:value('fPhone'), suburb:value('fSuburb'), address:value('fAddress'),
        addressLocation:bookingAddressSelection || { formattedAddress:value('fAddress'), suburb:value('fSuburb'), verified:false }, jobType, businessName:value('fBusinessName') });
      return;
    }
    if (mode === 'code') { await submitEmailCodeBooking(); return; }
    const email = document.getElementById('fEmail').value.trim().toLowerCase();
    const password = document.getElementById('fPassword').value;
    if (!email || !password) { showError('Enter your email and password.'); highlightMissingFields(['fEmail', 'fPassword']); return; }

    const customers = getCustomers();
    const btn = document.getElementById('confirmFreeBooking');
    const btnLabel = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Please wait…'; }

    try {
      if (mode === 'login') {
        if (!sb) { showError('Login is temporarily unavailable — please try again shortly.'); return; }
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { showError(error.message === 'Invalid login credentials' ? 'No account found with those details.' : error.message); return; }

        // Real account is now the source of truth; keep the local cache
        // (used elsewhere, e.g. the separate My Jobs login) in sync too.
        let { data: profile } = await sb.from('customers').select('*').eq('auth_user_id', data.user.id).maybeSingle();
        if (!profile) {
          const linkResponse = await fetch('/api/customer-register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + data.session.access_token },
            body: JSON.stringify({}),
          });
          const linkResult = await linkResponse.json();
          if (!linkResponse.ok) { showError(linkResult.error || 'Could not link your customer profile.'); return; }
          profile = linkResult.customer;
        }
        if (profile?.status === 'deactivated') {
          showError('This account has been deactivated. Contact MySubbies support if you believe this is a mistake.');
          return;
        }
        const existing = customers[email] || {};
        const merged = { ...existing, name: profile.name || existing.name, phone: profile.phone || existing.phone, email, customerDbId: profile.id, address:profile.address || existing.address, suburb:profile.suburb || existing.suburb || quote.suburb, addressLocation:profile.addressLocation || existing.addressLocation };
        customers[email] = merged;
        saveCustomers(customers);
        // My Jobs (customer-portal.html) checks this exact key to decide
        // whether the customer is logged in -- without it, "Track it in My
        // Jobs" after booking drops them back to a login screen even though
        // their account and job both exist (real bug, Aug 2026: this was
        // never wired up when registration/login moved to Supabase Auth).
        localStorage.setItem('mysubbies_customer_email', email);
        sessionCustomer = merged; mode = 'session';
        render();
        return;
      }

      // register
      const name = document.getElementById('fName').value.trim();
      const phone = document.getElementById('fPhone').value.trim();
      const suburb = document.getElementById('fSuburb').value.trim();
      const address = document.getElementById('fAddress').value.trim();
      const referralInput = document.getElementById('fReferral').value.trim().toUpperCase();
      const terms = document.getElementById('fTerms').checked;
      const businessName = jobType === 'business' ? document.getElementById('fBusinessName').value.trim() : '';
      if (!name || !phone || !suburb || !address || !email || !password) {
        showError('Please fill in the highlighted fields.');
        highlightMissingFields(['fName', 'fPhone', 'fSuburb', 'fAddress', 'fEmail', 'fPassword']);
        return;
      }
      bookingAddressSelection = window.MySubbiesAddress && window.MySubbiesAddress.getSelection('fAddress');
      if (bookingAddressAutocompleteAvailable && !bookingAddressSelection) {
        showError('Please select your address from the suggestions so we can verify the job location.');
        document.getElementById('fAddress').classList.add('field-invalid');
        return;
      }
      if (!terms) { showError('Please accept the Terms & Conditions to continue.'); return; }
      if (jobType === 'business' && !businessName) { showError('Enter the business name for your invoice.'); highlightMissingFields(['fBusinessName']); return; }
      if (customers[email]) { showError('An account with this email already exists — log in instead.'); return; }

      const referralCode = (name.replace(/[^A-Za-z]/g, '').slice(0, 4).toUpperCase() || 'FRND') + Math.floor(1000 + Math.random() * 9000);
      // Sep 2026 -- referredBy used to only "count" if the referrer's own
      // record happened to already be cached in THIS browser's localStorage
      // (Object.values(customers).some(...)), which silently failed for the
      // completely normal case of a new customer on a new device using a
      // code from a friend they'd never shared a browser with. Now just
      // stores whatever code was entered, verbatim, on the real customers
      // row -- the referral-credit system (granted once this customer's
      // first deposit succeeds, see api/stripe-webhook.js) is what actually
      // validates it's a real code server-side, where every customer's
      // record is visible regardless of device.
      const referredBy = referralInput || null;

      let customerDbId = null;
      if (sb) {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) { showError(error.message); return; }
        if (data.user) {
          const { data: inserted } = await sb.from('customers').insert({ auth_user_id: data.user.id, email, name, phone, referral_code: referralCode, referred_by: referredBy }).select().single();
          customerDbId = inserted?.id || null;
        }
      }

      const account = { name, phone, email, referralCode, referredBy, createdAt: new Date().toISOString(), customerDbId,
        addressLocation: bookingAddressSelection || { formattedAddress: address, suburb, verified: false } };
      customers[email] = account;
      saveCustomers(customers);
      // See the matching comment in the login branch above -- same missing
      // session key, same bug.
      localStorage.setItem('mysubbies_customer_email', email);
      // Admin had no way to learn a new customer registered except opening
      // the admin portal's Customers tab and checking themselves -- same
      // gap contractor-application-submitted already closed for contractor
      // applications (Sep 2026 pre-launch audit). Fire-and-forget, never
      // blocks the booking flow over an email hiccup.
      fetch('/api/notify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'customer-registered', name, email, phone, suburb }),
      }).catch(() => {});
      await beginBookingFlow({ ...account, address, suburb, jobType, businessName });
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = btnLabel; }
    }
  }

  const DEFAULT_PAYMENT_SCHEDULE = [
    { key: 'deposit', label: 'Deposit', pct: 5 },
    { key: 'materials', label: 'Materials ordered', pct: 35 },
    { key: 'frame', label: 'Frame stage complete', pct: 50 },
    { key: 'completion', label: 'On completion', pct: 10 },
  ];
  function getPaymentScheduleForCategory(catLabel) {
    try {
      const rateCard = JSON.parse(localStorage.getItem('mysubbies_ratecard') || '[]');
      const cat = rateCard.find(c => c.label === catLabel);
      if (cat && cat.paymentSchedule) return cat.paymentSchedule;
    } catch (e) { /* fall through to default */ }
    return DEFAULT_PAYMENT_SCHEDULE;
  }

  // Entry point after login/registration. Single-category bookings go
  // through a real Stripe deposit payment first — the job isn't created
  // (and never reaches the contractor board) until that succeeds. Bundles
  // (multiple trades in one cart) are a known gap: a single Stripe
  // PaymentIntent maps to one job in this v1 backend, and bundles create
  // several job records at once, so they still use the pre-Stripe
  // immediate-fictional-deposit path below until that's built out properly
  // — see CLAUDE.md.
  let reviewCustomer = null;
  let bookingSubmitting = false;
  const draftJobIds = {};
  function editPendingJob() {
    if (bookingSubmitting) return;
    document.getElementById('bookingCart')?.scrollIntoView({ behavior: 'smooth' });
    openBookingCartAdd();
  }
  function removePendingJob() {
    if (bookingSubmitting) return;
    localStorage.removeItem('mysubbies_pending_quote');
    sessionStorage.removeItem('mysubbies_estimator_draft_v1');
    quote = null;
    reviewCustomer = null;
    window.__mysubbiesPendingBooking = null;
    render();
  }
  async function beginBookingFlow(customer) {
    // The customer has already reviewed the editable cart on this screen.
    // Confirm in place, keeping contact fields intact if the server rejects it.
    reviewCustomer = customer;
    await confirmFreeBooking();
  }
  async function confirmFreeBooking() {
    if (bookingSubmitting || !reviewCustomer || !quote) return;
    bookingSubmitting = true;
    const button = document.getElementById('confirmFreeBooking');
    button.disabled = true;
    document.querySelectorAll('button[onclick="editPendingJob()"], button[onclick="removePendingJob()"]').forEach(b => b.disabled = true);
    try {
      const token = await getBookingAccessToken();
      if (!token) throw new Error('Please log in again to confirm your booking.');
      const categories = [...new Set(quote.items.map(i => i.catLabel))];
      if (!categories.length) throw new Error('Please add a job before booking.');
      for (const category of categories) {
        const jobId = draftJobIds[category] || (draftJobIds[category] = 'job_' + crypto.randomUUID());
        const response = await fetch('/api/create-deposit-intent', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ jobId, category, suburb: reviewCustomer.suburb || quote.suburb,
            basePriceCents: Math.round(quote.items.filter(i => i.catLabel === category).reduce((sum, i) => sum + i.base, 0) * 100),
            accepted: true, termsVersion: PAYMENT_TERMS_VERSION }),
        });
        const data = await response.json();
        if (!response.ok || !data.noDepositRequired) throw new Error(data.error || 'Could not confirm booking. No booking payment was taken.');
      }
      createJob(reviewCustomer, { jobIds: draftJobIds, depositPaid: false, pendingContractReview: true });
    } catch (error) {
      document.getElementById('bookingError').textContent = error.message;
      button.disabled = false;
      document.querySelectorAll('button[onclick="editPendingJob()"], button[onclick="removePendingJob()"]').forEach(b => b.disabled = false);
    } finally { bookingSubmitting = false; }
  }

  const PAYMENT_TERMS_VERSION = 'payment-schedule-2026-08-v1';

  async function renderDepositPayment(customer, catLabel) {
    const items = quote.items || [];
    const catItems = items.filter(i => i.catLabel === catLabel);
    const catBase = catItems.reduce((s, i) => s + i.base, 0);
    const priceCents = Math.round(catBase * 100);
    const jobId = 'job_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

    app.innerHTML = `<h1 class="pagetitle">Loading your payment schedule…</h1>`;

    // Best-effort CRM capture; failure here must never block checkout.
    try {
      const leadToken = await getBookingAccessToken();
      if (leadToken) {
        const params = new URLSearchParams(location.search);
        await fetch('/api/customer-lead-start', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + leadToken },
          body: JSON.stringify({ jobId, category: catLabel, suburb: customer.suburb || quote.suburb || 'Melbourne',
            attribution: { utm_source: params.get('utm_source'), utm_medium: params.get('utm_medium'), utm_campaign: params.get('utm_campaign'), utm_content: params.get('utm_content'), utm_term: params.get('utm_term'), referrer: document.referrer || null, landing_page: location.href },
            marketingConsent: customer.marketingConsent === true, marketingConsentAt: customer.marketingConsentAt || null }),
        });
      }
    } catch (e) { /* CRM capture cannot block checkout */ }

    let preview;
    try {
      const res = await fetch(`/api/job-payment-schedule?category=${encodeURIComponent(catLabel)}&priceCents=${priceCents}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not load payment schedule.');
      preview = data.preview;
    } catch (err) {
      app.innerHTML = `<h1 class="pagetitle">Something went wrong</h1><p class="pagesub">${err.message || 'Could not load your payment schedule. Please go back and try again.'}</p>`;
      return;
    }

    // Referral credit preview (Sep 2026, "Give $50, Get $50") -- a pure
    // display check so the deposit amount shown here matches what
    // api/create-deposit-intent.js will actually charge (it independently
    // re-checks and applies the real discount server-side at payment time
    // -- this is never the source of truth, just so the number on screen
    // isn't a surprise). Best-effort: if this fails, the page still works,
    // it just won't show a credit that does still apply at payment time.
    let creditCents = 0;
    if (customer.email) {
      try {
        const creditRes = await fetch(`/api/create-deposit-intent?email=${encodeURIComponent(customer.email)}`);
        if (creditRes.ok) { const creditData = await creditRes.json(); creditCents = creditData.creditCents || 0; }
      } catch (e) { /* no credit shown -- still applied correctly at payment time if one exists */ }
    }

    const depositMilestone = preview.milestones.find(m => m.milestone_type === 'deposit') || preview.milestones[0];
    const rawDepositCents = depositMilestone.amount_cents;
    const noDepositRequired = rawDepositCents === 0;
    const appliedCreditCents = Math.min(creditCents, Math.max(0, rawDepositCents - 100));
    const depositAmount = (rawDepositCents - appliedCreditCents) / 100;
    const isPendingAdminSchedule = preview.status === 'pending_admin_schedule';

    const scheduleRowsHtml = preview.milestones.map(m => `
      <div class="row"><span class="l">${m.label} (${m.pct}%)</span><span class="r">$${(m.amount_cents / 100).toLocaleString()}</span></div>
    `).join('') + (appliedCreditCents > 0 ? `
      <div class="row" style="color:var(--good);"><span class="l">Referral credit</span><span class="r">−$${(appliedCreditCents / 100).toLocaleString()}</span></div>
    ` : '');

    app.innerHTML = `
      <h1 class="pagetitle">Review your payment schedule</h1>
      <p class="pagesub">${catLabel} — $${catBase.toLocaleString()} total, GST inclusive.</p>

      <div style="background:var(--paper);border-radius:10px;padding:16px;margin-bottom:16px;">
        ${scheduleRowsHtml}
      </div>

      ${isPendingAdminSchedule ? `
        <div style="background:#FFF6E5;border:1px solid #F0DCA6;border-radius:10px;padding:14px;margin-bottom:16px;font-size:12.5px;color:#7A5C1E;line-height:1.6;">
          <strong>Large project booking:</strong> no payment is required today. Your booking will be recorded and held for MySubbies contract/compliance review before it is released to contractors or any payment is requested.
        </div>
      ` : `
        <div style="font-size:12.5px;color:var(--stone);line-height:1.6;margin-bottom:16px;">
          <p style="margin-bottom:8px;"><strong>What releases each payment:</strong> your contractor submits evidence (photos${preview.milestones.some(m => m.requires_evidence_type === 'delivery_docket') ? ', a delivery docket for materials,' : ''}${preview.milestones.some(m => m.requires_evidence_type === 'inspection_certificate') ? ', an inspection certificate,' : ''} and a written update) for each stage. You review it and approve payment, or raise an issue — nothing is charged without your approval or the review period expiring.</p>
          <p style="margin-bottom:8px;"><strong>Cancellation & refunds:</strong> free if no contractor has accepted yet. Once accepted, cancelling may incur a fee reflecting work or materials already committed.</p>
          <p style="margin-bottom:8px;"><strong>Variations:</strong> if extra work is needed, your contractor submits a variation with price and time impact — nothing proceeds until you approve it in writing.</p>
          <p><strong>Disputes:</strong> if you raise an issue on a milestone, that payment is paused and reviewed by MySubbies before release.</p>
        </div>
      `}

      <label class="terms" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:16px;">
        <input type="checkbox" id="fScheduleAccept" style="margin-top:3px;" />
        <span style="font-size:12.5px;">${noDepositRequired ? 'I confirm I want to book this job and understand it will be reviewed before contractor release or payment.' : 'I have reviewed and agree to the total price and milestone payment schedule.'}</span>
      </label>

      ${noDepositRequired ? '' : '<div id="cardElement" style="padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;"></div>'}
      <div id="depositError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
      <button class="btn btn-black" id="payDepositBtn" disabled style="opacity:0.5;" onclick="confirmDepositPayment()">${noDepositRequired ? 'Book job — $0 due today →' : 'Pay $' + depositAmount.toLocaleString() + ' deposit →'}</button>
    `;

    document.getElementById('fScheduleAccept').addEventListener('change', (e) => {
      const btn = document.getElementById('payDepositBtn');
      btn.disabled = !e.target.checked;
      btn.style.opacity = e.target.checked ? '1' : '0.5';
    });

    if (!noDepositRequired) {
      if (!stripe) {
        document.getElementById('depositError').textContent = 'Card payment is temporarily unavailable. Please try again shortly.';
        document.getElementById('payDepositBtn').disabled = true;
        return;
      }
      const elements = stripe.elements();
    // hidePostalCode: Stripe's built-in postal code field defaults to
    // US-style 5-digit validation with no way to configure it for
    // Australia's 4-digit postcodes — it rejected a real postcode like
    // "3000" as "incomplete". We already collect suburb/address in the
    // registration step above, so the field is redundant anyway; hiding it
    // removes the confusing mismatch instead of working around it.
      window.__mysubbiesCardElement = elements.create('card', { hidePostalCode: true });
      window.__mysubbiesCardElement.mount('#cardElement');
    } else {
      window.__mysubbiesCardElement = null;
    }
    window.__mysubbiesPendingBooking = { customer, catLabel, catBase, depositAmount, jobId, noDepositRequired };
  }

  async function confirmDepositPayment() {
    const pending = window.__mysubbiesPendingBooking;
    if (!pending) return;
    const btn = document.getElementById('payDepositBtn');
    const errBox = document.getElementById('depositError');
    const accepted = document.getElementById('fScheduleAccept').checked;
    if (!accepted) { errBox.textContent = 'Please confirm you agree to the payment schedule first.'; return; }
    btn.disabled = true;
    btn.textContent = 'Processing…';
    errBox.textContent = '';

    try {
      const accessToken = await getBookingAccessToken();
      if (!accessToken) throw new Error('Please log in again before continuing.');
      const res = await fetch('/api/create-deposit-intent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
        body: JSON.stringify({
          jobId: pending.jobId,
          category: pending.catLabel,
          suburb: pending.customer.suburb || quote.suburb || 'Melbourne',
          contractorEmail: null,
          basePriceCents: Math.round(pending.catBase * 100),
          accepted: true,
          customerId: pending.customer.customerDbId || null,
          customerEmail: pending.customer.email || null,
          termsVersion: PAYMENT_TERMS_VERSION,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not start payment.');

      if (data.noDepositRequired) {
        createJob(pending.customer, { presetJobId: pending.jobId, depositPaid: false, noDepositRequired: true, pendingContractReview: true });
        return;
      }

      const result = await stripe.confirmCardPayment(data.clientSecret, {
        payment_method: { card: window.__mysubbiesCardElement },
      });
      if (result.error) throw new Error(result.error.message);

      createJob(pending.customer, { presetJobId: pending.jobId, depositPaymentIntentId: result.paymentIntent.id, depositPaid: true });
    } catch (err) {
      errBox.textContent = err.message || 'Payment failed. Please try again.';
      btn.disabled = false;
      btn.textContent = pending.noDepositRequired ? 'Book job — $0 due today →' : 'Pay $' + pending.depositAmount.toLocaleString() + ' deposit →';
    }
  }

  // Resizes a data-URI image client-side (canvas), same technique already
  // used for rate-card task photos in mysubbies-admin-portal.html -- used
  // here to shrink a customer's job photo down to an email-safe thumbnail
  // before it goes into the new-job-available notification (see that
  // call site below for why raw uploads can't go straight into an email
  // that fans out to multiple contractors).
  function resizeImageDataUrl(dataUrl, maxWidth, quality) {
    return new Promise((resolve) => {
      if (!dataUrl) { resolve(null); return; }
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(null);
      img.src = dataUrl;
    });
  }
  function createJob(customer, paymentInfo) {
    const jobs = getJobs();
    const items = quote.items || [];
    const uniqueCats = [...new Set(items.map(i => i.catLabel))];
    const isBundle = uniqueCats.length > 1;
    const bundleId = isBundle ? 'bundle_' + Date.now() : null;
    const createdJobs = [];

    // Property-specific override (Aug 2026): set by mysubbies-customer-portal.html
    // when a multi-property customer raises a job from a specific property's
    // House Health view, so the new job is correctly tagged to THAT property
    // instead of silently defaulting to the account's single saved address
    // below. Cleared immediately so it never leaks into a later, unrelated
    // booking in the same browser session.
    let addressOverride = null;
    try {
      const raw = localStorage.getItem('mysubbies_new_job_property');
      if (raw) { addressOverride = JSON.parse(raw); localStorage.removeItem('mysubbies_new_job_property'); }
    } catch (e) { /* malformed override -- fall back to the account address below */ }

    uniqueCats.forEach(catLabel => {
      const catItems = items.filter(i => i.catLabel === catLabel);
      const catBase = catItems.reduce((s, i) => s + i.base, 0);
      const catLow = catBase;
      const catHigh = catBase;
      const singleItem = catItems.length === 1 ? catItems[0] : null;
      const paymentSchedule = getPaymentScheduleForCategory(catLabel);
      const useRealPayment = paymentInfo && (paymentInfo.presetJobId || paymentInfo.jobIds?.[catLabel]);
      const job = {
        id: useRealPayment ? (paymentInfo.jobIds?.[catLabel] || paymentInfo.presetJobId) : ('job_' + Date.now() + '_' + Math.floor(Math.random() * 1000)),
        category: catLabel, icon: catItems[0].catIcon,
        items: catItems,
        unit: singleItem ? singleItem.unit : null, qty: singleItem ? singleItem.qty : null,
        basePrice: catBase, priceLow: catLow, priceHigh: catHigh,
        suburb: (addressOverride && addressOverride.suburb) || customer.suburb || quote.suburb || 'Melbourne',
        address: (addressOverride && addressOverride.address) || customer.address || '',
        addressLocation: (addressOverride && addressOverride.addressLocation) || customer.addressLocation || null,
        customerName: customer.name, customerPhone: customer.phone, customerEmail: customer.email,
        jobType: customer.jobType || 'private', businessName: customer.businessName || '',
        site: quote.site, access: quote.access, urgency: quote.urgency, hasPhoto: quote.hasPhoto, photoDataUrl: quote.photoDataUrl || null, photoDataUrls: quote.photoDataUrls || (quote.photoDataUrl ? [quote.photoDataUrl] : []),
        status: (useRealPayment && paymentInfo.pendingContractReview) ? 'pending_contract_review' : 'feed', contractor: null,
        bundleId, bundleCategories: isBundle ? uniqueCats : null,
        paymentSchedule,
        // Bundles (and any booking made before Stripe was wired up) still use
        // the old fictional immediate-deposit flag — see beginBookingFlow().
        // Single-category real payments record the true PaymentIntent id and
        // require an actual Stripe success before this ever runs.
        paidStages: { deposit: useRealPayment ? !!paymentInfo.depositPaid : false },
        depositPaymentIntentId: useRealPayment ? paymentInfo.depositPaymentIntentId : null,
        messages: [], internalMessages: [],
        createdAt: new Date().toISOString(),
      };
      jobs.unshift(job);
      createdJobs.push(job);
    });

    saveJobs(jobs, createdJobs);
    sessionStorage.removeItem('mysubbies_estimator_draft_v1');
    sessionStorage.removeItem(BOOKING_DETAILS_KEY);
    localStorage.removeItem('mysubbies_pending_quote');

    // Fire-and-forget, one per created job (a bundle notifies each trade's
    // contractors separately) — never blocks the confirmation screen over
    // an email hiccup, same posture as every other /api/notify call in
    // this codebase. Added Aug 2026: until this existed, a contractor had
    // no way to learn a new job existed except opening the portal and
    // checking the Job Feed tab themselves. Sep 2026: now sends the real
    // minimum offer details (category, quantity, suburb and urgency).
    // Access instructions, site notes and customer photos are deliberately
    // withheld until the accepting contractor is authoritatively assigned.
    createdJobs.filter(job => job.status === 'feed').forEach(async (job) => {
      const taskName = job.items && job.items.length === 1 ? job.items[0].taskName
        : job.items && job.items.length > 1 ? job.items.length + ' items'
        : null;
      fetch('/api/notify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'new-job-available', jobId: job.id, category: job.category, suburb: job.suburb, taskName,
          items: (job.items || []).map(i => ({ taskName: i.taskName, qty: i.qty, unit: i.unit })),
          qty: job.qty, unit: job.unit, urgency: job.urgency, basePrice: job.basePrice,
        }),
      }).catch(() => {});
    });

    app.innerHTML = `
      <div class="confirm">
        <div class="tick">✓</div>
        <h1>${createdJobs[0].status === 'pending_contract_review' ? 'Booking received!' : 'Finding your contractor'}</h1>
        <p>${createdJobs[0].status === 'pending_contract_review'
          ? `We’ve received your ${createdJobs[0].category} booking in ${createdJobs[0].suburb}. We’ll check the details before arranging your contractor and keep you updated. No payment is due today.`
          : (isBundle
            ? `Your renovation in ${createdJobs[0].suburb} is now live on the contractor board \u2014 ${uniqueCats.join(', ')}, dispatched separately to the right trade for each.`
            : `${createdJobs[0].category} in ${createdJobs[0].suburb} is now live on the contractor board.`)}</p>
        <a class="btn btn-black" href="mysubbies-customer-portal.html" style="max-width:320px;margin:0 auto 12px;">Track ${isBundle ? 'them' : 'it'} in My Jobs →</a>
        <a class="btn btn-ghost" href="https://www.mysubbies.com.au/" style="max-width:320px;margin:0 auto;">Back to site</a>
      </div>`;
  }

  let bookingTimingChoice = 'Flexible';
  function chooseBookingTiming(choice) {
    bookingTimingChoice = choice;
    document.querySelectorAll('[data-timing]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.timing === choice)));
    document.getElementById('bookingDateFields').hidden = choice !== 'date';
    updateBookingTiming();
  }
  function updateBookingTiming() {
    const date = document.getElementById('fPreferredDate').value;
    const window = document.getElementById('fPreferredWindow').value;
    document.getElementById('fTiming').value = bookingTimingChoice === 'date' ? (date ? `${date} — ${window}` : '') : bookingTimingChoice;
    saveBookingDetails();
  }
  function restoreBookingTiming() {
    const timing = document.getElementById('fTiming').value || 'Flexible';
    const match = timing.match(/^(\d{4}-\d{2}-\d{2})/);
    const local = new Date(); local.setMinutes(local.getMinutes() - local.getTimezoneOffset());
    document.getElementById('fPreferredDate').min = local.toISOString().slice(0,10);
    if (match) {
      document.getElementById('fPreferredDate').value = match[1];
      const timeWindow = timing.split(' — ')[1];
      if (['Any time','Morning','Afternoon'].includes(timeWindow)) document.getElementById('fPreferredWindow').value = timeWindow;
    }
    chooseBookingTiming(match ? 'date' : timing === 'ASAP' ? 'ASAP' : 'Flexible');
  }
  function validateEmailBookingDetails() {
    const value = id => document.getElementById(id).value.trim();
    if (highlightMissingFields(['fName','fPhone','fSuburb','fAddress','fEmail'])) { showError('Please complete the highlighted details.'); return null; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value('fEmail'))) { showError('Enter a valid email address.'); return null; }
    if (bookingTimingChoice === 'date' && (!value('fPreferredDate') || value('fPreferredDate') < document.getElementById('fPreferredDate').min)) { showError('Choose a preferred date today or later.'); return null; }
    if (!document.getElementById('fTerms').checked) { showError('Please accept the Terms & Conditions to continue.'); return null; }
    if (jobType === 'business' && !value('fBusinessName')) { showError('Enter your business name for the invoice.'); return null; }
    bookingAddressSelection = window.MySubbiesAddress && window.MySubbiesAddress.getSelection('fAddress');
    if (bookingAddressAutocompleteAvailable && !bookingAddressSelection) { showError('Please select your address from the suggestions.'); return null; }
    return {name:value('fName'),phone:value('fPhone'),email:value('fEmail').toLowerCase(),suburb:value('fSuburb'),address:value('fAddress'),jobType,businessName:value('fBusinessName')};
  }
  async function requestBookingEmailCode() {
    if (bookingAuthBusy) return;
    const details = validateEmailBookingDetails(); if (!details) return;
    if (bookingCodeEmail === details.email && Date.now() - bookingCodeRequestedAt < 60000) { showError('Please wait a minute before requesting another code.'); return; }
    const button = document.getElementById('confirmFreeBooking');
    bookingAuthBusy = true; button.disabled = true;
    try {
      const response = await fetch('/api/customer-register', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request_booking_code',email:details.email})});
      const result = await response.json();
      if (!response.ok || !result.sent) throw new Error(result.error || 'Could not send your email code.');
      bookingCodeEmail = details.email; bookingCodeRequestedAt = Date.now();
      document.getElementById('bookingCodeFields').hidden = false;
      document.getElementById('bookingCodeStatus').textContent = 'Code sent. Check your inbox and spam folder.';
      button.textContent = 'Verify & confirm booking — $0 due today';
      document.getElementById('fBookingCode').focus();
    } catch (error) { showError(error.message); }
    finally { bookingAuthBusy = false; button.disabled = false; }
  }
  async function submitEmailCodeBooking() {
    if (bookingAuthBusy) return;
    const details = validateEmailBookingDetails(); if (!details) return;
    if (!sb) { showError('Email verification is temporarily unavailable. Please try again shortly.'); return; }
    if (bookingCodeEmail !== details.email) { await requestBookingEmailCode(); return; }
    const code = document.getElementById('fBookingCode').value.trim();
    if (!/^\d{6,10}$/.test(code)) { showError('Enter the verification code from your email.'); return; }
    const button = document.getElementById('confirmFreeBooking');
    bookingAuthBusy = true; button.disabled = true;
    try {
      const { data, error } = await sb.auth.verifyOtp({email:details.email,token:code,type:'email'});
      if (error || !data?.session) throw new Error('That code is invalid or expired. Please try again or request a new code.');
      const response = await fetch('/api/customer-register', {method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({firstName:details.name,phone:details.phone,referralCode:document.getElementById('fReferral').value.trim()})});
      const profile = await response.json();
      if (!response.ok || !profile.customer) throw new Error(profile.error || 'Could not save your customer details.');
      sessionCustomer = {...details,customerDbId:profile.customer.id,addressLocation:bookingAddressSelection || {formattedAddress:details.address,suburb:details.suburb,verified:false}};
      const customers = getCustomers(); customers[details.email] = {...customers[details.email],...sessionCustomer}; saveCustomers(customers);
      localStorage.setItem('mysubbies_customer_email',details.email);
      mode = 'session';
      document.getElementById('fEmail').readOnly = true;
      document.querySelector('.booking-email-code').hidden = true;
      button.textContent = 'Confirm booking — $0 due today';
      await beginBookingFlow(sessionCustomer);
    } catch (error) { showError(error.message); }
    finally { bookingAuthBusy = false; if (document.getElementById('confirmFreeBooking')) button.disabled = false; }
  }
  async function checkBookingAuthOptions() {
    if (sessionCustomer || mode !== 'code') return;
    try {
      const response = await fetch('/api/customer-register?action=booking-auth-options');
      const options = await response.json();
      if (response.ok && options.emailCodeEnabled === false && mode === 'code') { saveBookingDetails(); mode='register'; render(); }
    } catch (_) { /* Explicit request-code errors keep password login available. */ }
  }

  const BOOKING_DETAILS_KEY = 'mysubbies_booking_details_v1';
  function saveBookingDetails() {
    const details = {};
    for (const id of ['fName','fPhone','fSuburb','fAddress','fEmail','fBusinessName','fReferral','fTiming','fPreferredDate','fPreferredWindow']) {
      const input = document.getElementById(id); if (input) details[id] = input.value;
    }
    details.jobType = jobType;
    try { sessionStorage.setItem(BOOKING_DETAILS_KEY, JSON.stringify(details)); } catch (_) {}
  }
  function restoreBookingDetails() {
    let details = {};
    try { details = JSON.parse(sessionStorage.getItem(BOOKING_DETAILS_KEY) || '{}'); } catch (_) {}
    const account = sessionCustomer || {};
    const initial = { fName:account.name, fPhone:account.phone, fEmail:account.email, fSuburb:quote?.suburb || account.suburb, fAddress:account.address, fTiming:quote?.urgency, fPreferredWindow:'Any time' };
    for (const id of ['fName','fPhone','fSuburb','fAddress','fEmail','fBusinessName','fReferral','fTiming','fPreferredDate','fPreferredWindow']) {
      const input = document.getElementById(id);
      if (input) input.value = (sessionCustomer && id === 'fEmail' ? account.email : details[id] || initial[id]) || '';
      if (input && sessionCustomer && id === 'fEmail') input.readOnly = true;
    }
    if (details.jobType && document.getElementById('jobTypePrivateBtn')) setJobType(details.jobType);
  }
  app.addEventListener('input', saveBookingDetails);
  app.addEventListener('change', saveBookingDetails);
  async function hydrateBookingSession() {
    if (!sb || !quote) return;
    try {
      const { data } = await sb.auth.getSession();
      if (!data?.session) return;
      const { data: profile } = await sb.from('customers').select('*').eq('auth_user_id', data.session.user.id).maybeSingle();
      if (!profile || profile.status === 'deactivated') return;
      // Do not replace a form the customer has already started filling in.
      const password = document.getElementById('fPassword');
      if (password && password.value) return;
      saveBookingDetails();
      sessionCustomer = profile; mode = 'session';
      render();
    } catch (_) { /* Login/registration remains available. */ }
  }
  render();
  hydrateBookingSession();
  checkBookingAuthOptions();
  if (quote && quote.items.length === 0) openBookingCartAdd();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
