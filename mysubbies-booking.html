<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mysubbies — Complete your booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --ink: #171717; --black: #000000; --white: #FFFFFF; --paper: #F7F7F5;
    --stone: #6B6B68; --stone-light: #9C9C97; --line: #E4E4E1; --good: #2F7A50; --warn: #B0592E;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1, h2 { font-weight:800; letter-spacing:-0.02em; }
  a { color:inherit; text-decoration:none; }
  header { background: var(--black); }
  .navwrap { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { display:flex; align-items:center; gap:9px; }
  .logo-mark { width:28px; height:28px; border-radius:7px; background:#fff; }
  .logo-word { font-weight:800; font-size:19px; color:#fff; }
  .backlink { font-size:13px; color:rgba(255,255,255,0.65); }
  .wrap { max-width:640px; margin:0 auto; padding:48px 24px 80px; }
  .quote-summary { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; display:flex; gap:14px; align-items:center; margin-bottom:32px; }
  .quote-summary .qicon { font-size:26px; }
  .quote-summary .qcat { font-weight:700; font-size:16px; }
  .quote-summary .qsub { font-size:13px; color:var(--stone); margin-top:2px; }
  .quote-summary .qprice { margin-left:auto; font-weight:800; font-size:18px; white-space:nowrap; }
  .quote-summary img { width:56px; height:56px; border-radius:10px; object-fit:cover; }
  h1.pagetitle { font-size:26px; margin-bottom:6px; }
  p.pagesub { color:var(--stone); font-size:14px; margin-bottom:28px; }
  .field { margin-bottom:16px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  input[type=text], input[type=email], input[type=password], input[type=tel] {
    width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; color:var(--ink);
    border:1.5px solid var(--line); border-radius:10px; padding:13px 14px; outline:none; background:#fff;
  }
  input:focus { border-color: var(--black); }
  input.field-invalid { border-color:#B4232C !important; background:#FDF3F2; }
  .field-error-label { color:#B4232C; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px) { .row2 { grid-template-columns:1fr; } }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 24px; border-radius:999px; font-size:15px; font-weight:600; cursor:pointer; border:none; width:100%; }
  .btn-black { background:var(--black); color:#fff; }
  .btn-ghost { background:none; color:var(--stone); font-weight:500; }
  .terms { display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--stone); margin:20px 0; cursor:pointer; }
  .terms input { margin-top:3px; }
  .error { display:flex; gap:8px; align-items:center; padding:12px 14px; border-radius:10px; background:#FDEDEA; color:var(--warn); font-size:13px; margin-bottom:16px; }
  .toggle-mode { text-align:center; font-size:13px; color:var(--stone); margin-top:14px; }
  .toggle-mode a { font-weight:600; color:var(--ink); text-decoration:underline; }
  .empty-state { text-align:center; padding:60px 20px; }
  .empty-state p { color:var(--stone); margin-bottom:24px; }
  .confirm { text-align:center; padding:40px 0; }
  .confirm .tick { width:56px; height:56px; border-radius:999px; background:#EAF5EE; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:26px; }
  .confirm h1 { margin-bottom:10px; }
  .confirm p { color:var(--stone); margin-bottom:28px; }
  .divider { border-top:1px solid var(--line); margin:24px 0; }
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mysubbies">
</head>
<body>

<header>
  <div class="navwrap">
    <a class="logo" href="mysubbies-website.html">
      <div class="logo-mark"><svg viewBox="0 0 60 60" width="100%" height="100%"><rect x="4" y="4" width="52" height="52" rx="15" fill="#FFFFFF"/><path d="M17 42 V19 L30 33 L43 19 V42" fill="none" stroke="#000000" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="logo-word">Mysubbies</div>
    </a>
    <a class="backlink" href="mysubbies-website.html">← Back to site</a>
  </div>
</header>

<div class="wrap" id="app"></div>

<script>
  function getJobs() { return JSON.parse(localStorage.getItem('mysubbies_jobs') || '[]'); }
  function saveJobs(jobs) {
    localStorage.setItem('mysubbies_jobs', JSON.stringify(jobs));
    // Fire-and-forget mirror to Supabase so this job is visible from any
    // device, not just this browser — see api/sync-jobs.js. Every page's
    // saveJobs() does this, so every mutation (not just creation) stays in
    // sync without each call site needing to know about the backend.
    fetch('/api/sync-jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobs }) }).catch(() => {});
  }
  function getCustomers() { return JSON.parse(localStorage.getItem('mysubbies_customers') || '{}'); }
  function saveCustomers(c) { localStorage.setItem('mysubbies_customers', JSON.stringify(c)); }
  function getPendingQuote() { return JSON.parse(localStorage.getItem('mysubbies_pending_quote') || 'null'); }

  const quote = getPendingQuote();
  const app = document.getElementById('app');

  // Publishable keys are safe to expose client-side by design (unlike the
  // secret key, which only ever lives in Vercel env vars for /api
  // functions). Replace this with your real Stripe publishable key —
  // starts with pk_test_ in test mode, pk_live_ once you go live.
  const STRIPE_PUBLISHABLE_KEY = 'pk_test_51U2ob6B25lHD6dwFqx6bGEipaEkk6A74k1eU9F12rF6gPNju9U9vnjZ5jj23z7Zi8IckThWii8kf6MF2tBXjXtSA00pOTmdFUJ';
  const stripe = (typeof Stripe !== 'undefined' && !STRIPE_PUBLISHABLE_KEY.includes('REPLACE_ME'))
    ? Stripe(STRIPE_PUBLISHABLE_KEY) : null;

  // Same publishable/safe-to-expose category as the Stripe key above — this
  // is Supabase's "publishable" key, explicitly designed to be safe in
  // browser code as long as Row Level Security is on (it is; see
  // supabase/schema.sql and schema_v2_marketplace.sql). It can only ever do
  // what RLS policies allow, which for `customers` is "manage your own row,
  // once logged in" — nothing else.
  const SUPABASE_URL = 'https://yloiecuvrejaxxqvjglw.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dxp8_eCHY9nP1xF-LmxfuQ_h427tK3Y';
  const sb = (typeof window.supabase !== 'undefined')
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

  let mode = 'register'; // or 'login'
  let jobType = 'private'; // or 'business'
  function setJobType(type) {
    jobType = type;
    document.getElementById('jobTypePrivateBtn').className = 'btn ' + (type === 'private' ? 'btn-black' : 'btn-ghost');
    document.getElementById('jobTypeBusinessBtn').className = 'btn ' + (type === 'business' ? 'btn-black' : 'btn-ghost');
    document.getElementById('businessNameField').style.display = type === 'business' ? '' : 'none';
  }

  function renderGroupedItems(items) {
    const uniqueCats = [...new Set(items.map(i => i.catLabel))];
    const groups = uniqueCats.map(catLabel => ({
      catLabel, catIcon: items.find(i => i.catLabel === catLabel).catIcon,
      items: items.filter(i => i.catLabel === catLabel),
    }));
    const bundleNote = uniqueCats.length > 1
      ? `<div style="font-size:11.5px;color:var(--stone);background:var(--paper);border-radius:8px;padding:9px 12px;margin-top:10px;line-height:1.5;">This will be booked as ${uniqueCats.length} separate jobs \u2014 one per trade, each with its own contractor.</div>`
      : '';
    return `
      <div style="border-top:1px solid var(--line);padding-top:12px;">
        ${groups.map(g => `
          ${uniqueCats.length > 1 ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--stone);margin:8px 0 4px;">${g.catIcon} ${g.catLabel}</div>` : ''}
          ${g.items.map(i => `
            <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--stone);">
              <span>${uniqueCats.length > 1 ? '' : (i.catIcon || '') + ' '}${i.taskName} <span style="color:var(--stone-light);">(${i.qty} ${i.unit})</span></span>
              <span style="font-weight:600;color:var(--ink);">$${i.base.toLocaleString()}</span>
            </div>
          `).join('')}
        `).join('')}
      </div>
      ${bundleNote}
    `;
  }

  function render() {
    if (!quote) {
      app.innerHTML = `
        <div class="empty-state">
          <h1 class="pagetitle">No job in progress</h1>
          <p>Head back to the site and get an instant price first — that quote carries through to this booking step.</p>
          <a class="btn btn-black" href="mysubbies-website.html" style="max-width:280px;margin:0 auto;">Get an instant price →</a>
        </div>`;
      return;
    }

    app.innerHTML = `
      <div class="quote-summary" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;gap:14px;align-items:center;margin-bottom:${quote.items && quote.items.length ? '14px' : '0'};">
          ${quote.photoDataUrl && (!quote.photoDataUrls || quote.photoDataUrls.length <= 1) ? `<img src="${quote.photoDataUrl}" />` : `<div class="qicon">${quote.icon}</div>`}
          <div>
            <div class="qcat">${quote.category}</div>
            <div class="qsub">${quote.items ? quote.items.length + ' item' + (quote.items.length===1?'':'s') : ''}${quote.suburb ? ' · ' + quote.suburb : ''}</div>
          </div>
          <div class="qprice">$${quote.low.toLocaleString()}</div>
        </div>
        ${quote.items && quote.items.length ? renderGroupedItems(quote.items) : ''}
        ${quote.photoDataUrls && quote.photoDataUrls.length > 1 ? `
          <div style="display:flex;gap:8px;overflow-x:auto;padding-top:12px;margin-top:12px;border-top:1px solid var(--line);">
            ${quote.photoDataUrls.map(src => `<img src="${src}" style="width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0;" />`).join('')}
          </div>
        ` : ''}
      </div>

      <h1 class="pagetitle">${mode === 'register' ? 'A few details to send this off' : 'Welcome back'}</h1>
      <p class="pagesub">${mode === 'register' ? 'This creates your Mysubbies account so you can track the job — separate from contractor logins.' : 'Log in to continue and track this job under your existing account.'}</p>
      <div class="toggle-mode" style="margin:4px 0 16px;">
        ${mode === 'register' ? `Already registered? <a href="#" onclick="mode='login'; render(); return false;">Log in</a>` : `New here? <a href="#" onclick="mode='register'; render(); return false;">Create an account</a>`}
      </div>

      <div id="errorBox"></div>

      ${mode === 'register' ? `
        <div class="field"><label>Your name</label><input type="text" id="fName" placeholder="e.g. Sarah Nguyen" /></div>
        <div class="row2">
          <div class="field"><label>Phone</label><input type="tel" id="fPhone" placeholder="04xx xxx xxx" /></div>
          <div class="field"><label>Suburb</label><input type="text" id="fSuburb" value="${quote.suburb || ''}" /></div>
        </div>
        <div class="field"><label>Address</label><input type="text" id="fAddress" placeholder="Street address" /></div>

        <div class="field">
          <label>Is this a business or private job?</label>
          <div style="display:flex;gap:8px;">
            <button type="button" id="jobTypePrivateBtn" class="btn ${jobType === 'private' ? 'btn-black' : 'btn-ghost'}" style="flex:1;" onclick="setJobType('private')">Private</button>
            <button type="button" id="jobTypeBusinessBtn" class="btn ${jobType === 'business' ? 'btn-black' : 'btn-ghost'}" style="flex:1;" onclick="setJobType('business')">Business</button>
          </div>
        </div>
        <div class="field" id="businessNameField" style="${jobType === 'business' ? '' : 'display:none;'}"><label>Business name <span style="color:var(--stone-light);font-weight:400;">(for your invoice)</span></label><input type="text" id="fBusinessName" placeholder="e.g. Nguyen Property Co" /></div>

        <div class="field"><label>Referral code <span style="color:var(--stone-light);font-weight:400;">(optional)</span></label><input type="text" id="fReferral" placeholder="Got a code from a friend?" /></div>
      ` : ''}

      <div class="field"><label>Email</label><input type="email" id="fEmail" placeholder="you@example.com" /></div>
      <div class="field"><label>Password</label><input type="password" id="fPassword" placeholder="${mode === 'register' ? 'Choose a password' : 'Your password'}" /></div>

      ${mode === 'register' ? `
        <div style="background:#FFF6E5;border:1px solid #F0DCA6;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:#7A5C1E;line-height:1.5;">
          <strong>Controlled pilot:</strong> Mysubbies is in invitation-only testing.${stripe
            ? ' Your deposit is charged securely via Stripe when this job is approved. The remaining payment stages (materials, frame, completion) are not yet processed through Stripe — they\'re confirmed manually between you and your contractor as work progresses.'
            : ' No card is charged and no funds move through the platform at this stage — payment stages shown in your job tracker are confirmed manually between you and your contractor.'}
        </div>
        <div style="background:var(--paper);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:var(--stone);line-height:1.5;">
          <strong style="color:var(--ink);">Cancellation:</strong> free if no contractor has accepted yet. Once accepted, cancelling may incur a fee reflecting work or materials already committed. <a href="mysubbies-faq.html" target="_blank" style="text-decoration:underline;">Read more</a>
        </div>
        <label class="terms"><input type="checkbox" id="fTerms" /> I have read and accept the Mysubbies <a href="mysubbies-terms.html" target="_blank" style="text-decoration:underline;">Terms &amp; Conditions</a>, including how payment stages are tracked.</label>
      ` : '<div class="divider"></div>'}

      <button class="btn btn-black" onclick="submitBooking()">${mode === 'register' ? 'Approve & send to a contractor' : 'Log in & continue'}</button>
      <div class="toggle-mode">
        ${mode === 'register' ? `Already registered? <a href="#" onclick="mode='login'; render(); return false;">Log in</a>` : `New here? <a href="#" onclick="mode='register'; render(); return false;">Create an account</a>`}
      </div>
    `;
  }

  function showError(msg) {
    document.getElementById('errorBox').innerHTML = `<div class="error">⚠ ${msg}</div>`;
  }

  // Marks each empty required field with a red border and scrolls to the
  // first one, instead of leaving the customer to guess which of several
  // fields the generic error message was about.
  function highlightMissingFields(ids) {
    document.querySelectorAll('.field-invalid').forEach(el => el.classList.remove('field-invalid'));
    let first = null;
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el && !el.value.trim()) { el.classList.add('field-invalid'); if (!first) first = el; }
    });
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); first.focus(); }
    return first;
  }

  async function submitBooking() {
    const email = document.getElementById('fEmail').value.trim().toLowerCase();
    const password = document.getElementById('fPassword').value;
    if (!email || !password) { showError('Enter your email and password.'); highlightMissingFields(['fEmail', 'fPassword']); return; }

    const customers = getCustomers();
    const btn = document.querySelector('.btn-black');
    const btnLabel = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Please wait…'; }

    try {
      if (mode === 'login') {
        if (!sb) { showError('Login is temporarily unavailable — please try again shortly.'); return; }
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { showError(error.message === 'Invalid login credentials' ? 'No account found with those details.' : error.message); return; }

        // Real account is now the source of truth; keep the local cache
        // (used elsewhere, e.g. the separate My Jobs login) in sync too.
        const { data: profile } = await sb.from('customers').select('*').eq('auth_user_id', data.user.id).maybeSingle();
        const existing = customers[email] || {};
        const merged = { ...existing, name: profile?.name || existing.name, phone: profile?.phone || existing.phone, email, password };
        customers[email] = merged;
        saveCustomers(customers);
        beginBookingFlow(merged);
        return;
      }

      // register
      const name = document.getElementById('fName').value.trim();
      const phone = document.getElementById('fPhone').value.trim();
      const suburb = document.getElementById('fSuburb').value.trim();
      const address = document.getElementById('fAddress').value.trim();
      const referralInput = document.getElementById('fReferral').value.trim().toUpperCase();
      const terms = document.getElementById('fTerms').checked;
      const businessName = jobType === 'business' ? document.getElementById('fBusinessName').value.trim() : '';
      if (!name || !phone || !suburb || !address || !email || !password) {
        showError('Please fill in the highlighted fields.');
        highlightMissingFields(['fName', 'fPhone', 'fSuburb', 'fAddress', 'fEmail', 'fPassword']);
        return;
      }
      if (!terms) { showError('Please accept the Terms & Conditions to continue.'); return; }
      if (jobType === 'business' && !businessName) { showError('Enter the business name for your invoice.'); highlightMissingFields(['fBusinessName']); return; }
      if (customers[email]) { showError('An account with this email already exists — log in instead.'); return; }

      const referralCode = (name.replace(/[^A-Za-z]/g, '').slice(0, 4).toUpperCase() || 'FRND') + Math.floor(1000 + Math.random() * 9000);
      const referredBy = Object.values(customers).some(c => c.referralCode === referralInput) ? referralInput : null;

      if (sb) {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) { showError(error.message); return; }
        if (data.user) {
          await sb.from('customers').insert({ auth_user_id: data.user.id, email, name, phone });
        }
      }

      const account = { name, phone, email, password, referralCode, referredBy, createdAt: new Date().toISOString() };
      customers[email] = account;
      saveCustomers(customers);
      beginBookingFlow({ ...account, address, suburb, jobType, businessName });
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = btnLabel; }
    }
  }

  const DEFAULT_PAYMENT_SCHEDULE = [
    { key: 'deposit', label: 'Deposit', pct: 5 },
    { key: 'materials', label: 'Materials ordered', pct: 35 },
    { key: 'frame', label: 'Frame stage complete', pct: 50 },
    { key: 'completion', label: 'On completion', pct: 10 },
  ];
  function getPaymentScheduleForCategory(catLabel) {
    try {
      const rateCard = JSON.parse(localStorage.getItem('mysubbies_ratecard') || '[]');
      const cat = rateCard.find(c => c.label === catLabel);
      if (cat && cat.paymentSchedule) return cat.paymentSchedule;
    } catch (e) { /* fall through to default */ }
    return DEFAULT_PAYMENT_SCHEDULE;
  }

  // Entry point after login/registration. Single-category bookings go
  // through a real Stripe deposit payment first — the job isn't created
  // (and never reaches the contractor board) until that succeeds. Bundles
  // (multiple trades in one cart) are a known gap: a single Stripe
  // PaymentIntent maps to one job in this v1 backend, and bundles create
  // several job records at once, so they still use the pre-Stripe
  // immediate-fictional-deposit path below until that's built out properly
  // — see CLAUDE.md.
  function beginBookingFlow(customer) {
    const items = quote.items || [];
    const uniqueCats = [...new Set(items.map(i => i.catLabel))];
    if (uniqueCats.length === 1 && stripe) {
      renderDepositPayment(customer, uniqueCats[0]);
    } else {
      createJob(customer);
    }
  }

  function renderDepositPayment(customer, catLabel) {
    const items = quote.items || [];
    const catItems = items.filter(i => i.catLabel === catLabel);
    const catBase = catItems.reduce((s, i) => s + i.base, 0);
    const paymentSchedule = getPaymentScheduleForCategory(catLabel);
    const depositStage = paymentSchedule.find(s => s.key === 'deposit') || paymentSchedule[0];
    const depositAmount = Math.round(catBase * (depositStage.pct / 100) * 100) / 100;
    const jobId = 'job_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

    app.innerHTML = `
      <h1 class="pagetitle">Pay your deposit</h1>
      <p class="pagesub">${depositStage.label || 'Deposit'} (${depositStage.pct}%) for ${catLabel} — the rest follows the staged schedule shown in your job tracker.</p>
      <div style="background:var(--paper);border-radius:10px;padding:16px;margin-bottom:16px;">
        <div class="row"><span class="l">Deposit due now</span><span class="r" style="font-weight:700;">$${depositAmount.toLocaleString()}</span></div>
      </div>
      <div id="cardElement" style="padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;"></div>
      <div id="depositError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
      <button class="btn btn-black" id="payDepositBtn" onclick="confirmDepositPayment('${jobId}', '${catLabel.replace(/'/g,"\\'")}')">Pay $${depositAmount.toLocaleString()} deposit →</button>
    `;

    const elements = stripe.elements();
    // hidePostalCode: Stripe's built-in postal code field defaults to
    // US-style 5-digit validation with no way to configure it for
    // Australia's 4-digit postcodes — it rejected a real postcode like
    // "3000" as "incomplete". We already collect suburb/address in the
    // registration step above, so the field is redundant anyway; hiding it
    // removes the confusing mismatch instead of working around it.
    window.__mysubbiesCardElement = elements.create('card', { hidePostalCode: true });
    window.__mysubbiesCardElement.mount('#cardElement');
    window.__mysubbiesPendingBooking = { customer, catLabel, catBase, depositAmount, jobId };
  }

  async function confirmDepositPayment(jobId, catLabel) {
    const pending = window.__mysubbiesPendingBooking;
    if (!pending) return;
    const btn = document.getElementById('payDepositBtn');
    const errBox = document.getElementById('depositError');
    btn.disabled = true;
    btn.textContent = 'Processing…';
    errBox.textContent = '';

    try {
      const res = await fetch('/api/create-deposit-intent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          jobId: pending.jobId,
          category: pending.catLabel,
          suburb: pending.customer.suburb || quote.suburb || 'Melbourne',
          contractorEmail: null,
          basePriceCents: Math.round(pending.catBase * 100),
          depositAmountCents: Math.round(pending.depositAmount * 100),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not start payment.');

      const result = await stripe.confirmCardPayment(data.clientSecret, {
        payment_method: { card: window.__mysubbiesCardElement },
      });
      if (result.error) throw new Error(result.error.message);

      createJob(pending.customer, { presetJobId: pending.jobId, depositPaymentIntentId: result.paymentIntent.id, depositPaid: true });
    } catch (err) {
      errBox.textContent = err.message || 'Payment failed. Please try again.';
      btn.disabled = false;
      btn.textContent = `Pay $${pending.depositAmount.toLocaleString()} deposit →`;
    }
  }

  function createJob(customer, paymentInfo) {
    const jobs = getJobs();
    const items = quote.items || [];
    const uniqueCats = [...new Set(items.map(i => i.catLabel))];
    const isBundle = uniqueCats.length > 1;
    const bundleId = isBundle ? 'bundle_' + Date.now() : null;
    const createdJobs = [];

    uniqueCats.forEach(catLabel => {
      const catItems = items.filter(i => i.catLabel === catLabel);
      const catBase = catItems.reduce((s, i) => s + i.base, 0);
      const catLow = catBase;
      const catHigh = catBase;
      const singleItem = catItems.length === 1 ? catItems[0] : null;
      const paymentSchedule = getPaymentScheduleForCategory(catLabel);
      const useRealPayment = !isBundle && paymentInfo && paymentInfo.presetJobId;
      const job = {
        id: useRealPayment ? paymentInfo.presetJobId : ('job_' + Date.now() + '_' + Math.floor(Math.random() * 1000)),
        category: catLabel, icon: catItems[0].catIcon,
        items: catItems,
        unit: singleItem ? singleItem.unit : null, qty: singleItem ? singleItem.qty : null,
        basePrice: catBase, priceLow: catLow, priceHigh: catHigh,
        suburb: customer.suburb || quote.suburb || 'Melbourne', address: customer.address || '',
        customerName: customer.name, customerPhone: customer.phone, customerEmail: customer.email,
        jobType: customer.jobType || 'private', businessName: customer.businessName || '',
        site: quote.site, access: quote.access, urgency: quote.urgency, hasPhoto: quote.hasPhoto, photoDataUrl: quote.photoDataUrl || null, photoDataUrls: quote.photoDataUrls || (quote.photoDataUrl ? [quote.photoDataUrl] : []),
        status: 'feed', contractor: null,
        bundleId, bundleCategories: isBundle ? uniqueCats : null,
        paymentSchedule,
        // Bundles (and any booking made before Stripe was wired up) still use
        // the old fictional immediate-deposit flag — see beginBookingFlow().
        // Single-category real payments record the true PaymentIntent id and
        // require an actual Stripe success before this ever runs.
        paidStages: { deposit: useRealPayment ? !!paymentInfo.depositPaid : true },
        depositPaymentIntentId: useRealPayment ? paymentInfo.depositPaymentIntentId : null,
        messages: [], internalMessages: [],
        createdAt: new Date().toISOString(),
      };
      jobs.unshift(job);
      createdJobs.push(job);
    });

    saveJobs(jobs);
    localStorage.removeItem('mysubbies_pending_quote');

    app.innerHTML = `
      <div class="confirm">
        <div class="tick">✓</div>
        <h1>${isBundle ? createdJobs.length + ' jobs sent!' : 'Job sent!'}</h1>
        <p>${isBundle
          ? `Your renovation in ${createdJobs[0].suburb} is now live on the contractor board \u2014 ${uniqueCats.join(', ')}, dispatched separately to the right trade for each.`
          : `${createdJobs[0].category} in ${createdJobs[0].suburb} is now live on the contractor board.`}</p>
        <a class="btn btn-black" href="mysubbies-customer-portal.html" style="max-width:320px;margin:0 auto 12px;">Track ${isBundle ? 'them' : 'it'} in My Jobs →</a>
        <a class="btn btn-ghost" href="mysubbies-website.html" style="max-width:320px;margin:0 auto;">Back to site</a>
      </div>`;
  }

  render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
