<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MySubbies — Property Management Admin</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#151A26;--navy:#14213D;--paper:#F7F7F5;--stone:#6B7280;--line:#E7E7E4;--orange:#FF6A1A;--good:#2F7A50;--warn:#B0592E}*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--paper);color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{max-width:1280px;margin:auto;padding:28px 20px 70px}header{background:#fff;border-bottom:1px solid var(--line)}.nav{max-width:1280px;margin:auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;font-size:19px;color:var(--navy)}.logo span{color:var(--orange)}a{color:inherit;text-decoration:none}.btn{border:0;border-radius:999px;padding:10px 16px;font-size:12.5px;font-weight:700;cursor:pointer}.primary{background:var(--orange);color:var(--navy)}.outline{background:#fff;border:1.5px solid var(--line)}h1{font-size:25px;margin:0 0 4px}.sub{font-size:13px;color:var(--stone);margin-bottom:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{font-size:23px}.stat span{display:block;font-size:11px;color:var(--stone)}.tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;padding:9px 13px;border-radius:8px;background:#EDEBE7;color:var(--stone);font-weight:700;font-size:12px}.tabs button.active{background:var(--navy);color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.list{display:grid;gap:10px}.org-head,.wo-head{display:flex;justify-content:space-between;gap:14px}.title{font-weight:800}.meta{font-size:11.5px;color:var(--stone);margin-top:3px}.pill{display:inline-flex;padding:3px 8px;border-radius:999px;background:#EEE;font-size:10px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{padding:7px 11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{font-size:11.5px;font-weight:700;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px;background:#fff}.field textarea{min-height:80px}.modalback{position:fixed;inset:0;background:rgba(20,33,61,.45);display:grid;place-items:center;padding:18px;z-index:40}.modal{background:#fff;border-radius:18px;padding:22px;width:min(620px,100%);max-height:90vh;overflow:auto}.modal h2{font-size:19px;margin:0 0 5px}.error{background:#FDEDEA;color:#8F2E27;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px}.empty{text-align:center;padding:50px;color:var(--stone)}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}th,td{text-align:left;padding:11px;font-size:11.5px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#F1F1EE;color:var(--stone);font-size:10px;text-transform:uppercase}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}table,thead,tbody,tr,td{display:block}thead{display:none}tr{padding:8px;border-bottom:1px solid var(--line)}td{border:0;padding:5px 10px}.toolbar{align-items:flex-start;flex-direction:column}}</style></head><body>
<header><div class="nav"><a class="logo" href="mysubbies-admin-portal.html">My<span>Subbies</span> Admin</a><a class="btn outline" href="mysubbies-admin-portal.html">← Main admin</a></div></header><main class="wrap" id="app"></main><div id="modal"></div>
<script>
let data=null,catalog=null,tab='orders';const app=document.getElementById('app');const modal=document.getElementById('modal');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function money(c){return c==null?'—':new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(c/100)}function nice(v){return String(v||'—').replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase())}
async function req(action,body){const r=await fetch('/api/property-management'+(body?'':'?action='+encodeURIComponent(action)),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...body})}:{});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{data=await req('admin-summary');try{catalog=await (await fetch('/api/booking-api?action=catalog')).json()}catch(e){catalog={categories:[]}}render()}catch(e){app.innerHTML='<div class="card"><h1>Property Management Admin</h1><div class="error">'+esc(e.message)+'</div><p class="sub">Open the main admin portal, complete the normal MFA login, then return here. This page uses the same secure HttpOnly admin session.</p><a class="btn primary" href="mysubbies-admin-portal.html">Open main admin</a></div>'}}
function render(){const w=data.workOrders||[],orgs=data.organisations||[];const pending=w.filter(x=>x.approval_status==='pending').length,ready=w.filter(x=>x.status==='ready_to_release').length,active=w.filter(x=>['released','assigned','in_progress'].includes(x.status)).length;app.innerHTML='<h1>Property & Facilities Management</h1><div class="sub">One maintenance partner. One portal. Complete job visibility.</div><div class="stats"><div class="stat"><b>'+orgs.length+'</b><span>Organisations</span></div><div class="stat"><b>'+pending+'</b><span>Client approvals pending</span></div><div class="stat"><b>'+ready+'</b><span>Ready to release</span></div><div class="stat"><b>'+active+'</b><span>Active jobs</span></div></div><div class="toolbar"><div class="tabs">'+['orders','organisations','properties','contacts'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="tab=\''+t+'\';render()">'+nice(t)+'</button>').join('')+'</div><button class="btn primary" onclick="newOrg()">+ Onboard organisation</button></div>'+viewHtml()}
function orgName(id){return (data.organisations.find(x=>x.id===id)||{}).name||'Unknown organisation'}function prop(id){return data.properties.find(x=>x.id===id)||{}}
function viewHtml(){if(tab==='organisations')return orgsHtml();if(tab==='properties')return propertiesHtml();if(tab==='contacts')return contactsHtml();return ordersHtml()}
function ordersHtml(){const rows=data.workOrders||[];if(!rows.length)return '<div class="empty">No property work orders yet.</div>';return '<div class="list">'+rows.map(o=>{const p=prop(o.property_id),linked=o.linkedJob||{};return '<div class="card"><div class="wo-head"><div><div class="title">'+esc(o.task_summary)+'</div><div class="meta">'+esc(orgName(o.organisation_id))+' · '+esc(p.address||'')+' · '+nice(o.priority)+'</div></div><div><span class="pill">'+nice(o.status)+'</span></div></div><div class="meta" style="margin-top:8px">Price '+money(o.quoted_price_cents)+' · Approval '+nice(o.approval_status)+' · Legal review '+nice(o.legal_review_status)+(linked.jobNumber?' · Job #'+linked.jobNumber:'')+(linked.contractorAssigned?' · Contractor assigned':'')+'</div><div class="actions">'+(o.service_mode==='project_quote'||!o.quoted_price_cents?'<button class="btn outline" onclick="quote(\''+o.id+'\')">Set quote</button>':'<button class="btn outline" onclick="quote(\''+o.id+'\')">Edit quote</button>')+(o.status==='ready_to_release'?'<button class="btn primary" onclick="releaseJob(\''+o.id+'\')">Release to contractors</button>':'')+'<button class="btn outline" onclick="updateOrder(\''+o.id+'\')">Update / invoice</button></div></div>'}).join('')+'</div>'}
function orgsHtml(){return '<div class="list">'+(data.organisations||[]).map(o=>'<div class="card"><div class="org-head"><div><div class="title">'+esc(o.name)+'</div><div class="meta">'+nice(o.organisation_type)+' · '+nice(o.status)+' · Approval '+(o.approval_required?'required':'not required')+'</div></div><div class="actions" style="margin:0"><button class="btn outline" onclick="addProperty(\''+o.id+'\')">+ Property</button><button class="btn outline" onclick="addContact(\''+o.id+'\')">+ Contact</button></div></div></div>').join('')+'</div>'}
function propertiesHtml(){return '<table><thead><tr><th>Organisation</th><th>Property</th><th>Address</th><th>Access</th></tr></thead><tbody>'+(data.properties||[]).map(p=>'<tr><td>'+esc(orgName(p.organisation_id))+'</td><td>'+esc(p.name||'—')+'</td><td>'+esc(p.address)+' '+esc(p.suburb||'')+'</td><td>'+esc(p.access_notes||'—')+'</td></tr>').join('')+'</tbody></table>'}
function contactsHtml(){return '<table><thead><tr><th>Organisation</th><th>Contact</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>'+(data.members||[]).map(m=>'<tr><td>'+esc(orgName(m.organisation_id))+'</td><td>'+esc(m.name||'—')+'</td><td>'+esc(m.email)+'</td><td>'+nice(m.role)+(m.can_approve?' · approver':'')+'</td><td>'+nice(m.status)+'</td></tr>').join('')+'</tbody></table>'}
function show(title,body,save){modal.innerHTML='<div class="modalback" onclick="if(event.target===this)closeM()"><div class="modal"><h2>'+esc(title)+'</h2><div class="sub">Changes stay on this branch until you approve production deployment.</div><div id="merr"></div>'+body+'<div class="actions"><button class="btn primary" onclick="'+save+'">Save</button><button class="btn outline" onclick="closeM()">Cancel</button></div></div></div>'}function closeM(){modal.innerHTML=''}function merr(e){document.getElementById('merr').innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}
function newOrg(){show('Onboard organisation','<div class="field"><label>Organisation name</label><input id="mName"></div><div class="grid2"><div class="field"><label>Type</label><select id="mType"><option value="property_manager">Property manager</option><option value="strata">Strata / body corporate</option><option value="real_estate">Real-estate agency</option><option value="commercial">Commercial property</option><option value="facilities">Facilities management</option></select></div><div class="field"><label>Approval workflow</label><select id="mApproval"><option value="yes">Approval required</option><option value="no">No approval required</option></select></div></div><div class="grid2"><div class="field"><label>Primary contact name</label><input id="mAdminName"></div><div class="field"><label>Primary contact email</label><input id="mEmail" type="email"></div></div>','saveOrg()')}
async function saveOrg(){try{await req('admin-create-organisation',{name:mName.value,organisationType:mType.value,approvalRequired:mApproval.value==='yes',adminName:mAdminName.value,adminEmail:mEmail.value});closeM();await load()}catch(e){merr(e)}}
function addProperty(id){show('Add property','<div class="field"><label>Property name</label><input id="pName"></div><div class="field"><label>Address</label><input id="pAddress"></div><div class="grid2"><div class="field"><label>Suburb</label><input id="pSuburb"></div><div class="field"><label>Postcode</label><input id="pPost"></div></div><div class="field"><label>Access notes</label><textarea id="pAccess"></textarea></div>','saveProperty(\''+id+'\')')}
async function saveProperty(id){try{await req('admin-add-property',{organisationId:id,name:pName.value,address:pAddress.value,suburb:pSuburb.value,postcode:pPost.value,state:'VIC',accessNotes:pAccess.value});closeM();await load()}catch(e){merr(e)}}
function addContact(id){show('Add organisation contact','<div class="grid2"><div class="field"><label>Name</label><input id="cName"></div><div class="field"><label>Email</label><input id="cEmail" type="email"></div></div><div class="grid2"><div class="field"><label>Phone</label><input id="cPhone"></div><div class="field"><label>Role</label><select id="cRole"><option value="requester">Requester</option><option value="approver">Approver</option><option value="viewer">Viewer</option><option value="org_admin">Organisation admin</option></select></div></div>','saveContact(\''+id+'\')')}
async function saveContact(id){try{await req('admin-add-member',{organisationId:id,name:cName.value,email:cEmail.value,phone:cPhone.value,role:cRole.value});closeM();await load()}catch(e){merr(e)}}
function categoryOptions(selected){const cats=(catalog&&catalog.categories)||[];return '<option value="">Choose contractor category…</option>'+cats.map(c=>'<option '+(c.category===selected?'selected':'')+' value="'+esc(c.category)+'">'+esc(c.category)+'</option>').join('')}
function quote(id){const o=data.workOrders.find(x=>x.id===id);show('Set work-order quote','<div class="field"><label>Contractor service category</label><select id="qCat">'+categoryOptions(o.category)+'</select></div><div class="grid2"><div class="field"><label>Price incl. GST ($)</label><input id="qAmount" type="number" step=".01" value="'+(o.quoted_price_cents?o.quoted_price_cents/100:'')+'"></div><div class="field"><label>Quote reference</label><input id="qRef" value="'+esc(o.quote_reference||'')+'"></div></div><div class="meta">If the organisation requires approval, changing the quote returns it to Awaiting Approval.</div>','saveQuote(\''+id+'\')')}
async function saveQuote(id){try{await req('admin-set-quote',{workOrderId:id,quotedPriceCents:Math.round(Number(qAmount.value)*100),quoteReference:qRef.value,category:qCat.value});closeM();await load()}catch(e){merr(e)}}
async function releaseJob(id){if(!confirm('Release this approved work order to matching contractors?'))return;try{const r=await req('admin-release-work-order',{workOrderId:id});alert('Released as Job #'+r.jobNumber+'. '+r.contractorOfferCount+' matching contractor offer(s) created.');await load()}catch(e){alert(e.message)}}
function updateOrder(id){const o=data.workOrders.find(x=>x.id===id);show('Update work order / invoice','<div class="grid2"><div class="field"><label>Work-order status</label><select id="uStatus"><option value="">No change</option>'+['released','assigned','in_progress','completed','cancelled'].map(s=>'<option '+(o.status===s?'selected':'')+' value="'+s+'">'+nice(s)+'</option>').join('')+'</select></div><div class="field"><label>Contractor status note</label><input id="uContractor" value="'+esc(o.contractor_status||'')+'"></div></div><div class="field"><label>Completion notes</label><textarea id="uNotes">'+esc(o.completion_notes||'')+'</textarea></div><div class="field"><label>High-value contract/legal review</label><select id="uLegal"><option value="">No change — '+nice(o.legal_review_status||'not_required')+'</option>'+(o.legal_review_status==='pending'?'<option value="cleared">Mark review cleared</option>':'')+'</select></div><div class="grid2"><div class="field"><label>Invoice status</label><select id="uInvStatus">'+['not_issued','issued','paid','void'].map(s=>'<option '+(o.invoice_status===s?'selected':'')+' value="'+s+'">'+nice(s)+'</option>').join('')+'</select></div><div class="field"><label>Invoice reference</label><input id="uInvRef" value="'+esc(o.invoice_reference||'')+'"></div></div><div class="field"><label>Invoice amount ($)</label><input id="uInvAmount" type="number" step=".01" value="'+(o.invoice_amount_cents!=null?o.invoice_amount_cents/100:'')+'"></div>','saveUpdate(\''+id+'\')')}
async function saveUpdate(id){try{await req('admin-update-work-order',{workOrderId:id,status:uStatus.value||undefined,contractorStatus:uContractor.value,completionNotes:uNotes.value,legalReviewStatus:uLegal.value||undefined,invoiceStatus:uInvStatus.value,invoiceReference:uInvRef.value,invoiceAmountCents:uInvAmount.value===''?null:Math.round(Number(uInvAmount.value)*100)});closeM();await load()}catch(e){merr(e)}}
load();
</script></body></html>
