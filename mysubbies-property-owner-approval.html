<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MySubbies - Quote Approval</title><style>
body{font-family:Arial,sans-serif;background:#F7F7F5;color:#151A26;margin:0}.wrap{max-width:680px;margin:45px auto;padding:20px}.card{background:#fff;border:1px solid #E7E7E4;border-radius:18px;padding:30px}.brand{font-size:22px;font-weight:800;color:#14213D;margin-bottom:25px}.brand span{color:#FF6A1A}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#6B7280;font-weight:700}h1{font-size:27px;margin:8px 0}.amount{font-size:32px;font-weight:800;margin:20px 0}.row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #F0F0EE;padding:11px 0;font-size:13px}.label{color:#6B7280}.muted{color:#6B7280;font-size:12.5px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.btn{border-radius:999px;padding:12px 21px;font-weight:700;cursor:pointer;font-size:13px}.approve{background:#FF6A1A;color:#14213D;border:0}.decline{background:#fff;color:#151A26;border:1px solid #E7E7E4}.status{padding:13px;border-radius:10px;font-size:13px;margin:18px 0}.ok{background:#EAF5EE;color:#286842}.bad{background:#FDEDEA;color:#8F2E27}</style></head><body><div class="wrap"><div class="card"><div class="brand">My<span>Subbies</span></div><div id="app">Loading quote...</div></div></div><script>
const token=new URLSearchParams(location.search).get('token'),app=document.getElementById('app');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(c){return new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(Number(c||0)/100);}
async function load(){if(!token){app.innerHTML='<div class="status bad">This approval link is missing.</div>';return}try{const r=await fetch('/api/property-management?action=owner-quote&token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load the quote.');const q=d.quote,p=d.property||{};let h='<div class="eyebrow">Quote approval</div><h1>'+esc(p.address||'Property maintenance')+'</h1><p class="muted">Your property manager has asked you to review this maintenance quote.</p><div class="amount">'+money(q.quotedPriceCents)+'</div><div class="row"><span class="label">Work requested</span><b>'+esc(q.taskSummary)+'</b></div>'+(q.quoteReference?'<div class="row"><span class="label">Reference</span><b>'+esc(q.quoteReference)+'</b></div>':'')+'<div class="row"><span class="label">Priority</span><b>'+esc(q.priority)+'</b></div>'+(q.description?'<div style="margin-top:20px"><b>Scope / notes</b><p class="muted" style="white-space:pre-wrap">'+esc(q.description)+'</p></div>':'');if(q.status==='pending')h+='<div id="msg"></div><div class="actions"><button class="btn approve" onclick="decide(\'approved\')">Approve quote</button><button class="btn decline" onclick="decide(\'declined\')">Decline quote</button></div><p class="muted" style="margin-top:18px">This secure approval link expires '+new Date(q.expiresAt).toLocaleDateString('en-AU')+'.</p>';else h+='<div class="status '+(q.status==='approved'?'ok':'bad')+'">This quote has already been '+esc(q.status)+'.</div>';app.innerHTML=h}catch(e){app.innerHTML='<div class="status bad">'+esc(e.message)+'</div>'}}
async function decide(decision){const email=prompt('Optional: enter your email address for the approval record.','');if(email===null)return;if(!confirm(decision==='approved'?'Approve this quote?':'Decline this quote?'))return;try{const r=await fetch('/api/property-management',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'owner-quote-decision',token,decision,email})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not record your decision.');app.innerHTML='<div class="status '+(decision==='approved'?'ok':'bad')+'"><strong>Quote '+decision+'.</strong><br>Your decision has been recorded and your property manager has been notified.</div>'}catch(e){const m=document.getElementById('msg');if(m)m.innerHTML='<div class="status bad">'+esc(e.message)+'</div>'}}
load();
</script></body></html>
