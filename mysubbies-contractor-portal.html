<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MySubbies — Contractor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- Payment Receipt / Statement of Account export (Sep 2026) -- first PDF/
     Excel libraries in this codebase, loaded the same CDN-script way
     Supabase-js already is (no build step exists to npm-install these
     into a bundle). jsPDF + autotable for PDF, SheetJS for real .xlsx
     (not a CSV renamed .xls). -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    /* Navy/gold reskin (Aug 2026), Stage 2 -- see CLAUDE.md and
       mysubbies-website.html's :root for the source of this palette. Every
       existing var(--black)/var(--ink) usage cascades automatically. */
    --ink: #151A26; --black: #14213D; --white: #FFFFFF; --paper: #F7F7F5;
    --stone: #6B7280; --stone-light: #9CA3AF; --line: #E7E7E4; --good: #2F7A50; --warn: #B0592E;
    --accent: #F5A623; --accent-dark: #D98E14; --accent-pale: #FDF0D9;
    --primary-light: #1F335A; --primary-pale: #E7EAF1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1, h2 { font-weight:800; letter-spacing:-0.02em; }
  a { color:inherit; text-decoration:none; }
  header { background: #fff; border-bottom:1px solid var(--line); box-shadow:0 1px 4px rgba(20,33,61,0.04); position:relative; z-index:50; }
  .navwrap { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { display:flex; align-items:center; gap:9px; }
  .logo-word { font-weight:800; font-size:19px; color:var(--black); }
  .logo-word .gold { color:var(--accent); }
  .navlinks { display:flex; align-items:center; gap:22px; font-size:13px; }
  @media (max-width:460px) { .navwrap { padding:0 14px; } .navlinks { gap:9px; font-size:11px; } }
  .navlinks a { color:var(--stone); }
  .navlinks a.current { color:var(--black); font-weight:600; }
  .navlink-refresh { display:flex; align-items:center; cursor:pointer; color:var(--stone); }
  .navlink-refresh:hover { color:var(--black); }
  .navlink-refresh svg.spinning { animation:navlink-refresh-spin 0.8s linear infinite; }
  @keyframes navlink-refresh-spin { to { transform:rotate(360deg); } }
  /* Notification bell + panel (Sep 2026) -- see mysubbies-customer-portal.html
     for the matching implementation/comments (self-contained convention,
     no shared JS/CSS file). */
  .navlink-bell { display:flex; align-items:center; cursor:pointer; color:var(--stone); position:relative; }
  .navlink-bell:hover { color:var(--black); }
  .notif-badge { position:absolute; top:-5px; right:-7px; min-width:15px; height:15px; padding:0 3px; border-radius:999px; background:var(--warn); color:#fff; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; line-height:1; }
  .notif-panel { position:fixed; top:68px; right:16px; width:320px; max-width:calc(100vw - 32px); max-height:70vh; overflow-y:auto; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 32px rgba(0,0,0,.14); z-index:80; }
  .notif-panel-header { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--paper); font-size:13px; font-weight:700; position:sticky; top:0; background:#fff; }
  .notif-panel-header a { font-size:11.5px; font-weight:600; color:var(--stone); cursor:pointer; text-decoration:underline; }
  .notif-item { display:block; width:100%; text-align:left; padding:11px 14px; border:none; border-bottom:1px solid var(--paper); background:none; cursor:pointer; font-family:inherit; }
  /* Mobile bottom tab bar (Sep 2026) -- same pattern as
     mysubbies-website.html's .mobile-tabbar (own copy per this project's
     self-contained-page convention), mapped onto this portal's real 5 top
     tabs instead of inventing new destinations. Gated at the same 860px
     breakpoint used everywhere else in this codebase for mobile-only UI. */
  .mobile-tabbar { display:none; }
  @media (max-width:860px) {
    .mobile-tabbar {
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:70;
      background:#fff; border-top:1px solid var(--line);
      padding:8px 4px calc(10px + env(safe-area-inset-bottom));
      box-shadow:0 -4px 16px rgba(0,0,0,0.06);
    }
    .tab-item { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--stone); font-size:9.5px; font-weight:700; background:none; border:none; cursor:pointer; font-family:inherit; padding-top:2px; }
    .tab-item.active { color:var(--black); }
    .tab-item svg { flex-shrink:0; }
    .tab-item .notif-badge { top:-4px; right:16px; }
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  }
  .notif-item:hover { background:var(--paper); }
  .notif-item.unread { background:#fbf6ea; }
  .notif-item-title { font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:2px; }
  .notif-item-body { font-size:12px; color:var(--stone); line-height:1.4; }
  .notif-item-time { font-size:10.5px; color:var(--stone-light); margin-top:4px; }
  .notif-empty { padding:26px 14px; text-align:center; font-size:12.5px; color:var(--stone-light); }
  .wrap { max-width:640px; margin:0 auto; padding:32px 24px 80px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer; border:none; transition:box-shadow .15s ease, background .15s ease, border-color .15s ease, transform .1s ease; }
  .btn-black { background:var(--black); color:#fff; box-shadow:0 3px 10px rgba(20,33,61,0.22); }
  .btn-black:hover { background:var(--primary-light); box-shadow:0 5px 14px rgba(20,33,61,0.3); }
  .btn-black:active { transform:translateY(1px); }
  .btn-outline { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn-outline:hover { border-color:var(--black); background:var(--paper); }
  .btn:disabled, .btn:disabled:hover { opacity:.4; cursor:not-allowed; box-shadow:none; background:var(--black); transform:none; }
  .btn-full { width:100%; }
  input[type=text], input[type=email], input[type=password] { width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; border:1.5px solid var(--line); border-radius:10px; padding:13px 14px; outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
  input[type=text]:focus, input[type=email]:focus, input[type=password]:focus { border-color:var(--black); box-shadow:0 0 0 3px rgba(20,33,61,0.08); }
  .loginbox { background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px; text-align:center; margin-top:60px; box-shadow:0 8px 24px rgba(20,33,61,0.07); }
  .loginbox h1 { font-size:22px; margin-bottom:8px; }
  .loginbox p { color:var(--stone); font-size:14px; margin-bottom:20px; }
  .tabs { display:flex; gap:6px; background:#EFEDE9; padding:4px; border-radius:10px; margin-bottom:24px; }
  .tabs button { flex:1; padding:9px; border-radius:7px; font-size:13px; font-weight:600; border:none; cursor:pointer; background:transparent; color:var(--stone); }
  .tabs button.active { background:#fff; color:var(--ink); }
  .whoami { font-size:12px; color:var(--stone-light); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
  .whoami a { text-decoration:underline; cursor:pointer; }
  h1.pagetitle { font-size:24px; margin-bottom:2px; }
  p.pagesub { color:var(--stone); font-size:13px; margin-bottom:20px; }
  .jobcard { display:flex; gap:12px; padding:14px; border-radius:14px; border:1px solid var(--line); background:#fff; cursor:pointer; margin-bottom:10px; text-align:left; width:100%; }
  .jobcard:hover { border-color: var(--black); }
  .thumb { width:52px; height:52px; border-radius:10px; background:var(--paper); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .photoset-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--stone); margin:12px 0 6px; }
  .photoset-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); gap:6px; margin-bottom:8px; }
  .photoset-thumb { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .photoset-thumb img { width:100%; height:100%; object-fit:cover; }
  .photoset-thumb button { position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:999px; background:rgba(0,0,0,0.65); color:#fff; border:none; font-size:10px; cursor:pointer; line-height:1; }
  .photoset-addrow { display:flex; gap:6px; }
  .photoset-addbtn { flex:1; border:1.5px dashed var(--line); border-radius:8px; padding:10px; text-align:center; font-size:12px; color:var(--stone); cursor:pointer; background:#fff; }
  .pill { font-size:10px; font-weight:700; color:var(--stone); background:var(--paper); padding:2px 7px; border-radius:4px; display:inline-block; }
  .jobtitle { font-size:14px; font-weight:700; margin-top:4px; }
  .jobmeta { font-size:12px; color:var(--stone); margin-top:3px; }
  .jobprice { font-size:14px; font-weight:800; margin-top:4px; }
  .empty { text-align:center; padding:60px 20px; color:var(--stone); font-size:14px; }
  /* Job listing table (Aug 2026) -- matches mysubbies-admin-portal.html's
     All Jobs table exactly (same classes/values), so the job list looks
     and reads the same across all three portals. Used for "My Jobs" only --
     Job Feed keeps its own card layout (thumbnail + payout teaser, a
     browse-to-accept view rather than a tracking list). */
  table.jobstable { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  table.jobstable th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--stone); padding:12px 16px; background:var(--paper); }
  table.jobstable td { padding:14px 16px; font-size:13px; border-top:1px solid var(--paper); }
  tr.jobrow { cursor:pointer; }
  tr.jobrow:hover { background:var(--paper); }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-block; }
  .badge-feed { background:#FFF6E5; color:#8A6D2E; }
  .badge-assigned { background:#E9F1F9; color:#2E5E8A; }
  .badge-completed { background:#EAF5EE; color:var(--good); }
  .badge-rejected { background:#FDEDEA; color:var(--warn); }
  .backbtn { font-size:13px; color:var(--stone); background:none; border:none; cursor:pointer; margin-bottom:16px; display:flex; align-items:center; gap:4px; }
  .detailcard { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; }
  .row { display:flex; justify-content:space-between; font-size:14px; padding:9px 0; border-top:1px solid var(--paper); }
  .row:first-child { border-top:none; }
  .row .l { color:var(--stone); }
  .row .r { font-weight:700; }
  .row.big .r { font-size:20px; color:var(--good); }
  .stagebar { display:flex; gap:4px; margin:12px 0; }
  .stage { flex:1; height:6px; border-radius:3px; background:var(--line); }
  .stage.done { background:var(--good); }
  .note { font-size:12px; color:var(--stone-light); line-height:1.5; margin-top:10px; }
  img.jobphoto { width:100%; border-radius:12px; margin-bottom:16px; max-height:220px; object-fit:cover; }
  .msgbox { border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; background:#fff; }
  .msgbox h3 { font-size:14px; margin-bottom:12px; }
  .msglist { max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .msgbubble { max-width:80%; padding:9px 12px; border-radius:12px; font-size:13px; }
  .msgbubble.mine { align-self:flex-end; background:var(--black); color:#fff; }
  .msgbubble.theirs { align-self:flex-start; background:var(--paper); color:var(--ink); }
  .msgmeta { font-size:10px; color:var(--stone-light); margin-bottom:2px; }
  .msginput { display:flex; gap:8px; }
  .msginput input { margin-bottom:0; flex:1; }

  /* Profile bar + visual pass (Sep 2026) -- founder feedback that this
     dashboard "doesn't look very clean" next to the customer/admin portals,
     which already got the navy/gold shadow-card treatment. Two things
     found while fixing this: .box was used everywhere (earnings tiles,
     payout card, referral card, rating box) but never actually DEFINED
     anywhere in this file's CSS -- every one of those was rendering with
     zero border/padding/background. That alone explains a lot of the
     "unclean" read. Fixed here, plus a subtle shadow/radius pass on the
     existing flat jobcard/detailcard/table so the whole dashboard reads as
     one consistent, deliberate product rather than a bolted-together set
     of screens. */
  .box { border:1px solid var(--line); border-radius:14px; padding:16px; background:#fff; box-shadow:0 3px 12px rgba(20,33,61,0.05); }
  .jobcard { border-radius:16px; box-shadow:0 3px 12px rgba(20,33,61,0.05); }
  .jobcard:hover { box-shadow:0 6px 18px rgba(20,33,61,0.10); }
  .detailcard { border-radius:18px; box-shadow:0 3px 12px rgba(20,33,61,0.05); }
  table.jobstable, .msgbox { box-shadow:0 3px 12px rgba(20,33,61,0.05); }
  /* Profile summary bar -- shown above the tabs on every tab (the "main
     page when contractor signs in" ask), not just a buried Earnings-tab
     number. Reuses the navy-gradient avatar language the customer portal's
     Property hero already established, scaled down to a persistent strip
     rather than a full banner (this shows on every tab, not one view). */
  .ctr-profile-bar { display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-bottom:16px; box-shadow:0 6px 20px rgba(20,33,61,0.08); }
  .ctr-profile-avatar { width:52px; height:52px; border-radius:50%; flex-shrink:0; background:linear-gradient(135deg, var(--black), var(--primary-light)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800; overflow:hidden; }
  .ctr-profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .ctr-profile-info { flex:1; min-width:0; cursor:pointer; }
  .ctr-profile-name { font-size:15.5px; font-weight:800; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ctr-profile-meta { font-size:12px; color:var(--stone); margin-top:2px; }
  .ctr-profile-meta .stars { color:var(--accent-dark); }
  .ctr-payout-pill { font-size:10.5px; font-weight:700; padding:5px 11px; border-radius:999px; white-space:nowrap; flex-shrink:0; cursor:pointer; border:none; font-family:inherit; }
  .ctr-payout-pill.good { background:#EAF5EE; color:var(--good); }
  .ctr-payout-pill.warn { background:var(--accent-pale); color:var(--accent-dark); }
  /* My Profile tab */
  .ctr-profile-section { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:14px; box-shadow:0 3px 12px rgba(20,33,61,0.05); }
  .ctr-profile-section h3 { font-size:13.5px; font-weight:700; margin-bottom:12px; }
  .ctr-field-label { font-size:12px; font-weight:600; color:var(--stone); margin-bottom:5px; display:block; }
  input.ctr-input { margin-bottom:12px; }
  .ctr-field-readonly { font-size:14px; padding:12px 14px; background:var(--paper); border-radius:10px; color:var(--stone); margin-bottom:4px; }
  .ctr-field-note { font-size:11px; color:var(--stone-light); margin-bottom:12px; }
  .ctr-avatar-edit-wrap { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .ctr-avatar-edit { width:60px; height:60px; border-radius:50%; background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color:var(--stone); overflow:hidden; flex-shrink:0; }
  .ctr-avatar-edit img { width:100%; height:100%; object-fit:cover; }
  /* Download menus (Sep 2026) -- Statement of Account / per-job Payment
     Receipt in PDF, CSV and Excel, reusing the exact toCsv/downloadCsv
     pattern already proven in mysubbies-admin-portal.html. */
  .dl-menu-wrap { position:relative; display:inline-block; }
  .dl-menu { position:absolute; top:calc(100% + 6px); right:0; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 28px rgba(20,33,61,0.15); padding:6px; z-index:30; min-width:180px; display:none; }
  .dl-menu.show { display:block; }
  .dl-menu button { display:block; width:100%; text-align:left; padding:9px 12px; border-radius:8px; border:none; background:none; font-size:13px; font-family:inherit; cursor:pointer; color:var(--ink); }
  .dl-menu button:hover { background:var(--paper); }
</style>
<!-- Own manifest (not the shared one) so a contractor who "Add to Home
     Screen"s from THIS page gets an install shortcut whose start_url is
     the portal itself -- tap the icon, get the login screen (or straight
     into the portal if already signed in), never the customer homepage. -->
<link rel="manifest" href="manifest-contractor.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MySubbies Contractor">
</head>
<body>

<div class="install-banner" id="installBanner" style="display:none;">
  <div class="install-banner-text">
    <strong>Install the contractor app</strong>
    <span id="installBannerSub">Add it to your home screen — tap it to jump straight to your jobs.</span>
  </div>
  <div class="install-banner-actions">
    <button class="btn btn-white" id="installBannerBtn" onclick="triggerInstall()">Install</button>
    <button class="install-banner-close" onclick="dismissInstallBanner()" aria-label="Dismiss">✕</button>
  </div>
</div>
<script>
  // Same pattern as the homepage's install banner, but this page links its
  // OWN manifest (manifest-contractor.json, start_url pointing straight at
  // this portal) — so installing FROM here gives a home-screen icon that
  // opens directly to login/portal, not the general customer homepage.
  let deferredInstallPrompt = null;
  const INSTALL_DISMISS_KEY = 'mysubbies_contractor_install_dismissed';

  function isStandaloneDisplay() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function isIOSDevice() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }
  function showInstallBanner() {
    if (isStandaloneDisplay() || localStorage.getItem(INSTALL_DISMISS_KEY)) return;
    document.getElementById('installBanner').style.display = 'flex';
  }
  function dismissInstallBanner() {
    localStorage.setItem(INSTALL_DISMISS_KEY, 'true');
    document.getElementById('installBanner').style.display = 'none';
  }
  function triggerInstall() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(() => {
      deferredInstallPrompt = null;
      dismissInstallBanner();
    });
  }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    showInstallBanner();
  });
  window.addEventListener('appinstalled', dismissInstallBanner);
  if (isIOSDevice() && !isStandaloneDisplay() && !localStorage.getItem(INSTALL_DISMISS_KEY)) {
    document.getElementById('installBannerSub').textContent = 'Tap the Share icon, then "Add to Home Screen".';
    document.getElementById('installBannerBtn').style.display = 'none';
    showInstallBanner();
  }
</script>

    </div>

<nav class="mobile-tabbar" aria-label="Primary">
  <button class="tab-item" id="mtFeed" onclick="tab='feed'; render();">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    Job Feed
    <span class="notif-badge" id="mtFeedBadge" style="display:none;"></span>
  </button>
  <button class="tab-item" id="mtMyJobs" onclick="tab='myjobs'; render();">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    My Jobs
    <span class="notif-badge" id="mtMyJobsBadge" style="display:none;"></span>
  </button>
  <button class="tab-item" id="mtEarnings" onclick="tab='earnings'; render();">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    Earnings
  </button>
  <button class="tab-item" id="mtProfile" onclick="tab='profile'; render();">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    Profile
  </button>
  <button class="tab-item" id="mtMessages" onclick="tab='messages'; render();">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    Messages
    <span class="notif-badge" id="mtMessagesBadge" style="display:none;"></span>
  </button>
</nav>

<script>
  function getJobs() { return JSON.parse(localStorage.getItem('mysubbies_jobs') || '[]'); }
  function saveJobs(jobs) {
    localStorage.setItem('mysubbies_jobs', JSON.stringify(jobs));
    fetch('/api/sync-jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobs }) }).catch(() => {});
  }
  // Runs once before the first render: pulls jobs relevant to this
  // contractor (their own accepted jobs, plus the unassigned pool they can
  // still accept) from Supabase and merges into localStorage — see
  // api/get-jobs.js. Local-only jobs are left alone; they sync up on the
  // next saveJobs() call.
  async function hydrateJobsFromServer() {
    const email = localStorage.getItem('mysubbies_contractor_email');
    if (!email) return;
    try {
      const res = await fetch('/api/get-jobs?contractorEmail=' + encodeURIComponent(email));
      if (!res.ok) return;
      const { jobs: remoteJobs } = await res.json();
      if (!Array.isArray(remoteJobs) || remoteJobs.length === 0) return;
      const localJobs = getJobs();
      const byId = new Map(localJobs.map(j => [j.id, j]));
      remoteJobs.forEach(rj => { if (rj && rj.id) byId.set(rj.id, rj); });
      localStorage.setItem('mysubbies_jobs', JSON.stringify(Array.from(byId.values())));
    } catch (e) { /* offline or first load — local data still works */ }
  }

  // Admin -> contractor messaging (added Aug 2026) -- standalone channel,
  // no job involved (e.g. admin sending an updated rate card to the whole
  // panel). See api/admin-messages.js. Lives in Supabase only, no
  // localStorage mirror, same reasoning as property-profile.js: this is
  // read-mostly, per-contractor, and never needs to work offline.
  let adminMessages = [];
  let msgThreadAttachment = null; // { dataUrl, filename, mime } or null
  // Attaching a file needs a full render() to show the attachment chip,
  // which would otherwise silently wipe whatever the contractor already
  // typed in the reply box (a plain uncontrolled input has no state to
  // restore from) -- same "preserve draft across re-render" pattern
  // already used for the admin composer's subject/body in
  // mysubbies-admin-portal.html.
  let msgThreadReplyDraft = '';
  const MESSAGE_ATTACHMENT_MAX_BYTES = 4 * 1024 * 1024;
  function onMsgThreadAttachmentSelected(event) {
    const file = (event.target.files || [])[0];
    event.target.value = '';
    if (!file) return;
    if (file.size > MESSAGE_ATTACHMENT_MAX_BYTES) {
      showToast('That file is too large — please use one under 4MB.');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      msgThreadAttachment = { dataUrl: reader.result, filename: file.name, mime: file.type || 'application/octet-stream' };
      render();
    };
    reader.readAsDataURL(file);
  }
  function removeMsgThreadAttachment() {
    msgThreadAttachment = null;
    render();
  }
  async function hydrateAdminMessages() {
    const email = localStorage.getItem('mysubbies_contractor_email');
    if (!email) return;
    try {
      const res = await fetch('/api/admin-messages?contractorEmail=' + encodeURIComponent(email));
      if (!res.ok) return;
      const data = await res.json();
      adminMessages = Array.isArray(data.messages) ? data.messages : [];
    } catch (e) { /* offline or first load — messages just won't show yet */ }
  }
  // Called from inside render() itself (the messages tab branch) -- must
  // NOT call render() again, or every unread message would recurse into a
  // fresh render() call before the previous one finishes. The bubble
  // thread doesn't show a per-message read/unread state, so there's
  // nothing that needs a repaint here anyway -- just optimistic local
  // mutation + a fire-and-forget POST per newly-read message.
  function markAllAdminMessagesRead() {
    const email = localStorage.getItem('mysubbies_contractor_email');
    adminMessages.filter(m => m.sender_role === 'admin' && !m.read_at).forEach(m => {
      m.read_at = new Date().toISOString();
      fetch('/api/admin-messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'markRead', messageId: m.id, contractorEmail: email }),
      }).catch(() => {});
    });
  }
  function renderAdminThread() {
    const list = document.getElementById('msgListAdminThread');
    if (!list) return;
    if (adminMessages.length === 0) { list.innerHTML = '<div style="font-size:12px;color:var(--stone-light);">No messages yet.</div>'; return; }
    list.innerHTML = adminMessages.map(m => `
      <div class="msgbubble ${m.sender_role === 'contractor' ? 'mine' : 'theirs'}">
        <div class="msgmeta">${m.sender_role === 'contractor' ? 'You' : 'MySubbies'} · ${new Date(m.sent_at).toLocaleString('en-AU')}</div>
        ${m.subject ? `<div style="font-weight:700;margin-bottom:2px;">${escapeHtml(m.subject)}</div>` : ''}
        <div style="white-space:pre-wrap;">${escapeHtml(m.body)}</div>
        ${m.attachment_data_url ? `<div style="margin-top:6px;"><a href="${m.attachment_data_url}" download="${escapeHtml(m.attachment_filename || 'attachment')}" style="color:inherit;text-decoration:underline;font-size:12px;font-weight:600;">📎 ${escapeHtml(m.attachment_filename || 'Download attachment')}</a></div>` : ''}
      </div>
    `).join('');
    list.scrollTop = list.scrollHeight;
  }
  async function sendAdminThreadReply() {
    const text = msgThreadReplyDraft.trim();
    if (!text) return;
    const email = localStorage.getItem('mysubbies_contractor_email');
    if (!email) return;
    const attachment = msgThreadAttachment;
    msgThreadReplyDraft = '';
    msgThreadAttachment = null;
    const input = document.getElementById('msgInputAdminThread');
    if (input) input.value = '';
    const optimistic = {
      id: 'temp_' + Date.now(), contractor_email: email, sender_role: 'contractor', subject: null, body: text,
      attachment_data_url: attachment ? attachment.dataUrl : null,
      attachment_filename: attachment ? attachment.filename : null,
      attachment_mime: attachment ? attachment.mime : null,
      sent_at: new Date().toISOString(), read_at: new Date().toISOString(),
    };
    adminMessages.push(optimistic);
    render();
    try {
      const res = await fetch('/api/admin-messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'reply', contractorEmail: email, body: text,
          attachmentDataUrl: attachment ? attachment.dataUrl : null,
          attachmentFilename: attachment ? attachment.filename : null,
          attachmentMime: attachment ? attachment.mime : null,
        }),
      });
      if (!res.ok) throw new Error('send failed');
      const data = await res.json();
      if (data.message) Object.assign(optimistic, data.message);
    } catch (e) {
      adminMessages = adminMessages.filter(m => m.id !== optimistic.id);
      renderAdminThread();
      showToast('Could not send — try again');
    }
  }

  // Manual refresh (Aug 2026) -- re-pulls jobs from Supabase and re-renders,
  // for a contractor checking the feed/My Jobs for updates without a full
  // page reload (which would lose scroll position and whatever tab they're on).
  let manualRefreshInFlight = false;
  function manualRefresh() {
    if (manualRefreshInFlight) return;
    manualRefreshInFlight = true;
    const icon = document.getElementById('refreshIcon');
    if (icon) icon.classList.add('spinning');
    Promise.all([hydrateJobsFromServer(), hydrateAdminMessages()]).then(() => {
      render();
      showToast('Refreshed');
    }).catch(() => {}).finally(() => {
      manualRefreshInFlight = false;
      if (icon) icon.classList.remove('spinning');
    });
  }
  function showToast(msg) {
    let t = document.getElementById('toastMsg');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toastMsg';
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
  }

  // Referral sharing (Aug 2026) -- mirrors copyReferralCode()/shareAppWithFriend()
  // in mysubbies-customer-portal.html, but the share link here carries the
  // actual ?ref=CODE so a referred contractor lands on signup with their
  // code already filled in, rather than sharing a bare, code-less app link.
  function copyContractorReferralCode(code) {
    navigator.clipboard.writeText(code).then(() => showToast('Referral code copied!'));
  }
  function shareContractorReferralLink(code) {
    const url = location.origin + '/mysubbies-contractor-signup.html?ref=' + encodeURIComponent(code);
    const shareData = { title: 'Join MySubbies', text: 'Join the MySubbies contractor panel — no lead fees, no bidding wars.', url };
    if (navigator.share) {
      navigator.share(shareData).catch(() => {});
    } else {
      navigator.clipboard.writeText(url).then(() => showToast('Link copied — send it to a contractor!'));
    }
  }

  function getContractorName() { return localStorage.getItem('mysubbies_contractor_name'); }
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  let tab = 'feed';
  let selectedJobId = null;
  let jobSearchQuery = '';
  let selectedEarningsJobId = null;
  let earningsJobData = null;
  let earningsJobLoading = false;
  // Stripe Connect payout setup status (Aug 2026) -- fetched once when the
  // Earnings tab is first opened via the read side of
  // create-connect-onboarding-link.js. null = not yet fetched.
  let connectOnboardingStatus = null;
  let connectOnboardingLoading = false;
  // My Profile tab (Sep 2026) -- self-service edit of details that were
  // previously frozen at signup forever. myProfileDrafts holds in-progress
  // edits keyed by field name, committed only on explicit Save (same
  // draft-then-Save pattern established for the admin rate card UI this
  // session, not silent auto-save on blur).
  let myProfileData = null;
  let myProfileLoading = false;
  let myProfileDrafts = {};
  let showingEmailChange = false;
  let dlMenuOpenFor = null; // which "Download ▾" menu is open, one at a time
  let statementCache = null; // { customer|contractor: [...] } loaded lazily per Download click
  const app = document.getElementById('app');

  // General-purpose "Contact MySubbies" inquiry (Aug 2026) -- not tied to
  // any specific job. Each inquiry holds a `messages` thread (not just a
  // single message) so admin can actually reply and the contractor can
  // keep the conversation going. Attachments stored as data URIs in the
  // record itself, same as job photos already are.
  //
  // Sep 2026 (pre-launch audit) -- this used to be 100% localStorage-only,
  // so a contractor's submission never reached admin on any device. Now
  // backed by a real table (api/support.js,
  // supabase/schema_v14_disputes_inquiries.sql); localStorage stays as an
  // offline-first cache kept fresh by hydrateInquiriesFromServer().
  let inquiryAttachments = [];
  let showingNewInquiry = false;
  function getInquiries() { return JSON.parse(localStorage.getItem('mysubbies_inquiries') || '[]'); }
  function saveInquiries(inq) { localStorage.setItem('mysubbies_inquiries', JSON.stringify(inq)); }
  async function hydrateInquiriesFromServer(email) {
    if (!email) return;
    try {
      const res = await fetch('/api/support?entity=inquiries&role=contractor&email=' + encodeURIComponent(email));
      if (!res.ok) return;
      const { inquiries } = await res.json();
      if (Array.isArray(inquiries)) saveInquiries(inquiries);
    } catch (e) { /* offline -- local cache still works */ }
  }

  function openInquiryForm() {
    showingNewInquiry = false;
    inquiryAttachments = [];
    renderInquiryPanel();
  }
  function toggleNewInquiryCompose() {
    showingNewInquiry = !showingNewInquiry;
    inquiryAttachments = [];
    renderInquiryPanel();
  }
  function renderInquiryPanel() {
    const email = localStorage.getItem('mysubbies_contractor_email');
    const mine = getInquiries().filter(i => i.email === email);
    document.getElementById('inquiryFormWrap').innerHTML = `
      <div class="box" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:13px;font-weight:600;">Contact MySubbies</div>
          <button class="btn btn-outline" style="width:auto;padding:6px 12px;font-size:12px;" onclick="toggleNewInquiryCompose()">${showingNewInquiry ? 'Cancel' : '+ New inquiry'}</button>
        </div>
        <div id="newInquiryComposeWrap"></div>
        ${mine.length === 0 && !showingNewInquiry ? '<div style="font-size:12px;color:var(--stone);margin-top:8px;">No inquiries yet.</div>' : ''}
        ${mine.map(i => inquiryThreadHtml(i, 'contractor')).join('')}
      </div>`;
    if (showingNewInquiry) renderNewInquiryCompose();
  }
  function renderNewInquiryCompose() {
    document.getElementById('newInquiryComposeWrap').innerHTML = `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--paper);">
        <textarea id="inquiryMessage" placeholder="What can we help with?" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;min-height:80px;font-family:inherit;"></textarea>
        <input type="file" id="inquiryFileInput" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" multiple style="display:none;" onchange="onInquiryFileSelected(event)" />
        <button class="btn btn-outline" style="width:auto;padding:8px 14px;font-size:12px;margin-bottom:8px;" onclick="document.getElementById('inquiryFileInput').click()">📎 Attach documents</button>
        <div id="inquiryAttachmentList" style="margin-bottom:8px;"></div>
        <div id="inquiryError" style="color:var(--warn);font-size:12.5px;margin-bottom:8px;display:none;"></div>
        <button class="btn btn-black btn-full" onclick="submitInquiry()">Submit</button>
      </div>`;
  }
  // Shared shape with the customer portal's version -- myRole is whichever
  // side is viewing ('customer' | 'contractor' | 'admin'), so the same
  // thread renders with the viewer's own messages on the right.
  function inquiryThreadHtml(i, myRole) {
    const msgs = i.messages || [];
    return `
      <div style="border-top:1px solid var(--paper);padding-top:12px;margin-top:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:12px;color:var(--stone);">${new Date(i.createdAt).toLocaleDateString('en-AU')}</span>
          <span class="badge ${i.status === 'open' ? 'badge-feed' : 'badge-completed'}">${i.status}</span>
        </div>
        <div class="msglist" style="max-height:220px;">
          ${msgs.map(m => `
            <div class="msgbubble ${m.from === myRole ? 'mine' : 'theirs'}">
              <div class="msgmeta">${m.from === myRole ? 'You' : (m.from === 'admin' ? 'MySubbies' : escapeHtml(m.authorName || m.from))}</div>
              ${escapeHtml(m.text)}
              ${(m.attachments || []).map(a => `<div style="margin-top:4px;"><a href="${a.dataUrl}" download="${escapeHtml(a.name)}" style="text-decoration:underline;font-size:11px;color:inherit;">📄 ${escapeHtml(a.name)}</a></div>`).join('')}
            </div>`).join('')}
        </div>
        ${i.status === 'open' ? `
          <div class="msginput" style="margin-top:8px;">
            <input type="text" id="inquiryReply_${i.id}" placeholder="Reply…" onkeydown="if(event.key==='Enter') replyToInquiry('${i.id}', '${myRole}')" />
            <button class="btn btn-black" onclick="replyToInquiry('${i.id}', '${myRole}')">Send</button>
          </div>` : ''}
      </div>`;
  }
  async function replyToInquiry(id, myRole) {
    const input = document.getElementById('inquiryReply_' + id);
    const text = input.value.trim();
    if (!text) return;
    const email = localStorage.getItem('mysubbies_contractor_email');
    try {
      await fetch('/api/support', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entity: 'inquiries', action: 'reply', id, from: myRole, text, email }),
      });
    } catch (e) { /* falls through to re-hydrate either way */ }
    await hydrateInquiriesFromServer(email);
    renderInquiryPanel();
  }
  function onInquiryFileSelected(event) {
    const files = Array.from(event.target.files || []).slice(0, 5 - inquiryAttachments.length);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        inquiryAttachments.push({ name: file.name, dataUrl: reader.result });
        renderInquiryAttachmentList();
      };
      reader.readAsDataURL(file);
    });
  }
  function renderInquiryAttachmentList() {
    const wrap = document.getElementById('inquiryAttachmentList');
    if (!wrap) return;
    wrap.innerHTML = inquiryAttachments.map((a, idx) => `
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;">
        <span>📄 ${escapeHtml(a.name)}</span>
        <button onclick="removeInquiryAttachment(${idx})" style="background:none;border:none;color:var(--warn);cursor:pointer;font-size:12px;">Remove</button>
      </div>`).join('');
  }
  function removeInquiryAttachment(idx) {
    inquiryAttachments.splice(idx, 1);
    renderInquiryAttachmentList();
  }
  async function submitInquiry() {
    const input = document.getElementById('inquiryMessage');
    const message = input.value.trim();
    const errBox = document.getElementById('inquiryError');
    if (!message) {
      errBox.textContent = 'Please describe what you need help with.';
      errBox.style.display = 'block';
      input.focus();
      return;
    }
    const name = getContractorName();
    const email = localStorage.getItem('mysubbies_contractor_email');
    try {
      await fetch('/api/support', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entity: 'inquiries', action: 'create', role: 'contractor', name, email, text: message, attachments: inquiryAttachments }),
      });
    } catch (e) {
      errBox.textContent = 'Could not send — please try again.';
      errBox.style.display = 'block';
      return;
    }
    await hydrateInquiriesFromServer(email);
    showingNewInquiry = false;
    renderInquiryPanel();
  }

  // Status filter chips (Aug 2026, same pattern as the admin portal's All
  // Jobs and the customer portal's My jobs) -- replaces the separate
  // "Show completed" / "Show cancelled" toggles with chips per status. No
  // "Awaiting contractor" chip here -- a job only ever lands in "My Jobs"
  // once this contractor has accepted it, so that status can't appear.
  const MYJOBS_STATUS_FILTERS = [
    { key: 'all', label: 'All' },
    { key: 'assigned', label: 'Assigned' },
    { key: 'cancellation_requested', label: 'Cancellation requested' },
    { key: 'completed', label: 'Completed' },
    { key: 'cancelled', label: 'Cancelled' },
  ];
  let myJobsStatusFilter = 'all';
  function myJobsStatusFilterChipsHtml(jobs) {
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${MYJOBS_STATUS_FILTERS.map(f => {
        const count = f.key === 'all' ? jobs.length : jobs.filter(j => j.status === f.key).length;
        const active = myJobsStatusFilter === f.key;
        return `<button onclick="myJobsStatusFilter='${f.key}'; render();" style="padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid ${active ? 'var(--ink)' : 'var(--line)'};background:${active ? 'var(--ink)' : '#fff'};color:${active ? '#fff' : 'var(--ink)'};cursor:pointer;">${f.label} (${count})</button>`;
      }).join('')}
    </div>`;
  }

  // Job search (all 3 portals, Aug 2026) -- a plain-text filter over
  // category/suburb/id/task names, so anyone can find a specific job
  // without scrolling. Contractor's own job lists only, not the open feed.
  // render() rebuilds the whole list via innerHTML on every keystroke (same
  // pattern as everywhere else in this codebase), which would normally drop
  // focus/cursor position out from under the input -- restored manually
  // here rather than switching this one input to a different render model.
  function onJobSearchInput(el) {
    const cursorPos = el.selectionStart;
    jobSearchQuery = el.value;
    render();
    const newEl = document.getElementById('jobSearchInput');
    if (newEl) { newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
  }
  function jobMatchesSearch(j, rawQuery) {
    const q = rawQuery.trim().toLowerCase();
    if (!q) return true;
    const haystack = [j.id, j.category, j.suburb, j.customerName, ...(j.items || []).map(i => i.taskName)]
      .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  }
  function jobSearchBoxHtml() {
    return `<input type="text" id="jobSearchInput" value="${escapeHtml(jobSearchQuery)}" oninput="onJobSearchInput(this)" placeholder="Search by suburb, category or job details…" style="width:100%;font-size:14px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:14px;font-family:inherit;" />`;
  }

  // Shared rating math (Sep 2026) -- the only rating source that has ever
  // existed here is job.customerRating on this contractor's own completed
  // jobs (already cross-device correct since jobs sync to Supabase); the
  // real `ratings` table + contractors.average_rating column exist in the
  // schema but nothing writes to them yet, a known separate gap. Factored
  // out so the always-visible profile bar, the My Profile tab, and the
  // Earnings tab all show the exact same number instead of three
  // independently-computed copies.
  function computeContractorRatingStats(completedJobs) {
    const rated = completedJobs.filter(j => j.customerRating);
    const avg = rated.length ? (rated.reduce((s, j) => s + j.customerRating, 0) / rated.length) : null;
    return { avg, count: rated.length, reviews: rated.filter(j => j.customerReview).map(j => ({ stars: j.customerRating, text: j.customerReview, job: j })) };
  }
  function starsHtml(avg) {
    if (avg == null) return '<span style="color:var(--stone-light);">No ratings yet</span>';
    const rounded = Math.round(avg);
    return `<span class="stars">${'★'.repeat(rounded)}${'☆'.repeat(5 - rounded)}</span> ${avg.toFixed(1)}`;
  }

  // Profile bar (Sep 2026) -- shown above the tabs on EVERY tab, the
  // literal "give contractors profile and rating at the main page when
  // contractor signs in" ask, not buried one click into Earnings. Clicking
  // it (or the payout pill) jumps straight to My Profile. Payout status is
  // fetched lazily on first render since it's a network call -- shows a
  // neutral state until that resolves rather than blocking the bar.
  function ctrProfileBarHtml(name, myJobsCompleted) {
    if (myProfileData === null && !myProfileLoading) loadMyProfile();
    if (connectOnboardingStatus === null && !connectOnboardingLoading) loadConnectOnboardingStatus();
    const { avg, count } = computeContractorRatingStats(myJobsCompleted);
    const photo = myProfileData && myProfileData.profilePhoto;
    const initial = (name || '?').trim().charAt(0).toUpperCase();
    const payoutOk = connectOnboardingStatus === 'complete';
    const payoutLabel = connectOnboardingStatus === null ? 'Loading…' : (payoutOk ? '✓ Payments set up' : 'Payment setup needed');
    return `
      <div class="ctr-profile-bar">
        <div class="ctr-profile-avatar">${photo ? `<img src="${photo}" alt="" />` : initial}</div>
        <div class="ctr-profile-info" onclick="tab='profile'; render();">
          <div class="ctr-profile-name">${escapeHtml(name)}</div>
          <div class="ctr-profile-meta">${starsHtml(avg)}${count ? ` (${count} review${count===1?'':'s'})` : ''} · ${myJobsCompleted.length} job${myJobsCompleted.length===1?'':'s'} completed</div>
        </div>
        <button class="ctr-payout-pill ${payoutOk ? 'good' : 'warn'}" onclick="tab='profile'; render();">${payoutLabel}</button>
      </div>`;
  }

  // Mobile bottom tab bar (Sep 2026) -- lives outside #app (see the nav
  // markup above), so it's never touched by the innerHTML rewrites every
  // render*() function below already does. Wrapping the real render logic
  // (renamed renderInner) rather than editing every one of render()'s
  // early-return branches individually is the safe way to keep this in
  // sync with the current tab/badge counts without touching the many
  // existing call sites that already call render().
  function render() { renderInner(); updateMobileTabbar(); }
  function updateMobileTabbar() {
    const nav = document.querySelector('.mobile-tabbar');
    if (!nav) return;
    const name = getContractorName();
    if (!name) { nav.style.display = 'none'; return; }
    nav.style.display = '';
    ['mtFeed', 'mtMyJobs', 'mtEarnings', 'mtProfile', 'mtMessages'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.remove('active');
    });
    const activeId = { feed: 'mtFeed', myjobs: 'mtMyJobs', earnings: 'mtEarnings', profile: 'mtProfile', messages: 'mtMessages' }[tab];
    if (activeId) { const el = document.getElementById(activeId); if (el) el.classList.add('active'); }

    const jobs = getJobs();
    const myTrades = (getApplications().find(a => a.business === name) || {}).trades;
    const feedCount = jobs.filter(j => j.status === 'feed' && (!myTrades || !myTrades.length || myTrades.includes(j.category))).length;
    const hiddenJobIds = getHiddenJobIds(name);
    const myJobsCount = jobs.filter(j => j.contractor === name && !hiddenJobIds.has(j.id) && !['completed', 'cancelled'].includes(j.status)).length;
    const unreadMsgCount = adminMessages.filter(m => m.sender_role === 'admin' && !m.read_at).length;

    const setBadge = (id, count) => {
      const el = document.getElementById(id);
      if (!el) return;
      if (count > 0) { el.textContent = count > 9 ? '9+' : count; el.style.display = 'flex'; }
      else el.style.display = 'none';
    };
    setBadge('mtFeedBadge', feedCount);
    setBadge('mtMyJobsBadge', myJobsCount);
    setBadge('mtMessagesBadge', unreadMsgCount);
  }
  function renderInner() {
    const name = getContractorName();
    if (!name) { renderLogin(); return; }

    if (selectedJobId) { renderDetail(name); return; }
    if (selectedEarningsJobId) { renderEarningsDetail(); return; }

    const jobs = getJobs();
    // Trade-filtered feed: only show unclaimed jobs in categories this
    // contractor is approved for, matching the "dispatched to a matched
    // panel, not an open marketplace" model — same list the server already
    // uses to decide what to sync down, applied again here so anything
    // already sitting in localStorage from before this filter existed
    // doesn't keep showing. Falls back to unfiltered when we don't know
    // this contractor's trades yet (no local application record).
    const myTrades = (getApplications().find(a => a.business === name) || {}).trades;
    const feedJobs = jobs.filter(j => j.status === 'feed' && (!myTrades || !myTrades.length || myTrades.includes(j.category)));
    const hiddenJobIds = getHiddenJobIds(name);
    const myJobsAll = jobs.filter(j => j.contractor === name && !hiddenJobIds.has(j.id));
    // Tab badge / earnings still care about "active" and "completed" as
    // simple counts; the My Jobs tab body itself now uses the status filter
    // chips below instead of a mixed list.
    const myJobs = myJobsAll.filter(j => !['completed', 'cancelled'].includes(j.status));
    const myJobsCompleted = myJobsAll.filter(j => j.status === 'completed');

    app.innerHTML = `
      <div class="whoami">Logged in as <strong>${name}</strong> <a onclick="logout()">Log out</a> · <a onclick="openInquiryForm()">Contact MySubbies</a></div>
      ${ctrProfileBarHtml(name, myJobsCompleted)}
      <div id="inquiryFormWrap"></div>
      ${(() => {
        const myApp = getApplications().find(a => a.business === name);
        if (!myApp || !myApp.referralCode) return '';
        const referredCount = getApplications().filter(a => a.referredBy === myApp.referralCode).length;
        return `<div class="box" style="margin-bottom:16px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:4px;">Refer another contractor</div>
          <div style="font-size:12px;color:var(--stone);margin-bottom:8px;">${referredCount} contractor${referredCount===1?'':'s'} referred so far.</div>
          <div style="display:flex;gap:8px;align-items:center;">
            <code style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;flex:1;">${myApp.referralCode}</code>
            <button class="btn btn-outline" style="width:auto;padding:8px 14px;font-size:12px;flex-shrink:0;" onclick="copyContractorReferralCode('${myApp.referralCode}')">Copy</button>
          </div>
          <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div style="font-size:12px;color:var(--stone);">Share the sign-up link directly</div>
            <button class="btn btn-outline" style="width:auto;padding:8px 14px;font-size:12px;flex-shrink:0;" onclick="shareContractorReferralLink('${myApp.referralCode}')">Share link</button>
          </div>
        </div>`;
      })()}
      <div class="tabs">
        <button class="${tab==='feed'?'active':''}" onclick="tab='feed'; render();">Job Feed ${feedJobs.length ? '('+feedJobs.length+')' : ''}</button>
        <button class="${tab==='myjobs'?'active':''}" onclick="tab='myjobs'; render();">My Jobs ${myJobs.length ? '('+myJobs.length+')' : ''}</button>
        <button class="${tab==='earnings'?'active':''}" onclick="tab='earnings'; render();">Earnings</button>
        <button class="${tab==='profile'?'active':''}" onclick="tab='profile'; render();">My Profile</button>
        <button class="${tab==='messages'?'active':''}" onclick="tab='messages'; render();">Messages ${adminMessages.filter(m => !m.read_at).length ? '('+adminMessages.filter(m => !m.read_at).length+')' : ''}</button>
      </div>
    `;

    if (tab === 'earnings') {
      const completed = myJobsCompleted;
      const totalEarned = completed.reduce((s, j) => s + Math.round((j.basePrice || 0) * 0.75), 0);
      const { avg: avgRating, count: ratedCount } = computeContractorRatingStats(completed);
      app.innerHTML += `
        <h1 class="pagetitle">Earnings</h1>
        ${payoutSetupCardHtml()}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;">
          <div class="box"><div style="font-size:22px;font-weight:800;">$${totalEarned.toLocaleString()}</div><div class="jobmeta">Total earned</div></div>
          <div class="box"><div style="font-size:22px;font-weight:800;">${completed.length}</div><div class="jobmeta">Jobs completed</div></div>
        </div>
        <div class="box" style="margin-bottom:20px;"><div style="font-size:18px;font-weight:800;">${starsHtml(avgRating)}</div><div class="jobmeta">Average rating${ratedCount ? ` (${ratedCount} review${ratedCount===1?'':'s'})` : ''}</div></div>
        ${completed.length === 0 ? '<div class="empty">No completed jobs yet.</div>' : `
          <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">${downloadMenuHtml('statement-contractor', 'Statement of Account')}</div>
          <table class="jobstable">
            <thead><tr><th>Job</th><th>Suburb</th><th>Payout</th><th>Rating</th><th></th></tr></thead>
            <tbody>
              ${completed.map(j => {
                const titleDetail = j.items && j.items.length === 1 ? j.items[0].taskName : j.category;
                return `
                <tr class="jobrow">
                  <td onclick="openEarningsDetail('${j.id}')"><strong>${escapeHtml(titleDetail)}</strong></td>
                  <td onclick="openEarningsDetail('${j.id}')">${escapeHtml(j.suburb)}</td>
                  <td onclick="openEarningsDetail('${j.id}')">$${Math.round((j.basePrice||0)*0.75).toLocaleString()}</td>
                  <td onclick="openEarningsDetail('${j.id}')">${j.customerRating ? `${'★'.repeat(j.customerRating)}${'☆'.repeat(5-j.customerRating)}` : '<span style="color:var(--stone-light);">Not yet rated</span>'}</td>
                  <td><button class="btn btn-outline" style="width:auto;padding:6px 12px;font-size:11.5px;" onclick="event.stopPropagation(); downloadReceiptForJob('${j.id}', 'contractor')">Receipt</button></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        `}
      `;
      return;
    }

    if (tab === 'profile') {
      app.innerHTML += renderMyProfileTabHtml(name);
      return;
    }

    if (tab === 'messages') {
      app.innerHTML += `
        <h1 class="pagetitle">Messages</h1>
        <p class="jobmeta" style="margin-bottom:16px;">Messages with MySubbies admin — separate from the job-specific chat on each job.</p>
        <div class="msgbox">
          <div class="msglist" id="msgListAdminThread"></div>
          ${msgThreadAttachment ? `
            <div style="display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:8px;font-size:12.5px;">
              <span>📎 ${escapeHtml(msgThreadAttachment.filename)}</span>
              <button onclick="removeMsgThreadAttachment()" style="background:none;border:none;color:var(--stone);cursor:pointer;font-size:15px;line-height:1;">✕</button>
            </div>
          ` : `
            <input type="file" id="msgThreadAttachmentInput" onchange="onMsgThreadAttachmentSelected(event)" style="font-size:12px;margin-bottom:8px;" />
          `}
          <div class="msginput">
            <input type="text" id="msgInputAdminThread" value="${escapeHtml(msgThreadReplyDraft)}" oninput="msgThreadReplyDraft=this.value" placeholder="Reply to MySubbies…" onkeydown="if(event.key==='Enter') sendAdminThreadReply()" />
            <button class="btn btn-black" onclick="sendAdminThreadReply()">Send</button>
          </div>
        </div>
      `;
      renderAdminThread();
      markAllAdminMessagesRead();
      return;
    }

    if (tab === 'feed') {
      app.innerHTML += `<h1 class="pagetitle">New jobs near you</h1><p class="pagesub">No lead fees. No bidding against other contractors for the same job.</p>`;
      app.innerHTML += jobSearchBoxHtml();
      const feedJobsFiltered = feedJobs.filter(j => jobMatchesSearch(j, jobSearchQuery));
      if (feedJobs.length === 0) {
        app.innerHTML += `<div class="empty">No open jobs right now.<br>Go submit one from the site to see it appear here.</div>`;
      } else if (feedJobsFiltered.length === 0) {
        app.innerHTML += `<div class="empty">No jobs match "${escapeHtml(jobSearchQuery)}".</div>`;
      } else {
        app.innerHTML += feedJobsTableHtml(feedJobsFiltered);
      }
    } else {
      app.innerHTML += `<h1 class="pagetitle">My jobs</h1><p class="pagesub">${myJobsAll.length} total, ${myJobs.length} active</p>`;
      if (myJobsAll.length === 0) {
        app.innerHTML += `<div class="empty">No accepted jobs yet.</div>`;
      } else {
        app.innerHTML += myJobsStatusFilterChipsHtml(myJobsAll);
        app.innerHTML += jobSearchBoxHtml();
        const statusFiltered = myJobsStatusFilter === 'all' ? myJobsAll : myJobsAll.filter(j => j.status === myJobsStatusFilter);
        const filtered = statusFiltered.filter(j => jobMatchesSearch(j, jobSearchQuery));
        if (statusFiltered.length === 0) {
          app.innerHTML += `<div class="empty">No jobs in this status.</div>`;
        } else if (filtered.length === 0) {
          app.innerHTML += `<div class="empty">No jobs match "${escapeHtml(jobSearchQuery)}".</div>`;
        } else {
          app.innerHTML += myJobsTableHtml(filtered);
        }
      }
    }
  }

  // Job Feed now matches the same table style as My Jobs / admin's All
  // Jobs (Aug 2026) -- previously a card with a thumbnail that fell back to
  // raw j.icon text when a job had no icon/photo, which rendered the
  // literal word "undefined" clipped inside the box (real bug, spotted in
  // a founder screenshot). The table has no icon column, so that's moot.
  function feedJobsTableHtml(jobs) {
    return `
      <table class="jobstable">
        <thead><tr><th>#</th><th>Job</th><th>Suburb</th><th>Status</th><th>Payout</th></tr></thead>
        <tbody>
          ${jobs.map(j => {
            const titleDetail = j.items && j.items.length === 1 ? j.items[0].taskName
              : j.items && j.items.length > 1 ? j.items.length + ' items'
              : `${j.qty} ${j.unit}`;
            const payout = Math.round((j.basePrice || 0) * 0.75);
            return `
              <tr class="jobrow" onclick="selectedJobId='${j.id}'; render();">
                <td>${j.jobNumber ? '#' + j.jobNumber : '—'}</td>
                <td><strong>${escapeHtml(j.category)}</strong><br><span style="color:var(--stone);font-size:12px;">${escapeHtml(titleDetail)}</span></td>
                <td>${escapeHtml(j.suburb)}</td>
                <td><span class="badge badge-feed">Open</span></td>
                <td>$${payout.toLocaleString()}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  // Job list table (Aug 2026) -- same markup, classes, badge colours and
  // status labels as jobsTableHtml() in mysubbies-admin-portal.html, so the
  // job list reads identically across all three portals. "Contractor"
  // becomes "Customer" and "Value" becomes "Payout" here since this is the
  // contractor's own view of their jobs.
  const JOB_BADGE_CLASS = { feed: 'badge-feed', assigned: 'badge-assigned', completed: 'badge-completed', cancellation_requested: 'badge-rejected', cancelled: 'badge-rejected' };
  const JOB_BADGE_LABEL = { feed: 'Awaiting contractor', assigned: 'Assigned', completed: 'Completed', cancellation_requested: 'Cancellation requested', cancelled: 'Cancelled' };
  function myJobsTableHtml(jobs) {
    return `
      <table class="jobstable">
        <thead><tr><th>#</th><th>Job</th><th>Site address</th><th>Customer</th><th>Status</th><th>Payout</th><th></th></tr></thead>
        <tbody>
          ${jobs.map(j => {
            const titleDetail = j.items && j.items.length === 1 ? j.items[0].taskName : j.category;
            // Once accepted (this table is My Jobs only, never the pre-accept
            // feed), the customer's full site address is already on the job
            // record -- show it directly here instead of just the suburb, so
            // a contractor scanning their job list doesn't have to open each
            // one (or message the customer) just to find out where to go.
            // Falls back to suburb only for the rare job with no address on
            // file (older jobs, or a customer account that never had one set).
            return `
              <tr class="jobrow" onclick="selectedJobId='${j.id}'; render();">
                <td>${j.jobNumber ? '#' + j.jobNumber : '—'}</td>
                <td><strong>${escapeHtml(titleDetail)}</strong>${jobHasUnreadMessage(j) ? ` <span style="color:var(--warn);font-size:9px;vertical-align:middle;" title="New message">●</span>` : ''}${j.items && j.items.length > 1 ? `<br><span style="color:var(--stone);font-size:12px;">${j.items.length} items</span>` : ''}</td>
                <td>${escapeHtml(j.address || j.suburb)}${j.address ? `<br><span style="color:var(--stone);font-size:12px;">${escapeHtml(j.suburb)}</span>` : ''}</td>
                <td>${j.customerName ? escapeHtml(j.customerName) : '—'}</td>
                <td><span class="badge ${JOB_BADGE_CLASS[j.status] || 'badge-feed'}">${JOB_BADGE_LABEL[j.status] || j.status}</span></td>
                <td>$${Math.round((j.basePrice || 0) * 0.75).toLocaleString()}</td>
                <td>${j.status === 'cancelled' ? `<button class="btn btn-outline" style="width:auto;padding:6px 10px;font-size:11.5px;" onclick="hideCancelledJob('${j.id}', event)">Remove</button>` : ''}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  // Removing a cancelled job (Aug 2026) -- same per-account "hidden" list
  // pattern as mysubbies-customer-portal.html's hideCancelledJob(). Only
  // hides the job from THIS contractor's own My Jobs view (own localStorage
  // key) -- never deletes from the shared mysubbies_jobs array via
  // saveJobs(), since the customer's and admin's views still need it.
  function getHiddenJobIds(contractorName) {
    try {
      const all = JSON.parse(localStorage.getItem('mysubbies_contractor_hidden_jobs') || '{}');
      return new Set(all[contractorName] || []);
    } catch (e) { return new Set(); }
  }
  function hideCancelledJob(jobId, event) {
    if (event) event.stopPropagation();
    const name = getContractorName();
    if (!name) return;
    try {
      const all = JSON.parse(localStorage.getItem('mysubbies_contractor_hidden_jobs') || '{}');
      if (!all[name]) all[name] = [];
      if (!all[name].includes(jobId)) all[name].push(jobId);
      localStorage.setItem('mysubbies_contractor_hidden_jobs', JSON.stringify(all));
    } catch (e) { /* non-critical -- worst case the job just stays visible */ }
    render();
  }

  function renderDetail(name) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    if (!j) { selectedJobId = null; render(); return; }
    const isMine = j.contractor === name;
    const payout = Math.round(j.basePrice * 0.75);

    let actions = '';
    if (!isMine) {
      actions = `
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button class="btn btn-outline" style="flex:1;" onclick="declineJob('${j.id}')">✕ Decline</button>
          <button class="btn btn-black" style="flex:2;" onclick="acceptJob('${j.id}')">Accept job →</button>
        </div>`;
    } else if (j.status === 'cancellation_requested') {
      // Either side's cancellation is pending admin review — the
      // contractor is locked out of further claims/movement until that's
      // resolved, so nothing here can race an admin decision.
      actions = `<div class="note" style="color:var(--warn);">⚠ ${j.cancellationRequestedBy === 'contractor' ? 'Your cancellation request is being reviewed by MySubbies' : 'The customer has requested to cancel this job. MySubbies is reviewing it'} — no further action is needed from you right now.</div>`;
    } else if (j.status === 'completed') {
      actions = `<div id="milestoneClaimWrap"><div class="note">Loading payment schedule…</div></div>`;
    } else {
      // Once accepted, cancelling isn't self-service any more — same as the
      // customer side, this needs a real conversation (materials may
      // already be sourced, time already scheduled), so it goes to
      // MySubbies for review rather than cancelling instantly.
      actions = `
        <div id="milestoneClaimWrap"><div class="note">Loading payment schedule…</div></div>
        <button class="btn btn-outline btn-full" style="margin-top:8px;color:var(--warn);" onclick="openContractorRequestCancelForm('${j.id}')">Request to cancel</button>
        <div id="contractorCancelFormWrap"></div>`;
    }

    app.innerHTML = `
      <button class="backbtn" onclick="selectedJobId=null; render();">← Back</button>
      ${notifyBannerHtml()}
      <div class="detailcard">
        ${j.photoDataUrls && j.photoDataUrls.length > 1 ? `
          <div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;">
            ${j.photoDataUrls.map(src => `<img src="${src}" style="width:90px;height:90px;border-radius:10px;object-fit:cover;flex-shrink:0;" />`).join('')}
          </div>
        ` : j.photoDataUrl ? `<img class="jobphoto" src="${j.photoDataUrl}">` : ''}
        <span class="pill">${escapeHtml(j.category)}</span>
        <h1 class="pagetitle" style="margin-top:8px;">${escapeHtml(j.category)}${j.items && j.items.length > 1 ? '' : ` — ${j.qty} ${escapeHtml(j.unit)}`}</h1>
        <div class="jobmeta" style="margin-bottom:16px;">${j.jobNumber ? `Job #${j.jobNumber} · ` : ''}📍 ${escapeHtml(isMine ? (j.address || j.suburb) : j.suburb)} ${isMine ? '· ' + escapeHtml(j.customerName) : ''}</div>
        ${j.items && j.items.length ? `
          <div style="border-top:1px solid var(--paper);border-bottom:1px solid var(--paper);padding:10px 0;margin-bottom:8px;">
            ${j.items.map(i => `
              <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;">
                <span>${i.catIcon || ''} ${escapeHtml(i.taskName)} <span style="color:var(--stone);">(${i.qty} ${escapeHtml(i.unit)})</span></span>
                <span style="font-weight:600;">${i.aiEstimated ? '~' : ''}$${Math.round(i.base * 0.75).toLocaleString()}</span>
              </div>
              ${i.aiEstimated ? `<div style="font-size:11.5px;font-weight:700;color:#D98E14;background:#FDF0D9;border-radius:6px;padding:4px 8px;margin-bottom:4px;">🤖 AI-estimated price — MySubbies will confirm the final price before this is dispatched</div>` : ''}
              ${i.notes ? `<div style="font-size:11.5px;color:var(--stone);margin-bottom:4px;">${escapeHtml(i.notes)}</div>` : ''}
            `).join('')}
          </div>
        ` : ''}
        <div class="row big"><span class="l">${isMine ? 'Your payout' : 'Confirmed payout'}</span><span class="r">$${payout.toLocaleString()}</span></div>
        ${j.site ? `<div class="row"><span class="l">On site</span><span class="r">${escapeHtml(j.site)}</span></div>` : ''}
        ${j.access ? `<div class="row"><span class="l">Access</span><span class="r">${escapeHtml(j.access)}</span></div>` : ''}
        ${j.urgency ? `<div class="row"><span class="l">Urgency</span><span class="r">${escapeHtml(j.urgency)}</span></div>` : ''}
        ${!isMine ? '<div class="note">Full address is shared once you accept. Message the customer in-app — their phone number is not shared with contractors. No fee or commission is shown or deducted from what you see here.</div>' : ''}
        ${isMine ? '<div class="note">Keep all communication with the customer in the message thread below — their phone number isn\'t shared with contractors.</div>' : ''}
        ${actions}
      </div>
      ${isMine ? `
        <div class="detailcard" style="margin-top:14px;">
          <h3 style="font-size:15px;margin-bottom:10px;">Before / after photos</h3>
          <p style="font-size:11.5px;color:var(--stone);margin-bottom:10px;">Visible to the customer and MySubbies — good practice for every job, and useful evidence if a dispute comes up.</p>
          ${photoSetHtml('before', j.beforePhotos || [])}
          ${photoSetHtml('after', j.afterPhotos || [])}
        </div>
        <div class="detailcard" style="margin-top:14px;">
          <h3 style="font-size:15px;margin-bottom:10px;">Variations</h3>
          <div id="variationList">${variationListHtml(j, 'contractor')}</div>
          <div id="variationFormWrap"></div>
          ${j.status !== 'cancellation_requested' ? `<button class="btn btn-outline btn-full" style="margin-top:10px;" onclick="openVariationForm()">+ Request a variation</button>` : ''}
        </div>
      ` : ''}
      ${isMine ? `
        <div class="msgbox">
          <h3>💬 Messages with customer</h3>
          <div class="msglist" id="msgListCustomer"></div>
          ${j.status === 'completed'
            ? `<div style="font-size:12px;color:var(--stone-light);text-align:center;padding:8px 0;">This job is complete — messaging with the customer is closed. Contact MySubbies support if you need to follow up on anything.</div>`
            : j.status === 'cancellation_requested'

  // ============================================================
  // Downloads -- Payment Receipt (per job, PDF) and Payment/Earnings
  // Statement (all jobs, PDF/CSV/Excel). toCsv/downloadCsv copied verbatim

  // Deliberately kept as "Payment Receipt"/"Earnings Statement", never
  // "Tax Invoice" -- unlike mysubbies-customer-portal.html's version (where
  // Mysubbies genuinely is the GST-registered seller of record to the
  // customer), Mysubbies is not the buyer of a contractor's services here.
  // A contractor invoicing Mysubbies for their own GST-registered supply --
  // or Mysubbies issuing a Recipient-Created Tax Invoice on their behalf --

  // ============================================================
  const MYSUBBIES_ABN = '69 693 675 268';
  const MYSUBBIES_LEGAL_NAME = 'Mysubbies Holdings Pty Ltd';
  const MYSUBBIES_LOCATION = 'Melbourne, VIC';
  const PDF_NAVY = [20, 33, 61];
  const PDF_PAPER = [247, 247, 245];
  function pdfLetterhead(doc, { docType, docRef, dateStr }) {
    doc.setFillColor(...PDF_NAVY); doc.rect(0, 0, 210, 34, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(20);

    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text(docType, 196, 15, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(200, 206, 220);
    if (docRef) doc.text(docRef, 196, 21, { align: 'right' });
    doc.text(`Issued ${dateStr}`, 196, 27, { align: 'right' });
    doc.setTextColor(0, 0, 0);
  }
  function pdfFooter(doc, noteLine) {
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      const h = doc.internal.pageSize.getHeight();
      doc.setDrawColor(230, 230, 227); doc.setLineWidth(0.2);
      doc.line(14, h - 18, 196, h - 18);
      doc.setFontSize(7.5); doc.setTextColor(140, 140, 138);
      doc.text(`${MYSUBBIES_LEGAL_NAME} · ABN ${MYSUBBIES_ABN} · ${MYSUBBIES_LOCATION}`, 14, h - 12);
      doc.text(noteLine, 14, h - 8);
      doc.text(`Page ${i} of ${pageCount}`, 196, h - 8, { align: 'right' });
    }
  }
  function pdfSimpleTotalBox(doc, y, totalCents, totalLabel) {
    const boxX = 130, boxW = 66;
    doc.setDrawColor(220, 220, 217); doc.line(boxX, y, boxX + boxW, y);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(20, 33, 61);
    doc.text(totalLabel, boxX, y + 8);
    doc.text(fmtCents(totalCents), boxX + boxW, y + 8, { align: 'right' });
    doc.setTextColor(0, 0, 0); doc.setFont('helvetica', 'normal');
    return y + 15;
  }
  function toCsv(rows, columns) {
    const esc = v => {
      const s = v == null ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const header = columns.map(c => esc(c.label)).join(',');
    const body = rows.map(r => columns.map(c => esc(r[c.key])).join(',')).join('\n');
    return header + '\n' + body;
  }
  function downloadCsv(filename, csv) {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function downloadXlsx(filename, rows, columns) {
    const sheetRows = rows.map(r => {
      const o = {};
      columns.forEach(c => { o[c.label] = r[c.key]; });
      return o;
    });
    const ws = XLSX.utils.json_to_sheet(sheetRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    XLSX.writeFile(wb, filename);
  }
  function fmtCents(c) { return '$' + ((c || 0) / 100).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  const STATEMENT_COLUMNS = [
    { key: 'jobNumber', label: 'Job #' }, { key: 'category', label: 'Category' }, { key: 'suburb', label: 'Suburb' },
    { key: 'stage', label: 'Stage' }, { key: 'amount', label: 'Amount' }, { key: 'status', label: 'Status' }, { key: 'paidAt', label: 'Paid On' },
  ];
  function statementRows(jobsWithMilestones, forRole) {
    const rows = [];
    jobsWithMilestones.forEach(j => {
      (j.milestones || []).forEach(m => {
        const amountCents = forRole === 'contractor' ? Math.round((m.amount_cents || 0) * 0.75) : (m.amount_cents || 0);
        rows.push({
          jobNumber: j.jobNumber != null ? '#' + j.jobNumber : j.jobId,
          category: j.category || '', suburb: j.suburb || '', stage: m.label || m.milestone_type || '',
          amount: fmtCents(amountCents), status: m.status === 'paid' ? 'Paid' : 'Pending',
          paidAt: m.paid_at ? new Date(m.paid_at).toLocaleDateString('en-AU') : '',
        });
      });
    });
    return rows;
  }
  async function loadStatementJobs(forRole) {
    const email = localStorage.getItem(forRole === 'contractor' ? 'mysubbies_contractor_email' : 'mysubbies_customer_email');
    const param = forRole === 'contractor' ? 'contractorEmail' : 'customerEmail';

  async function downloadStatement(format, forRole) {
    dlMenuOpenFor = null; render();
    showToast('Preparing your statement…');
    try {
      const jobsWithMilestones = await loadStatementJobs(forRole);
      const rows = statementRows(jobsWithMilestones, forRole);
      if (rows.length === 0) { showToast('No payments to include yet.'); return; }
      const label = forRole === 'contractor' ? 'mysubbies-earnings-statement' : 'mysubbies-statement-of-account';
      if (format === 'csv') {
        downloadCsv(label + '.csv', toCsv(rows, STATEMENT_COLUMNS));
      } else if (format === 'xlsx') {
        downloadXlsx(label + '.xlsx', rows, STATEMENT_COLUMNS);
      } else if (format === 'pdf') {
        const totalCents = jobsWithMilestones.reduce((s, j) => s + (j.milestones || []).filter(m => m.status === 'paid').reduce((s2, m) => s2 + Math.round((m.amount_cents || 0) * (forRole === 'contractor' ? 0.75 : 1)), 0), 0);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const docType = forRole === 'contractor' ? 'EARNINGS STATEMENT' : 'STATEMENT OF ACCOUNT';
        pdfLetterhead(doc, { docType, docRef: null, dateStr: new Date().toLocaleDateString('en-AU') });
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(140);

        doc.text(localStorage.getItem(forRole === 'contractor' ? 'mysubbies_contractor_email' : 'mysubbies_customer_email') || '—', 14, 52);
        doc.autoTable({
          startY: 62, head: [STATEMENT_COLUMNS.map(c => c.label)],
          body: rows.map(r => STATEMENT_COLUMNS.map(c => r[c.key])),
          styles: { fontSize: 8, cellPadding: 3.5 }, headStyles: { fillColor: PDF_NAVY, textColor: 255, fontStyle: 'bold' },
          alternateRowStyles: { fillColor: PDF_PAPER },
          columnStyles: { 4: { halign: 'right' }, 5: { halign: 'center' } },
          theme: 'grid',
        });
        let finalY = doc.lastAutoTable.finalY || 66;
        if (finalY > 260) { doc.addPage(); finalY = 20; }
        pdfSimpleTotalBox(doc, finalY + 12, totalCents, forRole === 'contractor' ? 'Total paid out' : 'Total paid');
        pdfFooter(doc, 'This is a payment record, not a tax invoice.');
        doc.save(label + '.pdf');
      }
    } catch (e) { showToast('Could not prepare the statement — try again.'); }
  }
