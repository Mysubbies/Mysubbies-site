  async function renderMilestoneClaimSection(jobId) {
    const wrap = document.getElementById('milestoneClaimWrap');
    if (!wrap) return;
    let data;
    try {
      const res = await fetch('/api/job-payment-schedule?jobId=' + encodeURIComponent(jobId));
      data = await res.json();
    } catch (e) {
      wrap.innerHTML = '<div class="note">Could not load the payment schedule — try again shortly.</div>';
      return;
    }
    if (!data.schedule) { wrap.innerHTML = '<div class="note">No payment schedule found for this job yet.</div>'; return; }
    if (data.schedule.status === 'pending_admin_schedule') {
      wrap.innerHTML = '<div class="note">This is a large or complex project — MySubbies is preparing a project-specific payment plan with the customer before further milestones open up.</div>';
      return;
    }

    const milestones = data.milestones || [];
    const doneCount = milestones.filter(m => m.status === 'paid').length;
    const stagebar = `<div class="stagebar">${milestones.map(m => `<div class="stage ${m.status === 'paid' ? 'done' : ''}" style="flex:${m.pct};"></div>`).join('')}</div>`;
    // Percentage only, deliberately no dollar figure -- amount_cents is the
    // milestone's share of the CUSTOMER's full price, not the contractor's
    // payout (75%, and for anything past the deposit, paid out manually by
    // AP rather than by an automated split). Showing that number here would
    // read as a payout promise the system doesn't actually enforce.
    const list = `<div style="margin:10px 0;">${milestones.map(m => `
      <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:${m.status === 'paid' ? 'var(--good)' : 'var(--stone)'};">
        <span>${m.status === 'paid' ? '✓' : '○'} ${escapeHtml(m.label)}</span>
        <span>${m.pct}%</span>
      </div>`).join('')}</div>`;

    const next = milestones.find(m => m.status !== 'paid');
    let actionHtml;
    if (!next) {
      actionHtml = '<div class="note">✓ Job complete — fully paid.</div>';
    } else if (next.milestone_type === 'deposit') {
      actionHtml = '<div class="note">Waiting on the deposit payment.</div>';
    } else if (next.status === 'available') {
      actionHtml = `<button class="btn btn-black btn-full" style="margin-top:10px;" onclick="openMilestoneClaimForm('${jobId}','${next.key}')">Claim: ${escapeHtml(next.label)} (${next.pct}%)</button><div id="milestoneClaimFormWrap"></div>`;
    } else if (next.status === 'awaiting_customer') {
      actionHtml = `<div class="note">⏳ Waiting on the customer to review <strong>${escapeHtml(next.label)}</strong>.</div>`;
    } else if (next.status === 'disputed') {
      actionHtml = `<div class="note" style="color:var(--warn);">⚠ The customer raised an issue with <strong>${escapeHtml(next.label)}</strong> — MySubbies is reviewing it.</div>`;
    } else if (next.status === 'payment_processing') {
      actionHtml = `<div class="note">Payment for <strong>${escapeHtml(next.label)}</strong> is processing.</div>`;
    } else {
      actionHtml = `<div class="note">${escapeHtml(next.label)} is ${next.status}.</div>`;
    }

    wrap.innerHTML = stagebar + list + actionHtml;
    window.__mysubbiesMilestones = milestones;
  }

  function claimPhotoGridHtml() {

    return `<div class="photoset-grid">${claimPhotos.map((src, idx) => `

  function onClaimPhotoSelected(e) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    let remaining = files.length;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        claimPhotos.push(ev.target.result);
        remaining--;
        if (remaining === 0) { const gridWrap = document.getElementById('claimPhotoGridWrap'); if (gridWrap) gridWrap.innerHTML = claimPhotoGridHtml(); }
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  }

    claimPhotos.splice(idx, 1);
    const gridWrap = document.getElementById('claimPhotoGridWrap');
    if (gridWrap) gridWrap.innerHTML = claimPhotoGridHtml();

    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();

  async function submitMilestoneClaim(jobId, milestoneKey) {
    const errBox = document.getElementById('claimError');
    const description = document.getElementById('claimDescription').value.trim();
    const declared = document.getElementById('claimDeclaration').checked;
    const inspectionInput = document.getElementById('claimInspectionId');
    errBox.textContent = '';
    if (!declared) { errBox.textContent = 'Please confirm the declaration checkbox.'; return; }

    try {
      const res = await fetch('/api/milestone', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'claim', jobId, milestoneKey,
          contractorId: null, description,
          photoUrls: claimPhotos, deliveryDocketUrl: claimDocketDataUrl,
          inspectionRecordId: inspectionInput ? inspectionInput.value.trim() || null : null,
          declarationConfirmed: true,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not submit claim.');
      claimPhotos = [];
      claimDocketDataUrl = null;
      renderMilestoneClaimSection(jobId);
    } catch (err) {
      errBox.textContent = err.message || 'Could not submit claim.';
    }
  }

  function submitVariation(jobId) {
    const description = document.getElementById('varDescription').value.trim();
    const amount = Number(document.getElementById('varAmount').value);
    const reason = document.getElementById('varReason').value.trim();
    if (!description || !amount) return;

    const jobs = getJobs();
    const j = jobs.find(x => x.id === jobId);
    j.variations = j.variations || [];
    const variation = { id: 'var_' + Date.now(), description, amount, reason, status: 'pending', requestedAt: new Date().toISOString() };
    j.variations.push(variation);
    j.messages = j.messages || [];
    j.messages.push({ id: 'm_' + Date.now(), from: 'contractor', authorName: getContractorName(), text: `📋 Requested a variation: "${description}" for +$${amount.toLocaleString()} — please review and approve in My Jobs.`, createdAt: new Date().toISOString() });
    saveJobs(jobs);
    renderDetail(getContractorName());
  }

  function sendMsg(key) {
    const inputId = key === 'messages' ? 'msgInputCustomer' : 'msgInputAdmin';
    const input = document.getElementById(inputId);
    const text = input.value.trim();
    if (!text) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    if (!j || (key === 'messages' && ['completed', 'cancellation_requested'].includes(j.status))) return;
    j[key] = j[key] || [];
    j[key].push({ id: 'm_' + Date.now(), from: 'contractor', authorName: getContractorName(), text, createdAt: new Date().toISOString() });
    saveJobs(jobs);
    if (key === 'messages' && j.customerEmail) {
      fetch('/api/notify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'job-message', toEmail: j.customerEmail, toRole: 'customer', fromName: getContractorName(), category: j.category, jobNumber: j.jobNumber, jobId: j.id, text }),

  // ---- Real browser notifications (while this tab is open) + cross-tab live updates ----
  function notifyBannerHtml() {
    if (!('Notification' in window) || Notification.permission !== 'default') return '';
    return `<div class="note" style="background:var(--paper);padding:10px 12px;border-radius:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;"><span>Get a desktop alert on new messages (while this tab is open)</span><button id="notifyBtn" style="background:none;border:none;text-decoration:underline;font-size:12px;cursor:pointer;">Turn on</button></div>`;
  }
  function wireNotifyButton() {
    const btn = document.getElementById('notifyBtn');
    if (btn) btn.onclick = () => Notification.requestPermission().then(() => renderDetail(getContractorName()));
  }
  function notify(text) {
    if ('Notification' in window && Notification.permission === 'granted') new Notification('MySubbies', { body: text });
  }
  let lastMsgCounts = {};
  // Persistent (localStorage-backed) unread-message tracking for the
  // customer-facing thread only (not the private admin thread, which
  // already has its own real read-state via admin_contractor_messages).
  // Separate from lastMsgCounts below -- that one only detects a message
  // arriving while this tab is open (to fire a desktop Notification) and
  // resets on reload; this one survives reload/tab-close so a job with a
  // new customer message keeps showing a dot in My Jobs until the
  // contractor actually opens it. Same-device only (no server-side
  // read-state exists) -- real notification-across-devices is what the
  // email sent from sendMsg() (see api/notify.js's job-message type) is
  // for.
  function getMsgSeenMap() {
    try { return JSON.parse(localStorage.getItem('mysubbies_contractor_msg_seen') || '{}'); } catch (e) { return {}; }
  }
  function markJobMessagesSeen(jobId) {
    const j = getJobs().find(x => x.id === jobId);
    if (!j) return;
    const map = getMsgSeenMap();
    map[jobId] = (j.messages || []).length;
    try { localStorage.setItem('mysubbies_contractor_msg_seen', JSON.stringify(map)); } catch (e) { /* non-critical */ }
  }
  function jobHasUnreadMessage(j) {
    const msgs = j.messages || [];
    if (!msgs.length) return false;
    const last = msgs[msgs.length - 1];
    if (last.from === 'contractor') return false;
    return msgs.length > (getMsgSeenMap()[j.id] || 0);
  }
  function checkForNewMessages() {
    const contractorName = getContractorName();
    if (!contractorName) return;
    getJobs().filter(j => j.contractor === contractorName).forEach(j => {
      ['messages', 'internalMessages'].forEach(key => {
        const arr = j[key] || [];
        const cacheKey = j.id + '_' + key;
        const last = arr[arr.length - 1];
        if (lastMsgCounts[cacheKey] !== undefined && arr.length > lastMsgCounts[cacheKey] && last && last.from !== 'contractor') {
          notify(`${last.authorName || last.from}: ${last.text}`);
        }
        lastMsgCounts[cacheKey] = arr.length;
      });
    });
  }
  window.addEventListener('storage', (e) => { if (e.key === 'mysubbies_jobs') { checkForNewMessages(); render(); } });
  setInterval(checkForNewMessages, 3000);

  // ---- Notification center (bell icon + panel, Sep 2026) ----
  // See mysubbies-customer-portal.html for the matching implementation and
  // comments (self-contained convention, no shared JS file). Persistent
  // and cross-device (api/notifications.js), unlike checkForNewMessages()
  // above which only fires a transient desktop popup while this tab is
  // open.
  let notifPanelOpen = false;
  let notifItems = [];
  let notifUnreadCount = 0;
  async function pollNotifications() {
    const email = localStorage.getItem('mysubbies_contractor_email');
    if (!email) return;
    try {
      const res = await fetch('/api/notifications?role=contractor&email=' + encodeURIComponent(email));
      if (!res.ok) return;
      const data = await res.json();
      notifItems = data.notifications || [];
      notifUnreadCount = data.unreadCount || 0;
      renderNotifBadge();
      if (notifPanelOpen) renderNotifPanel();
    } catch (e) { /* offline -- badge just stays as last known */ }
  }
  function renderNotifBadge() {
    const badge = document.getElementById('notifBadge');
    if (!badge) return;
    if (notifUnreadCount > 0) { badge.textContent = notifUnreadCount > 9 ? '9+' : notifUnreadCount; badge.style.display = 'flex'; }
    else { badge.style.display = 'none'; }
  }
  function toggleNotifPanel() {
    notifPanelOpen = !notifPanelOpen;
    const panel = document.getElementById('notifPanel');
    if (!panel) return;
    if (notifPanelOpen) { panel.style.display = 'block'; renderNotifPanel(); }
    else { panel.style.display = 'none'; }
  }
  function renderNotifPanel() {
    const panel = document.getElementById('notifPanel');
    if (!panel) return;
    panel.innerHTML = `
      <div class="notif-panel-header">
        <span>Notifications</span>
        ${notifUnreadCount > 0 ? `<a onclick="markAllNotifsRead()">Mark all read</a>` : ''}
      </div>
      ${notifItems.length === 0 ? `<div class="notif-empty">No notifications yet.</div>` : notifItems.map(n => `
        <button type="button" class="notif-item ${!n.readAt ? 'unread' : ''}" onclick="openNotif('${n.id}', ${n.linkJobId ? `'${n.linkJobId}'` : 'null'})">
          <div class="notif-item-title">${escapeHtml(n.title)}</div>
          <div class="notif-item-body">${escapeHtml(n.body)}</div>
          <div class="notif-item-time">${new Date(n.createdAt).toLocaleString('en-AU')}</div>
        </button>
      `).join('')}
    `;
  }
  function markAllNotifsRead() {
    const email = localStorage.getItem('mysubbies_contractor_email');
    if (!email) return;
    fetch('/api/notifications', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'markAllRead', role: 'contractor', email }) }).catch(() => {});
    const now = new Date().toISOString();
    notifItems.forEach(n => { n.readAt = n.readAt || now; });
    notifUnreadCount = 0;
    renderNotifBadge();
    renderNotifPanel();
  }
  function openNotif(id, jobId) {
    const email = localStorage.getItem('mysubbies_contractor_email');
    if (email) {
      fetch('/api/notifications', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'markRead', id, role: 'contractor', email }) }).catch(() => {});
    }
    const item = notifItems.find(n => n.id === id);
    if (item && !item.readAt) { item.readAt = new Date().toISOString(); notifUnreadCount = Math.max(0, notifUnreadCount - 1); }
    renderNotifBadge();
    toggleNotifPanel();
    if (jobId) { selectedJobId = jobId; render(); }
  }
  document.addEventListener('click', (e) => {
    if (notifPanelOpen && !e.target.closest('.notif-panel') && !e.target.closest('.navlink-bell')) {
      notifPanelOpen = false;
      const p = document.getElementById('notifPanel');
      if (p) p.style.display = 'none';
    }
  });
  pollNotifications();
  setInterval(pollNotifications, 25000);

  function acceptJob(id) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.status = 'assigned';
    j.contractor = getContractorName();
    // Separate from the display-name `contractor` field above (kept as-is
    // for existing rendering code) — this is what sync-jobs.js uses to
    // populate the jobs.contractor_email lookup column for cross-device
    // filtering in get-jobs.js.
    j.contractorEmail = localStorage.getItem('mysubbies_contractor_email');
    saveJobs(jobs);
    if (j.customerEmail) {
      fetch('/api/notify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
        type: 'job-assigned', customerEmail: j.customerEmail, category: j.category, suburb: j.suburb, address: j.address,
        contractorName: j.contractor, jobId: j.id,
        items: (j.items || []).map(i => ({ taskName: i.taskName, qty: i.qty, unit: i.unit })), qty: j.qty, unit: j.unit, urgency: j.urgency,
        basePrice: j.basePrice,
      }) }).catch(() => {});
    }
    render();
  }
  function declineJob(id) { selectedJobId = null; render(); }

  // Mirrors requestCancelJob() in mysubbies-customer-portal.html -- once a
  // job is accepted, cancelling isn't self-service for the contractor
  // either, for the same reason: MySubbies has to square it with the
  // customer (who may already have paid a deposit) before it's final.
  // In-page form, not window.prompt() -- prompt() is a silent no-op on a
  // site installed as a standalone PWA (see the customer-portal fix, Aug 2026).
  function openContractorRequestCancelForm(jobId) {
    document.getElementById('contractorCancelFormWrap').innerHTML = `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--paper);">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;">Why would you like to cancel?</div>
        <textarea id="contractorCancelReason" placeholder="Tell us why, so MySubbies can review this" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;min-height:70px;font-family:inherit;"></textarea>
        <div id="contractorCancelError" style="color:var(--warn);font-size:12.5px;margin-bottom:8px;display:none;"></div>
        <button class="btn btn-black btn-full" onclick="submitContractorRequestCancel('${jobId}')">Submit cancellation request</button>
      </div>`;
  }
  function submitContractorRequestCancel(jobId) {
    const input = document.getElementById('contractorCancelReason');
    const reason = input.value.trim();
    const errBox = document.getElementById('contractorCancelError');
    if (!reason) {
      errBox.textContent = 'Please tell us why, so MySubbies can review this.';
      errBox.style.display = 'block';
      input.focus();
      return;
    }
    const jobs = getJobs();
    const j = jobs.find(x => x.id === jobId);
    if (!j) return;
    j.status = 'cancellation_requested';
    j.cancellationReason = reason;
    j.cancellationRequestedAt = new Date().toISOString();
    j.cancellationRequestedBy = 'contractor';
    saveJobs(jobs);
    render();
  }

  function photoSetHtml(kind, photos) {
    const label = kind === 'before' ? 'Before' : 'After';
    return `
      <div class="photoset-label">${label} photos</div>
      <div class="photoset-grid">
        ${photos.map((src, idx) => `
          <div class="photoset-thumb">
            <img src="${src}" />
            <button onclick="removeJobPhoto('${kind}', ${idx})" title="Remove">✕</button>
          </div>
        `).join('')}
      </div>
      <input type="file" id="jobPhoto_${kind}_camera" accept="image/*" capture="environment" multiple style="display:none;" onchange="onJobPhotoSelected('${kind}', event)" />
      <input type="file" id="jobPhoto_${kind}_gallery" accept="image/*" multiple style="display:none;" onchange="onJobPhotoSelected('${kind}', event)" />
      <div class="photoset-addrow">
        <div class="photoset-addbtn" onclick="document.getElementById('jobPhoto_${kind}_camera').click()">📷 Take a photo</div>
        <div class="photoset-addbtn" onclick="document.getElementById('jobPhoto_${kind}_gallery').click()">🖼️ Gallery</div>
      </div>
    `;
  }
  function onJobPhotoSelected(kind, e) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    const key = kind === 'before' ? 'beforePhotos' : 'afterPhotos';
    let remaining = files.length;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const jobs = getJobs();
        const j = jobs.find(x => x.id === selectedJobId);
        j[key] = j[key] || [];
        j[key].push(ev.target.result);
        saveJobs(jobs);
        remaining--;
        if (remaining === 0) render();
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  }
  function removeJobPhoto(kind, idx) {
    const key = kind === 'before' ? 'beforePhotos' : 'afterPhotos';
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    j[key].splice(idx, 1);
    saveJobs(jobs);
    render();
  }

  function getApplications() { return JSON.parse(localStorage.getItem('mysubbies_contractor_applications') || '[]'); }
  function saveApplications(apps) { localStorage.setItem('mysubbies_contractor_applications', JSON.stringify(apps)); }

  // Same publishable/safe-to-expose Supabase key as the customer and
  // contractor-signup pages — protected by RLS, not secrecy.
  const SUPABASE_URL = 'https://yloiecuvrejaxxqvjglw.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dxp8_eCHY9nP1xF-LmxfuQ_h427tK3Y';
  const sb = (typeof window.supabase !== 'undefined')
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

  function renderLogin() {
    app.innerHTML = `
      <div class="loginbox">
        <h1>Contractor Portal</h1>
        <p>Separate from customer logins.</p>
        <input type="email" id="loginEmail" placeholder="Email" style="margin-bottom:10px;" />
        <input type="password" id="loginPassword" placeholder="Password" style="margin-bottom:14px;" />
        <div id="loginError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
        <button class="btn btn-black btn-full" onclick="doLogin()">Log in →</button>
        <div style="text-align:center;font-size:13px;color:var(--stone);margin-top:14px;">
          <a onclick="renderForgotPassword()" style="text-decoration:underline;cursor:pointer;">Forgot password?</a>
        </div>
        <div style="text-align:center;font-size:13px;color:var(--stone);margin-top:8px;">
          Not registered yet? <a href="mysubbies-contractor-signup.html" style="font-weight:600;color:var(--ink);text-decoration:underline;">Apply to join</a>
        </div>
      </div>`;
  }
  function renderForgotPassword() {
    app.innerHTML = `
      <div class="loginbox">
        <h1>Reset password</h1>
        <p>Enter your application email. Our team will verify it's you and help you back in — we don't reset passwords automatically.</p>
        <input type="email" id="resetEmail" placeholder="Email" style="margin-bottom:10px;" />
        <div id="resetError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
        <button class="btn btn-black btn-full" onclick="requestPasswordReset()">Request reset →</button>
        <div style="text-align:center;font-size:13px;color:var(--stone);margin-top:14px;">
          <a onclick="renderLogin()" style="text-decoration:underline;cursor:pointer;">Back to log in</a>
        </div>
      </div>`;
  }
  function requestPasswordReset() {
    const email = document.getElementById('resetEmail').value.trim().toLowerCase();
    if (!email) { document.getElementById('resetError').textContent = 'Enter your email.'; return; }
    const requests = JSON.parse(localStorage.getItem('mysubbies_password_reset_requests') || '[]');
    requests.unshift({ id: 'reset_' + Date.now(), role: 'contractor', email, status: 'pending', requestedAt: new Date().toISOString() });
    localStorage.setItem('mysubbies_password_reset_requests', JSON.stringify(requests));
    app.innerHTML = `
      <div class="loginbox">
        <h1>Request received</h1>
        <p>If that email matches an application on file, our team will contact you directly to verify your identity and reset your password. This won't happen automatically.</p>
        <div style="text-align:center;font-size:13px;color:var(--stone);margin-top:14px;">
          <a onclick="renderLogin()" style="text-decoration:underline;cursor:pointer;">Back to log in</a>
        </div>
      </div>`;
  }
  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;
    const errBox = document.getElementById('loginError');
    if (!email || !password) { errBox.textContent = 'Enter your email and password.'; return; }

    const apps = getApplications();
    const application = apps.find(a => a.email === email);

    // Try the REAL account first, regardless of whether this browser has a
    // local application record — that's what makes this work cross-device.
    let verified = false;
    let remoteStatus = null; // real status from the `contractors` table, when available
    let knownAuthUserId = null;
    if (sb) {
      const { data: existing } = await sb.from('contractors').select('auth_user_id').eq('email', email).maybeSingle();
      knownAuthUserId = existing?.auth_user_id || null;
      const { data: authData, error } = await sb.auth.signInWithPassword({ email, password });
      verified = !error;
      if (verified) {
        const { data: profile } = await sb.from('contractors').select('status').eq('auth_user_id', authData.user.id).maybeSingle();
        if (profile) remoteStatus = profile.status;
      }
    }
    if (!verified) {
      // Once an account has a real Supabase Auth identity, the plaintext
      // local-application-password comparison below must never run for it
      // again -- otherwise a wrong Supabase password would silently
      // succeed via the old local copy. Same gate as the customer portal.
      if (knownAuthUserId) { errBox.textContent = 'This account already has a secure login. If you\'ve forgotten your password, contact MySubbies support.'; return; }
      if (!application || application.password !== password) { errBox.textContent = 'No account found with those details.'; return; }
      if (sb) {
        sb.auth.signUp({ email, password }).then(({ data }) => {
          if (data?.user) {
            sb.from('contractors').insert({
              auth_user_id: data.user.id, email, business_name: application.business,
              abn: application.abn, acn: application.acn, phone: application.phone,
              categories: application.trades || [],
            }).then(() => {});
          }
        });
      }
    }

    // The real `contractors.status` (kept in sync by the admin portal's
    // approve/reject actions — see api/update-contractor-status.js) is
    // authoritative whenever it's known, so approval decisions made on a
    // different device than this one still apply correctly. Local
    // application.status is only the fallback for accounts that have
    // never synced a real status yet.
    const effectiveStatus = remoteStatus || (application && application.status);
    const businessName = (application && application.business) || 'your business';
    const contactName = (application && application.contact) || 'there';

    if (!effectiveStatus) {
      errBox.textContent = '';
      app.innerHTML = `
        <div class="loginbox">
          <h1>Password verified — one more step</h1>
          <p>We've confirmed your password, but we don't have your application status on this device yet. Please log in from the device you applied from, or contact us to confirm your approval status.</p>
          <button class="btn btn-outline btn-full" onclick="renderLogin()">Back</button>
        </div>`;
      return;
    }

    if (effectiveStatus === 'pending' || effectiveStatus === 'manual_review' || effectiveStatus === 'watchlist') {
      errBox.textContent = '';
      app.innerHTML = `
        <div class="loginbox">
          <h1>Application under review</h1>
          <p>Thanks for applying, ${contactName} — we're still reviewing your application for <strong>${businessName}</strong>. You'll be able to log in once it's approved.</p>
          <button class="btn btn-outline btn-full" onclick="renderLogin()">Back</button>
        </div>`;
      return;
    }
    if (effectiveStatus === 'rejected' || effectiveStatus === 'suspended' || effectiveStatus === 'expired_documents') {
      errBox.textContent = '';
      app.innerHTML = `
        <div class="loginbox">
          <h1>Application not approved</h1>
          <p>Your application for <strong>${businessName}</strong> wasn't approved at this time. Contact us if you'd like to discuss.</p>
          <button class="btn btn-outline btn-full" onclick="renderLogin()">Back</button>
        </div>`;
      return;
    }
    localStorage.setItem('mysubbies_contractor_name', businessName);
    localStorage.setItem('mysubbies_contractor_email', email);
    // Same fix as customer-portal.html: the page-load hydrate already ran
    // and no-op'd before this login existed, so it needs to run again now.
    // hydrateAdminMessages() has the exact same email-guard early-return, so
    // it needs the same re-run -- without this, Messages sat empty until a
    // manual refresh (found live-testing the messaging feature, Aug 2026).
    await Promise.all([hydrateJobsFromServer(), hydrateAdminMessages()]);
    render();
  }
  function logout() {
    localStorage.removeItem('mysubbies_contractor_name');
    localStorage.removeItem('mysubbies_contractor_email');
    selectedJobId = null;
    render();
  }

  Promise.all([hydrateJobsFromServer(), hydrateAdminMessages()]).then(render);
  hydrateInquiriesFromServer(localStorage.getItem('mysubbies_contractor_email')).then(() => { if (document.getElementById('inquiryFormWrap')) renderInquiryPanel(); });
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
