<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MySubbies — Contractor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    /* Navy/gold reskin (Aug 2026), Stage 2 -- see CLAUDE.md and
       mysubbies-website.html's :root for the source of this palette. Every
       existing var(--black)/var(--ink) usage cascades automatically. */
    --ink: #151A26; --black: #14213D; --white: #FFFFFF; --paper: #F7F7F5;
    --stone: #6B7280; --stone-light: #9CA3AF; --line: #E7E7E4; --good: #2F7A50; --warn: #B0592E;
    --accent: #F5A623; --accent-dark: #D98E14; --accent-pale: #FDF0D9;
    --primary-light: #1F335A; --primary-pale: #E7EAF1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1, h2 { font-weight:800; letter-spacing:-0.02em; }
  a { color:inherit; text-decoration:none; }
  header { background: #fff; border-bottom:1px solid var(--line); }
  .navwrap { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { display:flex; align-items:center; gap:9px; }
  .logo-mark { width:28px; height:28px; border-radius:7px; background:#fff; }
  .logo-word { font-weight:800; font-size:19px; color:var(--black); }
  .navlinks { display:flex; align-items:center; gap:22px; font-size:13px; }
  @media (max-width:460px) { .navwrap { padding:0 14px; } .navlinks { gap:9px; font-size:11px; } }
  .navlinks a { color:var(--stone); }
  .navlinks a.current { color:var(--black); font-weight:600; }
  .wrap { max-width:640px; margin:0 auto; padding:32px 24px 80px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer; border:none; }
  .btn-black { background:var(--black); color:#fff; }
  .btn-outline { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn-full { width:100%; }
  input[type=text], input[type=email], input[type=password] { width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; border:1.5px solid var(--line); border-radius:10px; padding:13px 14px; outline:none; }
  .loginbox { background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; text-align:center; margin-top:60px; }
  .loginbox h1 { font-size:22px; margin-bottom:8px; }
  .loginbox p { color:var(--stone); font-size:14px; margin-bottom:20px; }
  .tabs { display:flex; gap:6px; background:#EFEDE9; padding:4px; border-radius:10px; margin-bottom:24px; }
  .tabs button { flex:1; padding:9px; border-radius:7px; font-size:13px; font-weight:600; border:none; cursor:pointer; background:transparent; color:var(--stone); }
  .tabs button.active { background:#fff; color:var(--ink); }
  .whoami { font-size:12px; color:var(--stone-light); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
  .whoami a { text-decoration:underline; cursor:pointer; }
  h1.pagetitle { font-size:24px; margin-bottom:2px; }
  p.pagesub { color:var(--stone); font-size:13px; margin-bottom:20px; }
  .jobcard { display:flex; gap:12px; padding:14px; border-radius:14px; border:1px solid var(--line); background:#fff; cursor:pointer; margin-bottom:10px; text-align:left; width:100%; }
  .jobcard:hover { border-color: var(--black); }
  .thumb { width:52px; height:52px; border-radius:10px; background:var(--paper); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .photoset-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--stone); margin:12px 0 6px; }
  .photoset-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); gap:6px; margin-bottom:8px; }
  .photoset-thumb { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .photoset-thumb img { width:100%; height:100%; object-fit:cover; }
  .photoset-thumb button { position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:999px; background:rgba(0,0,0,0.65); color:#fff; border:none; font-size:10px; cursor:pointer; line-height:1; }
  .photoset-addrow { display:flex; gap:6px; }
  .photoset-addbtn { flex:1; border:1.5px dashed var(--line); border-radius:8px; padding:10px; text-align:center; font-size:12px; color:var(--stone); cursor:pointer; background:#fff; }
  .pill { font-size:10px; font-weight:700; color:var(--stone); background:var(--paper); padding:2px 7px; border-radius:4px; display:inline-block; }
  .jobtitle { font-size:14px; font-weight:700; margin-top:4px; }
  .jobmeta { font-size:12px; color:var(--stone); margin-top:3px; }
  .jobprice { font-size:14px; font-weight:800; margin-top:4px; }
  .empty { text-align:center; padding:60px 20px; color:var(--stone); font-size:14px; }
  /* Job listing table (Aug 2026) -- matches mysubbies-admin-portal.html's
     All Jobs table exactly (same classes/values), so the job list looks
     and reads the same across all three portals. Used for "My Jobs" only --
     Job Feed keeps its own card layout (thumbnail + payout teaser, a
     browse-to-accept view rather than a tracking list). */
  table.jobstable { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  table.jobstable th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--stone); padding:12px 16px; background:var(--paper); }
  table.jobstable td { padding:14px 16px; font-size:13px; border-top:1px solid var(--paper); }
  tr.jobrow { cursor:pointer; }
  tr.jobrow:hover { background:var(--paper); }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-block; }
  .badge-feed { background:#FFF6E5; color:#8A6D2E; }
  .badge-assigned { background:#E9F1F9; color:#2E5E8A; }
  .badge-completed { background:#EAF5EE; color:var(--good); }
  .badge-rejected { background:#FDEDEA; color:var(--warn); }
  .backbtn { font-size:13px; color:var(--stone); background:none; border:none; cursor:pointer; margin-bottom:16px; display:flex; align-items:center; gap:4px; }
  .detailcard { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; }
  .row { display:flex; justify-content:space-between; font-size:14px; padding:9px 0; border-top:1px solid var(--paper); }
  .row:first-child { border-top:none; }
  .row .l { color:var(--stone); }
  .row .r { font-weight:700; }
  .row.big .r { font-size:20px; color:var(--good); }
  .stagebar { display:flex; gap:4px; margin:12px 0; }
  .stage { flex:1; height:6px; border-radius:3px; background:var(--line); }
  .stage.done { background:var(--good); }
  .note { font-size:12px; color:var(--stone-light); line-height:1.5; margin-top:10px; }
  img.jobphoto { width:100%; border-radius:12px; margin-bottom:16px; max-height:220px; object-fit:cover; }
  .msgbox { border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; background:#fff; }
  .msgbox h3 { font-size:14px; margin-bottom:12px; }
  .msglist { max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .msgbubble { max-width:80%; padding:9px 12px; border-radius:12px; font-size:13px; }
  .msgbubble.mine { align-self:flex-end; background:var(--black); color:#fff; }
  .msgbubble.theirs { align-self:flex-start; background:var(--paper); color:var(--ink); }
  .msgmeta { font-size:10px; color:var(--stone-light); margin-bottom:2px; }
  .msginput { display:flex; gap:8px; }
  .msginput input { margin-bottom:0; flex:1; }
</style>
<!-- Own manifest (not the shared one) so a contractor who "Add to Home
     Screen"s from THIS page gets an install shortcut whose start_url is
     the portal itself -- tap the icon, get the login screen (or straight
     into the portal if already signed in), never the customer homepage. -->
<link rel="manifest" href="manifest-contractor.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MySubbies Contractor">
</head>
<body>

<div class="install-banner" id="installBanner" style="display:none;">
  <div class="install-banner-text">
    <strong>Install the contractor app</strong>
    <span id="installBannerSub">Add it to your home screen — tap it to jump straight to your jobs.</span>
  </div>
  <div class="install-banner-actions">
    <button class="btn btn-white" id="installBannerBtn" onclick="triggerInstall()">Install</button>
    <button class="install-banner-close" onclick="dismissInstallBanner()" aria-label="Dismiss">✕</button>
  </div>
</div>
<script>
  // Same pattern as the homepage's install banner, but this page links its
  // OWN manifest (manifest-contractor.json, start_url pointing straight at
  // this portal) — so installing FROM here gives a home-screen icon that
  // opens directly to login/portal, not the general customer homepage.
  let deferredInstallPrompt = null;
  const INSTALL_DISMISS_KEY = 'mysubbies_contractor_install_dismissed';

  function isStandaloneDisplay() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function isIOSDevice() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }
  function showInstallBanner() {
    if (isStandaloneDisplay() || localStorage.getItem(INSTALL_DISMISS_KEY)) return;
    document.getElementById('installBanner').style.display = 'flex';
  }
  function dismissInstallBanner() {
    localStorage.setItem(INSTALL_DISMISS_KEY, 'true');
    document.getElementById('installBanner').style.display = 'none';
  }
  function triggerInstall() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(() => {
      deferredInstallPrompt = null;
      dismissInstallBanner();
    });
  }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    showInstallBanner();
  });
  window.addEventListener('appinstalled', dismissInstallBanner);
  if (isIOSDevice() && !isStandaloneDisplay() && !localStorage.getItem(INSTALL_DISMISS_KEY)) {
    document.getElementById('installBannerSub').textContent = 'Tap the Share icon, then "Add to Home Screen".';
    document.getElementById('installBannerBtn').style.display = 'none';
    showInstallBanner();
  }
</script>

<header>
  <div class="navwrap">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 60 60" width="100%" height="100%"><rect x="4" y="4" width="52" height="52" rx="15" fill="#FFFFFF"/><path d="M17 42 V19 L30 33 L43 19 V42" fill="none" stroke="#000000" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="logo-word">MySubbies</div>
    </div>
    <div class="navlinks">
      <a class="current" href="mysubbies-contractor-portal.html">Contractor Portal</a>
    </div>
  </div>
</header>

<div class="wrap" id="app"></div>

<script>
  function getJobs() { return JSON.parse(localStorage.getItem('mysubbies_jobs') || '[]'); }
  function saveJobs(jobs) {
    localStorage.setItem('mysubbies_jobs', JSON.stringify(jobs));
    fetch('/api/sync-jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobs }) }).catch(() => {});
  }
  // Runs once before the first render: pulls jobs relevant to this
  // contractor (their own accepted jobs, plus the unassigned pool they can
  // still accept) from Supabase and merges into localStorage — see
  // api/get-jobs.js. Local-only jobs are left alone; they sync up on the
  // next saveJobs() call.
  async function hydrateJobsFromServer() {
    const email = localStorage.getItem('mysubbies_contractor_email');
    if (!email) return;
    try {
      const res = await fetch('/api/get-jobs?contractorEmail=' + encodeURIComponent(email));
      if (!res.ok) return;
      const { jobs: remoteJobs } = await res.json();
      if (!Array.isArray(remoteJobs) || remoteJobs.length === 0) return;
      const localJobs = getJobs();
      const byId = new Map(localJobs.map(j => [j.id, j]));
      remoteJobs.forEach(rj => { if (rj && rj.id) byId.set(rj.id, rj); });
      localStorage.setItem('mysubbies_jobs', JSON.stringify(Array.from(byId.values())));
    } catch (e) { /* offline or first load — local data still works */ }
  }
  function getContractorName() { return localStorage.getItem('mysubbies_contractor_name'); }
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  let tab = 'feed';
  let selectedJobId = null;
  let jobSearchQuery = '';
  let selectedEarningsJobId = null;
  let earningsJobData = null;
  let earningsJobLoading = false;
  const app = document.getElementById('app');

  // General-purpose "Contact MySubbies" inquiry (Aug 2026) -- not tied to
  // any specific job. Same localStorage-log pattern used elsewhere in this
  // codebase (mysubbies_disputes etc.). Each inquiry holds a `messages`
  // thread (not just a single message) so admin can actually reply and the
  // contractor can keep the conversation going -- the original version
  // only had a "Mark resolved" button on the admin side with no way to
  // respond, which founder feedback flagged as a real gap. Attachments
  // stored as data URIs in the record itself, same as job photos already are.
  let inquiryAttachments = [];
  let showingNewInquiry = false;
  function getInquiries() { return JSON.parse(localStorage.getItem('mysubbies_inquiries') || '[]'); }
  function saveInquiries(inq) { localStorage.setItem('mysubbies_inquiries', JSON.stringify(inq)); }

  function openInquiryForm() {
    showingNewInquiry = false;
    inquiryAttachments = [];
    renderInquiryPanel();
  }
  function toggleNewInquiryCompose() {
    showingNewInquiry = !showingNewInquiry;
    inquiryAttachments = [];
    renderInquiryPanel();
  }
  function renderInquiryPanel() {
    const email = localStorage.getItem('mysubbies_contractor_email');
    const mine = getInquiries().filter(i => i.email === email);
    document.getElementById('inquiryFormWrap').innerHTML = `
      <div class="box" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:13px;font-weight:600;">Contact MySubbies</div>
          <button class="btn btn-outline" style="width:auto;padding:6px 12px;font-size:12px;" onclick="toggleNewInquiryCompose()">${showingNewInquiry ? 'Cancel' : '+ New inquiry'}</button>
        </div>
        <div id="newInquiryComposeWrap"></div>
        ${mine.length === 0 && !showingNewInquiry ? '<div style="font-size:12px;color:var(--stone);margin-top:8px;">No inquiries yet.</div>' : ''}
        ${mine.map(i => inquiryThreadHtml(i, 'contractor')).join('')}
      </div>`;
    if (showingNewInquiry) renderNewInquiryCompose();
  }
  function renderNewInquiryCompose() {
    document.getElementById('newInquiryComposeWrap').innerHTML = `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--paper);">
        <textarea id="inquiryMessage" placeholder="What can we help with?" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;min-height:80px;font-family:inherit;"></textarea>
        <input type="file" id="inquiryFileInput" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" multiple style="display:none;" onchange="onInquiryFileSelected(event)" />
        <button class="btn btn-outline" style="width:auto;padding:8px 14px;font-size:12px;margin-bottom:8px;" onclick="document.getElementById('inquiryFileInput').click()">📎 Attach documents</button>
        <div id="inquiryAttachmentList" style="margin-bottom:8px;"></div>
        <div id="inquiryError" style="color:var(--warn);font-size:12.5px;margin-bottom:8px;display:none;"></div>
        <button class="btn btn-black btn-full" onclick="submitInquiry()">Submit</button>
      </div>`;
  }
  // Shared shape with the customer portal's version -- myRole is whichever
  // side is viewing ('customer' | 'contractor' | 'admin'), so the same
  // thread renders with the viewer's own messages on the right.
  function inquiryThreadHtml(i, myRole) {
    const msgs = i.messages || [];
    return `
      <div style="border-top:1px solid var(--paper);padding-top:12px;margin-top:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:12px;color:var(--stone);">${new Date(i.createdAt).toLocaleDateString('en-AU')}</span>
          <span class="badge ${i.status === 'open' ? 'badge-feed' : 'badge-completed'}">${i.status}</span>
        </div>
        <div class="msglist" style="max-height:220px;">
          ${msgs.map(m => `
            <div class="msgbubble ${m.from === myRole ? 'mine' : 'theirs'}">
              <div class="msgmeta">${m.from === myRole ? 'You' : (m.from === 'admin' ? 'MySubbies' : escapeHtml(m.authorName || m.from))}</div>
              ${escapeHtml(m.text)}
              ${(m.attachments || []).map(a => `<div style="margin-top:4px;"><a href="${a.dataUrl}" download="${escapeHtml(a.name)}" style="text-decoration:underline;font-size:11px;color:inherit;">📄 ${escapeHtml(a.name)}</a></div>`).join('')}
            </div>`).join('')}
        </div>
        ${i.status === 'open' ? `
          <div class="msginput" style="margin-top:8px;">
            <input type="text" id="inquiryReply_${i.id}" placeholder="Reply…" onkeydown="if(event.key==='Enter') replyToInquiry('${i.id}', '${myRole}')" />
            <button class="btn btn-black" onclick="replyToInquiry('${i.id}', '${myRole}')">Send</button>
          </div>` : ''}
      </div>`;
  }
  function replyToInquiry(id, myRole) {
    const input = document.getElementById('inquiryReply_' + id);
    const text = input.value.trim();
    if (!text) return;
    const inquiries = getInquiries();
    const i = inquiries.find(x => x.id === id);
    if (!i) return;
    i.messages = i.messages || [];
    i.messages.push({ from: myRole, text, createdAt: new Date().toISOString() });
    saveInquiries(inquiries);
    renderInquiryPanel();
  }
  function onInquiryFileSelected(event) {
    const files = Array.from(event.target.files || []).slice(0, 5 - inquiryAttachments.length);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        inquiryAttachments.push({ name: file.name, dataUrl: reader.result });
        renderInquiryAttachmentList();
      };
      reader.readAsDataURL(file);
    });
  }
  function renderInquiryAttachmentList() {
    const wrap = document.getElementById('inquiryAttachmentList');
    if (!wrap) return;
    wrap.innerHTML = inquiryAttachments.map((a, idx) => `
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;">
        <span>📄 ${escapeHtml(a.name)}</span>
        <button onclick="removeInquiryAttachment(${idx})" style="background:none;border:none;color:var(--warn);cursor:pointer;font-size:12px;">Remove</button>
      </div>`).join('');
  }
  function removeInquiryAttachment(idx) {
    inquiryAttachments.splice(idx, 1);
    renderInquiryAttachmentList();
  }
  function submitInquiry() {
    const input = document.getElementById('inquiryMessage');
    const message = input.value.trim();
    const errBox = document.getElementById('inquiryError');
    if (!message) {
      errBox.textContent = 'Please describe what you need help with.';
      errBox.style.display = 'block';
      input.focus();
      return;
    }
    const name = getContractorName();
    const email = localStorage.getItem('mysubbies_contractor_email');
    const inquiries = getInquiries();
    inquiries.unshift({
      id: 'inq_' + Date.now(), role: 'contractor', name, email, status: 'open', createdAt: new Date().toISOString(),
      messages: [{ from: 'contractor', text: message, attachments: inquiryAttachments, createdAt: new Date().toISOString() }],
    });
    saveInquiries(inquiries);
    showingNewInquiry = false;
    renderInquiryPanel();
  }

  // Status filter chips (Aug 2026, same pattern as the admin portal's All
  // Jobs and the customer portal's My jobs) -- replaces the separate
  // "Show completed" / "Show cancelled" toggles with chips per status. No
  // "Awaiting contractor" chip here -- a job only ever lands in "My Jobs"
  // once this contractor has accepted it, so that status can't appear.
  const MYJOBS_STATUS_FILTERS = [
    { key: 'all', label: 'All' },
    { key: 'assigned', label: 'Assigned' },
    { key: 'cancellation_requested', label: 'Cancellation requested' },
    { key: 'completed', label: 'Completed' },
    { key: 'cancelled', label: 'Cancelled' },
  ];
  let myJobsStatusFilter = 'all';
  function myJobsStatusFilterChipsHtml(jobs) {
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${MYJOBS_STATUS_FILTERS.map(f => {
        const count = f.key === 'all' ? jobs.length : jobs.filter(j => j.status === f.key).length;
        const active = myJobsStatusFilter === f.key;
        return `<button onclick="myJobsStatusFilter='${f.key}'; render();" style="padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid ${active ? 'var(--ink)' : 'var(--line)'};background:${active ? 'var(--ink)' : '#fff'};color:${active ? '#fff' : 'var(--ink)'};cursor:pointer;">${f.label} (${count})</button>`;
      }).join('')}
    </div>`;
  }

  // Job search (all 3 portals, Aug 2026) -- a plain-text filter over
  // category/suburb/id/task names, so anyone can find a specific job
  // without scrolling. Contractor's own job lists only, not the open feed.
  // render() rebuilds the whole list via innerHTML on every keystroke (same
  // pattern as everywhere else in this codebase), which would normally drop
  // focus/cursor position out from under the input -- restored manually
  // here rather than switching this one input to a different render model.
  function onJobSearchInput(el) {
    const cursorPos = el.selectionStart;
    jobSearchQuery = el.value;
    render();
    const newEl = document.getElementById('jobSearchInput');
    if (newEl) { newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
  }
  function jobMatchesSearch(j, rawQuery) {
    const q = rawQuery.trim().toLowerCase();
    if (!q) return true;
    const haystack = [j.id, j.category, j.suburb, j.customerName, ...(j.items || []).map(i => i.taskName)]
      .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  }
  function jobSearchBoxHtml() {
    return `<input type="text" id="jobSearchInput" value="${escapeHtml(jobSearchQuery)}" oninput="onJobSearchInput(this)" placeholder="Search by suburb, category or job details…" style="width:100%;font-size:14px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:14px;font-family:inherit;" />`;
  }

  function render() {
    const name = getContractorName();
    if (!name) { renderLogin(); return; }

    if (selectedJobId) { renderDetail(name); return; }
    if (selectedEarningsJobId) { renderEarningsDetail(); return; }

    const jobs = getJobs();
    // Trade-filtered feed: only show unclaimed jobs in categories this
    // contractor is approved for, matching the "dispatched to a matched
    // panel, not an open marketplace" model — same list the server already
    // uses to decide what to sync down, applied again here so anything
    // already sitting in localStorage from before this filter existed
    // doesn't keep showing. Falls back to unfiltered when we don't know
    // this contractor's trades yet (no local application record).
    const myTrades = (getApplications().find(a => a.business === name) || {}).trades;
    const feedJobs = jobs.filter(j => j.status === 'feed' && (!myTrades || !myTrades.length || myTrades.includes(j.category)));
    const hiddenJobIds = getHiddenJobIds(name);
    const myJobsAll = jobs.filter(j => j.contractor === name && !hiddenJobIds.has(j.id));
    // Tab badge / earnings still care about "active" and "completed" as
    // simple counts; the My Jobs tab body itself now uses the status filter
    // chips below instead of a mixed list.
    const myJobs = myJobsAll.filter(j => !['completed', 'cancelled'].includes(j.status));
    const myJobsCompleted = myJobsAll.filter(j => j.status === 'completed');

    app.innerHTML = `
      <div class="whoami">Logged in as <strong>${name}</strong> <a onclick="logout()">Log out</a> · <a onclick="openInquiryForm()">Contact MySubbies</a></div>
      <div id="inquiryFormWrap"></div>
      ${(() => {
        const myApp = getApplications().find(a => a.business === name);
        if (!myApp || !myApp.referralCode) return '';
        const referredCount = getApplications().filter(a => a.referredBy === myApp.referralCode).length;
        return `<div class="box" style="margin-bottom:16px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:4px;">Refer another contractor</div>
          <div style="font-size:12px;color:var(--stone);margin-bottom:8px;">${referredCount} contractor${referredCount===1?'':'s'} referred so far.</div>
          <div style="display:flex;gap:8px;align-items:center;">
            <code style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;flex:1;">${myApp.referralCode}</code>
          </div>
        </div>`;
      })()}
      <div class="tabs">
        <button class="${tab==='feed'?'active':''}" onclick="tab='feed'; render();">Job Feed ${feedJobs.length ? '('+feedJobs.length+')' : ''}</button>
        <button class="${tab==='myjobs'?'active':''}" onclick="tab='myjobs'; render();">My Jobs ${myJobs.length ? '('+myJobs.length+')' : ''}</button>
        <button class="${tab==='earnings'?'active':''}" onclick="tab='earnings'; render();">Earnings</button>
      </div>
    `;

    if (tab === 'earnings') {
      const completed = myJobsCompleted;
      const totalEarned = completed.reduce((s, j) => s + Math.round((j.basePrice || 0) * 0.75), 0);
      const rated = completed.filter(j => j.customerRating);
      const avgRating = rated.length ? (rated.reduce((s, j) => s + j.customerRating, 0) / rated.length).toFixed(1) : null;
      app.innerHTML += `
        <h1 class="pagetitle">Earnings</h1>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;">
          <div class="box"><div style="font-size:22px;font-weight:800;">$${totalEarned.toLocaleString()}</div><div class="jobmeta">Total earned</div></div>
          <div class="box"><div style="font-size:22px;font-weight:800;">${completed.length}</div><div class="jobmeta">Jobs completed</div></div>
        </div>
        ${avgRating ? `<div class="box" style="margin-bottom:20px;"><div style="font-size:18px;font-weight:800;">${'★'.repeat(Math.round(avgRating))}${'☆'.repeat(5-Math.round(avgRating))} ${avgRating}</div><div class="jobmeta">Average rating (${rated.length} review${rated.length===1?'':'s'})</div></div>` : `<p class="note">No ratings yet — they'll show here once customers rate completed jobs.</p>`}
        ${completed.length === 0 ? '<div class="empty">No completed jobs yet.</div>' : `
          <table class="jobstable">
            <thead><tr><th>Job</th><th>Suburb</th><th>Payout</th><th>Rating</th></tr></thead>
            <tbody>
              ${completed.map(j => {
                const titleDetail = j.items && j.items.length === 1 ? j.items[0].taskName : j.category;
                return `
                <tr class="jobrow" onclick="openEarningsDetail('${j.id}')">
                  <td><strong>${escapeHtml(titleDetail)}</strong></td>
                  <td>${escapeHtml(j.suburb)}</td>
                  <td>$${Math.round((j.basePrice||0)*0.75).toLocaleString()}</td>
                  <td>${j.customerRating ? `${'★'.repeat(j.customerRating)}${'☆'.repeat(5-j.customerRating)}` : '<span style="color:var(--stone-light);">Not yet rated</span>'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        `}
      `;
      return;
    }

    if (tab === 'feed') {
      app.innerHTML += `<h1 class="pagetitle">New jobs near you</h1><p class="pagesub">No lead fees. No bidding against other contractors for the same job.</p>`;
      app.innerHTML += jobSearchBoxHtml();
      const feedJobsFiltered = feedJobs.filter(j => jobMatchesSearch(j, jobSearchQuery));
      if (feedJobs.length === 0) {
        app.innerHTML += `<div class="empty">No open jobs right now.<br>Go submit one from the site to see it appear here.</div>`;
      } else if (feedJobsFiltered.length === 0) {
        app.innerHTML += `<div class="empty">No jobs match "${escapeHtml(jobSearchQuery)}".</div>`;
      } else {
        app.innerHTML += feedJobsTableHtml(feedJobsFiltered);
      }
    } else {
      app.innerHTML += `<h1 class="pagetitle">My jobs</h1><p class="pagesub">${myJobsAll.length} total, ${myJobs.length} active</p>`;
      if (myJobsAll.length === 0) {
        app.innerHTML += `<div class="empty">No accepted jobs yet.</div>`;
      } else {
        app.innerHTML += myJobsStatusFilterChipsHtml(myJobsAll);
        app.innerHTML += jobSearchBoxHtml();
        const statusFiltered = myJobsStatusFilter === 'all' ? myJobsAll : myJobsAll.filter(j => j.status === myJobsStatusFilter);
        const filtered = statusFiltered.filter(j => jobMatchesSearch(j, jobSearchQuery));
        if (statusFiltered.length === 0) {
          app.innerHTML += `<div class="empty">No jobs in this status.</div>`;
        } else if (filtered.length === 0) {
          app.innerHTML += `<div class="empty">No jobs match "${escapeHtml(jobSearchQuery)}".</div>`;
        } else {
          app.innerHTML += myJobsTableHtml(filtered);
        }
      }
    }
  }

  // Job Feed now matches the same table style as My Jobs / admin's All
  // Jobs (Aug 2026) -- previously a card with a thumbnail that fell back to
  // raw j.icon text when a job had no icon/photo, which rendered the
  // literal word "undefined" clipped inside the box (real bug, spotted in
  // a founder screenshot). The table has no icon column, so that's moot.
  function feedJobsTableHtml(jobs) {
    return `
      <table class="jobstable">
        <thead><tr><th>Job</th><th>Suburb</th><th>Status</th><th>Payout</th></tr></thead>
        <tbody>
          ${jobs.map(j => {
            const titleDetail = j.items && j.items.length === 1 ? j.items[0].taskName
              : j.items && j.items.length > 1 ? j.items.length + ' items'
              : `${j.qty} ${j.unit}`;
            const payout = Math.round((j.basePrice || 0) * 0.75);
            return `
              <tr class="jobrow" onclick="selectedJobId='${j.id}'; render();">
                <td><strong>${escapeHtml(j.category)}</strong><br><span style="color:var(--stone);font-size:12px;">${escapeHtml(titleDetail)}</span></td>
                <td>${escapeHtml(j.suburb)}</td>
                <td><span class="badge badge-feed">Open</span></td>
                <td>$${payout.toLocaleString()}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  // Job list table (Aug 2026) -- same markup, classes, badge colours and
  // status labels as jobsTableHtml() in mysubbies-admin-portal.html, so the
  // job list reads identically across all three portals. "Contractor"
  // becomes "Customer" and "Value" becomes "Payout" here since this is the
  // contractor's own view of their jobs.
  const JOB_BADGE_CLASS = { feed: 'badge-feed', assigned: 'badge-assigned', completed: 'badge-completed', cancellation_requested: 'badge-rejected', cancelled: 'badge-rejected' };
  const JOB_BADGE_LABEL = { feed: 'Awaiting contractor', assigned: 'Assigned', completed: 'Completed', cancellation_requested: 'Cancellation requested', cancelled: 'Cancelled' };
  function myJobsTableHtml(jobs) {
    return `
      <table class="jobstable">
        <thead><tr><th>Job</th><th>Suburb</th><th>Customer</th><th>Status</th><th>Payout</th><th></th></tr></thead>
        <tbody>
          ${jobs.map(j => {
            const titleDetail = j.items && j.items.length === 1 ? j.items[0].taskName : j.category;
            return `
              <tr class="jobrow" onclick="selectedJobId='${j.id}'; render();">
                <td><strong>${escapeHtml(titleDetail)}</strong>${j.items && j.items.length > 1 ? `<br><span style="color:var(--stone);font-size:12px;">${j.items.length} items</span>` : ''}</td>
                <td>${escapeHtml(j.suburb)}</td>
                <td>${j.customerName ? escapeHtml(j.customerName) : '—'}</td>
                <td><span class="badge ${JOB_BADGE_CLASS[j.status] || 'badge-feed'}">${JOB_BADGE_LABEL[j.status] || j.status}</span></td>
                <td>$${Math.round((j.basePrice || 0) * 0.75).toLocaleString()}</td>
                <td>${j.status === 'cancelled' ? `<button class="btn btn-outline" style="width:auto;padding:6px 10px;font-size:11.5px;" onclick="hideCancelledJob('${j.id}', event)">Remove</button>` : ''}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  // Removing a cancelled job (Aug 2026) -- same per-account "hidden" list
  // pattern as mysubbies-customer-portal.html's hideCancelledJob(). Only
  // hides the job from THIS contractor's own My Jobs view (own localStorage
  // key) -- never deletes from the shared mysubbies_jobs array via
  // saveJobs(), since the customer's and admin's views still need it.
  function getHiddenJobIds(contractorName) {
    try {
      const all = JSON.parse(localStorage.getItem('mysubbies_contractor_hidden_jobs') || '{}');
      return new Set(all[contractorName] || []);
    } catch (e) { return new Set(); }
  }
  function hideCancelledJob(jobId, event) {
    if (event) event.stopPropagation();
    const name = getContractorName();
    if (!name) return;
    try {
      const all = JSON.parse(localStorage.getItem('mysubbies_contractor_hidden_jobs') || '{}');
      if (!all[name]) all[name] = [];
      if (!all[name].includes(jobId)) all[name].push(jobId);
      localStorage.setItem('mysubbies_contractor_hidden_jobs', JSON.stringify(all));
    } catch (e) { /* non-critical -- worst case the job just stays visible */ }
    render();
  }

  function renderDetail(name) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    if (!j) { selectedJobId = null; render(); return; }
    const isMine = j.contractor === name;
    const payout = Math.round(j.basePrice * 0.75);

    let actions = '';
    if (!isMine) {
      actions = `
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button class="btn btn-outline" style="flex:1;" onclick="declineJob('${j.id}')">✕ Decline</button>
          <button class="btn btn-black" style="flex:2;" onclick="acceptJob('${j.id}')">Accept job →</button>
        </div>`;
    } else if (j.status === 'cancellation_requested') {
      // Either side's cancellation is pending admin review — the
      // contractor is locked out of further claims/movement until that's
      // resolved, so nothing here can race an admin decision.
      actions = `<div class="note" style="color:var(--warn);">⚠ ${j.cancellationRequestedBy === 'contractor' ? 'Your cancellation request is being reviewed by MySubbies' : 'The customer has requested to cancel this job. MySubbies is reviewing it'} — no further action is needed from you right now.</div>`;
    } else if (j.status === 'completed') {
      actions = `<div id="milestoneClaimWrap"><div class="note">Loading payment schedule…</div></div>`;
    } else {
      // Once accepted, cancelling isn't self-service any more — same as the
      // customer side, this needs a real conversation (materials may
      // already be sourced, time already scheduled), so it goes to
      // MySubbies for review rather than cancelling instantly.
      actions = `
        <div id="milestoneClaimWrap"><div class="note">Loading payment schedule…</div></div>
        <button class="btn btn-outline btn-full" style="margin-top:8px;color:var(--warn);" onclick="openContractorRequestCancelForm('${j.id}')">Request to cancel</button>
        <div id="contractorCancelFormWrap"></div>`;
    }

    app.innerHTML = `
      <button class="backbtn" onclick="selectedJobId=null; render();">← Back</button>
      ${notifyBannerHtml()}
      <div class="detailcard">
        ${j.photoDataUrls && j.photoDataUrls.length > 1 ? `
          <div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;">
            ${j.photoDataUrls.map(src => `<img src="${src}" style="width:90px;height:90px;border-radius:10px;object-fit:cover;flex-shrink:0;" />`).join('')}
          </div>
        ` : j.photoDataUrl ? `<img class="jobphoto" src="${j.photoDataUrl}">` : ''}
        <span class="pill">${escapeHtml(j.category)}</span>
        <h1 class="pagetitle" style="margin-top:8px;">${escapeHtml(j.category)}${j.items && j.items.length > 1 ? '' : ` — ${j.qty} ${escapeHtml(j.unit)}`}</h1>
        <div class="jobmeta" style="margin-bottom:16px;">📍 ${escapeHtml(isMine ? (j.address || j.suburb) : j.suburb)} ${isMine ? '· ' + escapeHtml(j.customerName) : ''}</div>
        ${j.items && j.items.length ? `
          <div style="border-top:1px solid var(--paper);border-bottom:1px solid var(--paper);padding:10px 0;margin-bottom:8px;">
            ${j.items.map(i => `
              <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;">
                <span>${i.catIcon || ''} ${escapeHtml(i.taskName)} <span style="color:var(--stone);">(${i.qty} ${escapeHtml(i.unit)})</span></span>
                <span style="font-weight:600;">${i.aiEstimated ? '~' : ''}$${Math.round(i.base * 0.75).toLocaleString()}</span>
              </div>
              ${i.aiEstimated ? `<div style="font-size:11.5px;font-weight:700;color:#D98E14;background:#FDF0D9;border-radius:6px;padding:4px 8px;margin-bottom:4px;">🤖 AI-estimated price — MySubbies will confirm the final price before this is dispatched</div>` : ''}
              ${i.notes ? `<div style="font-size:11.5px;color:var(--stone);margin-bottom:4px;">${escapeHtml(i.notes)}</div>` : ''}
            `).join('')}
          </div>
        ` : ''}
        <div class="row big"><span class="l">${isMine ? 'Your payout' : 'Confirmed payout'}</span><span class="r">$${payout.toLocaleString()}</span></div>
        ${j.site ? `<div class="row"><span class="l">On site</span><span class="r">${escapeHtml(j.site)}</span></div>` : ''}
        ${j.access ? `<div class="row"><span class="l">Access</span><span class="r">${escapeHtml(j.access)}</span></div>` : ''}
        ${j.urgency ? `<div class="row"><span class="l">Urgency</span><span class="r">${escapeHtml(j.urgency)}</span></div>` : ''}
        ${!isMine ? '<div class="note">Full address is shared once you accept. Message the customer in-app — their phone number is not shared with contractors. No fee or commission is shown or deducted from what you see here.</div>' : ''}
        ${isMine ? '<div class="note">Keep all communication with the customer in the message thread below — their phone number isn\'t shared with contractors.</div>' : ''}
        ${actions}
      </div>
      ${isMine ? `
        <div class="detailcard" style="margin-top:14px;">
          <h3 style="font-size:15px;margin-bottom:10px;">Before / after photos</h3>
          <p style="font-size:11.5px;color:var(--stone);margin-bottom:10px;">Visible to the customer and MySubbies — good practice for every job, and useful evidence if a dispute comes up.</p>
          ${photoSetHtml('before', j.beforePhotos || [])}
          ${photoSetHtml('after', j.afterPhotos || [])}
        </div>
        <div class="detailcard" style="margin-top:14px;">
          <h3 style="font-size:15px;margin-bottom:10px;">Variations</h3>
          <div id="variationList">${variationListHtml(j, 'contractor')}</div>
          <div id="variationFormWrap"></div>
          ${j.status !== 'cancellation_requested' ? `<button class="btn btn-outline btn-full" style="margin-top:10px;" onclick="openVariationForm()">+ Request a variation</button>` : ''}
        </div>
      ` : ''}
      ${isMine ? `
        <div class="msgbox">
          <h3>💬 Messages with customer</h3>
          <div class="msglist" id="msgListCustomer"></div>
          ${j.status === 'completed'
            ? `<div style="font-size:12px;color:var(--stone-light);text-align:center;padding:8px 0;">This job is complete — messaging with the customer is closed. Contact MySubbies support if you need to follow up on anything.</div>`
            : j.status === 'cancellation_requested'
            ? `<div style="font-size:12px;color:var(--stone-light);text-align:center;padding:8px 0;">Cancellation pending review — messaging is paused. Contact MySubbies support if you need to follow up on anything.</div>`
            : `<div class="msginput">
            <input type="text" id="msgInputCustomer" placeholder="Type a message…" onkeydown="if(event.key==='Enter') sendMsg('messages')" />
            <button class="btn btn-black" onclick="sendMsg('messages')">Send</button>
          </div>`}
        </div>
        <div class="msgbox">
          <h3>🔒 Messages with MySubbies (private — customer never sees this)</h3>
          <div class="msglist" id="msgListAdmin"></div>
          <div class="msginput">
            <input type="text" id="msgInputAdmin" placeholder="e.g. requesting a document, asking about payment…" onkeydown="if(event.key==='Enter') sendMsg('internalMessages')" />
            <button class="btn btn-black" onclick="sendMsg('internalMessages')">Send</button>
          </div>
        </div>
      ` : ''}
    `;
    if (isMine) {
      renderThread(j, 'messages', 'msgListCustomer', 'contractor');
      renderThread(j, 'internalMessages', 'msgListAdmin', 'contractor');
      wireNotifyButton();
      renderMilestoneClaimSection(j.id);
    }
  }

  // Fetches the REAL, backend-calculated schedule (api/job-payment-schedule.js)
  // instead of the old client-authored job.paymentSchedule/paidStages — the
  // whole reason this system exists is that the schedule + milestone state
  // now lives server-side, validated, not trusted from the client.
  // Earnings breakdown (Aug 2026) -- clicking a completed job in Earnings
  // now shows what was actually earned from it, milestone by milestone.
  // This deliberately DOES show dollar amounts, unlike
  // renderMilestoneClaimSection() below (which only ever shows percentages,
  // on purpose -- see its comment): that view is about a live, in-progress
  // claim where materials/completion payouts aren't automated yet, so a
  // dollar figure there would read as a promise the system doesn't
  // enforce. A completed job is different -- by definition every milestone
  // is already resolved, so showing the real 75% payout per stage is just
  // reporting what happened, not promising anything.
  function openEarningsDetail(jobId) {
    selectedEarningsJobId = jobId;
    earningsJobData = null;
    earningsJobLoading = false;
    render();
    loadEarningsDetail(jobId);
  }
  function closeEarningsDetail() {
    selectedEarningsJobId = null;
    earningsJobData = null;
    render();
  }
  async function loadEarningsDetail(jobId) {
    if (earningsJobLoading) return;
    earningsJobLoading = true;
    try {
      const res = await fetch('/api/job-payment-schedule?jobId=' + encodeURIComponent(jobId));
      earningsJobData = await res.json();
    } catch (e) {
      earningsJobData = { error: true };
    }
    earningsJobLoading = false;
    render();
  }
  function renderEarningsDetail() {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedEarningsJobId);
    if (!j) { selectedEarningsJobId = null; render(); return; }
    const titleDetail = j.items && j.items.length === 1 ? j.items[0].taskName : j.category;

    let bodyHtml;
    if (!earningsJobData) {
      bodyHtml = '<div class="note">Loading…</div>';
    } else if (earningsJobData.error || !earningsJobData.schedule) {
      bodyHtml = `<div class="note">Could not load the payment breakdown for this job.</div>
        <div class="row big"><span class="l">Total payout</span><span class="r">$${Math.round((j.basePrice || 0) * 0.75).toLocaleString()}</span></div>`;
    } else {
      const milestones = earningsJobData.milestones || [];
      const totalPayout = milestones.reduce((s, m) => s + Math.round((m.amount_cents || 0) / 100 * 0.75), 0);
      bodyHtml = `
        ${milestones.map(m => `
          <div class="row"><span class="l">${escapeHtml(m.label)} (${m.pct}%)</span><span class="r">$${Math.round((m.amount_cents || 0) / 100 * 0.75).toLocaleString()}</span></div>
        `).join('')}
        <div class="row big"><span class="l">Total payout</span><span class="r">$${totalPayout.toLocaleString()}</span></div>
      `;
    }

    app.innerHTML = `
      <button class="backbtn" onclick="closeEarningsDetail()">← Back to earnings</button>
      <div class="detailcard">
        <span class="pill">${escapeHtml(j.category)}</span>
        <h1 class="pagetitle" style="margin-top:8px;">${escapeHtml(titleDetail)}</h1>
        <div class="jobmeta" style="margin-bottom:16px;">📍 ${escapeHtml(j.suburb)}</div>
        ${bodyHtml}
      </div>`;
  }

  async function renderMilestoneClaimSection(jobId) {
    const wrap = document.getElementById('milestoneClaimWrap');
    if (!wrap) return;
    let data;
    try {
      const res = await fetch('/api/job-payment-schedule?jobId=' + encodeURIComponent(jobId));
      data = await res.json();
    } catch (e) {
      wrap.innerHTML = '<div class="note">Could not load the payment schedule — try again shortly.</div>';
      return;
    }
    if (!data.schedule) { wrap.innerHTML = '<div class="note">No payment schedule found for this job yet.</div>'; return; }
    if (data.schedule.status === 'pending_admin_schedule') {
      wrap.innerHTML = '<div class="note">This is a large or complex project — MySubbies is preparing a project-specific payment plan with the customer before further milestones open up.</div>';
      return;
    }

    const milestones = data.milestones || [];
    const doneCount = milestones.filter(m => m.status === 'paid').length;
    const stagebar = `<div class="stagebar">${milestones.map(m => `<div class="stage ${m.status === 'paid' ? 'done' : ''}" style="flex:${m.pct};"></div>`).join('')}</div>`;
    // Percentage only, deliberately no dollar figure -- amount_cents is the
    // milestone's share of the CUSTOMER's full price, not the contractor's
    // payout (75%, and for anything past the deposit, paid out manually by
    // AP rather than by an automated split). Showing that number here would
    // read as a payout promise the system doesn't actually enforce.
    const list = `<div style="margin:10px 0;">${milestones.map(m => `
      <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:${m.status === 'paid' ? 'var(--good)' : 'var(--stone)'};">
        <span>${m.status === 'paid' ? '✓' : '○'} ${escapeHtml(m.label)}</span>
        <span>${m.pct}%</span>
      </div>`).join('')}</div>`;

    const next = milestones.find(m => m.status !== 'paid');
    let actionHtml;
    if (!next) {
      actionHtml = '<div class="note">✓ Job complete — fully paid.</div>';
    } else if (next.milestone_type === 'deposit') {
      actionHtml = '<div class="note">Waiting on the deposit payment.</div>';
    } else if (next.status === 'available') {
      actionHtml = `<button class="btn btn-black btn-full" style="margin-top:10px;" onclick="openMilestoneClaimForm('${jobId}','${next.key}')">Claim: ${escapeHtml(next.label)} (${next.pct}%)</button><div id="milestoneClaimFormWrap"></div>`;
    } else if (next.status === 'awaiting_customer') {
      actionHtml = `<div class="note">⏳ Waiting on the customer to review <strong>${escapeHtml(next.label)}</strong>.</div>`;
    } else if (next.status === 'disputed') {
      actionHtml = `<div class="note" style="color:var(--warn);">⚠ The customer raised an issue with <strong>${escapeHtml(next.label)}</strong> — MySubbies is reviewing it.</div>`;
    } else if (next.status === 'payment_processing') {
      actionHtml = `<div class="note">Payment for <strong>${escapeHtml(next.label)}</strong> is processing.</div>`;
    } else {
      actionHtml = `<div class="note">${escapeHtml(next.label)} is ${next.status}.</div>`;
    }

    wrap.innerHTML = stagebar + list + actionHtml;
    window.__mysubbiesMilestones = milestones;
  }

  function claimPhotoGridHtml() {

  function onClaimPhotoSelected(e) {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    let remaining = files.length;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        claimPhotos.push(ev.target.result);
        remaining--;
        if (remaining === 0) { const gridWrap = document.getElementById('claimPhotoGridWrap'); if (gridWrap) gridWrap.innerHTML = claimPhotoGridHtml(); }

      reader.readAsDataURL(file);
    });
    e.target.value = '';

    const file = e.target.files[0];

  async function submitMilestoneClaim(jobId, milestoneKey) {
    const errBox = document.getElementById('claimError');
    const description = document.getElementById('claimDescription').value.trim();
    const declared = document.getElementById('claimDeclaration').checked;
    const inspectionInput = document.getElementById('claimInspectionId');
    errBox.textContent = '';
    if (!declared) { errBox.textContent = 'Please confirm the declaration checkbox.'; return; }

    try {
      const res = await fetch('/api/milestone', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'claim', jobId, milestoneKey,
          contractorId: null, description,
          photoUrls: claimPhotos, deliveryDocketUrl: claimDocketDataUrl,
          inspectionRecordId: inspectionInput ? inspectionInput.value.trim() || null : null,
          declarationConfirmed: true,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not submit claim.');
      claimPhotos = [];
      claimDocketDataUrl = null;
      renderMilestoneClaimSection(jobId);
    } catch (err) {
      errBox.textContent = err.message || 'Could not submit claim.';
    }
  }

  function submitVariation(jobId) {
    const description = document.getElementById('varDescription').value.trim();
    const amount = Number(document.getElementById('varAmount').value);
    const reason = document.getElementById('varReason').value.trim();
    if (!description || !amount) return;

    const jobs = getJobs();
    const j = jobs.find(x => x.id === jobId);
    j.variations = j.variations || [];
    const variation = { id: 'var_' + Date.now(), description, amount, reason, status: 'pending', requestedAt: new Date().toISOString() };
    j.variations.push(variation);
    j.messages = j.messages || [];
    j.messages.push({ id: 'm_' + Date.now(), from: 'contractor', authorName: getContractorName(), text: `📋 Requested a variation: "${description}" for +$${amount.toLocaleString()} — please review and approve in My Jobs.`, createdAt: new Date().toISOString() });

    renderDetail(getContractorName());
  }

  let lastMsgCounts = {};
  function checkForNewMessages() {
    const contractorName = getContractorName();
    if (!contractorName) return;
    getJobs().filter(j => j.contractor === contractorName).forEach(j => {
      ['messages', 'internalMessages'].forEach(key => {
        const arr = j[key] || [];
        const cacheKey = j.id + '_' + key;
        const last = arr[arr.length - 1];
        if (lastMsgCounts[cacheKey] !== undefined && arr.length > lastMsgCounts[cacheKey] && last && last.from !== 'contractor') {
          notify(`${last.authorName || last.from}: ${last.text}`);
        }
        lastMsgCounts[cacheKey] = arr.length;
      });
    });
  }

  function requestPasswordReset() {

    const requests = JSON.parse(localStorage.getItem('mysubbies_password_reset_requests') || '[]');

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;
    const errBox = document.getElementById('loginError');
    if (!email || !password) { errBox.textContent = 'Enter your email and password.'; return; }

    const apps = getApplications();
    const application = apps.find(a => a.email === email);

    // Try the REAL account first, regardless of whether this browser has a
    // local application record — that's what makes this work cross-device.
    let verified = false;
    let remoteStatus = null; // real status from the `contractors` table, when available
    if (sb) {
      const { data: authData, error } = await sb.auth.signInWithPassword({ email, password });
      verified = !error;
      if (verified) {
        const { data: profile } = await sb.from('contractors').select('status').eq('auth_user_id', authData.user.id).maybeSingle();
        if (profile) remoteStatus = profile.status;
      }
    }
    if (!verified) {
      if (!application || application.password !== password) { errBox.textContent = 'No account found with those details.'; return; }
      if (sb) {
        sb.auth.signUp({ email, password }).then(({ data }) => {
          if (data?.user) {
            sb.from('contractors').insert({
              auth_user_id: data.user.id, email, business_name: application.business,
              abn: application.abn, acn: application.acn, phone: application.phone,
              categories: application.trades || [],
            }).then(() => {});
          }
        });
      }
    }

    // The real `contractors.status` (kept in sync by the admin portal's
    // approve/reject actions — see api/update-contractor-status.js) is
    // authoritative whenever it's known, so approval decisions made on a
    // different device than this one still apply correctly. Local
    // application.status is only the fallback for accounts that have
    // never synced a real status yet.
    const effectiveStatus = remoteStatus || (application && application.status);
    const businessName = (application && application.business) || 'your business';
    const contactName = (application && application.contact) || 'there';

    if (!effectiveStatus) {
      errBox.textContent = '';
      app.innerHTML = `
        <div class="loginbox">
          <h1>Password verified — one more step</h1>
          <p>We've confirmed your password, but we don't have your application status on this device yet. Please log in from the device you applied from, or contact us to confirm your approval status.</p>
          <button class="btn btn-outline btn-full" onclick="renderLogin()">Back</button>
        </div>`;
      return;
    }

    if (effectiveStatus === 'pending' || effectiveStatus === 'manual_review' || effectiveStatus === 'watchlist') {
      errBox.textContent = '';
      app.innerHTML = `
        <div class="loginbox">
          <h1>Application under review</h1>
          <p>Thanks for applying, ${contactName} — we're still reviewing your application for <strong>${businessName}</strong>. You'll be able to log in once it's approved.</p>
          <button class="btn btn-outline btn-full" onclick="renderLogin()">Back</button>
        </div>`;
      return;
    }
    if (effectiveStatus === 'rejected' || effectiveStatus === 'suspended' || effectiveStatus === 'expired_documents') {
      errBox.textContent = '';
      app.innerHTML = `
        <div class="loginbox">
          <h1>Application not approved</h1>
          <p>Your application for <strong>${businessName}</strong> wasn't approved at this time. Contact us if you'd like to discuss.</p>
          <button class="btn btn-outline btn-full" onclick="renderLogin()">Back</button>
        </div>`;
      return;
    }
    localStorage.setItem('mysubbies_contractor_name', businessName);
    localStorage.setItem('mysubbies_contractor_email', email);
    // Same fix as customer-portal.html: the page-load hydrate already ran
    // and no-op'd before this login existed, so it needs to run again now.
    await hydrateJobsFromServer();
    render();
  }
  function logout() {
    localStorage.removeItem('mysubbies_contractor_name');
    localStorage.removeItem('mysubbies_contractor_email');
    selectedJobId = null;
    render();
  }

  hydrateJobsFromServer().then(render);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
