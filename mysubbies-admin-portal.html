<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MySubbies — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Navy/gold reskin (Aug 2026), Stage 2 -- see CLAUDE.md and
       mysubbies-website.html's :root for the source of this palette. Every
       existing var(--black)/var(--ink) usage cascades automatically. */
    --ink: #151A26; --black: #14213D; --white: #FFFFFF; --paper: #F7F7F5;
    --stone: #6B7280; --stone-light: #9CA3AF; --line: #E7E7E4; --good: #2F7A50; --warn: #B0592E;
    --accent: #F5A623; --accent-dark: #D98E14; --accent-pale: #FDF0D9;
    --primary-light: #1F335A; --primary-pale: #E7EAF1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1, h2 { font-weight:800; letter-spacing:-0.02em; }
  a { color:inherit; text-decoration:none; }
  header { background: var(--black); }
  .navwrap { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { display:flex; align-items:center; gap:9px; }
  .logo-mark { width:28px; height:28px; border-radius:7px; background:#fff; }
  .logo-word { font-weight:800; font-size:19px; color:#fff; }
  .navlinks { display:flex; align-items:center; gap:22px; font-size:13px; }
  @media (max-width:460px) { .navwrap { padding:0 14px; } .navlinks { gap:9px; font-size:11px; } .navlinks a.hide-mobile { display:none; } }
  .navlinks a { color:rgba(255,255,255,0.65); }
  .navlinks a.current { color:#fff; font-weight:600; }
  .wrap { max-width:880px; margin:0 auto; padding:32px 24px 80px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
  .btn-black { background:var(--black); color:#fff; }
  .btn-outline { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn-danger { background:#fff; color:#B4232C; border:1.5px solid #F2C9C6; }
  .btn-danger:hover { background:#FDF3F2; }
  .searchbox { width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; color:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; outline:none; background:#fff; margin-bottom:16px; }
  .searchbox:focus { border-color:var(--black); }
  .badge-active { background:#EAF5EE; color:var(--good); }
  .badge-deactivated { background:#FDEDEA; color:var(--warn); }
  .statgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
  @media (max-width:700px) { .statgrid { grid-template-columns:1fr 1fr; } }
  .statcard { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .statcard .num { font-size:24px; font-weight:800; }
  .statcard .lab { font-size:12px; color:var(--stone); margin-top:2px; }
  .tabs { display:flex; gap:6px; background:#EFEDE9; padding:4px; border-radius:10px; margin-bottom:24px; width:fit-content; }
  .tabs button { padding:9px 16px; border-radius:7px; font-size:13px; font-weight:600; border:none; cursor:pointer; background:transparent; color:var(--stone); }
  .tabs button.active { background:#fff; color:var(--ink); }
  h1.pagetitle { font-size:22px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--stone); padding:12px 16px; background:var(--paper); }
  td { padding:14px 16px; font-size:13px; border-top:1px solid var(--paper); }
  tr.jobrow { cursor:pointer; }
  tr.jobrow:hover { background:var(--paper); }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-block; }
  .badge-feed { background:#FFF6E5; color:#8A6D2E; }
  .badge-assigned { background:#E9F1F9; color:#2E5E8A; }
  .badge-completed { background:#EAF5EE; color:var(--good); }
  .badge-rejected { background:#FDEDEA; color:var(--warn); }
  .empty { text-align:center; padding:60px 20px; color:var(--stone); font-size:14px; }
  .backbtn { font-size:13px; color:var(--stone); background:none; border:none; cursor:pointer; margin-bottom:16px; display:flex; align-items:center; gap:4px; }
  .detailcard { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; max-width:520px; }
  .row { display:flex; justify-content:space-between; font-size:14px; padding:9px 0; border-top:1px solid var(--paper); }
  .row:first-child { border-top:none; }
  .row .l { color:var(--stone); }
  .row .r { font-weight:700; }
  .row.commission .r { color:var(--warn); }
  .row.payout .r { color:var(--good); font-size:16px; }
  img.jobphoto { width:100%; border-radius:12px; margin-bottom:16px; max-height:200px; object-fit:cover; }
  .msgbox { border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; background:#fff; max-width:520px; }
  .msgbox h3 { font-size:14px; margin-bottom:12px; }
  .msglist { max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .msgbubble { max-width:80%; padding:9px 12px; border-radius:12px; font-size:13px; }
  .msgbubble.mine { align-self:flex-end; background:var(--black); color:#fff; }
  .msgbubble.theirs { align-self:flex-start; background:var(--paper); color:var(--ink); }
  .msgmeta { font-size:10px; color:var(--stone-light); margin-bottom:2px; }
  .msginput { display:flex; gap:8px; }
  .msginput input { flex:1; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:9px 12px; }
  .reassign { display:flex; gap:8px; margin-top:16px; }
  .reassign input { flex:1; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:9px 12px; }
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MySubbies">
</head>
<body>

<header>
  <div class="navwrap">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 60 60" width="100%" height="100%"><rect x="4" y="4" width="52" height="52" rx="15" fill="#FFFFFF"/><path d="M17 42 V19 L30 33 L43 19 V42" fill="none" stroke="#000000" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="logo-word">MySubbies</div>
    </div>
    <div class="navlinks">
      <a class="current" href="mysubbies-admin-portal.html">Admin</a>
      <a onclick="adminLogout()" style="cursor:pointer;">Log out</a>
    </div>
  </div>
</header>

<div class="wrap" id="app"></div>

<script>
  const ADMIN_PASSWORD = 'MySubbies2026!';

  function checkAdminAuth() {
    if (localStorage.getItem('mysubbies_admin_authed') === 'true') { Promise.all([hydrateJobsFromServer(), hydrateApplicationsFromServer()]).then(render); return; }
    document.getElementById('app').innerHTML = `
      <div style="max-width:360px;margin:80px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;">
        <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">Admin login</h1>
        <p style="font-size:13px;color:var(--stone);margin-bottom:20px;">This is a basic gate to keep the page out of casual view during testing — not real security.</p>
        <input type="password" id="adminPasswordInput" placeholder="Password" style="width:100%;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;" onkeydown="if(event.key==='Enter') adminLogin()">
        <div id="adminLoginError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
        <button onclick="adminLogin()" style="width:100%;background:var(--black);color:#fff;border:none;border-radius:999px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;">Log in →</button>
      </div>`;
  }
  function adminLogin() {
    const val = document.getElementById('adminPasswordInput').value;
    if (val === ADMIN_PASSWORD) {
      localStorage.setItem('mysubbies_admin_authed', 'true');
      Promise.all([hydrateJobsFromServer(), hydrateApplicationsFromServer()]).then(render);
    } else {
      document.getElementById('adminLoginError').textContent = 'Incorrect password.';
    }
  }
  function adminLogout() {
    localStorage.removeItem('mysubbies_admin_authed');
    checkAdminAuth();
  }

  function getJobs() { return JSON.parse(localStorage.getItem('mysubbies_jobs') || '[]'); }
  function saveJobs(jobs) {
    localStorage.setItem('mysubbies_jobs', JSON.stringify(jobs));
    fetch('/api/sync-jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobs }) }).catch(() => {});
  }
  // Pulls every job from Supabase (admin sees everything) and merges into
  // localStorage, so All Jobs reflects work created on any device, not
  // just this admin browser. See api/get-jobs.js.
  async function hydrateJobsFromServer() {
    try {
      const res = await fetch('/api/get-jobs?all=1');
      if (!res.ok) return;
      const { jobs: remoteJobs } = await res.json();
      if (!Array.isArray(remoteJobs) || remoteJobs.length === 0) return;
      const localJobs = getJobs();
      const byId = new Map(localJobs.map(j => [j.id, j]));
      remoteJobs.forEach(rj => { if (rj && rj.id) byId.set(rj.id, rj); });
      localStorage.setItem('mysubbies_jobs', JSON.stringify(Array.from(byId.values())));
    } catch (e) { /* offline or first load — local data still works */ }
  }

  let tab = 'overview';
  let selectedJobId = null;
  let jobSearchQuery = '';
  const app = document.getElementById('app');
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // "All Jobs" used to be one long mixed list (everything from awaiting-
  // contractor through cancelled, in creation order) with a single archive
  // toggle just for cancelled -- founder feedback (Aug 2026) was that this
  // gets hard to manage as job count grows. Replaced with status filter
  // chips, defaulting to the most actionable bucket (jobs still waiting to
  // be matched) rather than the full mixed list.
  const JOB_STATUS_FILTERS = [
    { key: 'all', label: 'All' },
    { key: 'feed', label: 'Awaiting contractor' },
    { key: 'assigned', label: 'Assigned' },
    { key: 'cancellation_requested', label: 'Cancellation requested' },
    { key: 'completed', label: 'Completed' },
    { key: 'cancelled', label: 'Cancelled' },
  ];
  let jobStatusFilter = 'feed';
  function jobStatusFilterChipsHtml(jobs) {
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${JOB_STATUS_FILTERS.map(f => {
        const count = f.key === 'all' ? jobs.length : jobs.filter(j => j.status === f.key).length;
        const active = jobStatusFilter === f.key;
        return `<button onclick="jobStatusFilter='${f.key}'; render();" style="padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid ${active ? 'var(--ink)' : 'var(--line)'};background:${active ? 'var(--ink)' : '#fff'};color:${active ? '#fff' : 'var(--ink)'};cursor:pointer;">${f.label} (${count})</button>`;
      }).join('')}
    </div>`;
  }

  // Job search (all 3 portals, Aug 2026) -- a plain-text filter over
  // category/suburb/id/contractor/customer/task names, so admin can find a
  // specific job across the whole platform without scrolling. render()
  // rebuilds the table via innerHTML on every keystroke, same as everywhere
  // else in this codebase, which would normally drop focus/cursor out from
  // under the input -- restored manually here instead.
  function onJobSearchInput(el) {
    const cursorPos = el.selectionStart;
    jobSearchQuery = el.value;
    render();
    const newEl = document.getElementById('jobSearchInput');
    if (newEl) { newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
  }
  function jobMatchesSearch(j, rawQuery) {
    const q = rawQuery.trim().toLowerCase();
    if (!q) return true;
    const haystack = [j.id, j.category, j.suburb, j.contractor, j.customerName, j.customerEmail, ...(j.items || []).map(i => i.taskName)]
      .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  }
  function jobSearchBoxHtml() {
    return `<input type="text" id="jobSearchInput" value="${escapeHtml(jobSearchQuery)}" oninput="onJobSearchInput(this)" placeholder="Search by suburb, category, contractor, customer or job details…" style="width:100%;font-size:14px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;margin:12px 0;font-family:inherit;" />`;
  }

  function getApplications() { return JSON.parse(localStorage.getItem('mysubbies_contractor_applications') || '[]'); }
  function saveApplications(apps) {
    localStorage.setItem('mysubbies_contractor_applications', JSON.stringify(apps));
    fetch('/api/sync-applications', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ applications: apps }) }).catch(() => {});
  }
  // Pulls every full application from Supabase (mirrors hydrateJobsFromServer)
  // so admin sees applications submitted from any device, not just this
  // browser. See api/get-admin-list.js?type=applications.
  async function hydrateApplicationsFromServer() {
    try {
      const res = await fetch('/api/get-admin-list?type=applications');
      if (!res.ok) return;
      const { applications: remoteApps } = await res.json();
      if (!Array.isArray(remoteApps) || remoteApps.length === 0) return;
      const localApps = getApplications();
      const byId = new Map(localApps.map(a => [a.id, a]));
      remoteApps.forEach(ra => { if (ra && ra.id) byId.set(ra.id, ra); });
      localStorage.setItem('mysubbies_contractor_applications', JSON.stringify(Array.from(byId.values())));
    } catch (e) { /* offline or first load — local data still works */ }
  }
  function getDisputes() { return JSON.parse(localStorage.getItem('mysubbies_disputes') || '[]'); }
  function saveDisputes(d) { localStorage.setItem('mysubbies_disputes', JSON.stringify(d)); }

  function renderDisputesTab(disputes, jobs) {
    if (disputes.length === 0) return '<div class="empty">No disputes reported.</div>';
    return `
      <h1 class="pagetitle">Disputes</h1>
      ${disputes.map(d => {
        const job = jobs.find(j => j.id === d.jobId);
        return `
          <div class="detailcard" style="max-width:640px;margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <div style="font-weight:700;font-size:15px;">${escapeHtml(d.reason)}</div>
                <div style="font-size:12px;color:var(--stone);margin-top:2px;">${job ? escapeHtml(job.category + ' — ' + job.suburb) : 'Job not found'} · reported by ${escapeHtml(d.reportedBy)} · ${new Date(d.reportedAt).toLocaleDateString('en-AU')}</div>
              </div>
              <span class="badge ${d.status === 'open' ? 'badge-feed' : 'badge-completed'}">${d.status}</span>
            </div>
            <div style="font-size:13px;color:#333;margin-top:10px;">${d.details ? escapeHtml(d.details) : '(no further details provided)'}</div>
            ${d.status === 'open' ? `<button class="btn btn-outline" style="margin-top:12px;" onclick="resolveDispute('${d.id}')">Mark resolved</button>` : ''}
          </div>`;
      }).join('')}
    `;
  }
  function resolveDispute(id) {
    const disputes = getDisputes();
    const d = disputes.find(x => x.id === id);
    d.status = 'resolved';
    saveDisputes(disputes);
    render();
  }

  function render() {
    if (selectedJobId) { renderDetail(); return; }
    const jobs = getJobs();
    const commission = jobs.reduce((s, j) => s + Math.round((j.basePrice || 0) * 0.25), 0);
    const gmv = jobs.reduce((s, j) => s + (j.basePrice || 0), 0);
    const applications = getApplications();
    const pendingCount = applications.filter(a => a.status === 'pending').length;
    const disputes = getDisputes();
    const openDisputeCount = disputes.filter(d => d.status === 'open').length;
    const cancellationRequests = jobs.filter(j => j.status === 'cancellation_requested');

    // Loaded unconditionally (not just when the Payments tab is opened) so
    // the Action required panel below has real disputed-milestone /
    // pending-schedule counts the moment admin logs in, not just after
    // they happen to click into that tab.
    if (!paymentTabData && !paymentTabLoading) loadPaymentScheduleTab();
    if (tab === 'customers' && !customersTabData && !customersTabLoading) loadCustomersTab();
    const paymentBadgeCount = paymentTabData ? (paymentTabData.disputedMilestones || []).length + (paymentTabData.pendingScheduleJobs || []).length : 0;

    // Action required (Aug 2026) -- a single always-visible checklist of
    // everything actually waiting on admin, so nothing (like a cancellation
    // request) gets missed sitting quietly inside a tab nobody happened to
    // open. Cancellation requests link straight to the job; everything
    // else links to the tab that already has the full review UI for it.
    const disputedMilestoneCount = paymentTabData ? (paymentTabData.disputedMilestones || []).length : 0;
    const pendingScheduleCount = paymentTabData ? (paymentTabData.pendingScheduleJobs || []).length : 0;
    const totalActionCount = cancellationRequests.length + openDisputeCount + pendingCount + disputedMilestoneCount + pendingScheduleCount;
    const actionRequiredHtml = `
      <div class="detailcard" style="margin-bottom:16px;border:1.5px solid #F0D89B;background:#FFFBF2;">
        <h2 style="font-size:16px;margin-bottom:2px;">⚡ Action required</h2>
        ${totalActionCount === 0 ? `<div style="font-size:13px;color:var(--stone);padding:8px 0 2px;">✓ Nothing needs your attention right now.</div>` : `
          ${cancellationRequests.map(j => `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0D89B;">
              <span style="font-size:13px;">⚠ Cancellation requested — ${escapeHtml(j.category)}, ${escapeHtml(j.suburb)}${j.cancellationRequestedBy ? ' (by ' + escapeHtml(j.cancellationRequestedBy) + ')' : ''}</span>
              <button class="btn btn-outline" style="width:auto;flex-shrink:0;padding:6px 12px;font-size:12px;" onclick="selectedJobId='${j.id}'; render();">Review</button>
            </div>`).join('')}
          ${openDisputeCount ? `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0D89B;">
              <span style="font-size:13px;">⚠ ${openDisputeCount} open dispute${openDisputeCount === 1 ? '' : 's'}</span>
              <button class="btn btn-outline" style="width:auto;flex-shrink:0;padding:6px 12px;font-size:12px;" onclick="tab='disputes'; render();">View</button>
            </div>` : ''}
          ${pendingCount ? `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0D89B;">
              <span style="font-size:13px;">⚠ ${pendingCount} pending contractor application${pendingCount === 1 ? '' : 's'}</span>
              <button class="btn btn-outline" style="width:auto;flex-shrink:0;padding:6px 12px;font-size:12px;" onclick="tab='applications'; render();">View</button>
            </div>` : ''}
          ${disputedMilestoneCount ? `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0D89B;">
              <span style="font-size:13px;">⚠ ${disputedMilestoneCount} disputed milestone${disputedMilestoneCount === 1 ? '' : 's'}</span>
              <button class="btn btn-outline" style="width:auto;flex-shrink:0;padding:6px 12px;font-size:12px;" onclick="tab='payments'; render();">View</button>
            </div>` : ''}
          ${pendingScheduleCount ? `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0D89B;">
              <span style="font-size:13px;">⚠ ${pendingScheduleCount} job${pendingScheduleCount === 1 ? '' : 's'} awaiting a payment schedule</span>
              <button class="btn btn-outline" style="width:auto;flex-shrink:0;padding:6px 12px;font-size:12px;" onclick="tab='payments'; render();">View</button>
            </div>` : ''}
        `}
      </div>`;

    app.innerHTML = `
      ${actionRequiredHtml}
      <div class="statgrid">
        <div class="statcard"><div class="num">${jobs.length}</div><div class="lab">Total jobs</div></div>
        <div class="statcard"><div class="num">${jobs.filter(j=>j.status==='feed').length}</div><div class="lab">Awaiting contractor</div></div>
        <div class="statcard"><div class="num">$${gmv.toLocaleString()}</div><div class="lab">Gross job value</div></div>
        <div class="statcard"><div class="num">$${commission.toLocaleString()}</div><div class="lab">Platform commission</div></div>
      </div>
      <div class="tabs">
        <button class="${tab==='overview'?'active':''}" onclick="tab='overview'; render();">All Jobs</button>
        <button class="${tab==='applications'?'active':''}" onclick="tab='applications'; render();">Applications ${pendingCount ? '(' + pendingCount + ')' : ''}</button>
        <button class="${tab==='customers'?'active':''}" onclick="tab='customers'; render();">Customers</button>
        <button class="${tab==='disputes'?'active':''}" onclick="tab='disputes'; render();">Disputes ${openDisputeCount ? '(' + openDisputeCount + ')' : ''}</button>
        <button class="${tab==='payments'?'active':''}" onclick="tab='payments'; render();">Payment Schedules ${paymentBadgeCount ? '(' + paymentBadgeCount + ')' : ''}</button>
        <button class="${tab==='ratecard'?'active':''}" onclick="tab='ratecard'; render();">Rate Card</button>
        <button class="${tab==='reports'?'active':''}" onclick="tab='reports'; render();">Reports</button>
      </div>
      ${tab === 'overview' ? `
        <h1 class="pagetitle">Jobs</h1>
        ${jobs.length === 0 ? '<div class="empty">No jobs yet. Submit one from the site to see it here.</div>' : `
          ${jobStatusFilterChipsHtml(jobs)}
          ${jobSearchBoxHtml()}
          ${(() => {
            const statusFiltered = jobStatusFilter === 'all' ? jobs : jobs.filter(j => j.status === jobStatusFilter);
            const filtered = statusFiltered.filter(j => jobMatchesSearch(j, jobSearchQuery));
            if (statusFiltered.length === 0) return '<div class="empty">No jobs in this status.</div>';
            return filtered.length === 0
              ? `<div class="empty">No jobs match "${escapeHtml(jobSearchQuery)}".</div>`
              : jobsTableHtml(filtered);
          })()}
        `}
      ` : tab === 'applications' ? renderApplicationsTab(applications) : tab === 'customers' ? renderCustomersTab() : tab === 'disputes' ? renderDisputesTab(disputes, jobs) : tab === 'payments' ? renderPaymentScheduleTab() : tab === 'reports' ? renderReportsTab(jobs, applications, disputes) : renderRateCardTab()}
    `;
    if (tab === 'ratecard') wireRateCardTab();
  }

  function getCustomersMap() { return JSON.parse(localStorage.getItem('mysubbies_customers') || '{}'); }

  // CSV export, sourced from the real Supabase tables (not local cache) so
  // the export reflects every customer/contractor across every device,
  // not just whoever registered in this browser.
  function toCsv(rows, columns) {
    const esc = v => {
      const s = v == null ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const header = columns.map(c => esc(c.label)).join(',');
    const body = rows.map(r => columns.map(c => esc(r[c.key])).join(',')).join('\n');
    return header + '\n' + body;
  }
  function downloadCsv(filename, csv) {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  async function exportCustomersCsv() {
    try {
      const res = await fetch('/api/get-admin-list?type=customers');
      const { customers } = await res.json();
      const csv = toCsv(customers || [], [
        { key: 'name', label: 'Name' }, { key: 'email', label: 'Email' },
        { key: 'phone', label: 'Phone' }, { key: 'created_at', label: 'Registered' },
      ]);
      downloadCsv('mysubbies-customers.csv', csv);
    } catch (e) { alert('Could not export customers — try again.'); }
  }
  function exportContractorsCsv() {
    const apps = getApplications();
    const rows = apps.map(a => ({ ...a, tradesCsv: (a.trades || []).join('; '), suburbsCsv: (a.suburbs || []).join('; ') }));
    downloadCsv('mysubbies-contractors.csv', toCsv(rows, [
      { key: 'business', label: 'Business name' }, { key: 'contact', label: 'Contact' },
      { key: 'email', label: 'Email' }, { key: 'phone', label: 'Phone' },
      { key: 'abn', label: 'ABN' }, { key: 'acn', label: 'ACN' },
      { key: 'status', label: 'Status' },
      { key: 'tradesCsv', label: 'Trades' }, { key: 'suburbsCsv', label: 'Suburbs' },
      { key: 'appliedAt', label: 'Applied' },
    ]));
  }

  function barHtml(label, value, max, valueLabel) {
    const pct = max > 0 ? Math.max(2, Math.round((value / max) * 100)) : 0;
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
          <span>${escapeHtml(label)}</span><span style="font-weight:600;">${valueLabel}</span>
        </div>
        <div style="background:var(--paper);border-radius:5px;height:8px;overflow:hidden;">
          <div style="background:var(--black);height:100%;width:${pct}%;"></div>
        </div>
      </div>`;
  }

  function renderReportsTab(jobs, applications, disputes) {
    const customers = getCustomersMap();
    const customerList = Object.values(customers);
    const newsletterCount = JSON.parse(localStorage.getItem('mysubbies_newsletter_signups') || '[]').length;

    const gmv = jobs.reduce((s, j) => s + (j.basePrice || 0), 0);
    const commission = Math.round(gmv * 0.25);
    const payout = gmv - commission;
    const completedJobs = jobs.filter(j => j.status === 'completed');
    const completedGmv = completedJobs.reduce((s, j) => s + (j.basePrice || 0), 0);

    const approved = applications.filter(a => a.status === 'approved');
    const pendingApps = applications.filter(a => a.status === 'pending');
    const rejectedApps = applications.filter(a => a.status === 'rejected');
    const openDisputes = disputes.filter(d => d.status === 'open');
    const disputeRate = jobs.length ? ((disputes.length / jobs.length) * 100).toFixed(1) : '0.0';
    const referredCustomers = customerList.filter(c => c.referredBy).length;

    // Revenue by category
    const byCategory = {};
    jobs.forEach(j => {
      const cat = j.category || 'Unknown';
      if (!byCategory[cat]) byCategory[cat] = { count: 0, value: 0 };
      byCategory[cat].count++;
      byCategory[cat].value += j.basePrice || 0;
    });
    const catRows = Object.entries(byCategory).sort((a, b) => b[1].value - a[1].value);
    const maxCatValue = catRows.length ? catRows[0][1].value : 0;

    // Demand by suburb (top 5)
    const bySuburb = {};
    jobs.forEach(j => { const s = j.suburb || 'Unknown'; bySuburb[s] = (bySuburb[s] || 0) + 1; });
    const suburbRows = Object.entries(bySuburb).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const maxSuburbCount = suburbRows.length ? suburbRows[0][1] : 0;

    // Jobs per month (sortable key -> display label)
    const monthMap = {};
    jobs.forEach(j => {
      const d = new Date(j.createdAt);
      if (isNaN(d)) return;
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      monthMap[key] = (monthMap[key] || 0) + 1;
    });
    const monthKeys = Object.keys(monthMap).sort();
    const maxMonthCount = monthKeys.length ? Math.max(...monthKeys.map(k => monthMap[k])) : 0;

    // Contractor category coverage (approved contractors per trade)
    const coverage = {};
    approved.forEach(a => (a.trades || []).forEach(t => { coverage[t] = (coverage[t] || 0) + 1; }));
    const uncoveredCats = catRows.filter(([cat]) => !coverage[cat]).map(([cat]) => cat);

    return `
      <h1 class="pagetitle">Reports</h1>
      <p class="pagesub">Built from live platform data — refreshes every time you open this tab.</p>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Export for marketing / analysis</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" style="flex:1;" onclick="exportCustomersCsv()">Export customers CSV</button>
          <button class="btn btn-outline" style="flex:1;" onclick="exportContractorsCsv()">Export contractors CSV</button>
        </div>
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Finance</h3>
        <div class="row"><span class="l">Gross merchandise value (all jobs)</span><span class="r">$${gmv.toLocaleString()}</span></div>
        <div class="row"><span class="l">Platform commission (25%)</span><span class="r">$${commission.toLocaleString()}</span></div>
        <div class="row"><span class="l">Contractor payout (75%)</span><span class="r">$${payout.toLocaleString()}</span></div>
        <div class="row"><span class="l">Completed jobs value</span><span class="r">$${completedGmv.toLocaleString()} (${completedJobs.length} jobs)</span></div>
        <div class="row"><span class="l">Average job value</span><span class="r">$${jobs.length ? Math.round(gmv / jobs.length).toLocaleString() : 0}</span></div>
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Revenue by category</h3>
        ${catRows.length === 0 ? '<div class="empty">No jobs yet.</div>' : catRows.map(([cat, d]) => barHtml(cat, d.value, maxCatValue, `$${d.value.toLocaleString()} · ${d.count} job${d.count === 1 ? '' : 's'}`)).join('')}
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Jobs booked by month</h3>
        ${monthKeys.length === 0 ? '<div class="empty">No jobs yet.</div>' : monthKeys.map(k => {
          const [y, m] = k.split('-');
          const label = new Date(Number(y), Number(m) - 1, 1).toLocaleDateString('en-AU', { month: 'short', year: 'numeric' });
          return barHtml(label, monthMap[k], maxMonthCount, String(monthMap[k]));
        }).join('')}
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Marketing</h3>
        <div class="row"><span class="l">Total customer accounts</span><span class="r">${customerList.length}</span></div>
        <div class="row"><span class="l">Customers who used a referral code</span><span class="r">${referredCustomers}</span></div>
        <div class="row"><span class="l">Newsletter signups</span><span class="r">${newsletterCount}</span></div>
        <div style="margin-top:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--stone);margin-bottom:8px;">Top demand by suburb</div>
        ${suburbRows.length === 0 ? '<div class="empty">No jobs yet.</div>' : suburbRows.map(([sub, count]) => barHtml(sub, count, maxSuburbCount, `${count} job${count === 1 ? '' : 's'}`)).join('')}
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Director / CEO overview</h3>
        <div class="row"><span class="l">Total jobs</span><span class="r">${jobs.length}</span></div>
        <div class="row"><span class="l">Approved contractors</span><span class="r">${approved.length}</span></div>
        <div class="row"><span class="l">Applications awaiting review</span><span class="r">${pendingApps.length}</span></div>
        <div class="row"><span class="l">Applications rejected</span><span class="r">${rejectedApps.length}</span></div>
        <div class="row"><span class="l">Open disputes</span><span class="r">${openDisputes.length} of ${disputes.length} total</span></div>
        <div class="row"><span class="l">Dispute rate</span><span class="r">${disputeRate}% of jobs</span></div>
        ${uncoveredCats.length ? `
          <div style="margin-top:12px;padding:10px 12px;background:#FFF6E5;border:1px solid #F0DCA6;border-radius:8px;font-size:12.5px;color:#7A5C1E;">
            <strong>No approved contractors yet</strong> in categories with active demand: ${uncoveredCats.map(escapeHtml).join(', ')}.
          </div>
        ` : ''}
      </div>
    `;
  }

  function variationListHtml(j) {
    const variations = j.variations || [];

  function docChipsHtml(docs) {

  // ============================================================
  // PAYMENT SCHEDULES — settings + resolution queue (backend-calculated

  let customersTabData = null;

  async function loadCustomersTab() {
    if (customersTabLoading) return;
    customersTabLoading = true;
    try {
      const res = await fetch('/api/get-admin-list?type=customers');
      const body = await res.json();
      if (!res.ok) { customersTabData = { error: body.error || 'Could not load customers.' }; }
      else { customersTabData = { rows: body.customers || [] }; }
    } catch (e) {
      customersTabData = { error: 'Could not load customers.' };

  // Shared caller for /api/admin-account (deactivate/reactivate/delete for
  // either role). Returns the parsed response on success, or null on
  // failure/cancel — callers only need to update local state when non-null.
  async function accountAction(role, email, action, confirmMsg) {
    if (confirmMsg && !confirm(confirmMsg)) return null;
    try {
      const res = await fetch('/api/admin-account', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role, email, action }),
      });
      const result = await res.json();
      if (!res.ok) { alert(result.error || 'Could not update this account.'); return null; }
      return result;
    } catch (e) { alert('Could not update this account — try again.'); return null; }
  }

  function renderCustomersTab() {

    return `
      <h1 class="pagetitle">Customers</h1>
      <p class="pagesub">${all.length} account${all.length === 1 ? '' : 's'} total. Deactivating blocks login on this and any other device — it doesn't touch their job history.</p>
      <input class="searchbox" placeholder="Search by name or email…" value="${escapeHtml(customerSearchQuery)}" oninput="customerSearchQuery=this.value; render();" />
      ${rows.length === 0 ? '<div class="empty">No customers match.</div>' : rows.map(c => `
        <div class="detailcard" style="max-width:640px;margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <div style="font-weight:700;font-size:15px;">${escapeHtml(c.name || '(no name)')}</div>

          <div style="display:flex;gap:8px;margin-top:14px;">

            <button class="btn btn-danger" style="flex:1;" onclick="deleteCustomerAccount('${escapeHtml(c.email)}')">Delete permanently</button>

  async function deactivateCustomer(email) {
    const c = customersTabData.rows.find(x => x.email === email);
    const result = await accountAction('customer', email, 'deactivate', `Deactivate ${c?.name || email}? They won't be able to log in until reactivated. Existing job history is untouched.`);
    if (!result) return;
    c.status = 'deactivated';
    render();
  }
  async function reactivateCustomer(email) {
    const c = customersTabData.rows.find(x => x.email === email);
    const result = await accountAction('customer', email, 'reactivate', `Reactivate ${c?.name || email}? They'll be able to log in again.`);
    if (!result) return;
    c.status = 'active';
    render();
  }
  async function deleteCustomerAccount(email) {
    const c = customersTabData.rows.find(x => x.email === email);
    const result = await accountAction('customer', email, 'delete', `Permanently delete ${c?.name || email}'s account? This can't be undone, and only works if they have no job history — otherwise use Deactivate.`);
    if (!result) return;
    customersTabData.rows = customersTabData.rows.filter(x => x.email !== email);
    render();
  }

        <div class="row"><span class="l">Material-Heavy — tier 3 max</span><span class="r">$<input id="cfgMatT3" type="number" value="${config.material_heavy_tier3_max_cents / 100}" style="width:100px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;" /></span></div>

  async function savePaymentConfig() {
    const errBox = document.getElementById('cfgSaveError');
    errBox.textContent = '';
    const config = {
      deposit_cap_low_pct: Number(document.getElementById('cfgDepositLow').value),
      deposit_cap_high_pct: Number(document.getElementById('cfgDepositHigh').value),
      high_value_threshold_cents: Math.round(Number(document.getElementById('cfgHighValue').value) * 100),
      simple_service_tier1_max_cents: Math.round(Number(document.getElementById('cfgSimpleT1').value) * 100),
      simple_service_tier2_max_cents: Math.round(Number(document.getElementById('cfgSimpleT2').value) * 100),
      material_heavy_tier1_max_cents: Math.round(Number(document.getElementById('cfgMatT1').value) * 100),
      material_heavy_tier2_max_cents: Math.round(Number(document.getElementById('cfgMatT2').value) * 100),
      material_heavy_tier3_max_cents: Math.round(Number(document.getElementById('cfgMatT3').value) * 100),
    };
    try {
      const res = await fetch('/api/payment-schedule-admin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save-config', config, actorId: 'admin' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not save thresholds.');
      paymentTabData.config = data.config;
      const saved = document.getElementById('cfgSaved');
      saved.style.display = 'inline';
      setTimeout(() => { saved.style.display = 'none'; }, 2000);
    } catch (e) { errBox.textContent = e.message || 'Could not save thresholds.'; }
  }

  function categoryRulesTableHtml(categories, ruleByCategory) {
    const types = ['simple_service', 'material_heavy', 'structural_inspection', 'custom', 'manual_review'];
    return `<table><thead><tr><th>Category</th><th>Schedule type</th></tr></thead><tbody>
      ${categories.map(cat => {
        const rule = ruleByCategory[cat];
        const current = rule ? rule.schedule_type : 'manual_review';
        return `<tr><td>${escapeHtml(cat)}</td><td>
          <select onchange="saveCategoryRule(${JSON.stringify(cat)}, this.value)" style="font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;">
            ${types.map(ty => `<option value="${ty}" ${current === ty ? 'selected' : ''}>${ty}</option>`).join('')}
          </select>
        </td></tr>`;
      }).join('')}
    </tbody></table>`;
  }

  async function saveCategoryRule(category, scheduleType) {
    await fetch('/api/payment-schedule-admin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'save-category-rule', category, scheduleType, allowJobOverride: true, actorId: 'admin' }),
    });
    paymentTabData = null;
    loadPaymentScheduleTab();
  }

  const MILESTONE_EVIDENCE_TYPES = ['none', 'photos', 'delivery_docket', 'inspection_certificate'];
  const MILESTONE_TYPES = ['deposit', 'materials_delivered', 'installation', 'foundation', 'frame', 'inspection', 'completion', 'custom'];

  function templateCardHtml(t) {
    const editing = editingTemplateId === t.id;
    const statusColor = t.status === 'approved' ? 'var(--good)' : t.status === 'pending_review' ? 'var(--warn)' : 'var(--stone)';
    const priceRange = t.min_price_cents != null ? `$${(t.min_price_cents / 100).toLocaleString()}${t.max_price_cents ? ' – $' + (t.max_price_cents / 100).toLocaleString() : '+'}` : '';
    const rows = editing ? editingTemplateDraft : t.milestones;
    return `
      <div class="detailcard" style="max-width:none;margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <div>
            <div style="font-weight:700;font-size:14px;">${escapeHtml(t.name)}</div>
            <div style="font-size:11.5px;color:var(--stone);">${escapeHtml(t.schedule_type)} · ${priceRange} · deposit ${t.deposit_pct}%</div>
          </div>
          <span class="badge" style="background:#F0EFEA;color:${statusColor};">${t.status}${t.is_builtin ? ' · built-in' : ''}</span>
        </div>
        ${(rows || []).map((m, idx) => editing ? `
          <div style="display:flex;gap:5px;align-items:center;padding:5px 0;border-top:1px solid var(--paper);flex-wrap:wrap;">
            <input id="draftLabel${idx}" value="${escapeHtml(m.label)}" style="flex:1;min-width:100px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;" />
            <input id="draftPct${idx}" type="number" step="0.01" value="${m.pct}" style="width:56px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;" />%
            <select id="draftEvidence${idx}" style="font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:5px 3px;">
              ${MILESTONE_EVIDENCE_TYPES.map(v => `<option value="${v}" ${m.requires_evidence_type === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <select id="draftType${idx}" style="font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:5px 3px;">
              ${MILESTONE_TYPES.map(v => `<option value="${v}" ${m.milestone_type === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <input id="draftKey${idx}" value="${escapeHtml(m.key)}" style="display:none;" />
            <button onclick="moveDraftMilestone(${idx},-1)" class="btn btn-outline" style="padding:4px 8px;">↑</button>
            <button onclick="moveDraftMilestone(${idx},1)" class="btn btn-outline" style="padding:4px 8px;">↓</button>
            <button onclick="removeDraftMilestone(${idx})" class="btn btn-outline" style="padding:4px 8px;color:var(--warn);">×</button>
          </div>
        ` : `
          <div class="row"><span class="l">${escapeHtml(m.label)} <span style="color:var(--stone-light);">(${escapeHtml(m.requires_evidence_type)})</span></span><span class="r">${m.pct}%</span></div>
        `).join('')}
        ${editing ? `
          <div id="templateSaveError" style="color:var(--warn);font-size:12px;margin-top:6px;"></div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
            <button class="btn btn-outline" onclick="addDraftMilestone()">+ Add milestone</button>
            <button class="btn btn-outline" onclick="cancelEditTemplate()">Cancel</button>
            <button class="btn btn-black" onclick="saveEditedTemplate(${JSON.stringify(t.id)})">Save</button>
          </div>
        ` : `
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-outline" onclick="startEditTemplate(${JSON.stringify(t.id)})">Edit</button>
            ${t.status === 'pending_review' ? `<button class="btn btn-black" onclick="approveTemplate(${JSON.stringify(t.id)})">Approve</button>` : ''}
          </div>
        `}
      </div>
    `;
  }

  function startEditTemplate(templateId) {
    const t = paymentTabData.templates.find(x => x.id === templateId);
    if (!t) return;
    editingTemplateId = templateId;
    editingTemplateDraft = t.milestones.map(m => ({ ...m }));
    render();
  }
  function cancelEditTemplate() { editingTemplateId = null; editingTemplateDraft = null; render(); }
  function addDraftMilestone() {
    editingTemplateDraft.push({ key: 'milestone_' + editingTemplateDraft.length, label: 'New milestone', pct: 0, milestone_type: 'custom', requires_evidence_type: 'photos', requires_customer_approval: true });
    render();
  }
  function removeDraftMilestone(idx) { editingTemplateDraft.splice(idx, 1); render(); }
  function moveDraftMilestone(idx, dir) {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= editingTemplateDraft.length) return;
    const tmp = editingTemplateDraft[idx];
    editingTemplateDraft[idx] = editingTemplateDraft[newIdx];
    editingTemplateDraft[newIdx] = tmp;
    render();
  }

  async function saveEditedTemplate(templateId) {
    const t = paymentTabData.templates.find(x => x.id === templateId);
    const milestones = editingTemplateDraft.map((m, idx) => ({
      key: (document.getElementById('draftKey' + idx).value.trim() || m.key),
      label: document.getElementById('draftLabel' + idx).value.trim(),
      pct: Number(document.getElementById('draftPct' + idx).value),
      milestone_type: document.getElementById('draftType' + idx).value,
      requires_evidence_type: document.getElementById('draftEvidence' + idx).value,
      requires_customer_approval: m.requires_customer_approval !== false,
    }));
    const errBox = document.getElementById('templateSaveError');
    try {
      const res = await fetch('/api/payment-schedule-admin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save-template', template: { ...t, milestones }, actorId: 'admin' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not save template.');
      editingTemplateId = null; editingTemplateDraft = null;
      paymentTabData = null;
      loadPaymentScheduleTab();
    } catch (e) { if (errBox) errBox.textContent = e.message || 'Could not save template.'; }
  }

  async function approveTemplate(templateId) {
    await fetch('/api/payment-schedule-admin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'approve-template', templateId, actorId: 'admin' }),
    });
    paymentTabData = null;
    loadPaymentScheduleTab();
  }

  function pendingScheduleJobRowHtml(s) {
    const building = buildingScheduleForJobId === s.job_id;
    const remainingCents = s.revised_total_price_cents - s.deposit_amount_cents;
    return `<div class="detailcard" style="max-width:none;margin-bottom:12px;">
      <div class="row"><span class="l">Job</span><span class="r">${escapeHtml(s.job_id)}</span></div>
      <div class="row"><span class="l">Total contract value</span><span class="r">$${(s.revised_total_price_cents / 100).toLocaleString()}</span></div>
      <div class="row"><span class="l">Deposit (paid)</span><span class="r">$${(s.deposit_amount_cents / 100).toLocaleString()}</span></div>
      <div class="row"><span class="l">Remaining to schedule</span><span class="r" style="font-weight:700;">$${(remainingCents / 100).toLocaleString()}</span></div>
      ${building ? buildScheduleFormHtml(s.job_id) : `<button class="btn btn-black" style="margin-top:10px;" onclick="startBuildSchedule(${JSON.stringify(s.job_id)})">Build schedule</button>`}
    </div>`;
  }

  function startBuildSchedule(jobId) {
    buildingScheduleForJobId = jobId;
    buildDraftMilestones = [
      { key: 'materials', label: 'Materials delivered', pct: 30, milestone_type: 'materials_delivered', requires_evidence_type: 'delivery_docket' },
      { key: 'completion', label: 'Job completion', pct: 70, milestone_type: 'completion', requires_evidence_type: 'photos' },
    ];
    render();

  function cancelBuildSchedule() { buildingScheduleForJobId = null; buildDraftMilestones = null; render(); }

    buildDraftMilestones.push({ key: 'milestone_' + buildDraftMilestones.length, label: 'New milestone', pct: 0, milestone_type: 'custom', requires_evidence_type: 'photos' });
    render();
  }
  function removeBuildMilestone(idx) { buildDraftMilestones.splice(idx, 1); render(); }

  function buildScheduleFormHtml(jobId) {
    return `
      <div style="margin-top:10px;">
        ${buildDraftMilestones.map((m, idx) => `
          <div style="display:flex;gap:5px;align-items:center;padding:5px 0;border-top:1px solid var(--paper);flex-wrap:wrap;">
            <input id="buildLabel${idx}" value="${escapeHtml(m.label)}" style="flex:1;min-width:100px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;" />
            <input id="buildPct${idx}" type="number" step="0.01" value="${m.pct}" style="width:56px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;" />%
            <select id="buildEvidence${idx}" style="font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:5px 3px;">
              ${MILESTONE_EVIDENCE_TYPES.map(v => `<option value="${v}" ${m.requires_evidence_type === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <button onclick="removeBuildMilestone(${idx})" class="btn btn-outline" style="padding:4px 8px;color:var(--warn);">×</button>
          </div>
        `).join('')}
        <div id="buildScheduleError" style="color:var(--warn);font-size:12px;margin-top:6px;"></div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">

          <button class="btn btn-black" onclick="saveBuiltSchedule(${JSON.stringify(jobId)})">Save schedule</button>
        </div>
      </div>

  async function saveBuiltSchedule(jobId) {
    const milestones = buildDraftMilestones.map((m, idx) => ({
      key: m.key,
      label: document.getElementById('buildLabel' + idx).value.trim(),
      pct: Number(document.getElementById('buildPct' + idx).value),
      milestone_type: m.milestone_type,
      requires_evidence_type: document.getElementById('buildEvidence' + idx).value,
      requires_customer_approval: true,
    }));

    try {
      const res = await fetch('/api/payment-schedule-admin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'build-job-schedule', jobId, milestones, actorId: 'admin' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not save schedule.');
      buildingScheduleForJobId = null; buildDraftMilestones = null;
      paymentTabData = null;
      loadPaymentScheduleTab();
    } catch (e) { if (errBox) errBox.textContent = e.message || 'Could not save schedule.'; }

  function disputedMilestoneRowHtml(m) {
    const disputes = m.payment_milestone_disputes || [];
    const dispute = disputes.find(d => d.status === 'open') || disputes[disputes.length - 1];
    const evidenceRows = m.milestone_evidence || [];
    const evidence = evidenceRows[evidenceRows.length - 1];
    const jobId = m.job_payment_schedules ? m.job_payment_schedules.job_id : '';
    return `<div class="detailcard" style="max-width:none;margin-bottom:12px;">
      <div class="row"><span class="l">Job</span><span class="r">${escapeHtml(jobId)}</span></div>
      <div class="row"><span class="l">Milestone</span><span class="r">${escapeHtml(m.label)} (${m.pct}%, $${(m.amount_cents / 100).toLocaleString()})</span></div>
      ${dispute ? `<div class="row"><span class="l">Customer's reason</span><span class="r" style="text-align:right;max-width:60%;">${escapeHtml(dispute.reason || '')}</span></div>` : ''}
      ${evidence ? `
        <div style="font-size:12px;color:var(--stone);margin:8px 0;">${escapeHtml(evidence.description || '')}</div>
        ${evidence.photo_urls && evidence.photo_urls.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-bottom:8px;">${evidence.photo_urls.map(src => `<img src="${escapeHtml(src)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;" />`).join('')}</div>` : ''}
        ${evidence.delivery_docket_url ? `<div style="font-size:12px;margin-bottom:8px;"><a href="${escapeHtml(evidence.delivery_docket_url)}" target="_blank">View delivery docket</a></div>` : ''}
      ` : ''}
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        <button class="btn btn-black" onclick="resolveMilestone(${JSON.stringify(m.id)},'approve')">Approve payment</button>
        <button class="btn btn-outline" onclick="resolveMilestone(${JSON.stringify(m.id)},'reject')">Reject claim</button>
        <button class="btn btn-outline" onclick="resolveMilestone(${JSON.stringify(m.id)},'request_evidence')">Request more evidence</button>
        <button class="btn btn-outline" onclick="resolveMilestone(${JSON.stringify(m.id)},'return_to_contractor')">Return to contractor</button>
      </div>
    </div>`;
  }

  async function resolveMilestone(milestoneId, adminAction) {
    const needsNotes = adminAction !== 'approve';
    const notes = needsNotes ? prompt('Notes for this decision (shown in the audit log, optional):') : null;
    if (needsNotes && notes === null) return; // cancelled the prompt
    await fetch('/api/milestone', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'admin-resolve', milestoneId, adminAction, adminNotes: notes, actorId: 'admin' }),
    });
    paymentTabData = null;
    loadPaymentScheduleTab();
  }

        <h3 style="font-size:15px;margin-bottom:8px;">Upload a rate card</h3>
        <p style="font-size:12.5px;color:var(--stone);margin-bottom:12px;">CSV file with columns: <strong>Category, Task, Unit, Rate, Notes</strong> (Notes optional). This replaces the entire rate card \u2014 you'll see a preview before it goes live.</p>

          <span style="font-size:13px;color:var(--stone);">$</span>
          <input type="number" id="minBookingValueInput" value="${getMinBookingValue()}" min="0" step="1" style="width:110px;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;">
          <button class="btn btn-black" onclick="saveMinBookingValue()">Save</button>
          <span id="minBookingValueSaved" style="font-size:12px;color:var(--stone);display:none;">Saved.</span>
        </div>
      </div>

          <span style="font-size:13px;color:var(--stone);">%</span>
          <button class="btn btn-outline" onclick="document.getElementById('bulkPct').value=3.8; previewBulkUpdate();">Use current CPI (3.8%)</button>
          <button class="btn btn-outline" onclick="previewBulkUpdate()">Preview change</button>
        </div>
        <div style="font-size:11px;color:var(--stone-light);margin-bottom:10px;">3.8% is the ABS CPI figure for the 12 months to June 2026. Use a negative number to reduce prices.</div>
        <div id="bulkPreview"></div>
        <div id="bulkHistory"></div>
      </div>

      <div class="detailcard" style="max-width:640px;">
        <div class="tabs" style="margin-bottom:16px;">
          <button class="${rcMode==='manage'?'active':''}" onclick="rcMode='manage'; render();">Manage Existing</button>
          <button class="${rcMode==='research'?'active':''}" onclick="rcMode='research'; render();">Research New</button>

            ${categories.length ? `<br><strong style="color:var(--ink);">Which existing categories do well?</strong> Check the <a href="#" onclick="tab='reports'; render(); return false;" style="text-decoration:underline;">Reports</a> tab's Revenue by category section \u2014 real sales data beats a guess. A brand-new category has no sales history yet, so that call is still yours.` : ''}

  function rateCardManageHtml(categories) {

  function downloadRateCardTemplate() {
    const categories = getRateCard();

    a.href = url; a.download = 'mysubbies-ratecard-template.csv';
    a.click();
    URL.revokeObjectURL(url);

  // Minimal CSV parser handling quoted fields with embedded commas.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i + 1];
      if (inQuotes) {
        if (ch === '"' && next === '"') { field += '"'; i++; }
        else if (ch === '"') { inQuotes = false; }
        else { field += ch; }
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ',') { row.push(field); field = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && next === '\n') i++;
          row.push(field); field = '';
          if (row.some(f => f !== '')) rows.push(row);
          row = [];
        } else { field += ch; }
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function onRateCardFileSelected(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const rows = parseCSV(ev.target.result);
      if (rows.length < 2) { document.getElementById('rcUploadPreview').innerHTML = '<div class="error" style="margin-top:12px;">That file doesn\u2019t look right \u2014 no rows found.</div>'; return; }
      const header = rows[0].map(h => h.trim().toLowerCase());
      const idx = { category: header.indexOf('category'), task: header.indexOf('task'), unit: header.indexOf('unit'), rate: header.indexOf('rate'), notes: header.indexOf('notes') };
      if (idx.category === -1 || idx.task === -1 || idx.unit === -1 || idx.rate === -1) {
        document.getElementById('rcUploadPreview').innerHTML = '<div class="error" style="margin-top:12px;">Missing required columns. Expected: Category, Task, Unit, Rate (Notes optional).</div>';
        return;
      }
      const dataRows = rows.slice(1).filter(r => r[idx.category]);
      pendingUploadRows = dataRows.map(r => ({
        category: r[idx.category].trim(), task: r[idx.task].trim(), unit: r[idx.unit].trim(),
        rate: r[idx.rate].trim() === '' ? null : Number(r[idx.rate]),
        notes: idx.notes > -1 ? (r[idx.notes] || '').trim() : '',
      }));
      const uniqueCats = [...new Set(pendingUploadRows.map(r => r.category))];
      document.getElementById('rcUploadPreview').innerHTML = `
        <div style="background:var(--paper);border-radius:10px;padding:14px;margin-top:14px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:6px;">Preview: ${pendingUploadRows.length} tasks across ${uniqueCats.length} categories</div>
          <div style="font-size:12px;color:var(--stone);margin-bottom:10px;">${uniqueCats.slice(0, 8).join(', ')}${uniqueCats.length > 8 ? ', +' + (uniqueCats.length - 8) + ' more' : ''}</div>
          <div style="font-size:12px;color:var(--warn);margin-bottom:10px;">⚠ This will replace the entire live rate card.</div>
          <button class="btn btn-black" onclick="confirmRateCardUpload()">Confirm & publish</button>
        </div>
      `;
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function confirmRateCardUpload() {
    if (!pendingUploadRows) return;
    const grouped = {};
    pendingUploadRows.forEach(r => {
      if (!grouped[r.category]) grouped[r.category] = { label: r.category, icon: '🔧', tasks: [] };
      grouped[r.category].tasks.push({ name: r.task, unit: r.unit, rate: r.rate, notes: r.notes });
    });
    saveRateCard(Object.values(grouped));
    pendingUploadRows = null;
    render();
  }

  // Mirrors the decision into the real `contractors` table (matched by
  // email) so a contractor logging in on a device that's never touched
  // this admin browser's localStorage still gets the right answer — see
  // api/update-contractor-status.js. Fire-and-forget, same pattern as
  // saveJobs()'s sync-jobs call.
  function syncContractorStatus(email, status) {
    fetch('/api/update-contractor-status', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, status }),
    }).catch(() => {});
  }
  function approveApplication(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    a.status = 'approved';
    saveApplications(apps);
    syncContractorStatus(a.email, 'approved');
    render();
  }
  function rejectApplication(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    a.status = 'rejected';
    saveApplications(apps);
    syncContractorStatus(a.email, 'rejected');
    render();
  }

  // Deactivate/reactivate/delete are post-approval account lifecycle
  // actions (distinct from the approve/reject application-review decision
  // above) — routed through /api/admin-account so customers and
  // contractors share one endpoint and one confirm/error-handling pattern.
  async function deactivateContractor(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    const result = await accountAction('contractor', a.email, 'deactivate', `Deactivate ${a.business}? They won't be able to log in or receive new jobs until reactivated.`);
    if (!result) return;
    a.status = 'suspended';
    saveApplications(apps);
    render();
  }
  async function reactivateContractor(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    const result = await accountAction('contractor', a.email, 'reactivate', `Reactivate ${a.business}? They'll be able to log in and receive jobs again.`);
    if (!result) return;
    a.status = 'approved';
    saveApplications(apps);
    render();
  }
  async function deleteContractorAccount(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    const result = await accountAction('contractor', a.email, 'delete', `Permanently delete ${a.business}'s account? This can't be undone, and only works if they have no job history — otherwise use Deactivate.`);
    if (!result) return;
    saveApplications(apps.filter(x => x.id !== id));
    render();
  }

    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    if (!j) { selectedJobId = null; render(); return; }
    const commission = Math.round((j.basePrice || 0) * 0.25);
    const payout = (j.basePrice || 0) - commission;

    app.innerHTML = `
      <button class="backbtn" onclick="selectedJobId=null; render();">← Back to jobs</button>
      <div class="detailcard">
        ${j.photoDataUrls && j.photoDataUrls.length > 1 ? `
          <div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;">
            ${j.photoDataUrls.map(src => `<img src="${src}" style="width:90px;height:90px;border-radius:10px;object-fit:cover;flex-shrink:0;" />`).join('')}
          </div>
        ` : j.photoDataUrl ? `<img class="jobphoto" src="${j.photoDataUrl}">` : ''}
        <h1 class="pagetitle" style="margin-bottom:2px;">${j.icon || ''} ${escapeHtml(j.category)}</h1>
        <div style="color:var(--stone);font-size:13px;margin-bottom:16px;">${j.items && j.items.length > 1 ? j.items.length + ' items' : `${j.qty || ''} ${escapeHtml(j.unit || '')}`} · 📍 ${j.address ? escapeHtml(j.address) + ', ' : ''}${escapeHtml(j.suburb)}</div>

        ${j.items && j.items.length ? `
          <div style="border-top:1px solid var(--paper);border-bottom:1px solid var(--paper);padding:10px 0;margin-bottom:8px;">
            ${j.items.map(i => `
              <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;">
                <span>${i.catIcon || ''} ${escapeHtml(i.taskName)} <span style="color:var(--stone);">(${i.qty} ${escapeHtml(i.unit)})</span></span>
                <span style="font-weight:600;">${i.aiEstimated ? '~' : ''}$${i.base.toLocaleString()}</span>
              </div>
              ${i.aiEstimated ? `<div style="font-size:11.5px;font-weight:700;color:#D98E14;background:#FDF0D9;border-radius:6px;padding:4px 8px;margin-bottom:4px;">🤖 AI-estimated price — not from the rate card${i.typicalRange ? ' · range ' + escapeHtml(i.typicalRange) : ''} — confirm before dispatch</div>` : ''}
              ${i.notes ? `<div style="font-size:11.5px;color:var(--stone);margin-bottom:4px;">${escapeHtml(i.notes)}</div>` : ''}
            `).join('')}
          </div>
        ` : ''}

        <div class="row"><span class="l">Customer</span><span class="r">${escapeHtml(j.customerName || '—')}</span></div>
        ${j.jobType === 'business' ? `<div class="row"><span class="l">Invoice to</span><span class="r">${escapeHtml(j.businessName || '—')} (business)</span></div>` : ''}
        <div class="row"><span class="l">Phone</span><span class="r">${escapeHtml(j.customerPhone || '—')}</span></div>
        <div class="row"><span class="l">Contractor</span><span class="r">${escapeHtml(j.contractor || 'Unassigned')}</span></div>
        <div class="row"><span class="l">On site / access</span><span class="r">${escapeHtml(j.site || '—')} ${j.access ? '· ' + escapeHtml(j.access) : ''}</span></div>
        ${j.urgency ? `<div class="row"><span class="l">Urgency</span><span class="r">${escapeHtml(j.urgency)}</span></div>` : ''}
        <div class="row"><span class="l">Total job value</span><span class="r">$${(j.basePrice || 0).toLocaleString()}</span></div>
        <div class="row commission"><span class="l">Platform commission (25%)</span><span class="r">$${commission.toLocaleString()}</span></div>
        <div class="row payout"><span class="l">Contractor payout</span><span class="r">$${payout.toLocaleString()}</span></div>

        ${j.status === 'cancellation_requested' ? `
        <div style="background:#FFF6E5;border:1.5px solid #F0D89B;border-radius:12px;padding:14px;margin-top:14px;">
          <div style="font-weight:700;font-size:13.5px;color:#8A6D2E;margin-bottom:4px;">⚠ ${j.cancellationRequestedBy === 'contractor' ? 'Contractor' : 'Customer'} requested to cancel this job</div>
          ${j.cancellationReason ? `<div style="font-size:12.5px;color:var(--ink);margin-bottom:10px;">"${escapeHtml(j.cancellationReason)}"</div>` : ''}
          <div style="display:flex;gap:8px;">
            <button class="btn btn-black" style="flex:1;" onclick="approveCancellation('${j.id}')">Approve cancellation</button>
            <button class="btn btn-outline" style="flex:1;" onclick="rejectCancellation('${j.id}')">Reject — keep job active</button>
          </div>
        </div>` : ''}

        <div class="reassign">
          <select id="reassignSelect" style="flex:1;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;">
            <option value="">${j.contractor ? 'Reassign to…' : 'Assign to…'}</option>
            ${approvedContractorOptions(j)}
          </select>
          <button class="btn btn-black" onclick="reassign('${j.id}')">${j.contractor ? 'Reassign' : 'Assign'}</button>
          ${j.contractor ? `<button class="btn btn-outline" onclick="unassign('${j.id}')">Unassign</button>` : ''}
        </div>
        <button class="btn btn-outline" style="margin-top:10px;width:100%;" onclick="toggleEditJob()">Edit job details</button>
        <div id="editJobWrap"></div>
      </div>
      ${(j.beforePhotos && j.beforePhotos.length) || (j.afterPhotos && j.afterPhotos.length) ? `
        <div class="detailcard" style="margin-top:14px;">
          <h3 style="font-size:15px;margin-bottom:10px;">Before / after photos</h3>
          ${(j.beforePhotos && j.beforePhotos.length) ? `<div style="font-size:11px;color:var(--stone);margin-bottom:6px;">BEFORE</div><div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));gap:8px;margin-bottom:12px;">${j.beforePhotos.map(src => `<img src="${src}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);" />`).join('')}</div>` : ''}
          ${(j.afterPhotos && j.afterPhotos.length) ? `<div style="font-size:11px;color:var(--stone);margin-bottom:6px;">AFTER</div><div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));gap:8px;">${j.afterPhotos.map(src => `<img src="${src}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);" />`).join('')}</div>` : ''}
        </div>
      ` : ''}
      ${j.variations && j.variations.length ? `
        <div class="detailcard" style="margin-top:14px;">
          <h3 style="font-size:15px;margin-bottom:10px;">Variations</h3>
          ${variationListHtml(j)}
        </div>
      ` : ''}
      ${notifyBannerHtml()}
      <div class="msgbox">
        <h3>💬 Customer ↔ Contractor <span style="font-weight:400;color:var(--stone);">(visible to customer)</span></h3>
        <div class="msglist" id="msgListPublic"></div>
        <div class="msginput">
          <input type="text" id="msgInputPublic" placeholder="Reply in this thread…" onkeydown="if(event.key==='Enter') sendMsg('messages')" />
          <button class="btn btn-black" onclick="sendMsg('messages')">Send</button>
        </div>
      </div>
      <div class="msgbox">
        <h3>🔒 Admin ↔ Contractor <span style="font-weight:400;color:var(--stone);">(private — customer never sees this)</span></h3>
        <div class="msglist" id="msgListPrivate"></div>
        <div class="msginput">
          <input type="text" id="msgInputPrivate" placeholder="e.g. request a document…" onkeydown="if(event.key==='Enter') sendMsg('internalMessages')" />
          <button class="btn btn-black" onclick="sendMsg('internalMessages')">Send</button>
        </div>
      </div>
    `;
    renderThread(j, 'messages', 'msgListPublic');
    renderThread(j, 'internalMessages', 'msgListPrivate');
    wireNotifyButton();
  }

  function renderThread(j, key, listId) {
    const list = document.getElementById(listId);
    const msgs = j[key] || [];
    if (msgs.length === 0) { list.innerHTML = '<div style="font-size:12px;color:var(--stone-light);">No messages yet.</div>'; return; }
    list.innerHTML = msgs.map(m => `
      <div class="msgbubble ${m.from === 'admin' ? 'mine' : 'theirs'}">
        <div class="msgmeta">${m.from === 'admin' ? 'You (MySubbies)' : escapeHtml(m.authorName || m.from)}</div>
        ${escapeHtml(m.text)}
      </div>
    `).join('');
    list.scrollTop = list.scrollHeight;
  }

  function sendMsg(key) {
    const inputId = key === 'messages' ? 'msgInputPublic' : 'msgInputPrivate';
    const input = document.getElementById(inputId);
    const text = input.value.trim();
    if (!text) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    j[key] = j[key] || [];
    j[key].push({ id: 'm_' + Date.now(), from: 'admin', authorName: 'MySubbies support', text, createdAt: new Date().toISOString() });
    saveJobs(jobs);
    input.value = '';
    renderDetail();
  }

  function notifyBannerHtml() {
    if (!('Notification' in window) || Notification.permission !== 'default') return '';
    return `<div class="note" style="background:var(--paper);padding:10px 12px;border-radius:8px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--stone);"><span>Get a desktop alert on new messages (while this tab is open)</span><button id="notifyBtn" style="background:none;border:none;text-decoration:underline;font-size:12px;cursor:pointer;">Turn on</button></div>`;
  }
  function wireNotifyButton() {
    const btn = document.getElementById('notifyBtn');
    if (btn) btn.onclick = () => Notification.requestPermission().then(() => renderDetail());
  }
  function notify(text) {
    if ('Notification' in window && Notification.permission === 'granted') new Notification('MySubbies admin', { body: text });
  }
  let lastAdminMsgCounts = {};
  function checkForNewMessages() {
    getJobs().forEach(j => {
      ['messages', 'internalMessages'].forEach(key => {
        const arr = j[key] || [];
        const cacheKey = j.id + '_' + key;
        const last = arr[arr.length - 1];
        if (lastAdminMsgCounts[cacheKey] !== undefined && arr.length > lastAdminMsgCounts[cacheKey] && last && last.from !== 'admin') {
          notify(`${j.category} — ${last.authorName || last.from}: ${last.text}`);
        }
        lastAdminMsgCounts[cacheKey] = arr.length;
      });
    });
  }
  window.addEventListener('storage', (e) => { if (e.key === 'mysubbies_jobs') { checkForNewMessages(); render(); } });
  setInterval(checkForNewMessages, 3000);

  // Approved contractors first (and ones covering this job's category
  // floated to the top), so reassigning is a pick-from-list action instead
  // of retyping a business name — which also fixes a real gap where the
  // old free-text "Assign" never set contractorEmail, so the job never
  // synced to that contractor's own device (see api/sync-jobs.js).
  function approvedContractorOptions(j) {
    const eligible = getApplications().filter(a => ['approved', 'preferred'].includes(a.status) && a.email !== (j.contractorEmail || ''));
    eligible.sort((a, b) => {
      const aMatch = (a.trades || []).includes(j.category) ? 0 : 1;
      const bMatch = (b.trades || []).includes(j.category) ? 0 : 1;
      return aMatch - bMatch || a.business.localeCompare(b.business);
    });
    return eligible.map(a => `<option value="${escapeHtml(a.email)}" data-name="${escapeHtml(a.business)}">${escapeHtml(a.business)}${(a.trades || []).includes(j.category) ? ' ✓ ' + escapeHtml(j.category) : ''}</option>`).join('');
  }

  function reassign(id) {
    const select = document.getElementById('reassignSelect');
    const email = select.value;
    if (!email) return;
    const name = select.selectedOptions[0].getAttribute('data-name');
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.contractor = name;
    j.contractorEmail = email;
    j.status = 'assigned';
    saveJobs(jobs);
    render();
  }

  function unassign(id) {
    if (!confirm('Unassign this job? It will go back to the open feed for matching contractors.')) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.contractor = null;
    j.contractorEmail = null;
    j.status = 'feed';
    saveJobs(jobs);
    render();
  }

  // A customer's cancellation request on an already-allocated job needs
  // admin sign-off — the contractor is mid-engagement and shouldn't have
  // work pulled out from under them by a self-service button.
  function approveCancellation(id) {
    if (!confirm('Approve this cancellation? The job will be marked cancelled and removed from the contractor\'s active jobs.')) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.status = 'cancelled';
    j.cancellationApprovedAt = new Date().toISOString();
    saveJobs(jobs);
    render();
  }

  function rejectCancellation(id) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.status = 'assigned';
    j.cancellationRequestRejectedAt = new Date().toISOString();
    saveJobs(jobs);
    render();
  }

  function toggleEditJob() {
    const wrap = document.getElementById('editJobWrap');
    if (wrap.innerHTML) { wrap.innerHTML = ''; return; }
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    wrap.innerHTML = `
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--paper);">
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">Suburb</div>
        <input type="text" id="editSuburb" value="${escapeHtml(j.suburb || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">Address</div>
        <input type="text" id="editAddress" value="${escapeHtml(j.address || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">On site / access</div>
        <input type="text" id="editSite" value="${escapeHtml(j.site || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">Urgency</div>
        <input type="text" id="editUrgency" value="${escapeHtml(j.urgency || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />
        <button class="btn btn-black" onclick="saveEditJob('${j.id}')">Save changes</button>
      </div>`;
  }

  function saveEditJob(id) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.suburb = document.getElementById('editSuburb').value.trim();
    j.address = document.getElementById('editAddress').value.trim();
    j.site = document.getElementById('editSite').value.trim();
    j.urgency = document.getElementById('editUrgency').value.trim();
    saveJobs(jobs);
    document.getElementById('editJobWrap').innerHTML = `<div style="font-size:12px;color:var(--good);margin-top:10px;">✓ Saved.</div>`;
  }

  checkAdminAuth();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
