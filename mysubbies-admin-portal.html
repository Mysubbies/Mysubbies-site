  .rc-min-row { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .rc-min-label { font-size:11.5px; font-weight:600; color:var(--stone); white-space:nowrap; }
  .rc-min-hint { font-size:11px; color:var(--stone-light); }
  .rc-new-task { margin-top:10px; padding:12px; background:#fff; border:1px dashed var(--line); border-radius:10px; }
  .rc-new-task-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--stone); margin-bottom:8px; }
  .rc-photo-wrap { position:relative; flex-shrink:0; width:40px; height:40px; }
  .rc-photo-thumb { width:40px; height:40px; border-radius:8px; object-fit:cover; cursor:pointer; display:block; border:1px solid var(--line); }
  .rc-photo-add { width:40px; height:40px; border-radius:8px; border:1.5px dashed var(--line); background:#fff; color:var(--stone-light); font-size:15px; cursor:pointer; display:grid; place-items:center; }
  .rc-photo-add:hover { border-color:var(--stone-light); color:var(--stone); }
  .rc-photo-remove { position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--warn); font-size:9px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0; }
  /* Explicit Save per row (Aug 2026) -- name/unit/rate/notes used to
     commit silently on blur; this button is now the only thing that
     writes anything, and its own enabled/dirty state is the confirmation
     that there's a real pending change to save. */
  .rc-save-btn { font-size:11.5px; font-weight:600; padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--stone-light); cursor:not-allowed; white-space:nowrap; }
  .rc-save-btn:disabled { opacity:.6; }
  @media (max-width:760px) {
    .rc-cat-head { align-items:flex-start; flex-wrap:wrap; }
    .rc-cat-toggle { width:100%; flex-basis:100%; }
    .rc-cat-actions { width:100%; justify-content:flex-start; padding-left:64px; }
    .rc-category-editor, .rc-add-category-grid { grid-template-columns:1fr; }
    .rc-category-photo-panel { grid-column:auto; }
    .rc-task-labels { display:none; }
  }
  .rc-save-btn.rc-save-dirty { background:var(--black); border-color:var(--black); color:#fff; cursor:pointer; }
  .rc-saved-msg { font-size:11.5px; font-weight:600; color:var(--good); white-space:nowrap; }
  .msgbox { border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; background:#fff; max-width:520px; }
  .msgbox h3 { font-size:14px; margin-bottom:12px; }
  .msglist { max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .msgbubble { max-width:80%; padding:9px 12px; border-radius:12px; font-size:13px; }
  .msgbubble.mine { align-self:flex-end; background:var(--black); color:#fff; }
  .msgbubble.theirs { align-self:flex-start; background:var(--paper); color:var(--ink); }
  .msgmeta { font-size:10px; color:var(--stone-light); margin-bottom:2px; }
  .msginput { display:flex; gap:8px; }
  .msginput input { flex:1; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:9px 12px; }
  .reassign { display:flex; gap:8px; margin-top:16px; }
  .reassign input { flex:1; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:9px 12px; }
  /* Mobile bottom tab bar (Sep 2026) -- same pattern as
     mysubbies-website.html's .mobile-tabbar (own copy per this project's
     self-contained-page convention). Admin has 9 top tabs, too many for a
     5-item bottom bar -- these are the 5 most time-sensitive for a quick
     mobile check (jobs, pending applications, unread messages, open
     disputes, reports); the rest stay reachable from the existing top-tab
     row, which is still visible/scrollable above this. */
  .mobile-tabbar { display:none; }
  @media (max-width:860px) {
    .mobile-tabbar {
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:70;
      background:#fff; border-top:1px solid var(--line);
      padding:8px 4px calc(10px + env(safe-area-inset-bottom));
      box-shadow:0 -4px 16px rgba(0,0,0,0.06);

    .tab-item { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--stone); font-size:9.5px; font-weight:700; background:none; border:none; cursor:pointer; font-family:inherit; padding-top:2px; }
    .tab-item.active { color:var(--black); }

    .tab-item .notif-badge { top:-4px; right:16px; }
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  }

<script>
  // Real server-side auth (Aug 2026) -- the password used to be a hardcoded
  // client-side JS constant compared in the browser, and none of the admin
  // API endpoints checked anything at all, so anyone who found those URLs
  // could call them directly with no credential. Login now goes through
  // api/admin-account.js (action:'login'), which checks the password
  // server-side against ADMIN_PASSWORD and returns a signed, expiring
  // session token (see api/_lib/adminAuth.js) that every admin-only
  // endpoint now verifies before acting.
  async function checkAdminAuth() {
    try {
      const session = await fetch('/api/admin-account', {
        method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'session' }),
      });
      if (session.ok) {
        document.body.classList.remove('logged-out');
        Promise.all([hydrateJobsFromServer(), hydrateApplicationsFromServer(), hydrateRateCardFromServer(), hydrateDisputesFromServer(), hydrateInquiriesFromServer()]).then(render);
        return;
      }
    } catch (e) { /* show login below */ }
    document.body.classList.add('logged-out');
    document.getElementById('app').innerHTML = `
      <div style="max-width:360px;margin:80px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;">
        <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">Admin login</h1>
        <input type="password" id="adminPasswordInput" placeholder="Password" style="width:100%;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;" onkeydown="if(event.key==='Enter') adminLogin()">
        <div id="adminLoginError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
        <button onclick="adminLogin()" style="width:100%;background:var(--black);color:#fff;border:none;border-radius:999px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;">Log in →</button>
      </div>`;
    // checkAdminAuth() renders the login form directly (not through
    // render()/renderInner()), so updateMobileTabbar() never runs on this
    // path -- without this call the bottom tab bar was left showing (and
    // its tabs non-functional) on top of the login screen.
    updateMobileTabbar();
  }
  async function adminLogin() {
    const val = document.getElementById('adminPasswordInput').value;
    try {
      const res = await fetch('/api/admin-account', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', password: val }) });
      const data = await res.json();
      if (!res.ok) { document.getElementById('adminLoginError').textContent = data.error || 'Incorrect password.'; return; }
      if (data.mfaRequired && data.challenge) {
        showAdminMfa(data.challenge);
        return;
      }
      document.getElementById('adminLoginError').textContent = 'Authenticator verification is required.';
      return;
    } catch (e) {
      document.getElementById('adminLoginError').textContent = 'Login failed — check your connection and try again.';
    }
  }
  function showAdminMfa(challenge) {
    document.getElementById('app').innerHTML = `
      <div style="max-width:360px;margin:80px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;">
        <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">Authenticator code</h1>
        <p style="font-size:13px;color:var(--stone);margin-bottom:14px;">Enter the 6-digit code from your authenticator app.</p>
        <input inputmode="numeric" autocomplete="one-time-code" maxlength="6" id="adminMfaInput" placeholder="000000" style="width:100%;font-size:20px;letter-spacing:8px;text-align:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;" onkeydown="if(event.key==='Enter') adminVerifyMfa()">
        <div id="adminMfaError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
        <button onclick="adminVerifyMfa()" style="width:100%;background:var(--black);color:#fff;border:none;border-radius:999px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;">Verify and log in →</button>
        <button onclick="checkAdminAuth()" style="width:100%;background:transparent;color:var(--stone);border:none;padding:12px;font-size:13px;cursor:pointer;">Use a different password</button>
      </div>`;
    window.adminMfaChallenge = challenge;
    document.getElementById('adminMfaInput').focus();
  }
  async function adminVerifyMfa() {
    const code = document.getElementById('adminMfaInput').value.replace(/\D/g, '');
    const error = document.getElementById('adminMfaError');
    if (code.length !== 6) { error.textContent = 'Enter the complete 6-digit code.'; return; }
    try {
      const res = await fetch('/api/admin-account', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'verifyMfa', challenge: window.adminMfaChallenge, code }) });
      const data = await res.json();
      if (!res.ok) { error.textContent = data.error || 'The authenticator code was not accepted.'; return; }
      document.body.classList.remove('logged-out');
      Promise.all([hydrateJobsFromServer(), hydrateApplicationsFromServer(), hydrateRateCardFromServer(), hydrateDisputesFromServer(), hydrateInquiriesFromServer()]).then(render);
    } catch (e) {
      error.textContent = 'Login failed — check your connection and try again.';
    }
  }
  async function adminLogout() {
    try {
      await fetch('/api/admin-account', {
        method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'logout' }),
      });
    } catch (e) { /* still return to the login screen */ }
    checkAdminAuth();
  }
  // Every admin-only API call goes through this instead of a bare fetch()
  // so the session token is always attached, and an expired/invalid token
  // (401) cleanly drops back to the login screen instead of the dashboard
  // silently failing to load data.
  async function adminFetch(url, opts) {
    const headers = Object.assign({}, (opts && opts.headers) || {});
    const res = await fetch(url, Object.assign({}, opts, { headers, credentials: 'same-origin' }));
    if (res.status === 401) checkAdminAuth();
    return res;
  }

  function getJobs() { return JSON.parse(localStorage.getItem('mysubbies_jobs') || '[]'); }
  function saveJobs(jobs) {
    // Sep 2026: a local caching failure (localStorage quota exceeded --
    // photos are the main size driver) must never block the real Supabase
    // sync below. Same fix as saveRateCard() elsewhere in this file.
    try {
      localStorage.setItem('mysubbies_jobs', JSON.stringify(jobs));
    } catch (e) {
      console.error('localStorage quota exceeded saving jobs:', e);
    }
    adminFetch('/api/sync-jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobs }) }).catch(() => {});
  }
  // Pulls every job from Supabase (admin sees everything) and merges into
  // localStorage, so All Jobs reflects work created on any device, not
  // just this admin browser. See api/get-jobs.js.
  async function hydrateJobsFromServer() {
    try {
      const res = await adminFetch('/api/get-jobs?all=1');
      if (!res.ok) return;
      const { jobs: remoteJobs } = await res.json();
      if (!Array.isArray(remoteJobs) || remoteJobs.length === 0) return;
      const localJobs = getJobs();
      const byId = new Map(localJobs.map(j => [j.id, j]));
      remoteJobs.forEach(rj => { if (rj && rj.id) byId.set(rj.id, rj); });
      localStorage.setItem('mysubbies_jobs', JSON.stringify(Array.from(byId.values())));
    } catch (e) { /* offline or first load — local data still works */ }
  }

  let tab = 'ceo';
  let selectedJobId = null;
  let jobSearchQuery = '';
  let selectedCustomerEmail = null;
  let selectedCustomerId = null;
  const app = document.getElementById('app');
  function setAdminTab(nextTab) { tab = nextTab; selectedJobId = null; selectedCustomerId = null; selectedCustomerEmail = null; render(); }
  function updateCrmNav() {
    document.querySelectorAll('#crmNav button').forEach(button => button.classList.toggle('active', button.dataset.tab === tab));
  }
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  function fmtCents(c) { return '$' + ((c || 0) / 100).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  // Mirrors api/quotes.js's STANDARD_QUOTE_TERMS.v1 (the server-side
  // source of truth, sent back on every quote GET) -- shown here only so
  // the admin sees the real terms text while drafting, before this quote
  // has been saved/issued and the server can return it. Never edited
  // client-side.
  const STANDARD_QUOTE_TERMS_V1 = 'This quote is valid until the expiry date shown above and may be withdrawn or revised after that date. Accepting this quote confirms you agree to the scope, pricing and payment terms described above. This document does not replace the MySubbies Platform Terms, which continue to apply in full -- see mysubbies-terms.html on the MySubbies website. Work is carried out by a vetted MySubbies contractor; any site-specific conditions discovered after acceptance may require a separate variation, which will always be agreed with you before proceeding.';

  // Same branded PDF helpers as mysubbies-customer-portal.html's Payment
  // Receipt / Statement of Account (copied verbatim, per the no-shared-JS
  // convention) -- used here for the Quote Builder's "Preview PDF".
  const PDF_NAVY = [20, 33, 61];
  const PDF_PAPER = [247, 247, 245];
  function gstBreakdown(totalIncGstCents) {
    const gstCents = Math.round((totalIncGstCents || 0) / 11);
    return { totalCents: totalIncGstCents || 0, gstCents, exGstCents: (totalIncGstCents || 0) - gstCents };
  }
  function pdfLetterhead(doc, { docType, docRef, dateStr, validUntil, legalName, abn }) {
    doc.setFillColor(...PDF_NAVY); doc.rect(0, 0, 210, 34, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(20);
    doc.text('MySubbies', 14, 16);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(200, 206, 220);
    doc.text(`${legalName}  ·  ABN ${abn}  ·  Melbourne, VIC`, 14, 23);
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text(docType, 196, 15, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(200, 206, 220);
    if (docRef) doc.text(docRef, 196, 21, { align: 'right' });
    doc.text(`Issued ${dateStr}`, 196, 27, { align: 'right' });
    if (validUntil) { doc.setTextColor(255, 106, 26); doc.setFont('helvetica', 'bold'); doc.text(`VALID UNTIL ${validUntil}`, 196, 32, { align: 'right' }); }
    doc.setTextColor(0, 0, 0);
  }
  function pdfFooter(doc, noteLine, legalName, abn) {
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      const h = doc.internal.pageSize.getHeight();
      doc.setDrawColor(230, 230, 227); doc.setLineWidth(0.2);
      doc.line(14, h - 18, 196, h - 18);
      doc.setFontSize(7.5); doc.setTextColor(140, 140, 138);
      doc.text(`${legalName} · ABN ${abn} · Melbourne, VIC`, 14, h - 12);
      doc.text(noteLine, 14, h - 8);
      doc.text(`Page ${i} of ${pageCount}`, 196, h - 8, { align: 'right' });
    }
  }
  function pdfTotalsBox(doc, y, { exGstCents, gstCents, totalCents }, totalLabel) {
    const boxX = 112, boxW = 84;
    doc.setFillColor(...PDF_NAVY); doc.roundedRect(boxX, y - 4, boxW, 29, 2, 2, 'F');
    doc.setFontSize(8.5); doc.setTextColor(210,216,229); doc.setFont('helvetica','normal');
    doc.text('Subtotal ex GST',boxX+6,y+2); doc.text(fmtCents(exGstCents),boxX+boxW-6,y+2,{align:'right'});
    doc.text('GST (10%)',boxX+6,y+8); doc.text(fmtCents(gstCents),boxX+boxW-6,y+8,{align:'right'});
    doc.setDrawColor(255,106,26); doc.setLineWidth(.7); doc.line(boxX+6,y+12,boxX+boxW-6,y+12);
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(255);
    doc.text((totalLabel || 'TOTAL INC GST').toUpperCase(),boxX+6,y+20); doc.text(fmtCents(totalCents),boxX+boxW-6,y+20,{align:'right'});
    doc.setTextColor(0, 0, 0); doc.setFont('helvetica', 'normal');
    return y + 24;
  }

    if (!category) { errBox.innerHTML = '<div class="error" style="margin-top:10px;">Enter a category name first.</div>'; return; }
    const validRows = researchRows.filter(r => r.task.trim() && r.unit.trim() && researchRowAvg(r) !== null);

    // form) that could create the duplicate tasks the founder reported.
    // Revive a tombstoned match, skip an already-active match (report it
    // rather than silently overwrite a price an admin may have since edited).
    let addedCount = 0, revivedCount = 0, skippedCount = 0;
    validRows.forEach(r => {
      const name = r.task.trim();
      const existing = cat.tasks.find(t => t.name.trim().toLowerCase() === name.toLowerCase());
      if (existing && !existing.deleted) { skippedCount++; return; }
      if (existing && existing.deleted) {

      if (t.rate === null) return;
      t.rate = Math.round(t.rate * (1 + pct / 100) * 100) / 100;
      count++;
    }));
    saveRateCard(categories);

    const log = getBulkHistory();
    log.unshift({ pct, taskCount: count, appliedAt: new Date().toISOString() });
    saveBulkHistory(log);

    document.getElementById('bulkPct').value = '';
    render();
  }

  // Minimal CSV parser handling quoted fields with embedded commas.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i + 1];
      if (inQuotes) {
        if (ch === '"' && next === '"') { field += '"'; i++; }
        else if (ch === '"') { inQuotes = false; }
        else { field += ch; }
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ',') { row.push(field); field = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && next === '\n') i++;
          row.push(field); field = '';
          if (row.some(f => f !== '')) rows.push(row);
          row = [];
        } else { field += ch; }
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function onRateCardFileSelected(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const rows = parseCSV(ev.target.result);
      if (rows.length < 2) { document.getElementById('rcUploadPreview').innerHTML = '<div class="error" style="margin-top:12px;">That file doesn’t look right — no rows found.</div>'; return; }
      const header = rows[0].map(h => h.trim().toLowerCase());
      const idx = { category: header.indexOf('category'), task: header.indexOf('task'), unit: header.indexOf('unit'), rate: header.indexOf('rate'), notes: header.indexOf('notes') };
      if (idx.category === -1 || idx.task === -1 || idx.unit === -1 || idx.rate === -1) {
        document.getElementById('rcUploadPreview').innerHTML = '<div class="error" style="margin-top:12px;">Missing required columns. Expected: Category, Task, Unit, Rate (Notes optional).</div>';
        return;
      }
      const dataRows = rows.slice(1).filter(r => r[idx.category]);
      pendingUploadRows = dataRows.map(r => ({
        category: r[idx.category].trim(), task: r[idx.task].trim(), unit: r[idx.unit].trim(),
        rate: r[idx.rate].trim() === '' ? null : Number(r[idx.rate]),
        notes: idx.notes > -1 ? (r[idx.notes] || '').trim() : '',

      const uniqueCats = [...new Set(pendingUploadRows.map(r => r.category))];
      document.getElementById('rcUploadPreview').innerHTML = `

    if (!pendingUploadRows) return;

  // Mirrors the decision into the real `contractors` table (matched by
  // email) so a contractor logging in on a device that's never touched
  // this admin browser's localStorage still gets the right answer — see
  // api/update-contractor-status.js. Fire-and-forget, same pattern as
  // saveJobs()'s sync-jobs call.
  async function syncContractorStatus(email, status, reason) {
    const response = await adminFetch('/api/update-contractor-status', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, status, reason }),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Could not update application.');
    return result;
  }
  async function applyContractorDecision(id, status, reason) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    if (!a) return;
    try {
      await syncContractorStatus(a.email, status, reason);
      a.status = status;
      if (reason) a.reviewNotes = reason;
      saveApplications(apps);
      render();
    } catch (error) { alert(error.message); }
  }
  function approveApplication(id) { applyContractorDecision(id, 'approved'); }
  function requestMoreInformation(id) {
    const reason = prompt('What information or documents are required? This will be included in the contractor email.');
    if (reason && reason.trim()) applyContractorDecision(id, 'manual_review', reason.trim());
  }
  function rejectApplication(id) {
    const reason = prompt('Why is this application being rejected? This will be included in the contractor email.');
    if (reason && reason.trim()) applyContractorDecision(id, 'rejected', reason.trim());
  }

  // Deactivate/reactivate/delete are post-approval account lifecycle
  // actions (distinct from the approve/reject application-review decision
  // above) — routed through /api/admin-account so customers and
  // contractors share one endpoint and one confirm/error-handling pattern.
  async function deactivateContractor(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    const reason = prompt(`Why is ${a.business} being suspended? This reason will be sent to the contractor.`);
    if (!reason || !reason.trim()) return;
    const result = await accountAction('contractor', a.email, 'deactivate', `Suspend ${a.business}? They won't be able to log in or receive new jobs until reactivated.`, { reason: reason.trim() });
    if (!result) return;
    a.status = 'suspended';
    saveApplications(apps);
    render();
  }
  async function reactivateContractor(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    const result = await accountAction('contractor', a.email, 'reactivate', `Reactivate ${a.business}? They'll be able to log in and receive jobs again.`);
    if (!result) return;
    a.status = 'approved';
    saveApplications(apps);
    render();
  }
  async function deleteContractorAccount(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    const result = await accountAction('contractor', a.email, 'delete', `Permanently delete ${a.business}'s account? This can't be undone, and only works if they have no job history — otherwise use Deactivate.`);
    if (!result) return;
    saveApplications(apps.filter(x => x.id !== id));
    render();
  }

  // Job creation date wasn't shown anywhere in the table, which made it
  // impossible to see at a glance how long a job had been sitting awaiting
  // a contractor (founder ask, Aug 2026: "monitor how old the job is and
  // how long it's taking to allocate"). Falls back to parsing the
  // timestamp embedded in the job id (job_<ms>_<rand>) for older records
  // that predate the createdAt field, rather than showing a blank.
  function jobSubmittedText(j) {
    let ts = j.createdAt ? new Date(j.createdAt) : null;
    if (!ts || isNaN(ts.getTime())) {
      const m = /^job_(\d+)_/.exec(j.id || '');
      ts = m ? new Date(Number(m[1])) : null;
    }
    if (!ts || isNaN(ts.getTime())) return { date: '—', relative: '' };
    const days = Math.floor((Date.now() - ts.getTime()) / 86400000);
    const relative = days <= 0 ? 'Today' : days === 1 ? '1 day ago' : `${days} days ago`;
    return { date: ts.toLocaleDateString('en-AU'), relative };
  }

        <h1 class="pagetitle" style="margin-bottom:2px;">${j.icon || ''} ${escapeHtml(j.category)}</h1>
        <div style="color:var(--stone);font-size:13px;margin-bottom:16px;">${j.jobNumber ? `Job #${j.jobNumber} · ` : ''}${j.items && j.items.length > 1 ? j.items.length + ' items' : `${j.qty || ''} ${escapeHtml(j.unit || '')}`} · 📍 ${j.address ? escapeHtml(j.address) + ', ' : ''}${escapeHtml(j.suburb)}</div>

        ${j.items && j.items.length ? `
          <div style="border-top:1px solid var(--paper);border-bottom:1px solid var(--paper);padding:10px 0;margin-bottom:8px;">
            ${j.items.map(i => `
              <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;">
                <span>${i.catIcon || ''} ${escapeHtml(i.taskName)} <span style="color:var(--stone);">(${i.qty} ${escapeHtml(i.unit)})</span></span>
                <span style="font-weight:600;">${i.aiEstimated ? '~' : ''}$${i.base.toLocaleString()}</span>
              </div>
              ${i.aiEstimated ? `<div style="font-size:11.5px;font-weight:700;color:#D98E14;background:#FDF0D9;border-radius:6px;padding:4px 8px;margin-bottom:4px;">🤖 AI-estimated price — not from the rate card${i.typicalRange ? ' · range ' + escapeHtml(i.typicalRange) : ''} — confirm before dispatch</div>` : ''}
              ${i.notes ? `<div style="font-size:11.5px;color:var(--stone);margin-bottom:4px;">${escapeHtml(i.notes)}</div>` : ''}
            `).join('')}
          </div>
        ` : ''}

        <div class="row"><span class="l">Customer</span><span class="r">${escapeHtml(j.customerName || '—')}</span></div>
        ${j.jobType === 'business' ? `<div class="row"><span class="l">Invoice to</span><span class="r">${escapeHtml(j.businessName || '—')} (business)</span></div>` : ''}
        <div class="row"><span class="l">Phone</span><span class="r">${escapeHtml(j.customerPhone || '—')}</span></div>
        <div class="row"><span class="l">Contractor</span><span class="r">${escapeHtml(j.contractor || 'Unassigned')}</span></div>
        <div class="row"><span class="l">On site / access</span><span class="r">${escapeHtml(j.site || '—')} ${j.access ? '· ' + escapeHtml(j.access) : ''}</span></div>
        ${j.urgency ? `<div class="row"><span class="l">Urgency</span><span class="r">${escapeHtml(j.urgency)}</span></div>` : ''}
        <div class="row"><span class="l">Total job value</span><span class="r">$${(j.basePrice || 0).toLocaleString()}</span></div>
        <div class="row commission"><span class="l">Platform commission (18%)</span><span class="r">$${commission.toLocaleString()}</span></div>
        <div class="row payout"><span class="l">Contractor payout</span><span class="r">$${payout.toLocaleString()}</span></div>

        ${j.status === 'cancellation_requested' ? `
        <div style="background:#FFF6E5;border:1.5px solid #F0D89B;border-radius:12px;padding:14px;margin-top:14px;">
          <div style="font-weight:700;font-size:13.5px;color:#8A6D2E;margin-bottom:4px;">⚠ ${j.cancellationRequestedBy === 'contractor' ? 'Contractor' : 'Customer'} requested to cancel this job</div>
          ${j.cancellationReason ? `<div style="font-size:12.5px;color:var(--ink);margin-bottom:10px;">"${escapeHtml(j.cancellationReason)}"</div>` : ''}
          <div style="display:flex;gap:8px;">
            <button class="btn btn-black" style="flex:1;" onclick="approveCancellation('${j.id}')">Approve cancellation</button>
            <button class="btn btn-outline" style="flex:1;" onclick="rejectCancellation('${j.id}')">Reject — keep job active</button>
          </div>
        </div>` : ''}

        <div class="reassign">
          <select id="reassignSelect" style="flex:1;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;">
            <option value="">${j.contractor ? 'Reassign to…' : 'Assign to…'}</option>
            ${approvedContractorOptions(j)}
          </select>
          <button class="btn btn-black" onclick="reassign('${j.id}')">${j.contractor ? 'Reassign' : 'Assign'}</button>
          ${j.contractor ? `<button class="btn btn-outline" onclick="unassign('${j.id}')">Unassign</button>` : ''}
        </div>
        <button class="btn btn-outline" style="margin-top:10px;width:100%;" onclick="toggleEditJob()">Edit job details</button>
        <div id="editJobWrap"></div>
      </div>
      ${(j.beforePhotos && j.beforePhotos.length) || (j.afterPhotos && j.afterPhotos.length) ? `
        <div class="detailcard" style="margin-top:14px;">
          <h3 style="font-size:15px;margin-bottom:10px;">Before / after photos</h3>
          ${(j.beforePhotos && j.beforePhotos.length) ? `<div style="font-size:11px;color:var(--stone);margin-bottom:6px;">BEFORE</div><div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));gap:8px;margin-bottom:12px;">${j.beforePhotos.map(src => `<img src="${src}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);" />`).join('')}</div>` : ''}
          ${(j.afterPhotos && j.afterPhotos.length) ? `<div style="font-size:11px;color:var(--stone);margin-bottom:6px;">AFTER</div><div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));gap:8px;">${j.afterPhotos.map(src => `<img src="${src}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);" />`).join('')}</div>` : ''}
        </div>
      ` : ''}
      ${j.variations && j.variations.length ? `
        <div class="detailcard" style="margin-top:14px;">
          <h3 style="font-size:15px;margin-bottom:10px;">Variations</h3>
          ${variationListHtml(j)}
        </div>
      ` : ''}
      ${notifyBannerHtml()}
      <div class="msgbox">
        <h3>💬 Customer ↔ Contractor <span style="font-weight:400;color:var(--stone);">(visible to customer)</span></h3>
        <div class="msglist" id="msgListPublic"></div>
        <div class="msginput">
          <input type="text" id="msgInputPublic" placeholder="Reply in this thread…" onkeydown="if(event.key==='Enter') sendMsg('messages')" />
          <button class="btn btn-black" onclick="sendMsg('messages')">Send</button>
        </div>
      </div>
      <div class="msgbox">
        <h3>🔒 Admin ↔ Contractor <span style="font-weight:400;color:var(--stone);">(private — customer never sees this)</span></h3>
        <div class="msglist" id="msgListPrivate"></div>
        <div class="msginput">
          <input type="text" id="msgInputPrivate" placeholder="e.g. request a document…" onkeydown="if(event.key==='Enter') sendMsg('internalMessages')" />
          <button class="btn btn-black" onclick="sendMsg('internalMessages')">Send</button>
        </div>
      </div>
    `;
    renderThread(j, 'messages', 'msgListPublic');
    renderThread(j, 'internalMessages', 'msgListPrivate');
    wireNotifyButton();
  }

  function renderThread(j, key, listId) {
    const list = document.getElementById(listId);
    const msgs = j[key] || [];
    if (msgs.length === 0) { list.innerHTML = '<div style="font-size:12px;color:var(--stone-light);">No messages yet.</div>'; return; }
    list.innerHTML = msgs.map(m => `
      <div class="msgbubble ${m.from === 'admin' ? 'mine' : 'theirs'}">
        <div class="msgmeta">${m.from === 'admin' ? 'You (MySubbies)' : escapeHtml(m.authorName || m.from)}</div>
        ${escapeHtml(m.text)}
      </div>
    `).join('');
    list.scrollTop = list.scrollHeight;
  }

  function sendMsg(key) {
    const inputId = key === 'messages' ? 'msgInputPublic' : 'msgInputPrivate';
    const input = document.getElementById(inputId);
    const text = input.value.trim();
    if (!text) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    j[key] = j[key] || [];
    j[key].push({ id: 'm_' + Date.now(), from: 'admin', authorName: 'MySubbies support', text, createdAt: new Date().toISOString() });
    saveJobs(jobs);
    input.value = '';
    renderDetail();
  }

  function notifyBannerHtml() {
    if (!('Notification' in window) || Notification.permission !== 'default') return '';
    return `<div class="note" style="background:var(--paper);padding:10px 12px;border-radius:8px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--stone);"><span>Get a desktop alert on new messages (while this tab is open)</span><button id="notifyBtn" style="background:none;border:none;text-decoration:underline;font-size:12px;cursor:pointer;">Turn on</button></div>`;
  }
  function wireNotifyButton() {
    const btn = document.getElementById('notifyBtn');
    if (btn) btn.onclick = () => Notification.requestPermission().then(() => renderDetail());
  }
  function notify(text) {
    if ('Notification' in window && Notification.permission === 'granted') new Notification('MySubbies admin', { body: text });
  }
  let lastAdminMsgCounts = {};
  function checkForNewMessages() {
    getJobs().forEach(j => {
      ['messages', 'internalMessages'].forEach(key => {
        const arr = j[key] || [];
        const cacheKey = j.id + '_' + key;
        const last = arr[arr.length - 1];
        if (lastAdminMsgCounts[cacheKey] !== undefined && arr.length > lastAdminMsgCounts[cacheKey] && last && last.from !== 'admin') {
          notify(`${j.category} — ${last.authorName || last.from}: ${last.text}`);
        }
        lastAdminMsgCounts[cacheKey] = arr.length;
      });
    });
  }
  window.addEventListener('storage', (e) => {
    if (e.key === 'mysubbies_jobs') {
      checkForNewMessages();
      // An unrelated job update from another tab must never replace the
      // quote form while an admin is in the middle of typing.
      if (!quoteBuilderOpen) render();
    }
  });
  setInterval(checkForNewMessages, 3000);

  // checkForNewMessages() above only ever sees what's already sitting in
  // THIS browser's localStorage -- fine for job messages, since every
  // portal syncs those on every save. It's blind to anything that
  // originates purely server-side from a different device: a contractor's
  // reply, a new application, a cancellation request, a disputed
  // milestone. This is a real poll of the server every 25s, comparing the
  // same "how many things need my attention" total the Action required
  // panel already computes, and firing one real desktop notification when
  // it goes up. Disputes/inquiries are still localStorage-only (no
  // Supabase mirror -- a known, pre-existing gap) so they're read fresh
  // from local storage same as always, not actually re-fetched here.
  let lastKnownActionTotal = null;
  async function pollForNewActivity() {
    if (document.body.classList.contains('logged-out')) return; // not logged in yet -- nothing to poll for
    try {
      await Promise.all([hydrateJobsFromServer(), hydrateApplicationsFromServer(), hydrateDisputesFromServer(), hydrateInquiriesFromServer()]);
      const unreadRes = await adminFetch('/api/get-admin-list?type=unread-contractor-messages');
      const unreadData = await unreadRes.json();
      unreadContractorMessageCount = unreadData.contractorCount || 0;
      messageThreadsData = null; // cheap to invalidate -- reloads next time that tab is opened

      let milestoneCount = 0, scheduleCount = 0;
      try {
        const [mRes, sRes] = await Promise.all([
          adminFetch('/api/get-admin-list?type=milestone-claims'),
          adminFetch('/api/get-admin-list?type=pending-schedule-jobs'),
        ]);
        const [mData, sData] = await Promise.all([mRes.json(), sRes.json()]);
        milestoneCount = (mData.milestones || []).length;
        scheduleCount = (sData.schedules || []).length;
        if (paymentTabData) { paymentTabData.disputedMilestones = mData.milestones || []; paymentTabData.pendingScheduleJobs = sData.schedules || []; }
      } catch (e) { /* payment-schedule counts just won't update this cycle */ }

      const freshJobs = getJobs();
      const freshApps = getApplications();
      const cancellationCount = freshJobs.filter(j => j.status === 'cancellation_requested').length;
      const pendingAppCount = freshApps.filter(a => a.status === 'pending').length;
      const openDisputeCount = getDisputes().filter(d => d.status === 'open').length;
      const openInquiryCount = getInquiries().filter(i => i.status === 'open').length;
      const freshTotal = cancellationCount + openDisputeCount + openInquiryCount + pendingAppCount + unreadContractorMessageCount + milestoneCount + scheduleCount;

      if (lastKnownActionTotal !== null && freshTotal > lastKnownActionTotal) {
        const delta = freshTotal - lastKnownActionTotal;
        notify(`${delta} new item${delta === 1 ? '' : 's'} need${delta === 1 ? 's' : ''} your attention in MySubbies admin.`);
      }
      lastKnownActionTotal = freshTotal;
      render();
    } catch (e) { /* offline or transient -- next interval will catch up */ }
  }
  setInterval(pollForNewActivity, 25000);
  pollForNewActivity();

  // ---- Notification center (bell icon + panel, Sep 2026) ----
  // See mysubbies-customer-portal.html for the matching implementation and
  // comments (self-contained convention, no shared JS file). Separate from
  // pollForNewActivity() above -- that one aggregates several existing
  // localStorage/API sources into one "action required" count + desktop
  // popup; this one is the real persistent inbox (api/notifications.js,
  // supabase/schema_v13_notifications.sql) a bell icon reads. Admin's
  // GET/markRead calls go through adminFetch since this role's feed is
  // bearer-token gated (role=admin has no email to scope by).
  let notifPanelOpen = false;
  let notifItems = [];
  let notifUnreadCount = 0;
  async function pollNotifications() {
    if (document.body.classList.contains('logged-out')) return;
    try {
      const res = await adminFetch('/api/notifications?role=admin');
      if (!res.ok) return;
      const data = await res.json();
      notifItems = data.notifications || [];
      notifUnreadCount = data.unreadCount || 0;
      renderNotifBadge();
      if (notifPanelOpen) renderNotifPanel();
    } catch (e) { /* offline -- badge just stays as last known */ }
  }
  function renderNotifBadge() {
    const badge = document.getElementById('notifBadge');
    if (!badge) return;
    if (notifUnreadCount > 0) { badge.textContent = notifUnreadCount > 9 ? '9+' : notifUnreadCount; badge.style.display = 'flex'; }
    else { badge.style.display = 'none'; }
  }
  function toggleNotifPanel() {
    notifPanelOpen = !notifPanelOpen;
    const panel = document.getElementById('notifPanel');
    if (!panel) return;
    if (notifPanelOpen) { panel.style.display = 'block'; renderNotifPanel(); }
    else { panel.style.display = 'none'; }
  }
  function renderNotifPanel() {
    const panel = document.getElementById('notifPanel');
    if (!panel) return;
    panel.innerHTML = `
      <div class="notif-panel-header">
        <span>Notifications</span>
        ${notifUnreadCount > 0 ? `<a onclick="markAllNotifsRead()">Mark all read</a>` : ''}
      </div>
      ${notifItems.length === 0 ? `<div class="notif-empty">No notifications yet.</div>` : notifItems.map(n => `
        <button type="button" class="notif-item ${!n.readAt ? 'unread' : ''}" onclick="openNotif('${n.id}', '${n.eventType}', ${n.linkJobId ? `'${n.linkJobId}'` : 'null'})">
          <div class="notif-item-title">${escapeHtml(n.title)}</div>
          <div class="notif-item-body">${escapeHtml(n.body)}</div>
          <div class="notif-item-time">${new Date(n.createdAt).toLocaleString('en-AU')}</div>
        </button>
      `).join('')}
    `;
  }
  function markAllNotifsRead() {
    adminFetch('/api/notifications', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'markAllRead', role: 'admin' }) }).catch(() => {});
    const now = new Date().toISOString();
    notifItems.forEach(n => { n.readAt = n.readAt || now; });
    notifUnreadCount = 0;
    renderNotifBadge();
    renderNotifPanel();
  }
  function openNotif(id, eventType, jobId) {
    adminFetch('/api/notifications', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'markRead', id, role: 'admin' }) }).catch(() => {});
    const item = notifItems.find(n => n.id === id);
    if (item && !item.readAt) { item.readAt = new Date().toISOString(); notifUnreadCount = Math.max(0, notifUnreadCount - 1); }
    renderNotifBadge();
    toggleNotifPanel();
    if (jobId) { selectedJobId = jobId; render(); }
    else if (eventType === 'contractor-application-submitted') { tab = 'applications'; render(); }
  }
  document.addEventListener('click', (e) => {
    if (notifPanelOpen && !e.target.closest('.notif-panel') && !e.target.closest('.navlink-bell')) {
      notifPanelOpen = false;
      const p = document.getElementById('notifPanel');
      if (p) p.style.display = 'none';
    }
  });
  setInterval(pollNotifications, 25000);
  pollNotifications();

  // Approved contractors first (and ones covering this job's category
  // floated to the top), so reassigning is a pick-from-list action instead
  // of retyping a business name — which also fixes a real gap where the
  // old free-text "Assign" never set contractorEmail, so the job never
  // synced to that contractor's own device (see api/sync-jobs.js).
  function approvedContractorOptions(j) {
    const eligible = getApplications().filter(a => ['approved', 'preferred'].includes(a.status) && a.email !== (j.contractorEmail || ''));
    eligible.sort((a, b) => {
      const aMatch = toArr(a.trades).includes(j.category) ? 0 : 1;
      const bMatch = toArr(b.trades).includes(j.category) ? 0 : 1;
      return aMatch - bMatch || (a.business || '').localeCompare(b.business || '');
    });
    return eligible.map(a => `<option value="${escapeHtml(a.email)}" data-name="${escapeHtml(a.business)}">${escapeHtml(a.business)}${toArr(a.trades).includes(j.category) ? ' ✓ ' + escapeHtml(j.category) : ''}</option>`).join('');
  }

  function reassign(id) {
    const select = document.getElementById('reassignSelect');
    const email = select.value;
    if (!email) return;
    const name = select.selectedOptions[0].getAttribute('data-name');
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.contractor = name;
    j.contractorEmail = email;
    j.status = 'assigned';
    saveJobs(jobs);
    render();
  }

  function unassign(id) {
    if (!confirm('Unassign this job? It will go back to the open feed for matching contractors.')) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.contractor = null;
    j.contractorEmail = null;
    j.status = 'feed';
    saveJobs(jobs);
    render();
  }

  // A customer's cancellation request on an already-allocated job needs
  // admin sign-off — the contractor is mid-engagement and shouldn't have
  // work pulled out from under them by a self-service button.
  // Real Stripe refund (Sept 2026) -- 90% of the deposit unless a later
  // stage (materials onward) has already been paid, in which case the
  // server takes no automated action and this just tells the admin to
  // assess the actual cost manually. See api/process-cancellation-refund.js
  // for the full policy and the server-side eligibility check (never
  // trusts this client's payment-state read, only uses it to preview the
  // outcome before confirming).
  async function approveCancellation(id) {
    if (!confirm('Approve this cancellation? If no stage beyond the deposit has been paid, 90% of the deposit will be refunded automatically (10% retained as a cancellation fee). The job will be marked cancelled and removed from the contractor\'s active jobs.')) return;
    try {
      const resp = await adminFetch('/api/process-cancellation-refund', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'admin-approve-cancellation', jobId: id, adminActorEmail: 'admin' }),
      });
      const data = await resp.json();
      if (!resp.ok) { alert(data.error || 'Could not process this cancellation.'); return; }
      if (data.caseByCase) {
        // The job is still cancelled either way (see api/process-cancellation-refund.js) --
        // only the automatic refund itself didn't happen, for one of a few reasons.
        if (data.reason === 'later_stage_paid') {
          alert('Job cancelled. A later payment stage had already been paid, so no automatic refund was issued -- assess the actual cost incurred and process a manual refund via the Stripe dashboard.');
        } else if (data.reason === 'refund_failed' || data.reason === 'no_payment_record') {
          alert(`Job cancelled, but the deposit could not be refunded automatically (${data.refundError || 'unknown error'}). This can happen for a deposit paid before the site switched to live payments. Please check whether a manual refund is owed and process it via the Stripe dashboard.`);
        } else {
          alert('Job cancelled. No automatic refund was issued -- please check whether a manual refund is owed.');
        }
      } else {
        alert(`Job cancelled and refunded $${(data.amountCents / 100).toFixed(2)} to the customer.`);
      }
    } catch (e) { alert('Could not reach the server to process this cancellation.'); return; }
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.status = 'cancelled';
    j.cancellationApprovedAt = new Date().toISOString();
    saveJobs(jobs);
    render();
  }

  function rejectCancellation(id) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.status = 'assigned';
    j.cancellationRequestRejectedAt = new Date().toISOString();
    saveJobs(jobs);
    render();
  }

  // Direct admin cancel (Aug 2026) -- approveCancellation() above only
  // fires once a customer or contractor has already requested one; this is
  // for admin proactively cancelling a job on their own initiative (e.g.
  // a job that's clearly gone stale), callable straight from the listing
  // row rather than needing to open the job first. event.stopPropagation()
  // keeps this from also triggering the row's own onclick (open job detail).
  function adminCancelJob(id, event) {
    if (event) event.stopPropagation();
    if (!confirm('Cancel this job? This can\'t be undone.')) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    if (!j) return;
    j.status = 'cancelled';
    j.cancelledByAdminAt = new Date().toISOString();
    saveJobs(jobs);
    render();
  }

  function toggleEditJob() {
    const wrap = document.getElementById('editJobWrap');
    if (wrap.innerHTML) { wrap.innerHTML = ''; return; }
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    wrap.innerHTML = `
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--paper);">
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">Suburb</div>
        <input type="text" id="editSuburb" value="${escapeHtml(j.suburb || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">Address</div>
        <input type="text" id="editAddress" value="${escapeHtml(j.address || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">On site / access</div>
        <input type="text" id="editSite" value="${escapeHtml(j.site || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">Urgency</div>
        <input type="text" id="editUrgency" value="${escapeHtml(j.urgency || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />
        <button class="btn btn-black" onclick="saveEditJob('${j.id}')">Save changes</button>
      </div>`;
  }

  function saveEditJob(id) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.suburb = document.getElementById('editSuburb').value.trim();
    j.address = document.getElementById('editAddress').value.trim();
    j.site = document.getElementById('editSite').value.trim();
    j.urgency = document.getElementById('editUrgency').value.trim();
    saveJobs(jobs);
    document.getElementById('editJobWrap').innerHTML = `<div style="font-size:12px;color:var(--good);margin-top:10px;">✓ Saved.</div>`;
  }

  checkAdminAuth();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
