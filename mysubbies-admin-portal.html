<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MySubbies — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Navy/gold reskin (Aug 2026), Stage 2 -- see CLAUDE.md and
       mysubbies-website.html's :root for the source of this palette. Every
       existing var(--black)/var(--ink) usage cascades automatically. */
    --ink: #151A26; --black: #14213D; --white: #FFFFFF; --paper: #F7F7F5;
    --stone: #6B7280; --stone-light: #9CA3AF; --line: #E7E7E4; --good: #2F7A50; --warn: #B0592E;
    --accent: #F5A623; --accent-dark: #D98E14; --accent-pale: #FDF0D9;
    --primary-light: #1F335A; --primary-pale: #E7EAF1;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1, h2 { font-weight:800; letter-spacing:-0.02em; }
  a { color:inherit; text-decoration:none; }
  header { background: #fff; border-bottom:1px solid var(--line); }
  .navwrap { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { display:flex; align-items:center; gap:9px; }
  .logo-word { font-weight:800; font-size:19px; color:var(--black); }
  .logo-word .gold { color:var(--accent); }
  .navlinks { display:flex; align-items:center; gap:22px; font-size:13px; }
  @media (max-width:460px) { .navwrap { padding:0 14px; } .navlinks { gap:9px; font-size:11px; } .navlinks a.hide-mobile { display:none; } }
  .navlinks a { color:var(--stone); }
  .navlinks a.current { color:var(--black); font-weight:600; }
  .navlink-refresh { display:flex; align-items:center; cursor:pointer; color:var(--stone); }
  .navlink-refresh:hover { color:var(--black); }
  .navlink-refresh svg.spinning { animation:navlink-refresh-spin 0.8s linear infinite; }
  @keyframes navlink-refresh-spin { to { transform:rotate(360deg); } }
  .wrap { max-width:880px; margin:0 auto; padding:32px 24px 80px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
  .btn-black { background:var(--black); color:#fff; }
  .btn-outline { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn-danger { background:#fff; color:#B4232C; border:1.5px solid #F2C9C6; }
  .btn-danger:hover { background:#FDF3F2; }
  .searchbox { width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; color:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; outline:none; background:#fff; margin-bottom:16px; }
  .searchbox:focus { border-color:var(--black); }
  .badge-active { background:#EAF5EE; color:var(--good); }
  .badge-deactivated { background:#FDEDEA; color:var(--warn); }
  .statgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
  @media (max-width:700px) { .statgrid { grid-template-columns:1fr 1fr; } }
  .statcard { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .statcard .num { font-size:24px; font-weight:800; }
  .statcard .lab { font-size:12px; color:var(--stone); margin-top:2px; }
  .tabs { display:flex; gap:6px; background:#EFEDE9; padding:4px; border-radius:10px; margin-bottom:24px; width:fit-content; }
  .tabs button { padding:9px 16px; border-radius:7px; font-size:13px; font-weight:600; border:none; cursor:pointer; background:transparent; color:var(--stone); }
  .tabs button.active { background:#fff; color:var(--ink); }
  h1.pagetitle { font-size:22px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--stone); padding:12px 16px; background:var(--paper); }
  td { padding:14px 16px; font-size:13px; border-top:1px solid var(--paper); }
  tr.jobrow { cursor:pointer; }
  tr.jobrow:hover { background:var(--paper); }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-block; }
  .badge-feed { background:#FFF6E5; color:#8A6D2E; }
  .badge-assigned { background:#E9F1F9; color:#2E5E8A; }
  .badge-completed { background:#EAF5EE; color:var(--good); }
  .badge-rejected { background:#FDEDEA; color:var(--warn); }
  .empty { text-align:center; padding:60px 20px; color:var(--stone); font-size:14px; }
  .backbtn { font-size:13px; color:var(--stone); background:none; border:none; cursor:pointer; margin-bottom:16px; display:flex; align-items:center; gap:4px; }
  .detailcard { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; max-width:520px; }
  .row { display:flex; justify-content:space-between; font-size:14px; padding:9px 0; border-top:1px solid var(--paper); }
  .row:first-child { border-top:none; }
  .row .l { color:var(--stone); }
  .row .r { font-weight:700; }
  .row.commission .r { color:var(--warn); }
  .row.payout .r { color:var(--good); font-size:16px; }
  img.jobphoto { width:100%; border-radius:12px; margin-bottom:16px; max-height:200px; object-fit:cover; }

  /* Rate card — Manage Existing (Aug 2026 redesign). 21 categories x ~163
     tasks always fully expanded was the actual cause of the "messy, hard
     to operate" feeling (founder report) -- collapsed-by-default category
     rows fix that; everything below just keeps each open category's
     content readable rather than a wall of identical input rows. */
  .rc-cat-list { border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .rc-cat { border-bottom:1px solid var(--line); }
  .rc-cat:last-child { border-bottom:none; }
  .rc-cat-head { width:100%; display:flex; align-items:center; gap:10px; padding:13px 16px; background:#fff; border:none; cursor:pointer; text-align:left; font-family:inherit; }
  .rc-cat-head:hover { background:var(--paper); }
  .rc-cat-chevron { display:inline-block; color:var(--stone-light); font-size:16px; transition:transform .15s ease; flex-shrink:0; }
  .rc-cat-open .rc-cat-chevron { transform:rotate(90deg); }
  .rc-cat-icon { flex-shrink:0; }
  .rc-cat-name { flex:1; font-size:13.5px; font-weight:700; color:var(--ink); }
  .rc-cat-count { font-size:11.5px; color:var(--stone); white-space:nowrap; }
  .rc-cat-delete-btn { flex-shrink:0; font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid #F6D9D2; background:#fff; color:var(--warn); cursor:pointer; white-space:nowrap; }
  .rc-cat-delete-btn:hover { background:#FDEDEA; border-color:var(--warn); }
  .rc-cat-body { background:var(--paper); padding:12px 16px 16px; }
  .rc-task { padding:10px 0; border-top:1px solid var(--line); }
  .rc-cat-body .rc-task:first-child { border-top:none; padding-top:2px; }
  .rc-task-held { background:#FDEDEA; margin:0 -16px; padding:10px 16px; border-top-color:#F6D9D2; }
  .rc-task-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .rc-input { font-size:12.5px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; font-family:inherit; background:#fff; }
  .rc-input-name { flex:1; min-width:160px; }
  .rc-input-unit { width:64px; }
  .rc-input-rate-wrap { display:flex; align-items:center; border:1px solid var(--line); border-radius:7px; background:#fff; overflow:hidden; }
  .rc-dollar { font-size:12px; color:var(--stone); padding:0 0 0 9px; }
  .rc-input-rate { width:72px; border:none; border-radius:0; padding:7px 9px 7px 4px; }
  .rc-held-badge { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--warn); background:#FDEDEA; padding:4px 9px; border-radius:999px; white-space:nowrap; }
  .rc-hold-btn { font-size:11.5px; font-weight:600; padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--stone); cursor:pointer; white-space:nowrap; }
  .rc-hold-btn:hover { border-color:var(--stone-light); color:var(--ink); }
  .rc-delete-btn { font-size:11.5px; font-weight:600; padding:7px 13px; border-radius:999px; border:1px solid #F6D9D2; background:#fff; color:var(--warn); cursor:pointer; white-space:nowrap; }
  .rc-delete-btn:hover { background:#FDEDEA; border-color:var(--warn); }
  .rc-notes { width:100%; font-size:11.5px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; font-family:inherit; min-height:44px; resize:vertical; margin-top:6px; background:#fff; color:var(--stone); }
  /* Minimum charge (Sep 2026) -- minJobPrice already existed on nearly
     every task in the underlying data (the estimator has floored prices
     against it since the small-jobs pivot) but had no admin UI at all --
     it was only ever set by editing DEFAULT_CATEGORIES in code. This is
     its own labelled row (not crammed into the compact rate/unit row
     above) since it's real money data, not a minor field. */
  .rc-min-row { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .rc-min-label { font-size:11.5px; font-weight:600; color:var(--stone); white-space:nowrap; }
  .rc-min-hint { font-size:11px; color:var(--stone-light); }
  .rc-new-task { margin-top:10px; padding:12px; background:#fff; border:1px dashed var(--line); border-radius:10px; }
  .rc-new-task-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--stone); margin-bottom:8px; }
  .rc-photo-wrap { position:relative; flex-shrink:0; width:40px; height:40px; }
  .rc-photo-thumb { width:40px; height:40px; border-radius:8px; object-fit:cover; cursor:pointer; display:block; border:1px solid var(--line); }
  .rc-photo-add { width:40px; height:40px; border-radius:8px; border:1.5px dashed var(--line); background:#fff; color:var(--stone-light); font-size:15px; cursor:pointer; display:grid; place-items:center; }
  .rc-photo-add:hover { border-color:var(--stone-light); color:var(--stone); }
  .rc-photo-remove { position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--warn); font-size:9px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0; }
  /* Explicit Save per row (Aug 2026) -- name/unit/rate/notes used to
     commit silently on blur; this button is now the only thing that
     writes anything, and its own enabled/dirty state is the confirmation
     that there's a real pending change to save. */
  .rc-save-btn { font-size:11.5px; font-weight:600; padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--stone-light); cursor:not-allowed; white-space:nowrap; }
  .rc-save-btn:disabled { opacity:.6; }
  .rc-save-btn.rc-save-dirty { background:var(--black); border-color:var(--black); color:#fff; cursor:pointer; }
  .rc-saved-msg { font-size:11.5px; font-weight:600; color:var(--good); white-space:nowrap; }
  .msgbox { border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; background:#fff; max-width:520px; }
  .msgbox h3 { font-size:14px; margin-bottom:12px; }
  .msglist { max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .msgbubble { max-width:80%; padding:9px 12px; border-radius:12px; font-size:13px; }
  .msgbubble.mine { align-self:flex-end; background:var(--black); color:#fff; }
  .msgbubble.theirs { align-self:flex-start; background:var(--paper); color:var(--ink); }
  .msgmeta { font-size:10px; color:var(--stone-light); margin-bottom:2px; }
  .msginput { display:flex; gap:8px; }
  .msginput input { flex:1; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:9px 12px; }
  .reassign { display:flex; gap:8px; margin-top:16px; }
  .reassign input { flex:1; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:9px 12px; }
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MySubbies">
</head>
<body>

<header>
  <div class="navwrap">
    <div class="logo">
      
      <div class="logo-word">My<span class="gold">Subbies</span></div>
    </div>
    <div class="navlinks">
      <a class="navlink-refresh" id="refreshLink" onclick="manualRefresh()" title="Refresh"><svg id="refreshIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></a>
      <a class="current" href="mysubbies-admin-portal.html">Admin</a>
      <a onclick="adminLogout()" style="cursor:pointer;">Log out</a>
    </div>
  </div>
</header>

<div class="wrap" id="app"></div>

<script>
  // Real server-side auth (Aug 2026) -- the password used to be a hardcoded
  // client-side JS constant compared in the browser, and none of the admin
  // API endpoints checked anything at all, so anyone who found those URLs
  // could call them directly with no credential. Login now goes through
  // api/admin-account.js (action:'login'), which checks the password
  // server-side against ADMIN_PASSWORD and returns a signed, expiring
  // session token (see api/_lib/adminAuth.js) that every admin-only
  // endpoint now verifies before acting.
  function checkAdminAuth() {
    if (localStorage.getItem('mysubbies_admin_token')) { Promise.all([hydrateJobsFromServer(), hydrateApplicationsFromServer(), hydrateRateCardFromServer()]).then(render); return; }
    document.getElementById('app').innerHTML = `
      <div style="max-width:360px;margin:80px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;">
        <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">Admin login</h1>
        <input type="password" id="adminPasswordInput" placeholder="Password" style="width:100%;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;" onkeydown="if(event.key==='Enter') adminLogin()">
        <div id="adminLoginError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
        <button onclick="adminLogin()" style="width:100%;background:var(--black);color:#fff;border:none;border-radius:999px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;">Log in →</button>
      </div>`;
  }
  async function adminLogin() {
    const val = document.getElementById('adminPasswordInput').value;
    try {
      const res = await fetch('/api/admin-account', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', password: val }) });
      const data = await res.json();
      if (!res.ok) { document.getElementById('adminLoginError').textContent = data.error || 'Incorrect password.'; return; }
      localStorage.setItem('mysubbies_admin_token', data.token);
      Promise.all([hydrateJobsFromServer(), hydrateApplicationsFromServer(), hydrateRateCardFromServer()]).then(render);
    } catch (e) {
      document.getElementById('adminLoginError').textContent = 'Login failed — check your connection and try again.';
    }
  }
  function adminLogout() {
    localStorage.removeItem('mysubbies_admin_token');
    checkAdminAuth();
  }
  // Every admin-only API call goes through this instead of a bare fetch()
  // so the session token is always attached, and an expired/invalid token
  // (401) cleanly drops back to the login screen instead of the dashboard
  // silently failing to load data.
  async function adminFetch(url, opts) {
    const token = localStorage.getItem('mysubbies_admin_token');
    const headers = Object.assign({}, (opts && opts.headers) || {}, token ? { Authorization: 'Bearer ' + token } : {});
    const res = await fetch(url, Object.assign({}, opts, { headers }));
    if (res.status === 401) { localStorage.removeItem('mysubbies_admin_token'); checkAdminAuth(); }
    return res;
  }

  function getJobs() { return JSON.parse(localStorage.getItem('mysubbies_jobs') || '[]'); }
  function saveJobs(jobs) {
    localStorage.setItem('mysubbies_jobs', JSON.stringify(jobs));
    fetch('/api/sync-jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobs }) }).catch(() => {});
  }
  // Pulls every job from Supabase (admin sees everything) and merges into
  // localStorage, so All Jobs reflects work created on any device, not
  // just this admin browser. See api/get-jobs.js.
  async function hydrateJobsFromServer() {
    try {
      const res = await adminFetch('/api/get-jobs?all=1');
      if (!res.ok) return;
      const { jobs: remoteJobs } = await res.json();
      if (!Array.isArray(remoteJobs) || remoteJobs.length === 0) return;
      const localJobs = getJobs();
      const byId = new Map(localJobs.map(j => [j.id, j]));
      remoteJobs.forEach(rj => { if (rj && rj.id) byId.set(rj.id, rj); });
      localStorage.setItem('mysubbies_jobs', JSON.stringify(Array.from(byId.values())));
    } catch (e) { /* offline or first load — local data still works */ }
  }

  let tab = 'overview';
  let selectedJobId = null;
  let jobSearchQuery = '';
  const app = document.getElementById('app');
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // "All Jobs" used to be one long mixed list (everything from awaiting-
  // contractor through cancelled, in creation order) with a single archive
  // toggle just for cancelled -- founder feedback (Aug 2026) was that this
  // gets hard to manage as job count grows. Replaced with status filter
  // chips, defaulting to the most actionable bucket (jobs still waiting to
  // be matched) rather than the full mixed list.
  const JOB_STATUS_FILTERS = [
    { key: 'all', label: 'All' },
    { key: 'feed', label: 'Awaiting contractor' },
    { key: 'assigned', label: 'Assigned' },
    { key: 'cancellation_requested', label: 'Cancellation requested' },
    { key: 'completed', label: 'Completed' },
    { key: 'cancelled', label: 'Cancelled' },
  ];
  let jobStatusFilter = 'feed';
  function jobStatusFilterChipsHtml(jobs) {
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${JOB_STATUS_FILTERS.map(f => {
        const count = f.key === 'all' ? jobs.length : jobs.filter(j => j.status === f.key).length;
        const active = jobStatusFilter === f.key;
        return `<button onclick="jobStatusFilter='${f.key}'; render();" style="padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid ${active ? 'var(--ink)' : 'var(--line)'};background:${active ? 'var(--ink)' : '#fff'};color:${active ? '#fff' : 'var(--ink)'};cursor:pointer;">${f.label} (${count})</button>`;
      }).join('')}
    </div>`;
  }

  // Same status-filter-chip treatment applied to Applications, Customers,
  // Disputes and Inquiries (Aug 2026) -- Applications' status set varies
  // (pending/approved/suspended/rejected are the common ones, but a few
  // legacy values exist too), so its chips are generated dynamically from
  // whatever statuses actually appear in the data rather than a fixed
  // list. Customers/Disputes/Inquiries are simple two-state sets, so they
  // share one small helper instead of three near-identical ones.
  let applicationsStatusFilter = 'all';
  function applicationsStatusFilterChipsHtml(applications) {
    const presentStatuses = Array.from(new Set(applications.map(a => a.status)));
    const preferredOrder = ['pending', 'approved', 'suspended', 'rejected', 'manual_review', 'preferred', 'watchlist', 'expired_documents'];
    presentStatuses.sort((a, b) => preferredOrder.indexOf(a) - preferredOrder.indexOf(b));
    const options = [{ key: 'all', label: 'All' }, ...presentStatuses.map(s => ({ key: s, label: s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) }))];
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${options.map(f => {
        const count = f.key === 'all' ? applications.length : applications.filter(a => a.status === f.key).length;
        const active = applicationsStatusFilter === f.key;
        return `<button onclick="applicationsStatusFilter='${f.key}'; render();" style="padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid ${active ? 'var(--ink)' : 'var(--line)'};background:${active ? 'var(--ink)' : '#fff'};color:${active ? '#fff' : 'var(--ink)'};cursor:pointer;">${f.label} (${count})</button>`;
      }).join('')}
    </div>`;
  }

  // Admin -> contractor messaging (added Aug 2026) -- standalone from the
  // existing per-job internalMessages thread, no job involved. Select one
  // or many approved contractors from the Applications tab and send them
  // the same message (+ optional attachment, e.g. an updated rate card).
  // See api/admin-messages.js.
  let selectedContractorEmails = new Set();
  let showMessageComposer = false;
  let messageComposerSending = false;
  let messageAttachment = null; // { dataUrl, filename, mime } or null
  // Subject/body are plain uncontrolled inputs, but attaching a file (or any
  // other change) needs a full render() same as everywhere else in this
  // file -- that rebuilds the modal's innerHTML from scratch, which would
  // silently wipe whatever the admin had already typed. Drafted here and
  // synced on every keystroke, same "preserve state across a full re-render"
  // pattern already used for qtyValues/renderQtyRows() elsewhere in this
  // codebase, so it survives.
  let messageComposerSubjectDraft = '';
  let messageComposerBodyDraft = '';
  const MESSAGE_ATTACHMENT_MAX_BYTES = 4 * 1024 * 1024;

  function toggleContractorSelection(email) {
    if (selectedContractorEmails.has(email)) selectedContractorEmails.delete(email);
    else selectedContractorEmails.add(email);
    render();
  }
  function selectAllApprovedContractors(applications) {
    applications.filter(a => a.status === 'approved').forEach(a => selectedContractorEmails.add(a.email));
    render();
  }
  function clearContractorSelection() {
    selectedContractorEmails.clear();
    render();
  }
  function openMessageComposer() {
    showMessageComposer = true;
    messageComposerSubjectDraft = '';
    messageComposerBodyDraft = '';
    render();
    setTimeout(() => document.getElementById('msgComposerBody')?.focus(), 50);
  }
  function closeMessageComposer() {
    showMessageComposer = false;
    messageAttachment = null;
    messageComposerSubjectDraft = '';
    messageComposerBodyDraft = '';
    render();
  }
  function onMessageAttachmentSelected(event) {
    const file = (event.target.files || [])[0];
    event.target.value = '';
    if (!file) return;
    const errBox = document.getElementById('msgComposerError');
    if (file.size > MESSAGE_ATTACHMENT_MAX_BYTES) {
      if (errBox) { errBox.textContent = 'That file is too large — please use one under 4MB.'; errBox.style.display = 'block'; }
      return;
    }
    if (errBox) errBox.style.display = 'none';
    const reader = new FileReader();
    reader.onload = () => {
      messageAttachment = { dataUrl: reader.result, filename: file.name, mime: file.type || 'application/octet-stream' };
      render();
    };
    reader.readAsDataURL(file);
  }
  function removeMessageAttachment() {
    messageAttachment = null;
    render();
  }
  async function sendContractorMessage() {
    const subject = messageComposerSubjectDraft.trim();
    const body = messageComposerBodyDraft.trim();
    const errBox = document.getElementById('msgComposerError');
    if (!body) { errBox.textContent = 'Write a message before sending.'; errBox.style.display = 'block'; return; }
    errBox.style.display = 'none';
    messageComposerSending = true;
    render();
    try {
      const res = await adminFetch('/api/admin-messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'send',
          contractorEmails: Array.from(selectedContractorEmails),
          subject: subject || null, body,
          attachmentDataUrl: messageAttachment ? messageAttachment.dataUrl : null,
          attachmentFilename: messageAttachment ? messageAttachment.filename : null,
          attachmentMime: messageAttachment ? messageAttachment.mime : null,
        }),
      });
      if (!res.ok) throw new Error('send failed');
      showMessageComposer = false;
      messageAttachment = null;
      messageComposerSubjectDraft = '';
      messageComposerBodyDraft = '';
      selectedContractorEmails.clear();
    } catch (e) {
      errBox.textContent = 'Something went wrong sending that — please try again.';
      errBox.style.display = 'block';
    } finally {
      messageComposerSending = false;
      render();
    }
  }

  // Single-contractor conversation thread (added Aug 2026) -- distinct from
  // the broadcast composer above (that's one-way, multi-recipient, no
  // history shown). This is a real two-way thread with one contractor:
  // their replies (api/admin-messages.js action:'reply') show up here, and
  // admin can reply back in-thread by reusing the existing 'send' action
  // with a single-email array.
  let openContractorThreadEmail = null;
  let contractorThreadMessages = [];
  let contractorThreadLoading = false;
  let contractorThreadSending = false;
  function openContractorThread(email) {
    openContractorThreadEmail = email;
    contractorThreadMessages = [];
    contractorThreadLoading = true;
    render();
    loadContractorThread(email);
  }
  function closeContractorThread() {
    openContractorThreadEmail = null;
    contractorThreadMessages = [];
    render();
  }
  async function loadContractorThread(email) {
    try {
      const res = await fetch('/api/admin-messages?contractorEmail=' + encodeURIComponent(email));
      const data = await res.json();
      contractorThreadMessages = Array.isArray(data.messages) ? data.messages : [];
    } catch (e) {
      contractorThreadMessages = [];
    }
    contractorThreadLoading = false;
    // Must be a full render(), not just renderContractorThreadList() --
    // the modal is still showing the "Loading…" branch of
    // contractorThreadModalHtml() at this point (that branch has no
    // #contractorThreadList element at all), so renderContractorThreadList()
    // alone would find nothing to update and silently no-op, leaving the
    // modal stuck on "Loading…" forever. render() regenerates the modal
    // HTML for the now-loaded state (which itself calls
    // renderContractorThreadList() again afterward -- see the bottom of
    // render()), so this isn't redundant, it's the actual fix.
    render();
    // Fire-and-forget -- admin has just seen this thread, mark any
    // contractor replies read. Doesn't need to block the view rendering.
    // Re-checks the Action required badge count afterward so it drops
    // immediately instead of only on next page load.
    adminFetch('/api/admin-messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'adminMarkRead', contractorEmail: email }),
    }).then(() => {
      unreadContractorMessageCount = null;
      loadUnreadContractorMessageCount();
      // If the Messages tab list is loaded, its unread badges are now
      // stale too -- force it to refetch next time it's shown.
      messageThreadsData = null;
    }).catch(() => {});
  }
  function contractorThreadModalHtml() {
    return `
      <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;" onclick="if(event.target===this) closeContractorThread();">
        <div style="background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%;max-height:85vh;display:flex;flex-direction:column;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h2 style="font-size:16px;">${escapeHtml(openContractorThreadEmail)}</h2>
            <button onclick="closeContractorThread()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--stone);line-height:1;">✕</button>
          </div>
          ${contractorThreadLoading ? '<div class="note">Loading…</div>' : `
            <div class="msglist" id="contractorThreadList" style="flex:1;max-height:none;"></div>
            <div class="msginput">
              <input type="text" id="contractorThreadInput" placeholder="Reply…" onkeydown="if(event.key==='Enter') sendContractorThreadReply()" ${contractorThreadSending ? 'disabled' : ''} />
              <button class="btn btn-black" onclick="sendContractorThreadReply()" ${contractorThreadSending ? 'disabled' : ''}>${contractorThreadSending ? '…' : 'Send'}</button>
            </div>
          `}
        </div>
      </div>`;
  }
  function renderContractorThreadList() {
    const list = document.getElementById('contractorThreadList');
    if (!list) return;
    if (contractorThreadMessages.length === 0) { list.innerHTML = '<div style="font-size:12px;color:var(--stone-light);">No messages yet.</div>'; return; }
    list.innerHTML = contractorThreadMessages.map(m => `
      <div class="msgbubble ${m.sender_role === 'admin' ? 'mine' : 'theirs'}">
        <div class="msgmeta">${m.sender_role === 'admin' ? 'You (MySubbies)' : 'Contractor'} · ${new Date(m.sent_at).toLocaleString('en-AU')}</div>
        ${m.subject ? `<div style="font-weight:700;margin-bottom:2px;">${escapeHtml(m.subject)}</div>` : ''}
        <div style="white-space:pre-wrap;">${escapeHtml(m.body)}</div>
        ${m.attachment_data_url ? `<div style="margin-top:6px;"><a href="${m.attachment_data_url}" download="${escapeHtml(m.attachment_filename || 'attachment')}" style="color:inherit;text-decoration:underline;font-size:12px;font-weight:600;">📎 ${escapeHtml(m.attachment_filename || 'Download attachment')}</a></div>` : ''}
      </div>
    `).join('');
    list.scrollTop = list.scrollHeight;
  }
  async function sendContractorThreadReply() {
    const input = document.getElementById('contractorThreadInput');
    const text = input.value.trim();
    if (!text || contractorThreadSending) return;
    contractorThreadSending = true;
    input.disabled = true;
    try {
      const res = await adminFetch('/api/admin-messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'send', contractorEmails: [openContractorThreadEmail], body: text }),
      });
      if (!res.ok) throw new Error('send failed');
      input.value = '';
      contractorThreadSending = false;
      await loadContractorThread(openContractorThreadEmail);
      const freshInput = document.getElementById('contractorThreadInput');
      if (freshInput) freshInput.disabled = false;
    } catch (e) {
      contractorThreadSending = false;
      input.disabled = false;
      showToast('Could not send — try again');
    }
  }

  // Dedicated Messages tab (Aug 2026) -- previously the only way to know a
  // contractor had replied was the Action required banner on Overview, or
  // stumbling onto it via the per-contractor "💬 Messages" button in
  // Applications/Contractors. This gives it a real home with its own
  // always-visible badge in the tab bar (same convention as Applications/
  // Disputes/Inquiries), so a new reply is impossible to miss regardless
  // of which tab admin happens to be on.
  let messageThreadsData = null;
  let messageThreadsLoading = false;
  async function loadMessageThreads() {
    if (messageThreadsLoading) return;
    messageThreadsLoading = true;
    try {
      const res = await adminFetch('/api/get-admin-list?type=message-threads');
      const data = await res.json();
      messageThreadsData = Array.isArray(data.threads) ? data.threads : [];
    } catch (e) {
      messageThreadsData = [];
    }
    messageThreadsLoading = false;
    render();
  }
  // Completed jobs per contractor, for manual weekly payment (Aug 2026) --
  // see api/get-admin-list.js's type=contractor-payouts for the completion
  // logic and the payout_line_items netting-off. Same load-once-per-tab-open
  // pattern as messageThreadsData above.
  let contractorPayoutsData = null;
  let contractorPayoutsLoading = false;
  async function loadContractorPayouts() {
    if (contractorPayoutsLoading) return;
    contractorPayoutsLoading = true;
    try {
      const res = await adminFetch('/api/get-admin-list?type=contractor-payouts');

    } catch (e) {

  let expandedPayoutContractor = null;
  function togglePayoutContractor(email) {
    expandedPayoutContractor = expandedPayoutContractor === email ? null : email;
    render();
  }
  function contractorPayoutsSectionHtml() {
    if (!contractorPayoutsData) return `<div class="detailcard" style="margin-bottom:14px;"><h3 style="font-size:15px;margin-bottom:12px;">Contractor payouts (weekly)</h3><div class="empty">Loading…</div></div>`;
    if (contractorPayoutsData.length === 0) return `<div class="detailcard" style="margin-bottom:14px;"><h3 style="font-size:15px;margin-bottom:12px;">Contractor payouts (weekly)</h3><div class="empty">No completed jobs yet.</div></div>`;

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:4px;">Contractor payouts (weekly)</h3>

        <div class="row" style="font-weight:700;"><span class="l">Total still owed (manual), all contractors</span><span class="r">$${(totalNet/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>

              </div>
            </div>
            ${expandedPayoutContractor === c.contractorEmail ? `
              <div style="margin-top:8px;font-size:12px;">
                <div class="row"><span class="l">Gross owed (75% of all completed jobs)</span><span class="r">$${(c.grossOwedCents/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>
                <div class="row"><span class="l">Already sent automatically (deposit transfers)</span><span class="r">$${(c.alreadyPaidCents/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>
                <table style="width:100%;border-collapse:collapse;margin-top:8px;">
                  <thead><tr>
                    <th style="text-align:left;font-size:10.5px;color:var(--stone);padding:4px;">#</th>
                    <th style="text-align:left;font-size:10.5px;color:var(--stone);padding:4px;">Job</th>
                    <th style="text-align:left;font-size:10.5px;color:var(--stone);padding:4px;">Suburb</th>
                    <th style="text-align:left;font-size:10.5px;color:var(--stone);padding:4px;">Completed</th>
                    <th style="text-align:left;font-size:10.5px;color:var(--stone);padding:4px;">Share (75%)</th>

                        <td style="padding:4px;">${j.completedAt ? new Date(j.completedAt).toLocaleDateString('en-AU') : '—'}</td>
                        <td style="padding:4px;">$${(j.shareCents/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                        <td style="padding:4px;">$${(j.alreadyPaidCents/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            ` : ''}

        `).join('')}

  }
  function renderMessagesTab(applications) {
    if (!messageThreadsData) return '<h1 class="pagetitle">Messages</h1><div class="empty">Loading…</div>';
    if (messageThreadsData.length === 0) return '<h1 class="pagetitle">Messages</h1><div class="empty">No conversations yet — message a contractor from the Contractors or Applications tab to start one.</div>';
    return `
      <h1 class="pagetitle">Messages</h1>
      <p class="pagesub">Every conversation with a contractor, most recent first.</p>
      ${messageThreadsData.map(t => {

        return `
        <button class="detailcard" style="max-width:640px;margin-bottom:10px;text-align:left;width:100%;cursor:pointer;display:block;${t.unreadCount ? 'border-color:var(--black);' : ''}" onclick="openContractorThread('${t.contractorEmail.replace(/'/g, "\\'")}')">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
            <strong style="font-size:14px;">${escapeHtml(name)}</strong>

          </div>

        </button>`;

  let customersStatusFilter = 'all';
  function customersStatusFilterChipsHtml(customers) {
    const statusOf = c => c.status === 'deactivated' ? 'deactivated' : 'active';
    const options = [{ key: 'all', label: 'All' }, { key: 'active', label: 'Active' }, { key: 'deactivated', label: 'Deactivated' }];
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${options.map(f => {
        const count = f.key === 'all' ? customers.length : customers.filter(c => statusOf(c) === f.key).length;
        const active = customersStatusFilter === f.key;
        return `<button onclick="customersStatusFilter='${f.key}'; render();" style="padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid ${active ? 'var(--ink)' : 'var(--line)'};background:${active ? 'var(--ink)' : '#fff'};color:${active ? '#fff' : 'var(--ink)'};cursor:pointer;">${f.label} (${count})</button>`;
      }).join('')}
    </div>`;
  }

  // Shared by Disputes and Inquiries -- both are a simple open/resolved
  // status set. setterFnName is the global function to call on click
  // ('setDisputesStatusFilter' or 'setInquiriesStatusFilter'), so this one
  // helper can drive either tab's own filter variable.
  function openResolvedFilterChipsHtml(items, currentFilter, setterFnName) {
    const options = [{ key: 'all', label: 'All' }, { key: 'open', label: 'Open' }, { key: 'resolved', label: 'Resolved' }];
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${options.map(f => {
        const count = f.key === 'all' ? items.length : items.filter(x => x.status === f.key).length;
        const active = currentFilter === f.key;
        return `<button onclick="${setterFnName}('${f.key}')" style="padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid ${active ? 'var(--ink)' : 'var(--line)'};background:${active ? 'var(--ink)' : '#fff'};color:${active ? '#fff' : 'var(--ink)'};cursor:pointer;">${f.label} (${count})</button>`;
      }).join('')}
    </div>`;
  }
  let disputesStatusFilter = 'all';
  function setDisputesStatusFilter(key) { disputesStatusFilter = key; render(); }
  let inquiriesStatusFilter = 'all';
  function setInquiriesStatusFilter(key) { inquiriesStatusFilter = key; render(); }

  // Job search (all 3 portals, Aug 2026) -- a plain-text filter over
  // category/suburb/id/contractor/customer/task names, so admin can find a
  // specific job across the whole platform without scrolling. render()
  // rebuilds the table via innerHTML on every keystroke, same as everywhere
  // else in this codebase, which would normally drop focus/cursor out from
  // under the input -- restored manually here instead.
  function onJobSearchInput(el) {
    const cursorPos = el.selectionStart;
    jobSearchQuery = el.value;
    render();
    const newEl = document.getElementById('jobSearchInput');
    if (newEl) { newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
  }
  function jobMatchesSearch(j, rawQuery) {
    const q = rawQuery.trim().toLowerCase();
    if (!q) return true;
    const haystack = [j.id, j.category, j.suburb, j.contractor, j.customerName, j.customerEmail, ...(j.items || []).map(i => i.taskName)]
      .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  }
  function jobSearchBoxHtml() {
    return `<input type="text" id="jobSearchInput" value="${escapeHtml(jobSearchQuery)}" oninput="onJobSearchInput(this)" placeholder="Search by suburb, category, contractor, customer or job details…" style="width:100%;font-size:14px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;margin:12px 0;font-family:inherit;" />`;
  }

  function getApplications() { return JSON.parse(localStorage.getItem('mysubbies_contractor_applications') || '[]'); }
  function saveApplications(apps) {
    localStorage.setItem('mysubbies_contractor_applications', JSON.stringify(apps));
    fetch('/api/sync-applications', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ applications: apps }) }).catch(() => {});
  }
  // Pulls every full application from Supabase (mirrors hydrateJobsFromServer)
  // so admin sees applications submitted from any device, not just this
  // browser. See api/get-admin-list.js?type=applications.
  async function hydrateApplicationsFromServer() {
    try {
      const res = await adminFetch('/api/get-admin-list?type=applications');
      if (!res.ok) return;
      const { applications: remoteApps } = await res.json();
      if (!Array.isArray(remoteApps) || remoteApps.length === 0) return;
      const localApps = getApplications();
      const byId = new Map(localApps.map(a => [a.id, a]));
      remoteApps.forEach(ra => { if (ra && ra.id) byId.set(ra.id, ra); });
      localStorage.setItem('mysubbies_contractor_applications', JSON.stringify(Array.from(byId.values())));
    } catch (e) { /* offline or first load — local data still works */ }
  }

  // Manual refresh (Aug 2026) -- re-pulls jobs + applications from Supabase,
  // and forces the lazily-cached Payments/Customers tab data (paymentTabData/
  // customersTabData, see render()'s `if (!paymentTabData ...) loadXxx()`
  // guards) to reload too, since those only ever fetch once and otherwise
  // go stale for the rest of the admin session.
  let manualRefreshInFlight = false;
  function manualRefresh() {
    if (manualRefreshInFlight) return;
    manualRefreshInFlight = true;
    const icon = document.getElementById('refreshIcon');
    if (icon) icon.classList.add('spinning');
    Promise.all([hydrateJobsFromServer(), hydrateApplicationsFromServer()]).then(() => {
      paymentTabData = null;
      customersTabData = null;
      unreadContractorMessageCount = null;
      messageThreadsData = null;
      contractorPayoutsData = null;
      render();
      showToast('Refreshed');
    }).catch(() => {}).finally(() => {
      manualRefreshInFlight = false;
      if (icon) icon.classList.remove('spinning');
    });
  }
  function showToast(msg) {
    let t = document.getElementById('toastMsg');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toastMsg';
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
  }

  function getDisputes() { return JSON.parse(localStorage.getItem('mysubbies_disputes') || '[]'); }
  function saveDisputes(d) { localStorage.setItem('mysubbies_disputes', JSON.stringify(d)); }

  function renderDisputesTab(disputes, jobs) {
    if (disputes.length === 0) return '<div class="empty">No disputes reported.</div>';
    const filtered = disputesStatusFilter === 'all' ? disputes : disputes.filter(d => d.status === disputesStatusFilter);
    return `
      <h1 class="pagetitle">Disputes</h1>
      ${openResolvedFilterChipsHtml(disputes, disputesStatusFilter, 'setDisputesStatusFilter')}
      ${filtered.length === 0 ? '<div class="empty">No disputes in this status.</div>' : filtered.map(d => {
        const job = jobs.find(j => j.id === d.jobId);
        return `
          <div class="detailcard" style="max-width:640px;margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <div style="font-weight:700;font-size:15px;">${escapeHtml(d.reason)}</div>
                <div style="font-size:12px;color:var(--stone);margin-top:2px;">${job ? (job.jobNumber ? `Job #${job.jobNumber} — ` : '') + escapeHtml(job.category + ' — ' + job.suburb) : 'Job not found'} · reported by ${escapeHtml(d.reportedBy)} · ${new Date(d.reportedAt).toLocaleDateString('en-AU')}</div>
              </div>
              <span class="badge ${d.status === 'open' ? 'badge-feed' : 'badge-completed'}">${d.status}</span>
            </div>
            <div style="font-size:13px;color:#333;margin-top:10px;">${d.details ? escapeHtml(d.details) : '(no further details provided)'}</div>
            ${d.status === 'open' ? `<button class="btn btn-outline" style="margin-top:12px;" onclick="resolveDispute('${d.id}')">Mark resolved</button>` : ''}
          </div>`;
      }).join('')}
    `;
  }
  function resolveDispute(id) {
    const disputes = getDisputes();
    const d = disputes.find(x => x.id === id);
    d.status = 'resolved';
    saveDisputes(disputes);
    render();
  }

  // General-purpose "Contact MySubbies" inquiries (Aug 2026) -- customers
  // and contractors can each send a free-form message with attachments
  // from their own portal, not tied to a specific job. Same
  // localStorage-log pattern as disputes above.
  function getInquiries() { return JSON.parse(localStorage.getItem('mysubbies_inquiries') || '[]'); }
  function saveInquiries(inq) { localStorage.setItem('mysubbies_inquiries', JSON.stringify(inq)); }
  function resolveInquiry(id) {
    const inquiries = getInquiries();
    const i = inquiries.find(x => x.id === id);
    i.status = 'resolved';
    saveInquiries(inquiries);
    render();
  }
  // Two-way thread (Aug 2026) -- the original version only showed the
  // customer/contractor's initial message with a "Mark resolved" button
  // and no way to actually respond (founder feedback: real gap). Now
  // reuses the same `messages`-array shape and inquiryThreadHtml()
  // rendering as the customer/contractor portals, with myRole='admin' so
  // admin's own replies land on the right and the sender's on the left.
  function renderInquiriesTab(inquiries) {
    if (inquiries.length === 0) return '<div class="empty">No inquiries yet.</div>';
    const filtered = inquiriesStatusFilter === 'all' ? inquiries : inquiries.filter(i => i.status === inquiriesStatusFilter);
    return `
      <h1 class="pagetitle">Inquiries</h1>
      ${openResolvedFilterChipsHtml(inquiries, inquiriesStatusFilter, 'setInquiriesStatusFilter')}
      ${filtered.length === 0 ? '<div class="empty">No inquiries in this status.</div>' : filtered.map(i => `

        </div>`).join('')}
    `;

  // Same shape/rendering as the customer and contractor portals' own copy
  // of this function -- myRole is whichever side is viewing, so the same
  // thread renders with the viewer's own messages on the right.
  function inquiryThreadHtml(i, myRole) {
    const msgs = i.messages || [];
    return `
      <div style="margin-top:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">

            <div class="msgbubble ${m.from === myRole ? 'mine' : 'theirs'}">

            <button class="btn btn-black" onclick="replyToInquiry('${i.id}', '${myRole}')">Send</button>

  function replyToInquiry(id, myRole) {
    const input = document.getElementById('inquiryReply_' + id);
    const text = input.value.trim();
    if (!text) return;
    const inquiries = getInquiries();
    const i = inquiries.find(x => x.id === id);
    if (!i) return;
    i.messages = i.messages || [];
    i.messages.push({ from: myRole, text, createdAt: new Date().toISOString() });
    saveInquiries(inquiries);
    render();
  }
  function reopenInquiry(id) {
    const inquiries = getInquiries();
    const i = inquiries.find(x => x.id === id);
    i.status = 'open';

  function render() {
    if (selectedJobId) { renderDetail(); return; }
    const jobs = getJobs();
    // Cancelled jobs never actually earn MySubbies anything -- counting

    const billableJobs = jobs.filter(j => j.status !== 'cancelled');

    // Action required (Aug 2026) -- a single always-visible checklist of

    const disputedMilestoneCount = paymentTabData ? (paymentTabData.disputedMilestones || []).length : 0;
    const pendingScheduleCount = paymentTabData ? (paymentTabData.pendingScheduleJobs || []).length : 0;
    const totalActionCount = cancellationRequests.length + openDisputeCount + openInquiryCount + pendingCount + disputedMilestoneCount + pendingScheduleCount + (unreadContractorMessageCount || 0);
    const actionRequiredHtml = `

          ${openDisputeCount ? `

              <span style="font-size:13px;">⚠ ${openDisputeCount} open dispute${openDisputeCount === 1 ? '' : 's'}</span>
              <button class="btn btn-outline" style="width:auto;flex-shrink:0;padding:6px 12px;font-size:12px;" onclick="tab='disputes'; render();">View</button>

          ${openInquiryCount ? `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0D89B;">
              <span style="font-size:13px;">⚠ ${openInquiryCount} open inquir${openInquiryCount === 1 ? 'y' : 'ies'}</span>
              <button class="btn btn-outline" style="width:auto;flex-shrink:0;padding:6px 12px;font-size:12px;" onclick="tab='inquiries'; render();">View</button>
            </div>` : ''}
          ${pendingCount ? `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0D89B;">
              <span style="font-size:13px;">⚠ ${pendingCount} pending contractor application${pendingCount === 1 ? '' : 's'}</span>
              <button class="btn btn-outline" style="width:auto;flex-shrink:0;padding:6px 12px;font-size:12px;" onclick="tab='applications'; render();">View</button>
            </div>` : ''}

            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0D89B;">

              <button class="btn btn-outline" style="width:auto;flex-shrink:0;padding:6px 12px;font-size:12px;" onclick="tab='contractors'; render();">View</button>

          ${disputedMilestoneCount ? `

        <button class="${tab==='disputes'?'active':''}" onclick="tab='disputes'; render();">Disputes ${openDisputeCount ? '(' + openDisputeCount + ')' : ''}</button>

        <button class="${tab==='payments'?'active':''}" onclick="tab='payments'; render();">Payment Schedules ${paymentBadgeCount ? '(' + paymentBadgeCount + ')' : ''}</button>

        <h1 class="pagetitle">Jobs</h1>

          ${jobStatusFilterChipsHtml(jobs)}

          ${(() => {
            const statusFiltered = jobStatusFilter === 'all' ? jobs : jobs.filter(j => j.status === jobStatusFilter);
            const filtered = statusFiltered.filter(j => jobMatchesSearch(j, jobSearchQuery));
            if (statusFiltered.length === 0) return '<div class="empty">No jobs in this status.</div>';
            return filtered.length === 0
              ? `<div class="empty">No jobs match "${escapeHtml(jobSearchQuery)}".</div>`
              : jobsTableHtml(filtered);
          })()}
        `}
      ` : tab === 'applications' ? renderApplicationsTab(applications) : tab === 'contractors' ? renderContractorsTab(applications) : tab === 'messages' ? renderMessagesTab(applications) : tab === 'customers' ? renderCustomersTab() : tab === 'disputes' ? renderDisputesTab(disputes, jobs) : tab === 'inquiries' ? renderInquiriesTab(inquiries) : tab === 'payments' ? renderPaymentScheduleTab() : tab === 'reports' ? renderReportsTab(jobs, applications, disputes) : renderRateCardTab()}
      ${openContractorThreadEmail ? contractorThreadModalHtml() : ''}
    `;
    if (tab === 'ratecard') wireRateCardTab();
    if (openContractorThreadEmail) renderContractorThreadList();
    wireNotifyButton();
  }

  function getCustomersMap() { return JSON.parse(localStorage.getItem('mysubbies_customers') || '{}'); }

  // CSV export, sourced from the real Supabase tables (not local cache) so
  // the export reflects every customer/contractor across every device,
  // not just whoever registered in this browser.
  function toCsv(rows, columns) {
    const esc = v => {
      const s = v == null ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const header = columns.map(c => esc(c.label)).join(',');
    const body = rows.map(r => columns.map(c => esc(r[c.key])).join(',')).join('\n');
    return header + '\n' + body;
  }
  function downloadCsv(filename, csv) {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  async function exportCustomersCsv() {
    try {
      const res = await adminFetch('/api/get-admin-list?type=customers');
      const { customers } = await res.json();
      const csv = toCsv(customers || [], [
        { key: 'name', label: 'Name' }, { key: 'email', label: 'Email' },
        { key: 'phone', label: 'Phone' }, { key: 'created_at', label: 'Registered' },
      ]);
      downloadCsv('mysubbies-customers.csv', csv);
    } catch (e) { alert('Could not export customers — try again.'); }
  }
  function exportContractorsCsv() {
    const apps = getApplications();
    const rows = apps.map(a => ({ ...a, tradesCsv: (a.trades || []).join('; '), suburbsCsv: (a.suburbs || []).join('; ') }));
    downloadCsv('mysubbies-contractors.csv', toCsv(rows, [
      { key: 'business', label: 'Business name' }, { key: 'contact', label: 'Contact' },
      { key: 'email', label: 'Email' }, { key: 'phone', label: 'Phone' },
      { key: 'abn', label: 'ABN' }, { key: 'acn', label: 'ACN' },
      { key: 'status', label: 'Status' },
      { key: 'tradesCsv', label: 'Trades' }, { key: 'suburbsCsv', label: 'Suburbs' },
      { key: 'appliedAt', label: 'Applied' },
    ]));
  }

  function barHtml(label, value, max, valueLabel) {
    const pct = max > 0 ? Math.max(2, Math.round((value / max) * 100)) : 0;
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
          <span>${escapeHtml(label)}</span><span style="font-weight:600;">${valueLabel}</span>
        </div>
        <div style="background:var(--paper);border-radius:5px;height:8px;overflow:hidden;">
          <div style="background:var(--black);height:100%;width:${pct}%;"></div>
        </div>
      </div>`;
  }

  function renderReportsTab(jobs, applications, disputes) {
    const customers = getCustomersMap();
    const customerList = Object.values(customers);
    const newsletterCount = JSON.parse(localStorage.getItem('mysubbies_newsletter_signups') || '[]').length;

    // Cancelled jobs never actually earn MySubbies (or a contractor)
    // anything -- gross job value, commission and payout are all computed
    // off billable (non-cancelled) jobs only (founder feedback, Aug 2026).
    const gmv = jobs.filter(j => j.status !== 'cancelled').reduce((s, j) => s + (j.basePrice || 0), 0);
    const commission = Math.round(gmv * 0.25);
    const payout = gmv - commission;
    const completedJobs = jobs.filter(j => j.status === 'completed');
    const completedGmv = completedJobs.reduce((s, j) => s + (j.basePrice || 0), 0);

    const approved = applications.filter(a => a.status === 'approved');
    const pendingApps = applications.filter(a => a.status === 'pending');
    const rejectedApps = applications.filter(a => a.status === 'rejected');
    const openDisputes = disputes.filter(d => d.status === 'open');
    const disputeRate = jobs.length ? ((disputes.length / jobs.length) * 100).toFixed(1) : '0.0';
    const referredCustomers = customerList.filter(c => c.referredBy).length;

    // Revenue by category
    const byCategory = {};
    jobs.forEach(j => {
      const cat = j.category || 'Unknown';
      if (!byCategory[cat]) byCategory[cat] = { count: 0, value: 0 };
      byCategory[cat].count++;
      byCategory[cat].value += j.basePrice || 0;
    });
    const catRows = Object.entries(byCategory).sort((a, b) => b[1].value - a[1].value);
    const maxCatValue = catRows.length ? catRows[0][1].value : 0;

    // Demand by suburb (top 5)
    const bySuburb = {};
    jobs.forEach(j => { const s = j.suburb || 'Unknown'; bySuburb[s] = (bySuburb[s] || 0) + 1; });
    const suburbRows = Object.entries(bySuburb).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const maxSuburbCount = suburbRows.length ? suburbRows[0][1] : 0;

    // Jobs per month (sortable key -> display label)
    const monthMap = {};
    jobs.forEach(j => {
      const d = new Date(j.createdAt);
      if (isNaN(d)) return;
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      monthMap[key] = (monthMap[key] || 0) + 1;
    });
    const monthKeys = Object.keys(monthMap).sort();
    const maxMonthCount = monthKeys.length ? Math.max(...monthKeys.map(k => monthMap[k])) : 0;

    // Contractor category coverage (approved contractors per trade)
    const coverage = {};
    approved.forEach(a => (a.trades || []).forEach(t => { coverage[t] = (coverage[t] || 0) + 1; }));
    const uncoveredCats = catRows.filter(([cat]) => !coverage[cat]).map(([cat]) => cat);

    return `
      <h1 class="pagetitle">Reports</h1>
