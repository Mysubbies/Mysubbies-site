          <button class="btn btn-outline" style="flex:1;" onclick="exportContractorsCsv()">Export contractors CSV</button>
        </div>
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Finance</h3>
        <div class="row"><span class="l">Gross merchandise value (all jobs)</span><span class="r">$${gmv.toLocaleString()}</span></div>
        <div class="row"><span class="l">Platform commission (25%)</span><span class="r">$${commission.toLocaleString()}</span></div>
        <div class="row"><span class="l">Contractor payout (75%)</span><span class="r">$${payout.toLocaleString()}</span></div>
        <div class="row"><span class="l">Completed jobs value</span><span class="r">$${completedGmv.toLocaleString()} (${completedJobs.length} jobs)</span></div>
        <div class="row"><span class="l">Average job value</span><span class="r">$${jobs.length ? Math.round(gmv / jobs.length).toLocaleString() : 0}</span></div>
      </div>

      ${contractorPayoutsSectionHtml()}

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Revenue by category</h3>
        ${catRows.length === 0 ? '<div class="empty">No jobs yet.</div>' : catRows.map(([cat, d]) => barHtml(cat, d.value, maxCatValue, `$${d.value.toLocaleString()} · ${d.count} job${d.count === 1 ? '' : 's'}`)).join('')}
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Jobs booked by month</h3>
        ${monthKeys.length === 0 ? '<div class="empty">No jobs yet.</div>' : monthKeys.map(k => {
          const [y, m] = k.split('-');
          const label = new Date(Number(y), Number(m) - 1, 1).toLocaleDateString('en-AU', { month: 'short', year: 'numeric' });
          return barHtml(label, monthMap[k], maxMonthCount, String(monthMap[k]));
        }).join('')}
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Marketing</h3>
        <div class="row"><span class="l">Total customer accounts</span><span class="r">${customerList.length}</span></div>
        <div class="row"><span class="l">Customers who used a referral code</span><span class="r">${referredCustomers}</span></div>
        <div class="row"><span class="l">Newsletter signups</span><span class="r">${newsletterCount}</span></div>
        <div style="margin-top:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--stone);margin-bottom:8px;">Top demand by suburb</div>
        ${suburbRows.length === 0 ? '<div class="empty">No jobs yet.</div>' : suburbRows.map(([sub, count]) => barHtml(sub, count, maxSuburbCount, `${count} job${count === 1 ? '' : 's'}`)).join('')}
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Director / CEO overview</h3>
        <div class="row"><span class="l">Total jobs</span><span class="r">${jobs.length}</span></div>
        <div class="row"><span class="l">Approved contractors</span><span class="r">${approved.length}</span></div>
        <div class="row"><span class="l">Applications awaiting review</span><span class="r">${pendingApps.length}</span></div>
        <div class="row"><span class="l">Applications rejected</span><span class="r">${rejectedApps.length}</span></div>
        <div class="row"><span class="l">Open disputes</span><span class="r">${openDisputes.length} of ${disputes.length} total</span></div>
        <div class="row"><span class="l">Dispute rate</span><span class="r">${disputeRate}% of jobs</span></div>
        ${uncoveredCats.length ? `
          <div style="margin-top:12px;padding:10px 12px;background:#FFF6E5;border:1px solid #F0DCA6;border-radius:8px;font-size:12.5px;color:#7A5C1E;">
            <strong>No approved contractors yet</strong> in categories with active demand: ${uncoveredCats.map(escapeHtml).join(', ')}.
          </div>
        ` : ''}
      </div>
    `;
  }

  function variationListHtml(j) {
    const variations = j.variations || [];
    const statusColor = { pending: '#8A6D2E', approved: 'var(--good)', declined: 'var(--warn)' };
    const statusBg = { pending: '#FFF6E5', approved: '#EAF5EE', declined: '#FDEDEA' };
    return variations.map(v => `
      <div style="border-top:1px solid var(--paper);padding:10px 0;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:600;">${escapeHtml(v.description)}</div>
            ${v.reason ? `<div style="font-size:11.5px;color:var(--stone);margin-top:2px;">${escapeHtml(v.reason)}</div>` : ''}
            <div style="font-size:10.5px;color:var(--stone-light);margin-top:2px;">Requested ${new Date(v.requestedAt).toLocaleDateString('en-AU')}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-weight:700;font-size:14px;">+$${v.amount.toLocaleString()}</div>
            <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;color:${statusColor[v.status]};background:${statusBg[v.status]};">${v.status}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function docChipsHtml(docs) {
    if (!docs || docs.length === 0) return '<span style="color:var(--stone-light);">None uploaded</span>';
    return docs.map(d => `
      <a href="${d.dataUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin:2px 4px 2px 0;text-decoration:none;color:var(--ink);">
        ${d.isImage ? '🖼️' : '📄'} ${d.name}
      </a>
    `).join('');
  }

  // --- Rate card storage: same localStorage key the live estimator reads from ---
  function getRateCard() {
    const stored = localStorage.getItem('mysubbies_ratecard');
    return stored ? JSON.parse(stored) : [];
  }
  // Pushes to the real server copy (api/rate-card.js) on every save, not
  // just localStorage -- previously an admin edit here only ever updated
  // admin's own browser, and no customer ever saw it (see
  // supabase/schema_v12_rate_card_sync.sql). Every rate-card-mutating
  // function in this file already funnels through here (editService,
  // toggleServiceDisabled, CSV upload, bulk update, add task, add
  // researched services), so this one change point covers all of them.
  // Fire-and-forget, same non-blocking posture as saveJobs()'s sync call --
  // a slow/failed push must never stop the admin's own UI from updating.
  function saveRateCard(categories) {
    localStorage.setItem('mysubbies_ratecard', JSON.stringify(categories));
    adminFetch('/api/rate-card', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ categories }),
    }).catch(() => {});
  }
  // Pulls the server's rate card in on load, so admin sees the latest even
  // if the last edit happened from a different device/browser. Server
  // wins on conflict (matches saveRateCard() always pushing admin's own
  // edits as authoritative) -- this only overwrites localStorage when the
  // two actually differ, and skips entirely if nothing has ever been
  // pushed to the server yet (categories: null).
  async function hydrateRateCardFromServer() {
    try {
      const res = await fetch('/api/rate-card');
      if (!res.ok) return;
      const { categories } = await res.json();
      if (!Array.isArray(categories) || categories.length === 0) return;
      const current = JSON.stringify(getRateCard());
      if (JSON.stringify(categories) !== current) {
        localStorage.setItem('mysubbies_ratecard', JSON.stringify(categories));
        if (tab === 'ratecard') render();
      }
    } catch (e) { /* offline or first load -- local data still works */ }
  }

  let pendingUploadRows = null;
  let rcMode = 'manage';
  let rcManageSearchQuery = '';
  // Which categories are expanded in Manage Existing (Aug 2026 redesign) --
  // 21 categories x ~163 tasks always fully expanded was the actual cause
  // of the "messy" rate card tab (founder report): every task row rendered
  // at once, all the time, whether or not it was the one being edited.
  // Collapsed by default; a category auto-expands while it has search
  // matches (see rateCardManageHtml) so search still works with zero extra
  // clicks, and stays manually toggle-able via the header row otherwise.
  let rcExpandedCategories = new Set();
  function toggleRcCategory(label) {
    if (rcExpandedCategories.has(label)) rcExpandedCategories.delete(label);
    else rcExpandedCategories.add(label);
    const list = document.getElementById('rcManageList');
    if (list) list.innerHTML = rateCardManageHtml(getRateCard(), rcManageSearchQuery);
  }

  // Explicit Save per task row (Aug 2026, founder report) -- name/unit/rate/
  // notes used to commit on every onchange (blur), with zero visible
  // confirmation, which read as "there's no save option" even though it
  // technically auto-saved. Now every field just updates a local draft on
  // input; nothing is written to the rate card (or pushed to the server --
  // see saveRateCard()) until Save is clicked. Keyed by category label +
  // real task index, same realIdx the rest of this file already uses so a
  // search-narrowed view can never edit the wrong task.
  let rcTaskDrafts = {};
  function rcRowId(catLabel, realIdx) { return realIdx + '_' + catLabel.replace(/[^a-zA-Z0-9]/g, ''); }
  function rcSetTaskDraft(catLabel, realIdx, field, value) {
    const key = catLabel + '__' + realIdx;
    if (!rcTaskDrafts[key]) {
      const cat = getRateCard().find(c => c.label === catLabel);
      const t = cat && cat.tasks[realIdx];
      if (!t) return;
      rcTaskDrafts[key] = { name: t.name, unit: t.unit, rate: t.rate === null ? '' : t.rate, minJobPrice: t.minJobPrice == null ? '' : t.minJobPrice, notes: t.notes || '' };
    }
    rcTaskDrafts[key][field] = value;
    const btn = document.getElementById('rcSaveBtn-' + rcRowId(catLabel, realIdx));
    if (btn) { btn.disabled = false; btn.classList.add('rc-save-dirty'); btn.textContent = 'Save'; }
  }
  function saveTaskRow(catLabel, realIdx) {
    const key = catLabel + '__' + realIdx;
    const draft = rcTaskDrafts[key];
    if (!draft) return;
    const categories = getRateCard();
    const cat = categories.find(c => c.label === catLabel);
    if (!cat) return;
    const task = cat.tasks[realIdx];
    task.name = draft.name.trim();
    task.unit = draft.unit.trim();
    task.rate = draft.rate === '' ? null : Number(draft.rate);
    task.minJobPrice = draft.minJobPrice === '' ? null : Number(draft.minJobPrice);
    task.notes = draft.notes;
    saveRateCard(categories);
    delete rcTaskDrafts[key];
    const rowId = rcRowId(catLabel, realIdx);
    const list = document.getElementById('rcManageList');
    if (list) list.innerHTML = rateCardManageHtml(getRateCard(), rcManageSearchQuery);
    const savedMsg = document.getElementById('rcSavedMsg-' + rowId);
    if (savedMsg) { savedMsg.style.display = 'inline'; setTimeout(() => { if (savedMsg) savedMsg.style.display = 'none'; }, 1800); }
  }

  // Per-task photo upload (Aug 2026) -- e.g. Timber fence vs. Colorbond
  // fence get their own distinct photo, shown to the customer in the
  // estimator so a sub-category picker like "which fence?" reads visually,
  // not just as a list of names. Same base64-data-URI-in-the-record
  // pattern already used for job/property photos throughout this project
  // (no real blob storage exists here) -- resized/compressed client-side
  // before storing, which matters MORE here than for a single job's
  // photos: this data rides inside the whole rate card blob that gets
  // synced to Supabase and fetched by every visitor's estimator on every
  // page load, not just when viewing one job. Applies and saves
  // immediately (like Hold/Unhold) rather than going through the
  // name/rate/notes draft above -- picking a photo is already a single
  // deliberate action, not something to accidentally half-finish.
  const RC_PHOTO_MAX_WIDTH = 480;
  const RC_PHOTO_JPEG_QUALITY = 0.72;
  function onTaskPhotoSelected(catLabel, realIdx, event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, RC_PHOTO_MAX_WIDTH / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const categories = getRateCard();
        const cat = categories.find(c => c.label === catLabel);
        if (!cat) return;
        cat.tasks[realIdx].photoDataUrl = canvas.toDataURL('image/jpeg', RC_PHOTO_JPEG_QUALITY);
        saveRateCard(categories);
        const list = document.getElementById('rcManageList');
        if (list) list.innerHTML = rateCardManageHtml(getRateCard(), rcManageSearchQuery);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function removeTaskPhoto(catLabel, realIdx, event) {
    if (event) event.stopPropagation();
    const categories = getRateCard();
    const cat = categories.find(c => c.label === catLabel);
    if (!cat) return;
    delete cat.tasks[realIdx].photoDataUrl;
    saveRateCard(categories);
    const list = document.getElementById('rcManageList');
    if (list) list.innerHTML = rateCardManageHtml(getRateCard(), rcManageSearchQuery);
  }
  // Re-render on every keystroke rebuilds #rcManageList's innerHTML same as
  // everywhere else in this file, which would normally drop focus/cursor
  // position out from under the input -- restored manually, same pattern
  // already used by onJobSearchInput() in the other two portals.
  function onRcManageSearchInput(el) {
    const cursorPos = el.selectionStart;
    rcManageSearchQuery = el.value;
    const list = document.getElementById('rcManageList');
    if (list) list.innerHTML = rateCardManageHtml(getRateCard(), rcManageSearchQuery);
    const newEl = document.getElementById('rcManageSearch');
    if (newEl) { newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
  }

  // Quick "add a single task to an existing category" (Aug 2026) -- Research
  // New already lets an admin add tasks, but forces the Google-research +
  // low/high-range-averaging workflow even when the admin already knows the
  // exact rate they want (e.g. a straightforward new line item like "Removal
  // of existing tile floor" under Flooring). This is the lighter-weight path
  // for that case, scoped to one category at a time from Manage Existing.
  let rcAddingTaskCat = null;
  let rcNewTaskDraft = { name: '', unit: '', rate: '', minJobPrice: '', notes: '' };
  function openAddTaskForm(catLabel) {
    rcAddingTaskCat = catLabel;
    rcNewTaskDraft = { name: '', unit: '', rate: '', minJobPrice: '', notes: '' };
    const list = document.getElementById('rcManageList');
    if (list) list.innerHTML = rateCardManageHtml(getRateCard(), rcManageSearchQuery);
  }
  function cancelAddTaskForm() {
    rcAddingTaskCat = null;
    const list = document.getElementById('rcManageList');
    if (list) list.innerHTML = rateCardManageHtml(getRateCard(), rcManageSearchQuery);
  }
  function saveNewTask(catLabel) {
    const name = rcNewTaskDraft.name.trim();
    const unit = rcNewTaskDraft.unit.trim();
    const rate = rcNewTaskDraft.rate === '' ? NaN : Number(rcNewTaskDraft.rate);
    const errBox = document.getElementById('rcNewTaskError');
    if (!name || !unit || isNaN(rate)) {
      if (errBox) errBox.innerHTML = '<div class="error" style="margin-top:6px;">Enter a task name, unit, and rate.</div>';
      return;
    }
    const categories = getRateCard();
    const cat = categories.find(c => c.label === catLabel);
    if (!cat) return;
    // Guard against the exact duplicate-task pattern the founder reported
    // (Aug 2026): this used to push blindly, so re-adding a task under a
    // name that already existed silently created a second row instead of
    // updating or reviving it. A tombstoned (deleted) match is revived --
    // clearly what re-adding it means -- rather than left buried while a
    // fresh duplicate is created next to it.
    const existing = cat.tasks.find(t => t.name.trim().toLowerCase() === name.toLowerCase());
    if (existing && !existing.deleted) {
      if (errBox) errBox.innerHTML = `<div class="error" style="margin-top:6px;">"${escapeHtml(name)}" already exists in this category — edit that row instead, or use a different name.</div>`;
      return;
    }
    const minJobPrice = rcNewTaskDraft.minJobPrice === '' ? null : Number(rcNewTaskDraft.minJobPrice);
    if (existing && existing.deleted) {
      existing.deleted = false; existing.disabled = false; existing.unavailable = false;
      existing.unit = unit; existing.rate = rate; existing.minJobPrice = minJobPrice; existing.notes = rcNewTaskDraft.notes.trim();
    } else {
      cat.tasks.push({ name, unit, rate, minJobPrice, notes: rcNewTaskDraft.notes.trim() });
    }
    saveRateCard(categories);
    rcAddingTaskCat = null;
    rcNewTaskDraft = { name: '', unit: '', rate: '', minJobPrice: '', notes: '' };
    const list = document.getElementById('rcManageList');
    if (list) list.innerHTML = rateCardManageHtml(getRateCard(), rcManageSearchQuery);
  }

  // Section 5 of the small-jobs brief: a configurable floor so a job never
  // books through at a price where the platform economics don't work.
  // Not yet enforced anywhere in the booking flow — that wiring is separate
  // follow-up work; this is the admin control for it.
  function getMinBookingValue() {
    const stored = localStorage.getItem('mysubbies_min_booking_value');
    return stored !== null ? Number(stored) : 149;
  }

  function saveMinBookingValue() {
    const val = Number(document.getElementById('minBookingValueInput').value);
    if (!Number.isFinite(val) || val < 0) return;
    localStorage.setItem('mysubbies_min_booking_value', String(val));
    const saved = document.getElementById('minBookingValueSaved');
    saved.style.display = 'inline';
    setTimeout(() => { saved.style.display = 'none'; }, 2000);
  }

  // ============================================================
  // PAYMENT SCHEDULES — settings + resolution queue (backend-calculated
  // milestone system, api/_lib/paymentSchedule.js). Loaded lazily since it
  // needs several server round-trips this tab's data isn't already
  // hydrated with at page load, unlike jobs/applications.
  // ============================================================
  let customersTabData = null;
  let customersTabLoading = false;
  let customerSearchQuery = '';
  let contractorSearchQuery = '';
  let contractorsStatusFilter = 'all';

  async function loadCustomersTab() {
    if (customersTabLoading) return;
    customersTabLoading = true;
    try {
      const res = await adminFetch('/api/get-admin-list?type=customers');
      const body = await res.json();
      if (!res.ok) { customersTabData = { error: body.error || 'Could not load customers.' }; }
      else { customersTabData = { rows: body.customers || [] }; }
    } catch (e) {
      customersTabData = { error: 'Could not load customers.' };
    }
    customersTabLoading = false;
    render();
  }

  // Shared caller for /api/admin-account (deactivate/reactivate/delete for
  // either role). Returns the parsed response on success, or null on
  // failure/cancel — callers only need to update local state when non-null.
  async function accountAction(role, email, action, confirmMsg) {
    if (confirmMsg && !confirm(confirmMsg)) return null;
    try {
      const res = await adminFetch('/api/admin-account', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role, email, action }),
      });
      const result = await res.json();
      if (!res.ok) { alert(result.error || 'Could not update this account.'); return null; }
      return result;
    } catch (e) { alert('Could not update this account — try again.'); return null; }
  }

  function renderCustomersTab() {
    if (!customersTabData) return '<h1 class="pagetitle">Customers</h1><div class="empty">Loading…</div>';
    if (customersTabData.error) {
      return `
        <h1 class="pagetitle">Customers</h1>
        <div class="empty">Couldn't load the customer list: ${escapeHtml(customersTabData.error)}<br><br>If this mentions a missing "status" column, run <code>supabase/schema_v4_account_status.sql</code> in the Supabase SQL editor, then reload this tab.</div>`;
    }
    const all = customersTabData.rows;
    const q = customerSearchQuery.trim().toLowerCase();
    const searched = q
      ? all.filter(c => (c.name || '').toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q))
      : all;
    const rows = customersStatusFilter === 'all' ? searched : searched.filter(c => (c.status === 'deactivated' ? 'deactivated' : 'active') === customersStatusFilter);
    return `
      <h1 class="pagetitle">Customers</h1>
      <p class="pagesub">${all.length} account${all.length === 1 ? '' : 's'} total. Deactivating blocks login on this and any other device — it doesn't touch their job history.</p>
      ${customersStatusFilterChipsHtml(all)}
      <input class="searchbox" placeholder="Search by name or email…" value="${escapeHtml(customerSearchQuery)}" oninput="customerSearchQuery=this.value; render();" />
      ${rows.length === 0 ? '<div class="empty">No customers match.</div>' : rows.map(c => `
        <div class="detailcard" style="max-width:640px;margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <div style="font-weight:700;font-size:15px;">${escapeHtml(c.name || '(no name)')}</div>
              <div style="font-size:12px;color:var(--stone);margin-top:2px;">${escapeHtml(c.email)}${c.phone ? ' · ' + escapeHtml(c.phone) : ''}</div>
            </div>
            <span class="badge ${c.status === 'deactivated' ? 'badge-deactivated' : 'badge-active'}">${c.status || 'active'}</span>
          </div>
          <div class="row"><span class="l">Registered</span><span class="r">${c.created_at ? new Date(c.created_at).toLocaleDateString('en-AU') : '—'}</span></div>
          <div style="display:flex;gap:8px;margin-top:14px;">
            ${c.status === 'deactivated'
              ? `<button class="btn btn-outline" style="flex:1;" onclick="reactivateCustomer('${escapeHtml(c.email)}')">Reactivate</button>`
              : `<button class="btn btn-outline" style="flex:1;" onclick="deactivateCustomer('${escapeHtml(c.email)}')">Deactivate</button>`}
            <button class="btn btn-danger" style="flex:1;" onclick="deleteCustomerAccount('${escapeHtml(c.email)}')">Delete permanently</button>
          </div>
        </div>
      `).join('')}
    `;
  }

  // Contractors tab (Aug 2026) -- founder feedback: "Applications" reads as
  // the vetting queue (approve/reject a new signup), not somewhere to go
  // for day-to-day account management, and there was no contractor
  // equivalent of the Customers tab to just look someone up and
  // deactivate/delete them. Sourced from the same `applications` array
  // Applications already uses (contractor accounts and their applications
  // are the same record in this schema) -- excludes 'pending' since those
  // aren't real usable accounts yet, that's still Applications' job.
  function contractorsStatusFilterChipsHtml(contractors) {
    const presentStatuses = Array.from(new Set(contractors.map(a => a.status)));
    const preferredOrder = ['approved', 'suspended', 'rejected', 'manual_review', 'preferred', 'watchlist', 'expired_documents'];
    presentStatuses.sort((a, b) => preferredOrder.indexOf(a) - preferredOrder.indexOf(b));
    const options = [{ key: 'all', label: 'All' }, ...presentStatuses.map(s => ({ key: s, label: s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) }))];
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${options.map(f => {
        const count = f.key === 'all' ? contractors.length : contractors.filter(a => a.status === f.key).length;
        const active = contractorsStatusFilter === f.key;
        return `<button onclick="contractorsStatusFilter='${f.key}'; render();" style="padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid ${active ? 'var(--ink)' : 'var(--line)'};background:${active ? 'var(--ink)' : '#fff'};color:${active ? '#fff' : 'var(--ink)'};cursor:pointer;">${f.label} (${count})</button>`;
      }).join('')}
    </div>`;
  }
  function renderContractorsTab(applications) {
    const all = applications.filter(a => a.status !== 'pending');
    if (all.length === 0) return '<h1 class="pagetitle">Contractors</h1><div class="empty">No approved contractors yet -- see Applications for pending signups.</div>';
    const q = contractorSearchQuery.trim().toLowerCase();
    const searched = q
      ? all.filter(a => (a.business || '').toLowerCase().includes(q) || (a.contact || '').toLowerCase().includes(q) || (a.email || '').toLowerCase().includes(q))
      : all;
    const rows = contractorsStatusFilter === 'all' ? searched : searched.filter(a => a.status === contractorsStatusFilter);
    const approvedCount = all.filter(a => a.status === 'approved').length;
    return `
      <h1 class="pagetitle">Contractors</h1>
      <p class="pagesub">${all.length} account${all.length === 1 ? '' : 's'} total. Deactivating blocks login and new job matches until reactivated.</p>
      ${contractorsStatusFilterChipsHtml(all)}
      <input class="searchbox" placeholder="Search by business, contact or email…" value="${escapeHtml(contractorSearchQuery)}" oninput="contractorSearchQuery=this.value; render();" />
      ${approvedCount > 0 ? `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:14px 0;max-width:640px;">
          <div style="font-size:12.5px;color:var(--stone);">
            ${selectedContractorEmails.size > 0 ? `<strong style="color:var(--ink);">${selectedContractorEmails.size}</strong> contractor${selectedContractorEmails.size === 1 ? '' : 's'} selected` : `Select approved contractors to message them`}
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-outline" style="padding:7px 14px;font-size:12.5px;" onclick="selectAllApprovedContractors(getApplications())">Select all approved (${approvedCount})</button>
            ${selectedContractorEmails.size > 0 ? `<button class="btn btn-outline" style="padding:7px 14px;font-size:12.5px;" onclick="clearContractorSelection()">Clear</button>
            <button class="btn btn-black" style="padding:7px 14px;font-size:12.5px;" onclick="openMessageComposer()">Message selected →</button>` : ''}
          </div>
        </div>
      ` : ''}
      ${rows.length === 0 ? '<div class="empty">No contractors match.</div>' : rows.map(a => `
        <div class="detailcard" style="max-width:640px;margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div style="display:flex;gap:12px;align-items:center;">
              ${a.status === 'approved' ? `<input type="checkbox" onclick="toggleContractorSelection('${a.email.replace(/'/g, "\\'")}')" ${selectedContractorEmails.has(a.email) ? 'checked' : ''} style="width:17px;height:17px;flex-shrink:0;cursor:pointer;" title="Select to message" />` : ''}
              ${a.profilePhoto ? `<img src="${escapeHtml(a.profilePhoto)}" style="width:44px;height:44px;border-radius:999px;object-fit:cover;">` : ''}
              <div>
                <div style="font-weight:700;font-size:15px;">${escapeHtml(a.business)}</div>
                <div style="font-size:12px;color:var(--stone);margin-top:2px;">${escapeHtml(a.contact)} · ${escapeHtml(a.email)}${a.phone ? ' · ' + escapeHtml(a.phone) : ''}</div>
              </div>
            </div>
            <span class="badge ${a.status === 'approved' ? 'badge-completed' : a.status === 'suspended' ? 'badge-rejected' : 'badge-feed'}">${a.status}</span>
          </div>
          <div class="row"><span class="l">Trades</span><span class="r" style="text-align:right;max-width:280px;">${escapeHtml((a.trades || []).join(', ') || '—')}</span></div>
          <div class="row"><span class="l">Applied</span><span class="r">${a.appliedAt ? new Date(a.appliedAt).toLocaleDateString('en-AU') : '—'}</span></div>
          <div style="display:flex;gap:8px;margin-top:14px;">
            <button class="btn btn-outline" style="flex:1;" onclick="openContractorThread('${a.email.replace(/'/g, "\\'")}')">💬 Messages</button>
            ${a.status === 'suspended'
              ? `<button class="btn btn-outline" style="flex:1;" onclick="reactivateContractor('${a.id}')">Reactivate</button>`
              : `<button class="btn btn-outline" style="flex:1;" onclick="deactivateContractor('${a.id}')">Deactivate</button>`}
            <button class="btn btn-danger" style="flex:1;" onclick="deleteContractorAccount('${a.id}')">Delete permanently</button>
          </div>
        </div>
      `).join('')}
      ${showMessageComposer ? messageComposerHtml() : ''}
    `;
  }

  async function deactivateCustomer(email) {
    const c = customersTabData.rows.find(x => x.email === email);
    const result = await accountAction('customer', email, 'deactivate', `Deactivate ${c?.name || email}? They won't be able to log in until reactivated. Existing job history is untouched.`);
    if (!result) return;
    c.status = 'deactivated';
    render();
  }
  async function reactivateCustomer(email) {
    const c = customersTabData.rows.find(x => x.email === email);
    const result = await accountAction('customer', email, 'reactivate', `Reactivate ${c?.name || email}? They'll be able to log in again.`);
    if (!result) return;
    c.status = 'active';
    render();
  }
  async function deleteCustomerAccount(email) {
    const c = customersTabData.rows.find(x => x.email === email);
    const result = await accountAction('customer', email, 'delete', `Permanently delete ${c?.name || email}'s account? This can't be undone, and only works if they have no job history — otherwise use Deactivate.`);
    if (!result) return;
    customersTabData.rows = customersTabData.rows.filter(x => x.email !== email);
    render();
  }

  let paymentTabData = null;
  let paymentTabLoading = false;
  // Unread contractor replies count, for the Action required checklist --
  // loaded unconditionally on every render (same reasoning as
  // paymentTabData below: an admin should see this the moment they log
  // in, not only after happening to open a specific contractor's thread).
  let unreadContractorMessageCount = null; // null = not loaded yet (distinct from a real 0)
  let unreadContractorMessageLoading = false;
  async function loadUnreadContractorMessageCount() {
    if (unreadContractorMessageLoading) return;
    unreadContractorMessageLoading = true;
    try {
      const res = await adminFetch('/api/get-admin-list?type=unread-contractor-messages');
      const data = await res.json();
      unreadContractorMessageCount = data.contractorCount || 0;
    } catch (e) { /* leave at last-known count */ }
    unreadContractorMessageLoading = false;
    render();
  }
  let editingTemplateId = null;
  let editingTemplateDraft = null;
  let buildingScheduleForJobId = null;
  let buildDraftMilestones = null;

  async function loadPaymentScheduleTab() {
    if (paymentTabLoading) return;
    paymentTabLoading = true;
    try {
      const [tRes, rRes, cRes, dRes, pRes] = await Promise.all([
        adminFetch('/api/payment-schedule-admin?type=templates'),
        adminFetch('/api/payment-schedule-admin?type=category-rules'),
        adminFetch('/api/payment-schedule-admin?type=config'),
        adminFetch('/api/get-admin-list?type=milestone-claims'),
        adminFetch('/api/get-admin-list?type=pending-schedule-jobs'),
      ]);
      const [t, r, c, d, p] = await Promise.all([tRes.json(), rRes.json(), cRes.json(), dRes.json(), pRes.json()]);
      paymentTabData = {
        templates: t.templates || [], rules: r.rules || [], config: c.config || {},
        disputedMilestones: d.milestones || [], pendingScheduleJobs: p.schedules || [],
      };
    } catch (e) {
      paymentTabData = { error: true, templates: [], rules: [], config: {}, disputedMilestones: [], pendingScheduleJobs: [] };
    }
    paymentTabLoading = false;
    render();
  }

  function renderPaymentScheduleTab() {
    if (!paymentTabData) return `<h1 class="pagetitle">Payment Schedules</h1><div class="empty">Loading…</div>`;
    const { templates, rules, config, disputedMilestones, pendingScheduleJobs, error } = paymentTabData;
    const ruleByCategory = {};
    rules.forEach(r => { ruleByCategory[r.category] = r; });
    const categories = getRateCard().map(c => c.label);

    return `
      <h1 class="pagetitle">Payment Schedules</h1>
      <div style="background:#FDEDEA;border:1.5px solid #F3C5B8;border-radius:12px;padding:16px 18px;margin-bottom:24px;">
        <div style="font-weight:700;font-size:13.5px;color:var(--warn);margin-bottom:4px;">⚠ Legal review required before production use</div>
        <div style="font-size:12.5px;color:var(--ink);">These payment schedules, deposit caps, evidence rules and dispute workflow have been built to match the requirements given to Claude, but have not been reviewed by a Victorian construction lawyer. Do not rely on this system for real customer payments until that review is complete.</div>
      </div>
      ${error ? '<div class="empty">Could not load payment schedule data — try refreshing.</div>' : `
      ${pendingScheduleJobs.length ? `
        <div style="margin-bottom:28px;">
          <h2 style="font-size:15px;margin-bottom:10px;">Jobs awaiting a project-specific schedule (${pendingScheduleJobs.length})</h2>
          ${pendingScheduleJobs.map(s => pendingScheduleJobRowHtml(s)).join('')}
        </div>` : ''}
      ${disputedMilestones.length ? `
        <div style="margin-bottom:28px;">
          <h2 style="font-size:15px;margin-bottom:10px;">Milestone Resolution Queue (${disputedMilestones.length})</h2>
          ${disputedMilestones.map(m => disputedMilestoneRowHtml(m)).join('')}
        </div>` : ''}
      <div style="margin-bottom:28px;">
        <h2 style="font-size:15px;margin-bottom:10px;">Thresholds</h2>
        ${thresholdConfigFormHtml(config)}
      </div>
      <div style="margin-bottom:28px;">
        <h2 style="font-size:15px;margin-bottom:10px;">Category → schedule type</h2>
        ${categoryRulesTableHtml(categories, ruleByCategory)}
      </div>
      <div>
        <h2 style="font-size:15px;margin-bottom:10px;">Templates</h2>
        ${templates.map(t => templateCardHtml(t)).join('')}
      </div>
      `}
    `;
  }

  function thresholdConfigFormHtml(config) {
    return `
      <div class="detailcard" style="max-width:none;">
        <div class="row"><span class="l">Deposit cap — under high-value threshold</span><span class="r"><input id="cfgDepositLow" type="number" step="0.01" value="${config.deposit_cap_low_pct}" style="width:70px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;" />%</span></div>
        <div class="row"><span class="l">Deposit cap — at/above high-value threshold</span><span class="r"><input id="cfgDepositHigh" type="number" step="0.01" value="${config.deposit_cap_high_pct}" style="width:70px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;" />%</span></div>
        <div class="row"><span class="l">High-value threshold (structural schedules ≥ this need an admin-built plan)</span><span class="r">$<input id="cfgHighValue" type="number" value="${config.high_value_threshold_cents / 100}" style="width:100px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;" /></span></div>
        <div class="row"><span class="l">Simple Service — tier 1 max</span><span class="r">$<input id="cfgSimpleT1" type="number" value="${config.simple_service_tier1_max_cents / 100}" style="width:100px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;" /></span></div>
        <div class="row"><span class="l">Simple Service — tier 2 max</span><span class="r">$<input id="cfgSimpleT2" type="number" value="${config.simple_service_tier2_max_cents / 100}" style="width:100px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;" /></span></div>
        <div class="row"><span class="l">Material-Heavy — tier 1 max</span><span class="r">$<input id="cfgMatT1" type="number" value="${config.material_heavy_tier1_max_cents / 100}" style="width:100px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;" /></span></div>
        <div class="row"><span class="l">Material-Heavy — tier 2 max</span><span class="r">$<input id="cfgMatT2" type="number" value="${config.material_heavy_tier2_max_cents / 100}" style="width:100px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;" /></span></div>
        <div class="row"><span class="l">Material-Heavy — tier 3 max</span><span class="r">$<input id="cfgMatT3" type="number" value="${config.material_heavy_tier3_max_cents / 100}" style="width:100px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;" /></span></div>
      </div>
      <div id="cfgSaveError" style="color:var(--warn);font-size:12.5px;margin-top:8px;"></div>
      <button class="btn btn-black" style="margin-top:10px;" onclick="savePaymentConfig()">Save thresholds</button>
      <span id="cfgSaved" style="display:none;color:var(--good);font-size:12.5px;margin-left:10px;">Saved ✓</span>
    `;
  }

  async function savePaymentConfig() {
    const errBox = document.getElementById('cfgSaveError');
    errBox.textContent = '';
    const config = {
      deposit_cap_low_pct: Number(document.getElementById('cfgDepositLow').value),
      deposit_cap_high_pct: Number(document.getElementById('cfgDepositHigh').value),
      high_value_threshold_cents: Math.round(Number(document.getElementById('cfgHighValue').value) * 100),
      simple_service_tier1_max_cents: Math.round(Number(document.getElementById('cfgSimpleT1').value) * 100),
      simple_service_tier2_max_cents: Math.round(Number(document.getElementById('cfgSimpleT2').value) * 100),
      material_heavy_tier1_max_cents: Math.round(Number(document.getElementById('cfgMatT1').value) * 100),
      material_heavy_tier2_max_cents: Math.round(Number(document.getElementById('cfgMatT2').value) * 100),
      material_heavy_tier3_max_cents: Math.round(Number(document.getElementById('cfgMatT3').value) * 100),
    };
    try {
      const res = await adminFetch('/api/payment-schedule-admin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save-config', config, actorId: 'admin' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not save thresholds.');
      paymentTabData.config = data.config;
      const saved = document.getElementById('cfgSaved');
      saved.style.display = 'inline';
      setTimeout(() => { saved.style.display = 'none'; }, 2000);
    } catch (e) { errBox.textContent = e.message || 'Could not save thresholds.'; }
  }

  function categoryRulesTableHtml(categories, ruleByCategory) {
    const types = ['simple_service', 'material_heavy', 'structural_inspection', 'custom', 'manual_review'];
    return `<table><thead><tr><th>Category</th><th>Schedule type</th></tr></thead><tbody>
      ${categories.map(cat => {
        const rule = ruleByCategory[cat];
        const current = rule ? rule.schedule_type : 'manual_review';
        return `<tr><td>${escapeHtml(cat)}</td><td>
          <select onchange="saveCategoryRule(${JSON.stringify(cat)}, this.value)" style="font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;">
            ${types.map(ty => `<option value="${ty}" ${current === ty ? 'selected' : ''}>${ty}</option>`).join('')}
          </select>
        </td></tr>`;
      }).join('')}
    </tbody></table>`;
  }

  async function saveCategoryRule(category, scheduleType) {
    await adminFetch('/api/payment-schedule-admin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'save-category-rule', category, scheduleType, allowJobOverride: true, actorId: 'admin' }),
    });
    paymentTabData = null;
    loadPaymentScheduleTab();
  }

  const MILESTONE_EVIDENCE_TYPES = ['none', 'photos', 'delivery_docket', 'inspection_certificate'];
  const MILESTONE_TYPES = ['deposit', 'materials_delivered', 'installation', 'foundation', 'frame', 'inspection', 'completion', 'custom'];

  function templateCardHtml(t) {
    const editing = editingTemplateId === t.id;
    const statusColor = t.status === 'approved' ? 'var(--good)' : t.status === 'pending_review' ? 'var(--warn)' : 'var(--stone)';
    const priceRange = t.min_price_cents != null ? `$${(t.min_price_cents / 100).toLocaleString()}${t.max_price_cents ? ' – $' + (t.max_price_cents / 100).toLocaleString() : '+'}` : '';
    const rows = editing ? editingTemplateDraft : t.milestones;
    return `
      <div class="detailcard" style="max-width:none;margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <div>
            <div style="font-weight:700;font-size:14px;">${escapeHtml(t.name)}</div>
            <div style="font-size:11.5px;color:var(--stone);">${escapeHtml(t.schedule_type)} · ${priceRange} · deposit ${t.deposit_pct}%</div>
          </div>
          <span class="badge" style="background:#F0EFEA;color:${statusColor};">${t.status}${t.is_builtin ? ' · built-in' : ''}</span>
        </div>
        ${(rows || []).map((m, idx) => editing ? `
          <div style="display:flex;gap:5px;align-items:center;padding:5px 0;border-top:1px solid var(--paper);flex-wrap:wrap;">
            <input id="draftLabel${idx}" value="${escapeHtml(m.label)}" style="flex:1;min-width:100px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;" />
            <input id="draftPct${idx}" type="number" step="0.01" value="${m.pct}" style="width:56px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;" />%
            <select id="draftEvidence${idx}" style="font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:5px 3px;">
              ${MILESTONE_EVIDENCE_TYPES.map(v => `<option value="${v}" ${m.requires_evidence_type === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <select id="draftType${idx}" style="font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:5px 3px;">
              ${MILESTONE_TYPES.map(v => `<option value="${v}" ${m.milestone_type === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <input id="draftKey${idx}" value="${escapeHtml(m.key)}" style="display:none;" />
            <button onclick="moveDraftMilestone(${idx},-1)" class="btn btn-outline" style="padding:4px 8px;">↑</button>
            <button onclick="moveDraftMilestone(${idx},1)" class="btn btn-outline" style="padding:4px 8px;">↓</button>
            <button onclick="removeDraftMilestone(${idx})" class="btn btn-outline" style="padding:4px 8px;color:var(--warn);">×</button>
          </div>
        ` : `
          <div class="row"><span class="l">${escapeHtml(m.label)} <span style="color:var(--stone-light);">(${escapeHtml(m.requires_evidence_type)})</span></span><span class="r">${m.pct}%</span></div>
        `).join('')}
        ${editing ? `
          <div id="templateSaveError" style="color:var(--warn);font-size:12px;margin-top:6px;"></div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
            <button class="btn btn-outline" onclick="addDraftMilestone()">+ Add milestone</button>
            <button class="btn btn-outline" onclick="cancelEditTemplate()">Cancel</button>
            <button class="btn btn-black" onclick="saveEditedTemplate(${JSON.stringify(t.id)})">Save</button>
          </div>
        ` : `
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-outline" onclick="startEditTemplate(${JSON.stringify(t.id)})">Edit</button>
            ${t.status === 'pending_review' ? `<button class="btn btn-black" onclick="approveTemplate(${JSON.stringify(t.id)})">Approve</button>` : ''}
          </div>
        `}
      </div>
    `;
  }

  function startEditTemplate(templateId) {
    const t = paymentTabData.templates.find(x => x.id === templateId);
    if (!t) return;
    editingTemplateId = templateId;
    editingTemplateDraft = t.milestones.map(m => ({ ...m }));
    render();
  }
  function cancelEditTemplate() { editingTemplateId = null; editingTemplateDraft = null; render(); }
  function addDraftMilestone() {
    editingTemplateDraft.push({ key: 'milestone_' + editingTemplateDraft.length, label: 'New milestone', pct: 0, milestone_type: 'custom', requires_evidence_type: 'photos', requires_customer_approval: true });
    render();
  }
  function removeDraftMilestone(idx) { editingTemplateDraft.splice(idx, 1); render(); }
  function moveDraftMilestone(idx, dir) {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= editingTemplateDraft.length) return;
    const tmp = editingTemplateDraft[idx];
    editingTemplateDraft[idx] = editingTemplateDraft[newIdx];
    editingTemplateDraft[newIdx] = tmp;
    render();
  }

  async function saveEditedTemplate(templateId) {
    const t = paymentTabData.templates.find(x => x.id === templateId);
    const milestones = editingTemplateDraft.map((m, idx) => ({
      key: (document.getElementById('draftKey' + idx).value.trim() || m.key),
      label: document.getElementById('draftLabel' + idx).value.trim(),
      pct: Number(document.getElementById('draftPct' + idx).value),
      milestone_type: document.getElementById('draftType' + idx).value,
      requires_evidence_type: document.getElementById('draftEvidence' + idx).value,
      requires_customer_approval: m.requires_customer_approval !== false,
    }));
    const errBox = document.getElementById('templateSaveError');
    try {
      const res = await adminFetch('/api/payment-schedule-admin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save-template', template: { ...t, milestones }, actorId: 'admin' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not save template.');
      editingTemplateId = null; editingTemplateDraft = null;
      paymentTabData = null;
      loadPaymentScheduleTab();
    } catch (e) { if (errBox) errBox.textContent = e.message || 'Could not save template.'; }
  }

  async function approveTemplate(templateId) {
    await adminFetch('/api/payment-schedule-admin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'approve-template', templateId, actorId: 'admin' }),
    });
    paymentTabData = null;
    loadPaymentScheduleTab();
  }

  function pendingScheduleJobRowHtml(s) {
    const building = buildingScheduleForJobId === s.job_id;
    const remainingCents = s.revised_total_price_cents - s.deposit_amount_cents;
    return `<div class="detailcard" style="max-width:none;margin-bottom:12px;">
      <div class="row"><span class="l">Job</span><span class="r">${escapeHtml(s.job_id)}</span></div>
      <div class="row"><span class="l">Total contract value</span><span class="r">$${(s.revised_total_price_cents / 100).toLocaleString()}</span></div>
      <div class="row"><span class="l">Deposit (paid)</span><span class="r">$${(s.deposit_amount_cents / 100).toLocaleString()}</span></div>
      <div class="row"><span class="l">Remaining to schedule</span><span class="r" style="font-weight:700;">$${(remainingCents / 100).toLocaleString()}</span></div>
      ${building ? buildScheduleFormHtml(s.job_id) : `<button class="btn btn-black" style="margin-top:10px;" onclick="startBuildSchedule(${JSON.stringify(s.job_id)})">Build schedule</button>`}
    </div>`;
  }

  function startBuildSchedule(jobId) {
    buildingScheduleForJobId = jobId;
    buildDraftMilestones = [
      { key: 'materials', label: 'Materials delivered', pct: 30, milestone_type: 'materials_delivered', requires_evidence_type: 'delivery_docket' },
      { key: 'completion', label: 'Job completion', pct: 70, milestone_type: 'completion', requires_evidence_type: 'photos' },
    ];
    render();
  }
  function cancelBuildSchedule() { buildingScheduleForJobId = null; buildDraftMilestones = null; render(); }
  function addBuildMilestone() {
    buildDraftMilestones.push({ key: 'milestone_' + buildDraftMilestones.length, label: 'New milestone', pct: 0, milestone_type: 'custom', requires_evidence_type: 'photos' });
    render();
  }
  function removeBuildMilestone(idx) { buildDraftMilestones.splice(idx, 1); render(); }

  function buildScheduleFormHtml(jobId) {
    return `
      <div style="margin-top:10px;">
        ${buildDraftMilestones.map((m, idx) => `
          <div style="display:flex;gap:5px;align-items:center;padding:5px 0;border-top:1px solid var(--paper);flex-wrap:wrap;">
            <input id="buildLabel${idx}" value="${escapeHtml(m.label)}" style="flex:1;min-width:100px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;" />
            <input id="buildPct${idx}" type="number" step="0.01" value="${m.pct}" style="width:56px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;" />%
            <select id="buildEvidence${idx}" style="font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:5px 3px;">
              ${MILESTONE_EVIDENCE_TYPES.map(v => `<option value="${v}" ${m.requires_evidence_type === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <button onclick="removeBuildMilestone(${idx})" class="btn btn-outline" style="padding:4px 8px;color:var(--warn);">×</button>
          </div>
        `).join('')}
        <div id="buildScheduleError" style="color:var(--warn);font-size:12px;margin-top:6px;"></div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
          <button class="btn btn-outline" onclick="addBuildMilestone()">+ Add milestone</button>
          <button class="btn btn-outline" onclick="cancelBuildSchedule()">Cancel</button>
          <button class="btn btn-black" onclick="saveBuiltSchedule(${JSON.stringify(jobId)})">Save schedule</button>
        </div>
      </div>
    `;
  }

  async function saveBuiltSchedule(jobId) {
    const milestones = buildDraftMilestones.map((m, idx) => ({
      key: m.key,
      label: document.getElementById('buildLabel' + idx).value.trim(),
      pct: Number(document.getElementById('buildPct' + idx).value),
      milestone_type: m.milestone_type,
      requires_evidence_type: document.getElementById('buildEvidence' + idx).value,
      requires_customer_approval: true,
    }));

    try {
      const res = await adminFetch('/api/payment-schedule-admin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'build-job-schedule', jobId, milestones, actorId: 'admin' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not save schedule.');
      buildingScheduleForJobId = null; buildDraftMilestones = null;
      paymentTabData = null;
      loadPaymentScheduleTab();
    } catch (e) { if (errBox) errBox.textContent = e.message || 'Could not save schedule.'; }

  function disputedMilestoneRowHtml(m) {
    const disputes = m.payment_milestone_disputes || [];
    const dispute = disputes.find(d => d.status === 'open') || disputes[disputes.length - 1];
    const evidenceRows = m.milestone_evidence || [];
    const evidence = evidenceRows[evidenceRows.length - 1];
    const jobId = m.job_payment_schedules ? m.job_payment_schedules.job_id : '';
    const relatedJob = jobId ? getJobs().find(j => j.id === jobId) : null;
    const jobLabel = relatedJob && relatedJob.jobNumber ? `#${relatedJob.jobNumber}` : jobId;
    return `<div class="detailcard" style="max-width:none;margin-bottom:12px;">
      <div class="row"><span class="l">Job</span><span class="r">${escapeHtml(jobLabel)}</span></div>
      <div class="row"><span class="l">Milestone</span><span class="r">${escapeHtml(m.label)} (${m.pct}%, $${(m.amount_cents / 100).toLocaleString()})</span></div>
      ${dispute ? `<div class="row"><span class="l">Customer's reason</span><span class="r" style="text-align:right;max-width:60%;">${escapeHtml(dispute.reason || '')}</span></div>` : ''}
      ${evidence ? `
        <div style="font-size:12px;color:var(--stone);margin:8px 0;">${escapeHtml(evidence.description || '')}</div>
        ${evidence.photo_urls && evidence.photo_urls.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-bottom:8px;">${evidence.photo_urls.map(src => `<img src="${escapeHtml(src)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;" />`).join('')}</div>` : ''}
        ${evidence.delivery_docket_url ? `<div style="font-size:12px;margin-bottom:8px;"><a href="${escapeHtml(evidence.delivery_docket_url)}" target="_blank">View delivery docket</a></div>` : ''}
      ` : ''}
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        <button class="btn btn-black" onclick="resolveMilestone(${JSON.stringify(m.id)},'approve')">Approve payment</button>
        <button class="btn btn-outline" onclick="resolveMilestone(${JSON.stringify(m.id)},'reject')">Reject claim</button>
        <button class="btn btn-outline" onclick="resolveMilestone(${JSON.stringify(m.id)},'request_evidence')">Request more evidence</button>
        <button class="btn btn-outline" onclick="resolveMilestone(${JSON.stringify(m.id)},'return_to_contractor')">Return to contractor</button>
      </div>
    </div>`;
  }

  async function resolveMilestone(milestoneId, adminAction) {
    const needsNotes = adminAction !== 'approve';
    const notes = needsNotes ? prompt('Notes for this decision (shown in the audit log, optional):') : null;
    if (needsNotes && notes === null) return; // cancelled the prompt
    await adminFetch('/api/milestone', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'admin-resolve', milestoneId, adminAction, adminNotes: notes, actorId: 'admin' }),
    });
    paymentTabData = null;
    loadPaymentScheduleTab();
  }

  // Search (added Aug 2026) -- with 21+ categories and ~163 tasks, finding
  // one specific service meant scrolling through the entire card (founder
  // report). Filters by category label or task name, client-side (all data
  // is already local). Tasks are filtered for DISPLAY only -- editService()/
  // toggleServiceDisabled() re-fetch the real rate card and index into the
  // REAL cat.tasks array by position, so every onclick/onchange below must
  // keep using each task's real index (realIdx), never its position in the
  // filtered list, or a search-narrowed view would silently edit the wrong
  // task.
  function rateCardManageHtml(categories, query) {
    // Deleted categories/tasks stay in the underlying array as tombstones
    // (see deleteCategory/deleteTask below) so the customer-side additive
    // merge never resurrects them -- they're filtered out of the admin's
    // own view right here, so a delete reads as a real removal, not a hide.
    categories = categories.filter(c => !c.deleted);
    if (categories.length === 0) return '<div class="empty">No rate card loaded yet. Visit the live site once to initialize it from the defaults, upload a CSV above, or add your first service via Research New.</div>';
    const q = (query || '').trim().toLowerCase();
    const withRealIdx = categories.map(c => ({ ...c, tasksWithIdx: c.tasks.map((t, realIdx) => ({ t, realIdx })).filter(({ t }) => !t.deleted) }));
    const filtered = !q ? withRealIdx : withRealIdx
      .map(c => {
        const catMatches = c.label.toLowerCase().includes(q);
        const tasksWithIdx = catMatches ? c.tasksWithIdx : c.tasksWithIdx.filter(({ t }) => t.name.toLowerCase().includes(q));
        return { ...c, tasksWithIdx };
      })
      .filter(c => c.tasksWithIdx.length > 0);
    if (q && filtered.length === 0) return `<div class="empty">No services match "${escapeHtml(query)}".</div>`;
    // A category is open if the admin has toggled it open, if it's mid-add,
    // or (while searching) simply because it has a match -- search should
    // never require an extra click to see the result it just found.
    return `<div class="rc-cat-list">` + filtered.map(c => {
      const safeLabel = c.label.replace(/'/g, "\\'");
      const isOpen = q ? true : (rcExpandedCategories.has(c.label) || c.label === rcAddingTaskCat);
      const disabledCount = c.tasksWithIdx.filter(({ t }) => t.disabled).length;
      return `
      <div class="rc-cat ${isOpen ? 'rc-cat-open' : ''}">
        <div class="rc-cat-head" onclick="toggleRcCategory('${safeLabel}')">
          <span class="rc-cat-chevron">›</span>
          <span class="rc-cat-icon">${c.icon || ''}</span>
          <span class="rc-cat-name">${escapeHtml(c.label)}</span>
          <span class="rc-cat-count">${c.tasksWithIdx.length} task${c.tasksWithIdx.length === 1 ? '' : 's'}${disabledCount ? ` · ${disabledCount} held` : ''}</span>
          <button type="button" class="rc-cat-delete-btn" onclick="deleteCategory('${safeLabel}', event)" title="Permanently delete this whole category">Delete category</button>
        </div>
        ${isOpen ? `
        <div class="rc-cat-body">
          ${c.tasksWithIdx.map(({ t, realIdx }) => {
            const draft = rcTaskDrafts[c.label + '__' + realIdx];
            const nameVal = draft ? draft.name : t.name;
            const unitVal = draft ? draft.unit : t.unit;
            const rateVal = draft ? draft.rate : (t.rate === null ? '' : t.rate);
            const minJobPriceVal = draft ? draft.minJobPrice : (t.minJobPrice == null ? '' : t.minJobPrice);
            const notesVal = draft ? draft.notes : (t.notes || '');
            const rowId = rcRowId(c.label, realIdx);
            return `
            <div class="rc-task ${t.disabled ? 'rc-task-held' : ''}">
              <div class="rc-task-row">
                <div class="rc-photo-wrap">
                  ${t.photoDataUrl ? `
                    <img src="${t.photoDataUrl}" class="rc-photo-thumb" onclick="document.getElementById('rcPhotoInput-${rowId}').click()" title="Change photo" />
                    <button type="button" class="rc-photo-remove" onclick="removeTaskPhoto('${safeLabel}', ${realIdx}, event)" title="Remove photo">✕</button>
                  ` : `
                    <button type="button" class="rc-photo-add" onclick="document.getElementById('rcPhotoInput-${rowId}').click()" title="Add a photo for this task">📷</button>
                  `}
                  <input type="file" accept="image/*" id="rcPhotoInput-${rowId}" style="display:none;" onchange="onTaskPhotoSelected('${safeLabel}', ${realIdx}, event)" />
                </div>
                <input type="text" value="${escapeHtml(nameVal)}" oninput="rcSetTaskDraft('${safeLabel}', ${realIdx}, 'name', this.value)" class="rc-input rc-input-name" ${t.disabled ? 'disabled' : ''} />
                <input type="text" value="${escapeHtml(unitVal)}" oninput="rcSetTaskDraft('${safeLabel}', ${realIdx}, 'unit', this.value)" class="rc-input rc-input-unit" placeholder="unit" ${t.disabled ? 'disabled' : ''} />
                <div class="rc-input-rate-wrap">
                  <span class="rc-dollar">$</span>
                  <input type="number" value="${rateVal}" oninput="rcSetTaskDraft('${safeLabel}', ${realIdx}, 'rate', this.value)" class="rc-input rc-input-rate" ${t.disabled ? 'disabled' : ''} />
                </div>
                ${t.disabled ? '<span class="rc-held-badge">Held</span>' : ''}
                <button onclick="toggleServiceDisabled('${safeLabel}', ${realIdx})" class="rc-hold-btn">${t.disabled ? 'Unhold' : 'Hold'}</button>
                <button onclick="deleteTask('${safeLabel}', ${realIdx}, event)" class="rc-delete-btn" title="Permanently delete this task">Delete</button>
                <button id="rcSaveBtn-${rowId}" onclick="saveTaskRow('${safeLabel}', ${realIdx})" class="rc-save-btn" ${draft ? '' : 'disabled'}>Save</button>
                <span id="rcSavedMsg-${rowId}" class="rc-saved-msg" style="display:none;">✓ Saved</span>
              </div>
              <div class="rc-min-row">
                <span class="rc-min-label">Minimum charge</span>
                <div class="rc-input-rate-wrap">
                  <span class="rc-dollar">$</span>
                  <input type="number" value="${minJobPriceVal}" oninput="rcSetTaskDraft('${safeLabel}', ${realIdx}, 'minJobPrice', this.value)" class="rc-input rc-input-rate" placeholder="none" ${t.disabled ? 'disabled' : ''} />
                </div>
                <span class="rc-min-hint">Floor price for this task, even on a tiny job — leave blank for none</span>
              </div>
              <textarea oninput="rcSetTaskDraft('${safeLabel}', ${realIdx}, 'notes', this.value)" placeholder="What's included, materials/spec standards, exclusions — shown to the customer under this task in the estimator." class="rc-notes" ${t.disabled ? 'disabled' : ''}>${escapeHtml(notesVal)}</textarea>
            </div>
          `;
          }).join('')}
          ${c.label === rcAddingTaskCat ? `
            <div class="rc-new-task">
              <div class="rc-new-task-label">New task</div>
              <div class="rc-task-row" style="margin-bottom:8px;">
                <input type="text" value="${escapeHtml(rcNewTaskDraft.name)}" oninput="rcNewTaskDraft.name=this.value" placeholder="Task name (e.g. Removal of existing tile floor)" class="rc-input rc-input-name" />
                <input type="text" value="${escapeHtml(rcNewTaskDraft.unit)}" oninput="rcNewTaskDraft.unit=this.value" placeholder="unit" class="rc-input rc-input-unit" />
                <div class="rc-input-rate-wrap">
                  <span class="rc-dollar">$</span>
                  <input type="number" value="${escapeHtml(rcNewTaskDraft.rate)}" oninput="rcNewTaskDraft.rate=this.value" placeholder="Rate" class="rc-input rc-input-rate" />
                </div>
              </div>
              <div class="rc-min-row" style="margin-bottom:8px;">
                <span class="rc-min-label">Minimum charge</span>
                <div class="rc-input-rate-wrap">
                  <span class="rc-dollar">$</span>
                  <input type="number" value="${escapeHtml(rcNewTaskDraft.minJobPrice)}" oninput="rcNewTaskDraft.minJobPrice=this.value" placeholder="none" class="rc-input rc-input-rate" />
                </div>
                <span class="rc-min-hint">Optional — leave blank for none</span>
              </div>
              <textarea oninput="rcNewTaskDraft.notes=this.value" placeholder="Customer-facing details / specs (optional)" class="rc-notes" style="margin-bottom:8px;">${escapeHtml(rcNewTaskDraft.notes)}</textarea>
              <div id="rcNewTaskError"></div>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-black" style="width:auto;padding:7px 16px;font-size:12.5px;" onclick="saveNewTask('${safeLabel}')">Add task</button>
                <button class="btn btn-outline" style="width:auto;padding:7px 16px;font-size:12.5px;" onclick="cancelAddTaskForm()">Cancel</button>
              </div>
            </div>
          ` : `
            <button class="btn btn-outline" style="width:auto;padding:7px 14px;font-size:12.5px;margin-top:4px;" onclick="openAddTaskForm('${safeLabel}')">+ Add task</button>
          `}
        </div>
        ` : ''}
      </div>
    `;
    }).join('') + `</div>`;
  }

  function openResearch() {
    const q = document.getElementById('researchQuery').value.trim();
    if (!q) return;
    window.open(`https://www.google.com/search?q=${encodeURIComponent(q + ' Melbourne trade price 2026')}`, '_blank');
    document.getElementById('newSvcCategory').value = q;
  }

  let researchRows = [{ task: '', unit: '', low: '', high: '', notes: '' }, { task: '', unit: '', low: '', high: '', notes: '' }, { task: '', unit: '', low: '', high: '', notes: '' }];

  function researchRowAvg(row) {
    const low = parseFloat(row.low), high = parseFloat(row.high);
    if (!isNaN(low) && !isNaN(high)) return Math.round((low + high) / 2 * 100) / 100;
    if (!isNaN(low)) return low;
    if (!isNaN(high)) return high;
    return null;
  }

  function researchRowsHtml() {
    return `
      <table style="width:100%;border-collapse:collapse;margin-bottom:10px;">
        <thead><tr>
          <th style="text-align:left;font-size:10.5px;color:var(--stone);padding:4px;">Sub-category / task</th>
          <th style="text-align:left;font-size:10.5px;color:var(--stone);padding:4px;width:60px;">Unit</th>
          <th style="text-align:left;font-size:10.5px;color:var(--stone);padding:4px;width:70px;">Low $</th>
          <th style="text-align:left;font-size:10.5px;color:var(--stone);padding:4px;width:70px;">High $</th>
          <th style="text-align:left;font-size:10.5px;color:var(--stone);padding:4px;width:70px;">Avg $</th>
          <th style="width:24px;"></th>
        </tr></thead>
        <tbody>
          ${researchRows.map((row, i) => {
            const avg = researchRowAvg(row);
            return `
            <tr>
              <td style="padding:3px;"><input type="text" value="${escapeHtml(row.task)}" oninput="researchRows[${i}].task=this.value" placeholder="e.g. Install — small" style="width:100%;font-size:12px;padding:6px 7px;border:1px solid var(--line);border-radius:5px;"></td>
              <td style="padding:3px;"><input type="text" value="${escapeHtml(row.unit)}" oninput="researchRows[${i}].unit=this.value" placeholder="m²" style="width:100%;font-size:12px;padding:6px 7px;border:1px solid var(--line);border-radius:5px;"></td>
              <td style="padding:3px;"><input type="number" value="${row.low}" oninput="researchRows[${i}].low=this.value; document.getElementById('researchAvg${i}').textContent = researchRowAvg(researchRows[${i}]) === null ? '—' : '$' + researchRowAvg(researchRows[${i}]).toLocaleString();" style="width:100%;font-size:12px;padding:6px 7px;border:1px solid var(--line);border-radius:5px;"></td>
              <td style="padding:3px;"><input type="number" value="${row.high}" oninput="researchRows[${i}].high=this.value; document.getElementById('researchAvg${i}').textContent = researchRowAvg(researchRows[${i}]) === null ? '—' : '$' + researchRowAvg(researchRows[${i}]).toLocaleString();" style="width:100%;font-size:12px;padding:6px 7px;border:1px solid var(--line);border-radius:5px;"></td>
              <td style="padding:3px;font-size:12.5px;font-weight:600;" id="researchAvg${i}">${avg === null ? '—' : '$' + avg.toLocaleString()}</td>
              <td style="padding:3px;text-align:center;"><span onclick="removeResearchRow(${i})" style="cursor:pointer;color:var(--stone-light);font-size:14px;" title="Remove row">✕</span></td>
            </tr>
            <tr><td colspan="6" style="padding:0 3px 6px;"><input type="text" value="${escapeHtml(row.notes)}" oninput="researchRows[${i}].notes=this.value" placeholder="Notes shown to customers (optional)" style="width:100%;font-size:11.5px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;color:var(--stone);"></td></tr>
          `;
          }).join('')}
        </tbody>
      </table>
    `;
  }

  function addResearchRow() {
    researchRows.push({ task: '', unit: '', low: '', high: '', notes: '' });
    document.getElementById('researchRowsWrap').innerHTML = researchRowsHtml();
  }

  function removeResearchRow(i) {
    researchRows.splice(i, 1);
    document.getElementById('researchRowsWrap').innerHTML = researchRowsHtml();
  }

  function addResearchedServices() {
    const category = document.getElementById('newSvcCategory').value.trim();
    const errBox = document.getElementById('addSvcError');
    if (!category) { errBox.innerHTML = '<div class="error" style="margin-top:10px;">Enter a category name first.</div>'; return; }
    const validRows = researchRows.filter(r => r.task.trim() && r.unit.trim() && researchRowAvg(r) !== null);
    if (validRows.length === 0) { errBox.innerHTML = '<div class="error" style="margin-top:10px;">Fill in at least one row with a task, unit, and a low or high price.</div>'; return; }

    const categories = getRateCard();
    let cat = categories.find(c => c.label.toLowerCase() === category.toLowerCase());
    if (!cat) { cat = { label: category, icon: '🔧', tasks: [] }; categories.push(cat); }
    // Same duplicate guard as saveNewTask() -- this used to push every row
    // blindly, which is the other real path (besides the quick "+Add task"
    // form) that could create the duplicate tasks the founder reported.
    // Revive a tombstoned match, skip an already-active match (report it
    // rather than silently overwrite a price an admin may have since edited).
    let addedCount = 0, revivedCount = 0, skippedCount = 0;
    validRows.forEach(r => {
      const name = r.task.trim();
      const existing = cat.tasks.find(t => t.name.trim().toLowerCase() === name.toLowerCase());
      if (existing && !existing.deleted) { skippedCount++; return; }
      if (existing && existing.deleted) {
        existing.deleted = false; existing.disabled = false; existing.unavailable = false;
        existing.unit = r.unit.trim(); existing.rate = researchRowAvg(r); existing.notes = r.notes.trim();
        revivedCount++;
      } else {
        cat.tasks.push({ name, unit: r.unit.trim(), rate: researchRowAvg(r), notes: r.notes.trim() });
        addedCount++;
      }
    });
    saveRateCard(categories);

    researchRows = [{ task: '', unit: '', low: '', high: '', notes: '' }, { task: '', unit: '', low: '', high: '', notes: '' }, { task: '', unit: '', low: '', high: '', notes: '' }];
    const parts = [];
    if (addedCount) parts.push(`added ${addedCount} new`);
    if (revivedCount) parts.push(`restored ${revivedCount} previously-deleted`);
    if (skippedCount) parts.push(`skipped ${skippedCount} already in the rate card`);
    errBox.innerHTML = `<div class="note" style="margin-top:10px;">✓ ${parts.join(', ')} — ${escapeHtml(category)}.</div>`;
    document.getElementById('researchRowsWrap').innerHTML = researchRowsHtml();
  }

  function editService(catLabel, taskIdx, field, value) {
    const categories = getRateCard();
    const cat = categories.find(c => c.label === catLabel);
    if (!cat) return;
    const task = cat.tasks[taskIdx];
    task[field] = field === 'rate' ? (value === '' ? null : Number(value)) : value;
    saveRateCard(categories);
  }

  function toggleServiceDisabled(catLabel, taskIdx) {
    const categories = getRateCard();
    const cat = categories.find(c => c.label === catLabel);
    if (!cat) return;
    cat.tasks[taskIdx].disabled = !cat.tasks[taskIdx].disabled;
    saveRateCard(categories);
    render();
  }

  // Permanent delete (Aug 2026, founder report of duplicate categories/tasks
  // piling up) -- distinct from Hold, which just hides a task from customers
  // while keeping it re-enablable. This is a soft delete: the task/category
  // stays in the array with deleted:true rather than being spliced out,
  // because mysubbies-website.html's mergeRateCardUpdates() only skips
  // re-adding a DEFAULT_CATEGORIES entry when it can already find a
  // same-named one in the stored data -- splicing it out would make that
  // lookup fail and silently resurrect it on every visitor's next load.
  // Also sets disabled+unavailable so every existing customer-facing filter
  // (all of which already check one or both of those flags) treats it as
  // fully gone with zero changes needed on that side. rateCardManageHtml()
  // filters deleted:true out of admin's own view, so it reads as a real
  // removal here too.
  function deleteTask(catLabel, realIdx, event) {
    if (event) event.stopPropagation();
    const categories = getRateCard();
    const cat = categories.find(c => c.label === catLabel);
    if (!cat) return;
    const task = cat.tasks[realIdx];
    if (!task) return;
    if (!confirm(`Permanently delete "${task.name}" from ${catLabel}?\n\nCustomers will no longer see this task. This can't be undone from here (Hold is reversible, Delete isn't).`)) return;
    task.deleted = true;
    task.disabled = true;
    task.unavailable = true;
    delete rcTaskDrafts[catLabel + '__' + realIdx];
    saveRateCard(categories);
    const list = document.getElementById('rcManageList');
    if (list) list.innerHTML = rateCardManageHtml(getRateCard(), rcManageSearchQuery);
  }

  function deleteCategory(catLabel, event) {
    if (event) event.stopPropagation(); // don't also toggle the accordion open/closed
    const categories = getRateCard();
    const cat = categories.find(c => c.label === catLabel);
    if (!cat) return;
    const activeCount = cat.tasks.filter(t => !t.deleted).length;

  // Minimal CSV parser handling quoted fields with embedded commas.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i + 1];
      if (inQuotes) {
        if (ch === '"' && next === '"') { field += '"'; i++; }
        else if (ch === '"') { inQuotes = false; }
        else { field += ch; }
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ',') { row.push(field); field = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && next === '\n') i++;
          row.push(field); field = '';
          if (row.some(f => f !== '')) rows.push(row);
          row = [];
        } else { field += ch; }
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function onRateCardFileSelected(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const rows = parseCSV(ev.target.result);
      if (rows.length < 2) { document.getElementById('rcUploadPreview').innerHTML = '<div class="error" style="margin-top:12px;">That file doesn’t look right — no rows found.</div>'; return; }
      const header = rows[0].map(h => h.trim().toLowerCase());
      const idx = { category: header.indexOf('category'), task: header.indexOf('task'), unit: header.indexOf('unit'), rate: header.indexOf('rate'), notes: header.indexOf('notes') };
      if (idx.category === -1 || idx.task === -1 || idx.unit === -1 || idx.rate === -1) {
        document.getElementById('rcUploadPreview').innerHTML = '<div class="error" style="margin-top:12px;">Missing required columns. Expected: Category, Task, Unit, Rate (Notes optional).</div>';
        return;
      }
      const dataRows = rows.slice(1).filter(r => r[idx.category]);
      pendingUploadRows = dataRows.map(r => ({
        category: r[idx.category].trim(), task: r[idx.task].trim(), unit: r[idx.unit].trim(),
        rate: r[idx.rate].trim() === '' ? null : Number(r[idx.rate]),
        notes: idx.notes > -1 ? (r[idx.notes] || '').trim() : '',
      }));
      const uniqueCats = [...new Set(pendingUploadRows.map(r => r.category))];
      document.getElementById('rcUploadPreview').innerHTML = `
        <div style="background:var(--paper);border-radius:10px;padding:14px;margin-top:14px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:6px;">Preview: ${pendingUploadRows.length} tasks across ${uniqueCats.length} categories</div>
          <div style="font-size:12px;color:var(--stone);margin-bottom:10px;">${uniqueCats.slice(0, 8).join(', ')}${uniqueCats.length > 8 ? ', +' + (uniqueCats.length - 8) + ' more' : ''}</div>
          <div style="font-size:12px;color:var(--warn);margin-bottom:10px;">⚠ This will replace the entire live rate card.</div>
          <button class="btn btn-black" onclick="confirmRateCardUpload()">Confirm & publish</button>
        </div>
      `;
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function confirmRateCardUpload() {
    if (!pendingUploadRows) return;
    const grouped = {};
    pendingUploadRows.forEach(r => {
      if (!grouped[r.category]) grouped[r.category] = { label: r.category, icon: '🔧', tasks: [] };
      grouped[r.category].tasks.push({ name: r.task, unit: r.unit, rate: r.rate, notes: r.notes });
    });
    saveRateCard(Object.values(grouped));
    pendingUploadRows = null;
    render();
  }

  async function deactivateContractor(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    const result = await accountAction('contractor', a.email, 'deactivate', `Deactivate ${a.business}? They won't be able to log in or receive new jobs until reactivated.`);

    a.status = 'suspended';

    a.status = 'approved';

    const apps = getApplications();

  // Job creation date wasn't shown anywhere in the table, which made it
  // impossible to see at a glance how long a job had been sitting awaiting
  // a contractor (founder ask, Aug 2026: "monitor how old the job is and
  // how long it's taking to allocate"). Falls back to parsing the
  // timestamp embedded in the job id (job_<ms>_<rand>) for older records
  // that predate the createdAt field, rather than showing a blank.
  function jobSubmittedText(j) {
    let ts = j.createdAt ? new Date(j.createdAt) : null;
    if (!ts || isNaN(ts.getTime())) {
      const m = /^job_(\d+)_/.exec(j.id || '');
      ts = m ? new Date(Number(m[1])) : null;
    }
    if (!ts || isNaN(ts.getTime())) return { date: '—', relative: '' };
    const days = Math.floor((Date.now() - ts.getTime()) / 86400000);
    const relative = days <= 0 ? 'Today' : days === 1 ? '1 day ago' : `${days} days ago`;
    return { date: ts.toLocaleDateString('en-AU'), relative };
  }
