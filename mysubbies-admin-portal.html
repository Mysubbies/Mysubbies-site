<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mysubbies — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #171717; --black: #000000; --white: #FFFFFF; --paper: #F7F7F5;
    --stone: #6B6B68; --stone-light: #9C9C97; --line: #E4E4E1; --good: #2F7A50; --warn: #B0592E;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1, h2 { font-weight:800; letter-spacing:-0.02em; }
  a { color:inherit; text-decoration:none; }
  header { background: var(--black); }
  .navwrap { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { display:flex; align-items:center; gap:9px; }
  .logo-mark { width:28px; height:28px; border-radius:7px; background:#fff; }
  .logo-word { font-weight:800; font-size:19px; color:#fff; }
  .navlinks { display:flex; align-items:center; gap:22px; font-size:13px; }
  .navlinks a { color:rgba(255,255,255,0.65); }
  .navlinks a.current { color:#fff; font-weight:600; }
  .wrap { max-width:880px; margin:0 auto; padding:32px 24px 80px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
  .btn-black { background:var(--black); color:#fff; }
  .btn-outline { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .statgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
  @media (max-width:700px) { .statgrid { grid-template-columns:1fr 1fr; } }
  .statcard { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .statcard .num { font-size:24px; font-weight:800; }
  .statcard .lab { font-size:12px; color:var(--stone); margin-top:2px; }
  .tabs { display:flex; gap:6px; background:#EFEDE9; padding:4px; border-radius:10px; margin-bottom:24px; width:fit-content; }
  .tabs button { padding:9px 16px; border-radius:7px; font-size:13px; font-weight:600; border:none; cursor:pointer; background:transparent; color:var(--stone); }
  .tabs button.active { background:#fff; color:var(--ink); }
  h1.pagetitle { font-size:22px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--stone); padding:12px 16px; background:var(--paper); }
  td { padding:14px 16px; font-size:13px; border-top:1px solid var(--paper); }
  tr.jobrow { cursor:pointer; }
  tr.jobrow:hover { background:var(--paper); }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-block; }
  .badge-feed { background:#FFF6E5; color:#8A6D2E; }
  .badge-assigned { background:#E9F1F9; color:#2E5E8A; }
  .badge-completed { background:#EAF5EE; color:var(--good); }
  .badge-rejected { background:#FDEDEA; color:var(--warn); }
  .empty { text-align:center; padding:60px 20px; color:var(--stone); font-size:14px; }
  .backbtn { font-size:13px; color:var(--stone); background:none; border:none; cursor:pointer; margin-bottom:16px; display:flex; align-items:center; gap:4px; }
  .detailcard { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; max-width:520px; }
  .row { display:flex; justify-content:space-between; font-size:14px; padding:9px 0; border-top:1px solid var(--paper); }
  .row:first-child { border-top:none; }
  .row .l { color:var(--stone); }
  .row .r { font-weight:700; }
  .row.commission .r { color:var(--warn); }
  .row.payout .r { color:var(--good); font-size:16px; }
  img.jobphoto { width:100%; border-radius:12px; margin-bottom:16px; max-height:200px; object-fit:cover; }
  .msgbox { border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; background:#fff; max-width:520px; }
  .msgbox h3 { font-size:14px; margin-bottom:12px; }
  .msglist { max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .msgbubble { max-width:80%; padding:9px 12px; border-radius:12px; font-size:13px; }
  .msgbubble.mine { align-self:flex-end; background:var(--black); color:#fff; }
  .msgbubble.theirs { align-self:flex-start; background:var(--paper); color:var(--ink); }
  .msgmeta { font-size:10px; color:var(--stone-light); margin-bottom:2px; }
  .msginput { display:flex; gap:8px; }
  .msginput input { flex:1; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:9px 12px; }
  .reassign { display:flex; gap:8px; margin-top:16px; }
  .reassign input { flex:1; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:9px 12px; }
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mysubbies">
</head>
<body>

<header>
  <div class="navwrap">
    <a class="logo" href="mysubbies-website.html">
      <div class="logo-mark"><svg viewBox="0 0 60 60" width="100%" height="100%"><rect x="4" y="4" width="52" height="52" rx="15" fill="#FFFFFF"/><path d="M17 42 V19 L30 33 L43 19 V42" fill="none" stroke="#000000" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="logo-word">Mysubbies</div>
    </a>
    <div class="navlinks">
      <a href="mysubbies-website.html">Site</a>
      <a href="mysubbies-customer-portal.html">My Jobs</a>
      <a href="mysubbies-contractor-portal.html">Contractor Portal</a>
      <a class="current" href="mysubbies-admin-portal.html">Admin</a>
      <a onclick="adminLogout()" style="cursor:pointer;">Log out</a>
    </div>
  </div>
</header>

<div class="wrap" id="app"></div>

<script>
  const ADMIN_PASSWORD = 'Mysubbies2026!';

  function checkAdminAuth() {
    if (localStorage.getItem('mysubbies_admin_authed') === 'true') { hydrateJobsFromServer().then(render); return; }
    document.getElementById('app').innerHTML = `
      <div style="max-width:360px;margin:80px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;">
        <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">Admin login</h1>
        <p style="font-size:13px;color:var(--stone);margin-bottom:20px;">This is a basic gate to keep the page out of casual view during testing — not real security.</p>
        <input type="password" id="adminPasswordInput" placeholder="Password" style="width:100%;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;" onkeydown="if(event.key==='Enter') adminLogin()">
        <div id="adminLoginError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
        <button onclick="adminLogin()" style="width:100%;background:#000;color:#fff;border:none;border-radius:999px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;">Log in →</button>
      </div>`;
  }
  function adminLogin() {
    const val = document.getElementById('adminPasswordInput').value;
    if (val === ADMIN_PASSWORD) {
      localStorage.setItem('mysubbies_admin_authed', 'true');
      hydrateJobsFromServer().then(render);
    } else {
      document.getElementById('adminLoginError').textContent = 'Incorrect password.';
    }
  }
  function adminLogout() {
    localStorage.removeItem('mysubbies_admin_authed');
    checkAdminAuth();
  }

  function getJobs() { return JSON.parse(localStorage.getItem('mysubbies_jobs') || '[]'); }
  function saveJobs(jobs) {
    localStorage.setItem('mysubbies_jobs', JSON.stringify(jobs));
    fetch('/api/sync-jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobs }) }).catch(() => {});
  }
  // Pulls every job from Supabase (admin sees everything) and merges into
  // localStorage, so All Jobs reflects work created on any device, not
  // just this admin browser. See api/get-jobs.js.
  async function hydrateJobsFromServer() {
    try {
      const res = await fetch('/api/get-jobs?all=1');
      if (!res.ok) return;
      const { jobs: remoteJobs } = await res.json();
      if (!Array.isArray(remoteJobs) || remoteJobs.length === 0) return;
      const localJobs = getJobs();
      const byId = new Map(localJobs.map(j => [j.id, j]));
      remoteJobs.forEach(rj => { if (rj && rj.id) byId.set(rj.id, rj); });
      localStorage.setItem('mysubbies_jobs', JSON.stringify(Array.from(byId.values())));
    } catch (e) { /* offline or first load — local data still works */ }
  }

  let tab = 'overview';
  let selectedJobId = null;
  const app = document.getElementById('app');
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function getApplications() { return JSON.parse(localStorage.getItem('mysubbies_contractor_applications') || '[]'); }
  function saveApplications(apps) { localStorage.setItem('mysubbies_contractor_applications', JSON.stringify(apps)); }
  function getDisputes() { return JSON.parse(localStorage.getItem('mysubbies_disputes') || '[]'); }
  function saveDisputes(d) { localStorage.setItem('mysubbies_disputes', JSON.stringify(d)); }

  function renderDisputesTab(disputes, jobs) {
    if (disputes.length === 0) return '<div class="empty">No disputes reported.</div>';
    return `
      <h1 class="pagetitle">Disputes</h1>
      ${disputes.map(d => {
        const job = jobs.find(j => j.id === d.jobId);
        return `
          <div class="detailcard" style="max-width:640px;margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <div style="font-weight:700;font-size:15px;">${escapeHtml(d.reason)}</div>
                <div style="font-size:12px;color:var(--stone);margin-top:2px;">${job ? escapeHtml(job.category + ' — ' + job.suburb) : 'Job not found'} · reported by ${escapeHtml(d.reportedBy)} · ${new Date(d.reportedAt).toLocaleDateString('en-AU')}</div>
              </div>
              <span class="badge ${d.status === 'open' ? 'badge-feed' : 'badge-completed'}">${d.status}</span>
            </div>
            <div style="font-size:13px;color:#333;margin-top:10px;">${d.details ? escapeHtml(d.details) : '(no further details provided)'}</div>
            ${d.status === 'open' ? `<button class="btn btn-outline" style="margin-top:12px;" onclick="resolveDispute('${d.id}')">Mark resolved</button>` : ''}
          </div>`;
      }).join('')}
    `;
  }
  function resolveDispute(id) {
    const disputes = getDisputes();
    const d = disputes.find(x => x.id === id);
    d.status = 'resolved';
    saveDisputes(disputes);
    render();
  }

  function render() {
    if (selectedJobId) { renderDetail(); return; }
    const jobs = getJobs();
    const commission = jobs.reduce((s, j) => s + Math.round((j.basePrice || 0) * 0.25), 0);
    const gmv = jobs.reduce((s, j) => s + (j.basePrice || 0), 0);
    const applications = getApplications();
    const pendingCount = applications.filter(a => a.status === 'pending').length;
    const disputes = getDisputes();
    const openDisputeCount = disputes.filter(d => d.status === 'open').length;

    app.innerHTML = `
      <div class="statgrid">
        <div class="statcard"><div class="num">${jobs.length}</div><div class="lab">Total jobs</div></div>
        <div class="statcard"><div class="num">${jobs.filter(j=>j.status==='feed').length}</div><div class="lab">Awaiting contractor</div></div>
        <div class="statcard"><div class="num">$${gmv.toLocaleString()}</div><div class="lab">Gross job value</div></div>
        <div class="statcard"><div class="num">$${commission.toLocaleString()}</div><div class="lab">Platform commission</div></div>
      </div>
      <div class="tabs">
        <button class="${tab==='overview'?'active':''}" onclick="tab='overview'; render();">All Jobs</button>
        <button class="${tab==='applications'?'active':''}" onclick="tab='applications'; render();">Applications ${pendingCount ? '(' + pendingCount + ')' : ''}</button>
        <button class="${tab==='disputes'?'active':''}" onclick="tab='disputes'; render();">Disputes ${openDisputeCount ? '(' + openDisputeCount + ')' : ''}</button>
        <button class="${tab==='ratecard'?'active':''}" onclick="tab='ratecard'; render();">Rate Card</button>
        <button class="${tab==='reports'?'active':''}" onclick="tab='reports'; render();">Reports</button>
      </div>
      ${tab === 'overview' ? `
        <h1 class="pagetitle">Jobs</h1>
        ${jobs.length === 0 ? '<div class="empty">No jobs yet. Submit one from the site to see it here.</div>' : jobsTableHtml(jobs)}
      ` : tab === 'applications' ? renderApplicationsTab(applications) : tab === 'disputes' ? renderDisputesTab(disputes, jobs) : tab === 'reports' ? renderReportsTab(jobs, applications, disputes) : renderRateCardTab()}
    `;
    if (tab === 'ratecard') wireRateCardTab();
  }

  function getCustomersMap() { return JSON.parse(localStorage.getItem('mysubbies_customers') || '{}'); }

  function barHtml(label, value, max, valueLabel) {
    const pct = max > 0 ? Math.max(2, Math.round((value / max) * 100)) : 0;
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
          <span>${escapeHtml(label)}</span><span style="font-weight:600;">${valueLabel}</span>
        </div>
        <div style="background:var(--paper);border-radius:5px;height:8px;overflow:hidden;">
          <div style="background:var(--black);height:100%;width:${pct}%;"></div>
        </div>
      </div>`;
  }

  function renderReportsTab(jobs, applications, disputes) {
    const customers = getCustomersMap();
    const customerList = Object.values(customers);
    const newsletterCount = JSON.parse(localStorage.getItem('mysubbies_newsletter_signups') || '[]').length;

    const gmv = jobs.reduce((s, j) => s + (j.basePrice || 0), 0);
    const commission = Math.round(gmv * 0.25);
    const payout = gmv - commission;
    const completedJobs = jobs.filter(j => j.status === 'completed');
    const completedGmv = completedJobs.reduce((s, j) => s + (j.basePrice || 0), 0);

    const approved = applications.filter(a => a.status === 'approved');
    const pendingApps = applications.filter(a => a.status === 'pending');
    const rejectedApps = applications.filter(a => a.status === 'rejected');
    const openDisputes = disputes.filter(d => d.status === 'open');
    const disputeRate = jobs.length ? ((disputes.length / jobs.length) * 100).toFixed(1) : '0.0';
    const referredCustomers = customerList.filter(c => c.referredBy).length;

    // Revenue by category
    const byCategory = {};
    jobs.forEach(j => {
      const cat = j.category || 'Unknown';
      if (!byCategory[cat]) byCategory[cat] = { count: 0, value: 0 };
      byCategory[cat].count++;
      byCategory[cat].value += j.basePrice || 0;
    });
    const catRows = Object.entries(byCategory).sort((a, b) => b[1].value - a[1].value);
    const maxCatValue = catRows.length ? catRows[0][1].value : 0;

    // Demand by suburb (top 5)
    const bySuburb = {};
    jobs.forEach(j => { const s = j.suburb || 'Unknown'; bySuburb[s] = (bySuburb[s] || 0) + 1; });
    const suburbRows = Object.entries(bySuburb).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const maxSuburbCount = suburbRows.length ? suburbRows[0][1] : 0;

    // Jobs per month (sortable key -> display label)
    const monthMap = {};
    jobs.forEach(j => {
      const d = new Date(j.createdAt);
      if (isNaN(d)) return;
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      monthMap[key] = (monthMap[key] || 0) + 1;
    });
    const monthKeys = Object.keys(monthMap).sort();
    const maxMonthCount = monthKeys.length ? Math.max(...monthKeys.map(k => monthMap[k])) : 0;

    // Contractor category coverage (approved contractors per trade)
    const coverage = {};
    approved.forEach(a => (a.trades || []).forEach(t => { coverage[t] = (coverage[t] || 0) + 1; }));
    const uncoveredCats = catRows.filter(([cat]) => !coverage[cat]).map(([cat]) => cat);

    return `
      <h1 class="pagetitle">Reports</h1>
      <p class="pagesub">Built from live platform data — refreshes every time you open this tab.</p>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Finance</h3>
        <div class="row"><span class="l">Gross merchandise value (all jobs)</span><span class="r">$${gmv.toLocaleString()}</span></div>
        <div class="row"><span class="l">Platform commission (25%)</span><span class="r">$${commission.toLocaleString()}</span></div>
        <div class="row"><span class="l">Contractor payout (75%)</span><span class="r">$${payout.toLocaleString()}</span></div>
        <div class="row"><span class="l">Completed jobs value</span><span class="r">$${completedGmv.toLocaleString()} (${completedJobs.length} jobs)</span></div>
        <div class="row"><span class="l">Average job value</span><span class="r">$${jobs.length ? Math.round(gmv / jobs.length).toLocaleString() : 0}</span></div>
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Revenue by category</h3>
        ${catRows.length === 0 ? '<div class="empty">No jobs yet.</div>' : catRows.map(([cat, d]) => barHtml(cat, d.value, maxCatValue, `$${d.value.toLocaleString()} · ${d.count} job${d.count === 1 ? '' : 's'}`)).join('')}
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Jobs booked by month</h3>
        ${monthKeys.length === 0 ? '<div class="empty">No jobs yet.</div>' : monthKeys.map(k => {
          const [y, m] = k.split('-');
          const label = new Date(Number(y), Number(m) - 1, 1).toLocaleDateString('en-AU', { month: 'short', year: 'numeric' });
          return barHtml(label, monthMap[k], maxMonthCount, String(monthMap[k]));
        }).join('')}
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Marketing</h3>
        <div class="row"><span class="l">Total customer accounts</span><span class="r">${customerList.length}</span></div>
        <div class="row"><span class="l">Customers who used a referral code</span><span class="r">${referredCustomers}</span></div>
        <div class="row"><span class="l">Newsletter signups</span><span class="r">${newsletterCount}</span></div>
        <div style="margin-top:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--stone);margin-bottom:8px;">Top demand by suburb</div>
        ${suburbRows.length === 0 ? '<div class="empty">No jobs yet.</div>' : suburbRows.map(([sub, count]) => barHtml(sub, count, maxSuburbCount, `${count} job${count === 1 ? '' : 's'}`)).join('')}
      </div>

      <div class="detailcard" style="margin-bottom:14px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Director / CEO overview</h3>
        <div class="row"><span class="l">Total jobs</span><span class="r">${jobs.length}</span></div>
        <div class="row"><span class="l">Approved contractors</span><span class="r">${approved.length}</span></div>
        <div class="row"><span class="l">Applications awaiting review</span><span class="r">${pendingApps.length}</span></div>
        <div class="row"><span class="l">Applications rejected</span><span class="r">${rejectedApps.length}</span></div>
        <div class="row"><span class="l">Open disputes</span><span class="r">${openDisputes.length} of ${disputes.length} total</span></div>
        <div class="row"><span class="l">Dispute rate</span><span class="r">${disputeRate}% of jobs</span></div>
        ${uncoveredCats.length ? `
          <div style="margin-top:12px;padding:10px 12px;background:#FFF6E5;border:1px solid #F0DCA6;border-radius:8px;font-size:12.5px;color:#7A5C1E;">
            <strong>No approved contractors yet</strong> in categories with active demand: ${uncoveredCats.map(escapeHtml).join(', ')}.
          </div>
        ` : ''}
      </div>
    `;
  }

  function variationListHtml(j) {
    const variations = j.variations || [];
    const statusColor = { pending: '#8A6D2E', approved: 'var(--good)', declined: 'var(--warn)' };
    const statusBg = { pending: '#FFF6E5', approved: '#EAF5EE', declined: '#FDEDEA' };
    return variations.map(v => `
      <div style="border-top:1px solid var(--paper);padding:10px 0;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:600;">${escapeHtml(v.description)}</div>
            ${v.reason ? `<div style="font-size:11.5px;color:var(--stone);margin-top:2px;">${escapeHtml(v.reason)}</div>` : ''}
            <div style="font-size:10.5px;color:var(--stone-light);margin-top:2px;">Requested ${new Date(v.requestedAt).toLocaleDateString('en-AU')}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-weight:700;font-size:14px;">+$${v.amount.toLocaleString()}</div>
            <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;color:${statusColor[v.status]};background:${statusBg[v.status]};">${v.status}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function docChipsHtml(docs) {
    if (!docs || docs.length === 0) return '<span style="color:var(--stone-light);">None uploaded</span>';
    return docs.map(d => `
      <a href="${d.dataUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin:2px 4px 2px 0;text-decoration:none;color:var(--ink);">
        ${d.isImage ? '🖼️' : '📄'} ${d.name}
      </a>
    `).join('');
  }

  // --- Rate card storage: same localStorage key the live estimator reads from ---
  function getRateCard() {
    const stored = localStorage.getItem('mysubbies_ratecard');
    return stored ? JSON.parse(stored) : [];
  }
  function saveRateCard(categories) {

  function downloadRateCardTemplate() {
    const categories = getRateCard();
    let csv = 'Category,Task,Unit,Rate,Notes\n';
    categories.forEach(c => {
      c.tasks.forEach(t => {
        const notes = (t.notes || '').replace(/"/g, '""');
        csv += `"${c.label}","${t.name}","${t.unit}",${t.rate === null ? '' : t.rate},"${notes}"\n`;
      });
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'mysubbies-ratecard-template.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  // Minimal CSV parser handling quoted fields with embedded commas.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i + 1];
      if (inQuotes) {
        if (ch === '"' && next === '"') { field += '"'; i++; }
        else if (ch === '"') { inQuotes = false; }
        else { field += ch; }
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ',') { row.push(field); field = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && next === '\n') i++;
          row.push(field); field = '';
          if (row.some(f => f !== '')) rows.push(row);
          row = [];
        } else { field += ch; }
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function onRateCardFileSelected(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const rows = parseCSV(ev.target.result);
      if (rows.length < 2) { document.getElementById('rcUploadPreview').innerHTML = '<div class="error" style="margin-top:12px;">That file doesn\u2019t look right \u2014 no rows found.</div>'; return; }
      const header = rows[0].map(h => h.trim().toLowerCase());
      const idx = { category: header.indexOf('category'), task: header.indexOf('task'), unit: header.indexOf('unit'), rate: header.indexOf('rate'), notes: header.indexOf('notes') };
      if (idx.category === -1 || idx.task === -1 || idx.unit === -1 || idx.rate === -1) {
        document.getElementById('rcUploadPreview').innerHTML = '<div class="error" style="margin-top:12px;">Missing required columns. Expected: Category, Task, Unit, Rate (Notes optional).</div>';
        return;
      }
      const dataRows = rows.slice(1).filter(r => r[idx.category]);
      pendingUploadRows = dataRows.map(r => ({
        category: r[idx.category].trim(), task: r[idx.task].trim(), unit: r[idx.unit].trim(),
        rate: r[idx.rate].trim() === '' ? null : Number(r[idx.rate]),
        notes: idx.notes > -1 ? (r[idx.notes] || '').trim() : '',
      }));
      const uniqueCats = [...new Set(pendingUploadRows.map(r => r.category))];
      document.getElementById('rcUploadPreview').innerHTML = `
        <div style="background:var(--paper);border-radius:10px;padding:14px;margin-top:14px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:6px;">Preview: ${pendingUploadRows.length} tasks across ${uniqueCats.length} categories</div>
          <div style="font-size:12px;color:var(--stone);margin-bottom:10px;">${uniqueCats.slice(0, 8).join(', ')}${uniqueCats.length > 8 ? ', +' + (uniqueCats.length - 8) + ' more' : ''}</div>
          <div style="font-size:12px;color:var(--warn);margin-bottom:10px;">⚠ This will replace the entire live rate card.</div>
          <button class="btn btn-black" onclick="confirmRateCardUpload()">Confirm & publish</button>
        </div>
      `;
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function confirmRateCardUpload() {
    if (!pendingUploadRows) return;
    const grouped = {};
    pendingUploadRows.forEach(r => {
      if (!grouped[r.category]) grouped[r.category] = { label: r.category, icon: '🔧', tasks: [] };
      grouped[r.category].tasks.push({ name: r.task, unit: r.unit, rate: r.rate, notes: r.notes });
    });
    saveRateCard(Object.values(grouped));
    pendingUploadRows = null;
    render();
  }

              ${a.profilePhoto ? `<img src="${escapeHtml(a.profilePhoto)}" style="width:44px;height:44px;border-radius:999px;object-fit:cover;">` : ''}
              <div>
                <div style="font-weight:700;font-size:16px;">${escapeHtml(a.business)}</div>
                <div style="font-size:12px;color:var(--stone);margin-top:2px;">${escapeHtml(a.contact)} \u00b7 ${escapeHtml(a.email)} \u00b7 ${escapeHtml(a.phone)}</div>
              </div>
            </div>
            <span class="badge ${statusBadge[a.status]}">${a.status}</span>
          </div>
          <div class="row"><span class="l">ABN</span><span class="r">${escapeHtml(a.abn)}</span></div>
          ${a.acn ? `<div class="row"><span class="l">ACN</span><span class="r">${escapeHtml(a.acn)}</span></div>` : ''}
          <div class="row"><span class="l">Trades</span><span class="r" style="text-align:right;max-width:280px;">${escapeHtml(a.trades.join(', '))}</span></div>
          <div class="row"><span class="l">Service suburbs</span><span class="r" style="text-align:right;max-width:280px;">${escapeHtml(a.suburbs.length ? a.suburbs.join(', ') : 'All Melbourne metro')}</span></div>
          ${a.licence ? `<div class="row"><span class="l">Licence</span><span class="r">${escapeHtml(a.licence)}</span></div>` : ''}
          ${a.insurer ? `<div class="row"><span class="l">Insurer</span><span class="r">${escapeHtml(a.insurer)}</span></div>` : ''}
          <div class="row"><span class="l">Applied</span><span class="r">${new Date(a.appliedAt).toLocaleDateString('en-AU')}</span></div>
          <div style="border-top:1px solid var(--paper);margin-top:10px;padding-top:10px;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--stone);margin-bottom:6px;">Insurance certificate</div>
            <div>${docChipsHtml(a.insuranceDocs)}</div>
          </div>
          <div style="margin-top:10px;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--stone);margin-bottom:6px;">Trade certificate / licence</div>
            <div>${docChipsHtml(a.certDocs)}</div>
          </div>
          ${a.status === 'pending' ? `
            <div style="display:flex;gap:8px;margin-top:14px;">
              <button class="btn btn-outline" style="flex:1;" onclick="rejectApplication('${a.id}')">Reject</button>
              <button class="btn btn-black" style="flex:2;" onclick="approveApplication('${a.id}')">Approve \u2192</button>
            </div>
          ` : ''}
        </div>
      `).join('')}
    `;
  }

  // Mirrors the decision into the real `contractors` table (matched by
  // email) so a contractor logging in on a device that's never touched
  // this admin browser's localStorage still gets the right answer — see
  // api/update-contractor-status.js. Fire-and-forget, same pattern as
  // saveJobs()'s sync-jobs call.
  function syncContractorStatus(email, status) {
    fetch('/api/update-contractor-status', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, status }),
    }).catch(() => {});
  }
  function approveApplication(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    a.status = 'approved';
    saveApplications(apps);
    syncContractorStatus(a.email, 'approved');
    render();
  }
  function rejectApplication(id) {
    const apps = getApplications();
    const a = apps.find(x => x.id === id);
    a.status = 'rejected';
    saveApplications(apps);
    syncContractorStatus(a.email, 'rejected');
    render();
  }

  function jobsTableHtml(jobs) {
    const badgeClass = { feed: 'badge-feed', assigned: 'badge-assigned', completed: 'badge-completed' };
    const badgeLabel = { feed: 'Awaiting contractor', assigned: 'Assigned', completed: 'Completed' };
    return `
      <table>
        <thead><tr><th>Job</th><th>Suburb</th><th>Contractor</th><th>Status</th><th>Value</th></tr></thead>
        <tbody>
          ${jobs.map(j => `
            <tr class="jobrow" onclick="selectedJobId='${j.id}'; render();">
              <td><strong>${j.icon || ''} ${escapeHtml(j.category)}</strong><br><span style="color:var(--stone);font-size:12px;">${j.items && j.items.length > 1 ? j.items.length + ' items' : (j.qty || '') + ' ' + escapeHtml(j.unit || '')}</span></td>
              <td>${escapeHtml(j.suburb)}</td>
              <td>${escapeHtml(j.contractor || '—')}</td>
              <td><span class="badge ${badgeClass[j.status] || 'badge-feed'}">${badgeLabel[j.status] || j.status}</span></td>
              <td>$${(j.basePrice || 0).toLocaleString()}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  function renderDetail() {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    if (!j) { selectedJobId = null; render(); return; }
    const commission = Math.round((j.basePrice || 0) * 0.25);
    const payout = (j.basePrice || 0) - commission;

    app.innerHTML = `
      <button class="backbtn" onclick="selectedJobId=null; render();">← Back to jobs</button>
      <div class="detailcard">
        ${j.photoDataUrls && j.photoDataUrls.length > 1 ? `
          <div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;">
            ${j.photoDataUrls.map(src => `<img src="${src}" style="width:90px;height:90px;border-radius:10px;object-fit:cover;flex-shrink:0;" />`).join('')}
          </div>
        ` : j.photoDataUrl ? `<img class="jobphoto" src="${j.photoDataUrl}">` : ''}
        <h1 class="pagetitle" style="margin-bottom:2px;">${j.icon || ''} ${escapeHtml(j.category)}</h1>
        <div style="color:var(--stone);font-size:13px;margin-bottom:16px;">${j.items && j.items.length > 1 ? j.items.length + ' items' : `${j.qty || ''} ${escapeHtml(j.unit || '')}`} · 📍 ${j.address ? escapeHtml(j.address) + ', ' : ''}${escapeHtml(j.suburb)}</div>

        ${j.items && j.items.length ? `
          <div style="border-top:1px solid var(--paper);border-bottom:1px solid var(--paper);padding:10px 0;margin-bottom:8px;">
            ${j.items.map(i => `
              <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;">
                <span>${i.catIcon || ''} ${escapeHtml(i.taskName)} <span style="color:var(--stone);">(${i.qty} ${escapeHtml(i.unit)})</span></span>
                <span style="font-weight:600;">$${i.base.toLocaleString()}</span>
              </div>
              ${i.notes ? `<div style="font-size:11.5px;color:var(--stone);margin-bottom:4px;">${escapeHtml(i.notes)}</div>` : ''}
            `).join('')}
          </div>
        ` : ''}

        <div class="row"><span class="l">Customer</span><span class="r">${escapeHtml(j.customerName || '—')}</span></div>
        ${j.jobType === 'business' ? `<div class="row"><span class="l">Invoice to</span><span class="r">${escapeHtml(j.businessName || '—')} (business)</span></div>` : ''}
        <div class="row"><span class="l">Phone</span><span class="r">${escapeHtml(j.customerPhone || '—')}</span></div>
        <div class="row"><span class="l">Contractor</span><span class="r">${escapeHtml(j.contractor || 'Unassigned')}</span></div>
        <div class="row"><span class="l">On site / access</span><span class="r">${escapeHtml(j.site || '—')} ${j.access ? '· ' + escapeHtml(j.access) : ''}</span></div>
        ${j.urgency ? `<div class="row"><span class="l">Urgency</span><span class="r">${escapeHtml(j.urgency)}</span></div>` : ''}
        <div class="row"><span class="l">Total job value</span><span class="r">$${(j.basePrice || 0).toLocaleString()}</span></div>
        <div class="row commission"><span class="l">Platform commission (25%)</span><span class="r">$${commission.toLocaleString()}</span></div>
        <div class="row payout"><span class="l">Contractor payout</span><span class="r">$${payout.toLocaleString()}</span></div>

        ${!j.contractor ? `
          <div class="reassign">
            <input type="text" id="reassignInput" placeholder="Assign to (business name)" />
            <button class="btn btn-black" onclick="reassign('${j.id}')">Assign</button>
          </div>
        ` : ''}
      </div>
      ${j.variations && j.variations.length ? `
        <div class="detailcard" style="margin-top:14px;">
          <h3 style="font-size:15px;margin-bottom:10px;">Variations</h3>
          ${variationListHtml(j)}
        </div>
      ` : ''}
      ${notifyBannerHtml()}
      <div class="msgbox">
        <h3>💬 Customer ↔ Contractor <span style="font-weight:400;color:var(--stone);">(visible to customer)</span></h3>
        <div class="msglist" id="msgListPublic"></div>
        <div class="msginput">
          <input type="text" id="msgInputPublic" placeholder="Reply in this thread…" onkeydown="if(event.key==='Enter') sendMsg('messages')" />
          <button class="btn btn-black" onclick="sendMsg('messages')">Send</button>
        </div>
      </div>
      <div class="msgbox">
        <h3>🔒 Admin ↔ Contractor <span style="font-weight:400;color:var(--stone);">(private — customer never sees this)</span></h3>
        <div class="msglist" id="msgListPrivate"></div>
        <div class="msginput">
          <input type="text" id="msgInputPrivate" placeholder="e.g. request a document…" onkeydown="if(event.key==='Enter') sendMsg('internalMessages')" />
          <button class="btn btn-black" onclick="sendMsg('internalMessages')">Send</button>
        </div>
      </div>
    `;
    renderThread(j, 'messages', 'msgListPublic');
    renderThread(j, 'internalMessages', 'msgListPrivate');
    wireNotifyButton();
  }

  function renderThread(j, key, listId) {
    const list = document.getElementById(listId);
    const msgs = j[key] || [];
    if (msgs.length === 0) { list.innerHTML = '<div style="font-size:12px;color:var(--stone-light);">No messages yet.</div>'; return; }
    list.innerHTML = msgs.map(m => `
      <div class="msgbubble ${m.from === 'admin' ? 'mine' : 'theirs'}">
        <div class="msgmeta">${m.from === 'admin' ? 'You (Mysubbies)' : escapeHtml(m.authorName || m.from)}</div>
        ${escapeHtml(m.text)}
      </div>
    `).join('');
    list.scrollTop = list.scrollHeight;
  }

  function sendMsg(key) {
    const inputId = key === 'messages' ? 'msgInputPublic' : 'msgInputPrivate';
    const input = document.getElementById(inputId);
    const text = input.value.trim();
    if (!text) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    j[key] = j[key] || [];
    j[key].push({ id: 'm_' + Date.now(), from: 'admin', authorName: 'Mysubbies support', text, createdAt: new Date().toISOString() });
    saveJobs(jobs);
    input.value = '';
    renderDetail();
  }

  function notifyBannerHtml() {
    if (!('Notification' in window) || Notification.permission !== 'default') return '';
    return `<div class="note" style="background:var(--paper);padding:10px 12px;border-radius:8px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--stone);"><span>Get a desktop alert on new messages (while this tab is open)</span><button id="notifyBtn" style="background:none;border:none;text-decoration:underline;font-size:12px;cursor:pointer;">Turn on</button></div>`;
  }
  function wireNotifyButton() {
    const btn = document.getElementById('notifyBtn');
    if (btn) btn.onclick = () => Notification.requestPermission().then(() => renderDetail());
  }
  function notify(text) {
    if ('Notification' in window && Notification.permission === 'granted') new Notification('Mysubbies admin', { body: text });
  }
  let lastAdminMsgCounts = {};
  function checkForNewMessages() {
    getJobs().forEach(j => {
      ['messages', 'internalMessages'].forEach(key => {
        const arr = j[key] || [];
        const cacheKey = j.id + '_' + key;
        const last = arr[arr.length - 1];
        if (lastAdminMsgCounts[cacheKey] !== undefined && arr.length > lastAdminMsgCounts[cacheKey] && last && last.from !== 'admin') {
          notify(`${j.category} — ${last.authorName || last.from}: ${last.text}`);
        }
        lastAdminMsgCounts[cacheKey] = arr.length;
      });
    });
  }
  window.addEventListener('storage', (e) => { if (e.key === 'mysubbies_jobs') { checkForNewMessages(); render(); } });
  setInterval(checkForNewMessages, 3000);

  function reassign(id) {
    const val = document.getElementById('reassignInput').value.trim();
    if (!val) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === id);
    j.contractor = val;
    j.status = 'assigned';
    saveJobs(jobs);
    render();
  }

  checkAdminAuth();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
