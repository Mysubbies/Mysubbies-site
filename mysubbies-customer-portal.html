  // Fetches the real backend-calculated schedule (api/job-payment-schedule.js)
  // instead of the old client-authored job.paymentSchedule/paidStages.
  async function renderMilestoneSection(jobId) {
    const wrap = document.getElementById('milestoneSectionWrap');
    if (!wrap) return;
    let data;
    try {
      const res = await fetch('/api/job-payment-schedule?jobId=' + encodeURIComponent(jobId));
      data = await res.json();
    } catch (e) {
      wrap.innerHTML = '<div class="note">Could not load the payment schedule — try again shortly.</div>';
      return;
    }
    if (!data.schedule) { wrap.innerHTML = ''; return; }
    if (data.schedule.status === 'pending_admin_schedule') {
      wrap.innerHTML = '<div class="note">This is a large or complex project — MySubbies is preparing a project-specific payment plan with you before further milestones open up.</div>';
      return;
    }
    if (data.schedule.status === 'pending_customer_acceptance') {
      const remaining = (data.milestones || []).filter(m => m.milestone_type !== 'deposit');
      wrap.innerHTML = `
        <div style="background:var(--paper);border-radius:10px;padding:14px;margin-top:12px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:8px;">Review your payment schedule</div>
          <div style="font-size:12.5px;color:var(--stone);margin-bottom:10px;">MySubbies has prepared the payment plan for the rest of this project. Please review each stage and accept before your contractor can begin claiming further payments.</div>
          <div style="margin:10px 0;">${remaining.map(m => `
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--stone);">
              <span>${escapeHtml(m.label)} (${m.pct}%)</span>
              <span>$${(m.amount_cents / 100).toLocaleString()}</span>
            </div>`).join('')}</div>
          <label style="display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin:10px 0;">
            <input type="checkbox" id="fScheduleAcceptUpdated" style="margin-top:2px;" />
            <span>I have reviewed and agree to this updated payment schedule.</span>
          </label>
          <div id="scheduleAcceptError" style="color:var(--warn);font-size:12.5px;margin-bottom:8px;"></div>
          <button class="btn btn-black btn-full" id="scheduleAcceptBtn" onclick="acceptUpdatedSchedule('${jobId}')">Accept schedule</button>
        </div>`;
      return;
    }

    const milestones = data.milestones || [];
    const stagebar = `<div class="stagebar">${milestones.map(m => `<div class="stage ${m.status === 'paid' ? 'done' : ''}" style="flex:${m.pct};"></div>`).join('')}</div>`;
    const list = `<div style="margin:10px 0;">${milestones.map(m => `
      <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:${m.status === 'paid' ? 'var(--good)' : 'var(--stone)'};">
        <span>${m.status === 'paid' ? '✓' : '○'} ${escapeHtml(m.label)} (${m.pct}%)</span>
        <span>$${(m.amount_cents / 100).toLocaleString()}</span>
      </div>`).join('')}</div>`;

    // 'approved' (not yet paid) covers two cases: the payment step was
    // interrupted after the customer's own approval, or MySubbies resolved
    // a dispute in the contractor's favour — either way the customer still
    // needs to complete payment, just without the evidence/dispute panel
    // since that decision is already made.
    const awaiting = milestones.find(m => m.status === 'awaiting_customer');
    const approvedUnpaid = !awaiting && milestones.find(m => m.status === 'approved');
    let actionHtml = '';
    if (awaiting) {
      const evidence = (data.evidenceByMilestone || {})[awaiting.id];
      actionHtml = `
        <div style="background:var(--paper);border-radius:10px;padding:14px;margin-top:12px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:6px;">Review: ${escapeHtml(awaiting.label)}</div>
          ${evidence ? `
            <div style="font-size:12.5px;color:var(--stone);margin-bottom:8px;">${escapeHtml(evidence.description || '')}</div>
            ${evidence.photo_urls && evidence.photo_urls.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(64px, 1fr));gap:6px;margin-bottom:8px;">${evidence.photo_urls.map(src => `<img src="${src}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;" />`).join('')}</div>` : ''}
            ${evidence.delivery_docket_url ? `<div style="font-size:12px;margin-bottom:8px;"><a href="${evidence.delivery_docket_url}" target="_blank" style="text-decoration:underline;">View delivery docket</a></div>` : ''}
          ` : ''}
          <div class="row"><span class="l">Amount due</span><span class="r" style="font-weight:700;">$${(awaiting.amount_cents / 100).toLocaleString()}</span></div>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-outline" style="flex:1;" onclick="openDisputeMilestoneForm('${awaiting.id}')">Raise an issue</button>
            <button class="btn btn-black" style="flex:1;" onclick="openMilestonePayForm('${jobId}','${awaiting.id}', ${awaiting.amount_cents}, false)">Approve & pay →</button>
          </div>
          <div id="milestonePayFormWrap"></div>
        </div>`;
    } else if (approvedUnpaid) {
      actionHtml = `
        <div style="background:var(--paper);border-radius:10px;padding:14px;margin-top:12px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:6px;">Payment due: ${escapeHtml(approvedUnpaid.label)}</div>
          <div class="row"><span class="l">Amount due</span><span class="r" style="font-weight:700;">$${(approvedUnpaid.amount_cents / 100).toLocaleString()}</span></div>
          <button class="btn btn-black btn-full" style="margin-top:10px;" onclick="openMilestonePayForm('${jobId}','${approvedUnpaid.id}', ${approvedUnpaid.amount_cents}, true)">Pay $${(approvedUnpaid.amount_cents / 100).toLocaleString()} →</button>
          <div id="milestonePayFormWrap"></div>
        </div>`;
    } else {
      const disputed = milestones.find(m => m.status === 'disputed');
      if (disputed) actionHtml = `<div class="note" style="color:var(--warn);">⚠ You raised an issue with <strong>${escapeHtml(disputed.label)}</strong> — MySubbies is reviewing it.</div>`;
    }

    wrap.innerHTML = stagebar + list + actionHtml;
  }

  async function acceptUpdatedSchedule(jobId) {
    const checked = document.getElementById('fScheduleAcceptUpdated').checked;
    const errBox = document.getElementById('scheduleAcceptError');
    if (!checked) { errBox.textContent = 'Please confirm you have reviewed the schedule.'; return; }
    const btn = document.getElementById('scheduleAcceptBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const res = await fetch('/api/job-payment-schedule', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'accept', jobId, customerId: null, termsVersion: 'payment-schedule-2026-08-v1' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not accept the schedule.');
      renderMilestoneSection(jobId);
    } catch (e) {
      errBox.textContent = e.message || 'Could not accept the schedule — please try again.';
      btn.disabled = false; btn.textContent = 'Accept schedule';
    }
  }

  function openMilestonePayForm(jobId, milestoneId, amountCents, alreadyApproved) {
    if (!stripe) { document.getElementById('milestonePayFormWrap').innerHTML = '<div class="note" style="margin-top:10px;">Payment is temporarily unavailable — please try again shortly, or contact support.</div>'; return; }
    document.getElementById('milestonePayFormWrap').innerHTML = `
      <div id="milestoneCardElement" style="padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin:10px 0;"></div>
      <div id="milestonePayError" style="color:var(--warn);font-size:13px;margin-bottom:10px;"></div>
      <button class="btn btn-black btn-full" id="milestonePayBtn" onclick="approveAndPayMilestone('${jobId}','${milestoneId}', ${amountCents}, ${!!alreadyApproved})">Pay $${(amountCents / 100).toLocaleString()} →</button>`;
    const elements = stripe.elements();
    window.__mysubbiesMilestoneCardElement = elements.create('card', { hidePostalCode: true });
    window.__mysubbiesMilestoneCardElement.mount('#milestoneCardElement');
  }

  // Same window.prompt()/alert() issue as cancelJob/requestCancelJob above
  // -- silently no-ops in a standalone-installed PWA. Reuses the same
  // milestonePayFormWrap slot the "Pay" form renders into (mutually
  // exclusive states, so sharing it is fine).
  function openDisputeMilestoneForm(milestoneId) {
    document.getElementById('milestonePayFormWrap').innerHTML = `
      <div style="margin-top:10px;">
        <textarea id="milestoneDisputeReason" placeholder="What went wrong? This pauses the payment and MySubbies will review it." style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;min-height:70px;font-family:inherit;"></textarea>
        <div id="milestoneDisputeError" style="color:var(--warn);font-size:12.5px;margin-bottom:8px;display:none;"></div>
        <button class="btn btn-black btn-full" onclick="submitDisputeMilestone('${milestoneId}')">Submit</button>
      </div>`;
  }
  async function submitDisputeMilestone(milestoneId) {
    const input = document.getElementById('milestoneDisputeReason');
    const reason = input.value.trim();
    const errBox = document.getElementById('milestoneDisputeError');
    if (!reason) {
      errBox.textContent = 'Please tell us what went wrong.';
      errBox.style.display = 'block';
      input.focus();
      return;
    }
    try {
      await fetch('/api/milestone', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'respond', milestoneId, customerId: null, response: 'disputed', notes: reason }),
      });
      renderDetail(getCurrentCustomerEmail());
    } catch (e) {
      errBox.textContent = 'Could not submit — please try again.';
      errBox.style.display = 'block';
    }
  }

  async function approveAndPayMilestone(jobId, milestoneId, amountCents, alreadyApproved) {
    const btn = document.getElementById('milestonePayBtn');
    const errBox = document.getElementById('milestonePayError');
    btn.disabled = true;
    btn.textContent = 'Processing…';
    errBox.textContent = '';

    try {
      // Already 'approved' (resumed after an interrupted payment, or an
      // admin resolved a dispute in the contractor's favour) — the
      // milestone.js 'respond' action only accepts milestones still
      // 'awaiting_customer', so calling it again here would 409.
      if (!alreadyApproved) {
        const respondRes = await fetch('/api/milestone', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'respond', milestoneId, customerId: null, response: 'approved' }),
        });
        const respondData = await respondRes.json();
        if (!respondRes.ok) throw new Error(respondData.error || 'Could not approve this milestone.');
      }

      const res = await fetch('/api/create-stage-payment-intent', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ milestoneId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not start payment.');

      const result = await stripe.confirmCardPayment(data.clientSecret, {
        payment_method: { card: window.__mysubbiesMilestoneCardElement },
      });
      if (result.error) throw new Error(result.error.message);

      renderDetail(getCurrentCustomerEmail());
    } catch (err) {
      errBox.textContent = err.message || 'Payment failed. Please try again.';
      btn.disabled = false;
      btn.textContent = `Pay $${(amountCents / 100).toLocaleString()} →`;
    }
  }

  function copyReferralCode(code) {
    navigator.clipboard.writeText(code).then(() => showToast('Referral code copied!'));
  }
  function showToast(msg) {
    let t = document.getElementById('toastMsg');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toastMsg';
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
  }

  function renderRatingSection(j) {
    if (j.customerRating) {
      return `<div class="row" style="margin-top:10px;"><span class="l">Your rating</span><span class="r">${'★'.repeat(j.customerRating)}${'☆'.repeat(5-j.customerRating)}</span></div>${j.customerReview ? `<div style="font-size:12.5px;color:var(--stone);margin-top:4px;">"${j.customerReview}"</div>` : ''}`;
    }
    return `
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--paper);">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;">Rate your contractor</div>
        <div id="starPicker" style="display:flex;gap:4px;margin-bottom:10px;">
          ${[1,2,3,4,5].map(n => `<button onclick="setStarRating(${n})" data-star="${n}" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--stone-light);">☆</button>`).join('')}
        </div>
        <input type="text" id="reviewText" placeholder="Optional review" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;">
        <button class="btn btn-black btn-full" onclick="submitRating('${j.id}')">Submit rating</button>
      </div>`;
  }
  let selectedStars = 0;
  function setStarRating(n) {
    selectedStars = n;
    document.querySelectorAll('#starPicker button').forEach(b => {
      b.textContent = Number(b.dataset.star) <= n ? '★' : '☆';
      b.style.color = Number(b.dataset.star) <= n ? 'var(--ink)' : 'var(--stone-light)';
    });
  }
  function submitRating(jobId) {
    if (selectedStars === 0) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === jobId);
    j.customerRating = selectedStars;
    j.customerReview = document.getElementById('reviewText').value.trim();
    saveJobs(jobs);
    selectedStars = 0;
    renderDetail(getCurrentCustomerEmail());
  }

  function variationListHtml(j, role) {
    const variations = j.variations || [];
    const statusColor = { pending: '#8A6D2E', approved: 'var(--good)', declined: 'var(--warn)' };
    const statusBg = { pending: '#FFF6E5', approved: '#EAF5EE', declined: '#FDEDEA' };
    if (variations.length === 0) return '<div style="font-size:12px;color:var(--stone-light);">No variations yet.</div>';
    return variations.map(v => `
      <div style="border-top:1px solid var(--paper);padding:10px 0;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:600;">${escapeHtml(v.description)}</div>
            ${v.reason ? `<div style="font-size:11.5px;color:var(--stone);margin-top:2px;">${escapeHtml(v.reason)}</div>` : ''}
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-weight:700;font-size:14px;">+$${v.amount.toLocaleString()}</div>
            <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;color:${statusColor[v.status]};background:${statusBg[v.status]};">${v.status}</span>
          </div>
        </div>
        ${role === 'customer' && v.status === 'pending' ? `
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn btn-outline" style="flex:1;padding:8px;font-size:12px;" onclick="declineVariation('${v.id}')">Decline</button>
            <button class="btn btn-black" style="flex:1;padding:8px;font-size:12px;" onclick="approveVariation('${v.id}')">Approve +$${v.amount.toLocaleString()}</button>
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  function approveVariation(variationId) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    const v = j.variations.find(x => x.id === variationId);
    v.status = 'approved';
    v.respondedAt = new Date().toISOString();
    j.basePrice = (j.basePrice || 0) + v.amount;
    j.priceLow = Math.round(j.basePrice * 0.96 / 5) * 5;
    j.priceHigh = Math.round(j.basePrice * 1.05 / 5) * 5;
    j.messages = j.messages || [];
    j.messages.push({ id: 'm_' + Date.now(), from: 'customer', authorName: 'You', text: `✓ Approved the variation "${v.description}" (+$${v.amount.toLocaleString()}).`, createdAt: new Date().toISOString() });
    saveJobs(jobs);
    renderDetail(getCurrentCustomerEmail());
  }

  function declineVariation(variationId) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    const v = j.variations.find(x => x.id === variationId);
    v.status = 'declined';
    v.respondedAt = new Date().toISOString();
    j.messages = j.messages || [];
    j.messages.push({ id: 'm_' + Date.now(), from: 'customer', authorName: 'You', text: `✕ Declined the variation "${v.description}".`, createdAt: new Date().toISOString() });
    saveJobs(jobs);
    renderDetail(getCurrentCustomerEmail());
  }

  function openDisputeForm() {
    document.getElementById('disputeFormWrap').innerHTML = `
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--paper);">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;">What's the problem?</div>
        <select id="disputeReason" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;">
          <option>Contractor hasn't shown up</option>
          <option>Work quality issue</option>
          <option>Price or payment issue</option>
          <option>Other</option>
        </select>
        <textarea id="disputeDetails" placeholder="Tell us what happened" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;min-height:70px;font-family:inherit;"></textarea>
        <button class="btn btn-black btn-full" onclick="submitDispute('${selectedJobId}')">Submit report</button>
      </div>`;
  }
  function submitDispute(jobId) {
    const reason = document.getElementById('disputeReason').value;
    const details = document.getElementById('disputeDetails').value.trim();
    const disputes = JSON.parse(localStorage.getItem('mysubbies_disputes') || '[]');
    disputes.unshift({ id: 'dispute_' + Date.now(), jobId, reason, details, status: 'open', reportedAt: new Date().toISOString(), reportedBy: 'customer' });
    localStorage.setItem('mysubbies_disputes', JSON.stringify(disputes));
    document.getElementById('disputeFormWrap').innerHTML = `<div class="note" style="margin-top:12px;">✓ Reported — our team will review this and be in touch.</div>`;
  }

  // Cancel/edit are only offered while a job is still unallocated (status
  // 'feed', no contractor) — once a contractor has accepted, changing scope
  // or cancelling needs a real conversation, not a self-service button.
  //
  // Both this and requestCancelJob() below used to gate on window.confirm()/
  // prompt() — native dialogs that iOS (and some Android WebViews) silently
  // no-op for a site installed as a standalone PWA (no browser chrome to
  // show them in), which is exactly this site's install flow. That made the
  // button look broken with zero error or feedback (founder report, Aug
  // 2026). Replaced with the same in-page-form pattern openDisputeForm()
  // already uses, which works identically everywhere.
  function openCancelJobConfirm(jobId) {
    document.getElementById('cancelJobFormWrap').innerHTML = `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--paper);">
        <div style="font-size:13px;margin-bottom:10px;">Cancel this job? This can't be undone — you'll need to submit a new job if you change your mind.</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" style="flex:1;" onclick="document.getElementById('cancelJobFormWrap').innerHTML=''">Never mind</button>
          <button class="btn btn-black" style="flex:1;background:var(--warn);" onclick="cancelJob('${jobId}')">Yes, cancel job</button>
        </div>
      </div>`;
  }
  function cancelJob(jobId) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === jobId);
    if (!j) return;
    j.status = 'cancelled';
    saveJobs(jobs);
    render();
  }

  // Once a contractor has accepted, cancelling isn't a self-service action
  // any more — the request goes to MySubbies for review (they're the ones
  // who have to square it with the contractor's accepted work), and the
  // contractor is locked out of further movement on the job in the
  // meantime (see renderDetail in mysubbies-contractor-portal.html).
  function openRequestCancelForm(jobId) {
    document.getElementById('requestCancelFormWrap').innerHTML = `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--paper);">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;">Why would you like to cancel?</div>
        <textarea id="cancelReasonInput" placeholder="Tell us why, so MySubbies can review this" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;min-height:70px;font-family:inherit;"></textarea>
        <div id="cancelReasonError" style="color:var(--warn);font-size:12.5px;margin-bottom:8px;display:none;"></div>
        <button class="btn btn-black btn-full" onclick="submitRequestCancel('${jobId}')">Submit cancellation request</button>
      </div>`;
  }
  function submitRequestCancel(jobId) {
    const input = document.getElementById('cancelReasonInput');
    const reason = input.value.trim();
    const errBox = document.getElementById('cancelReasonError');
    if (!reason) {
      errBox.textContent = 'Please tell us why, so MySubbies can review this.';
      errBox.style.display = 'block';
      input.focus();
      return;
    }
    const jobs = getJobs();
    const j = jobs.find(x => x.id === jobId);
    if (!j) return;
    j.status = 'cancellation_requested';
    j.cancellationReason = reason;
    j.cancellationRequestedAt = new Date().toISOString();
    j.cancellationRequestedBy = 'customer';
    saveJobs(jobs);
    render();
  }

  function getRateCard() {
    const stored = localStorage.getItem('mysubbies_ratecard');
    return stored ? JSON.parse(stored) : [];
  }

  // Looks up an item's CURRENT rate-card price-per-unit by category+task
  // name (matching how the estimator itself prices things: qty × rate) —
  // reused so a size/quantity edit here recalculates the same way a fresh
  // booking would, rather than duplicating a separate pricing model.
  function findTaskRate(catLabel, taskName) {
    const cat = getRateCard().find(c => c.label === catLabel);
    if (!cat) return null;
    const task = (cat.tasks || []).find(t => t.name === taskName);
    return task ? task.rate : null;
  }

  function openEditJobForm() {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    const items = j.items && j.items.length ? j.items : [{ catLabel: j.category, taskName: j.category, qty: j.qty, unit: j.unit, base: j.basePrice }];
    document.getElementById('editJobFormWrap').innerHTML = `
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--paper);">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;">Edit job details</div>
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">Address</div>
        <input type="text" id="editAddress" value="${escapeHtml(j.address || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">What's currently on the site?</div>
        <input type="text" id="editSite" value="${escapeHtml(j.site || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />
        <div style="font-size:12px;color:var(--stone);margin-bottom:2px;">How urgent is this job?</div>
        <input type="text" id="editUrgency" value="${escapeHtml(j.urgency || '')}" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" />

        <div style="font-size:13px;font-weight:600;margin:14px 0 6px;">Size / quantity</div>
        <div style="font-size:12px;color:var(--stone);margin-bottom:8px;">Changing quantity recalculates your estimated price — you'll see the new total and payment schedule before anything is confirmed.</div>
        ${items.map((it, idx) => `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
            <span style="font-size:12.5px;flex:1;">${escapeHtml(it.taskName || it.catLabel)}</span>
            <input type="number" min="0" step="any" id="editQty${idx}" value="${it.qty}" style="width:80px;font-size:13px;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;" />
            <span style="font-size:11.5px;color:var(--stone);width:40px;">${escapeHtml(it.unit || '')}</span>
          </div>
        `).join('')}
        <button class="btn btn-outline btn-full" style="margin-top:6px;margin-bottom:6px;" onclick='previewRecalculatedPrice(${JSON.stringify(j.id)}, ${JSON.stringify(items)})'>Recalculate price</button>
        <div id="editPricePreview"></div>

        <button class="btn btn-black btn-full" style="margin-top:12px;" onclick="saveEditJobForm('${j.id}')">Save changes</button>
      </div>`;
  }

  let pendingRecalc = null;

  function previewRecalculatedPrice(jobId, items) {
    const errBox = document.getElementById('editPricePreview');
    const newItems = items.map((it, idx) => {
      const qty = Number(document.getElementById('editQty' + idx).value);
      const rate = findTaskRate(it.catLabel, it.taskName);
      const base = rate != null ? Math.round(qty * rate) : Math.round((it.base / (it.qty || 1)) * qty);
      return { ...it, qty, base };
    });
    const newTotal = newItems.reduce((s, it) => s + it.base, 0);
    if (!newTotal || newItems.some(it => !it.qty || it.qty <= 0)) {
      errBox.innerHTML = `<div class="note" style="color:var(--warn);">Enter a valid quantity for every item.</div>`;
      return;
    }
    pendingRecalc = { jobId, newItems, newTotal };
    errBox.innerHTML = `<div class="note" style="margin-top:4px;">Loading updated payment schedule…</div>`;

    fetch('/api/job-payment-schedule', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'recalculate', jobId, newBasePriceCents: Math.round(newTotal * 100), customerId: null }),
    }).then(async r => {
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Could not recalculate this job\'s price.');
      pendingRecalc.milestones = data.milestones;
      pendingRecalc.confirmed = false;
      errBox.innerHTML = `
        <div style="background:var(--paper);border-radius:10px;padding:12px;margin-top:8px;">
          <div style="font-weight:700;font-size:13px;margin-bottom:6px;">New total: $${newTotal.toLocaleString()}</div>
          ${data.milestones.map(m => `
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--stone);">
              <span>${escapeHtml(m.label)}${m.status === 'paid' ? ' (already paid)' : ''}</span>
              <span>$${(m.amount_cents / 100).toLocaleString()}</span>
            </div>`).join('')}
          <label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;margin-top:10px;">
            <input type="checkbox" id="fRecalcAccept" style="margin-top:2px;" onchange="pendingRecalc.confirmed = this.checked;" />
            <span>I have reviewed and agree to this updated price and payment schedule.</span>
          </label>
        </div>`;
    }).catch(e => {
      errBox.innerHTML = `<div class="note" style="color:var(--warn);">${escapeHtml(e.message || 'Could not recalculate this job\'s price.')}</div>`;
      pendingRecalc = null;
    });
  }

  function saveEditJobForm(jobId) {
    const jobs = getJobs();
    const j = jobs.find(x => x.id === jobId);
    if (!j) return;
    j.address = document.getElementById('editAddress').value.trim();
    j.site = document.getElementById('editSite').value.trim();
    j.urgency = document.getElementById('editUrgency').value.trim();

    if (pendingRecalc && pendingRecalc.jobId === jobId) {
      if (!pendingRecalc.confirmed) {
        document.getElementById('editPricePreview').insertAdjacentHTML('beforeend', `<div class="note" style="color:var(--warn);margin-top:6px;">Please confirm you agree to the updated price and payment schedule.</div>`);
        return;
      }
      j.items = pendingRecalc.newItems;
      j.basePrice = pendingRecalc.newTotal;
      j.priceLow = pendingRecalc.newTotal;
      j.priceHigh = pendingRecalc.newTotal;
      pendingRecalc = null;
    }

    saveJobs(jobs);
    document.getElementById('editJobFormWrap').innerHTML = `<div class="note" style="margin-top:12px;">✓ Job updated.</div>`;
  }

  function renderMessages(j) {
    const list = document.getElementById('msgList');
    const msgs = j.messages || [];
    if (msgs.length === 0) { list.innerHTML = '<div style="font-size:12px;color:var(--stone-light);">No messages yet.</div>'; return; }
    list.innerHTML = msgs.map(m => `
      <div class="msgbubble ${m.from === 'customer' ? 'mine' : 'theirs'}">
        <div class="msgmeta">${m.from === 'customer' ? 'You' : escapeHtml(m.authorName || 'Contractor')}</div>
        ${escapeHtml(m.text)}
      </div>
    `).join('');
    list.scrollTop = list.scrollHeight;
  }

  function sendMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    const jobs = getJobs();
    const j = jobs.find(x => x.id === selectedJobId);
    if (!j || j.status === 'completed') return;
    j.messages = j.messages || [];
    j.messages.push({ id: 'm_' + Date.now(), from: 'customer', authorName: 'You', text, createdAt: new Date().toISOString() });
    saveJobs(jobs);
    input.value = '';
    renderDetail(getCurrentCustomerEmail());
  }

  function renderLogin() {
    app.innerHTML = `
      <div class="loginbox">
        <h1>Log in to My Jobs</h1>
        <p>Use the email and password you registered with when you booked a job.</p>
        <input type="email" id="loginEmail" placeholder="Email" />
        <input type="password" id="loginPassword" placeholder="Password" />
        <div id="loginError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
        <button class="btn btn-black btn-full" onclick="doLogin()">Log in →</button>
        <div style="text-align:center;font-size:13px;color:var(--stone);margin-top:14px;">
          <a onclick="renderForgotPassword()" style="text-decoration:underline;cursor:pointer;">Forgot password?</a>
        </div>
      </div>`;
  }
  function renderForgotPassword() {
    app.innerHTML = `
      <div class="loginbox">
        <h1>Reset password</h1>
        <p>Enter your account email. Our team will verify it's you and help you back in — we don't reset passwords automatically.</p>
        <input type="email" id="resetEmail" placeholder="Email" />
        <div id="resetError" style="color:var(--warn);font-size:13px;margin-bottom:12px;"></div>
        <button class="btn btn-black btn-full" onclick="requestPasswordReset()">Request reset →</button>
        <div style="text-align:center;font-size:13px;color:var(--stone);margin-top:14px;">
          <a onclick="renderLogin()" style="text-decoration:underline;cursor:pointer;">Back to log in</a>
        </div>
      </div>`;
  }
  function requestPasswordReset() {
    const email = document.getElementById('resetEmail').value.trim().toLowerCase();
    if (!email) { document.getElementById('resetError').textContent = 'Enter your email.'; return; }
    const requests = JSON.parse(localStorage.getItem('mysubbies_password_reset_requests') || '[]');
    requests.unshift({ id: 'reset_' + Date.now(), role: 'customer', email, status: 'pending', requestedAt: new Date().toISOString() });
    localStorage.setItem('mysubbies_password_reset_requests', JSON.stringify(requests));
    app.innerHTML = `
      <div class="loginbox">
        <h1>Request received</h1>
        <p>If that email matches an account, our team will contact you directly to verify your identity and reset your password. This won't happen automatically.</p>
        <div style="text-align:center;font-size:13px;color:var(--stone);margin-top:14px;">
          <a onclick="renderLogin()" style="text-decoration:underline;cursor:pointer;">Back to log in</a>
        </div>
      </div>`;
  }
  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;
    const customers = getCustomers();
    const account = customers[email];

    // Checked by email, before any password verification, so it applies
    // no matter which path below ends up confirming the password (real
    // Supabase Auth session, or the local-cache fallback further down) --
    // same reasoning as contractor-portal.html's suspended/rejected gate.
    if (sb) {
      const { data: statusProfile } = await sb.from('customers').select('status').eq('email', email).maybeSingle();
      if (statusProfile?.status === 'deactivated') {
        document.getElementById('loginError').textContent = 'This account has been deactivated. Contact MySubbies support if you believe this is a mistake.';
        return;
      }
    }

    // Try the REAL account first, regardless of whether this browser has a
    // local cache entry — that's what makes this work cross-device (e.g.
    // logging in from a phone that never touched booking.html on this
    // browser). Only fall back to the local-only legacy check if that fails
    // or Supabase isn't reachable.
    let verified = false;
    if (sb) {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      verified = !error;
      if (verified) {
        const { data: profile } = await sb.from('customers').select('*').eq('auth_user_id', data.user.id).maybeSingle();
        if (profile) {
          customers[email] = { ...account, name: profile.name || account?.name, phone: profile.phone || account?.phone, email, password };
          saveCustomers(customers);
        }
      }
    }
    if (!verified) {
      if (!account || account.password !== password) {
        document.getElementById('loginError').textContent = 'No account found with those details.';
        return;
      }
      if (sb) {
        sb.auth.signUp({ email, password }).then(({ data }) => {
          if (data?.user) {
            sb.from('customers').insert({ auth_user_id: data.user.id, email, name: account.name, phone: account.phone }).then(() => {});
          }
        });
      }
    }

    localStorage.setItem('mysubbies_customer_email', email);
    // The page-load hydrate (bottom of this script) already ran and no-op'd
    // before this login existed — it needs to run again now that we know
    // who's logged in, or a first login on a fresh device shows "0 jobs"
    // even though jobs exist on the server. Found via live testing.
    await hydrateJobsFromServer();
    render();
  }
  function logout() {
    localStorage.removeItem('mysubbies_customer_email');
    selectedJobId = null;
    render();
  }

  // ---- Real browser notifications (while this tab is open) + cross-tab live updates ----
  function notifyBannerHtml() {
    if (!('Notification' in window)) return '';
    if (Notification.permission === 'granted') return '';
    if (Notification.permission === 'denied') return '';
    return `<div class="notify-banner"><span>Get a desktop alert when your contractor replies (while this tab is open)</span><button id="notifyBtn">Turn on</button></div>`;
  }
  function wireNotifyButton() {
    const btn = document.getElementById('notifyBtn');
    if (btn) btn.onclick = () => Notification.requestPermission().then(() => render());
  }
  function notify(text) {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('MySubbies', { body: text });
    }
  }
  let lastMsgCount = {};
  function checkForNewMessages() {
    const email = getCurrentCustomerEmail();
    if (!email) return;
    getJobs().filter(j => j.customerEmail === email).forEach(j => {
      const count = (j.messages || []).length;
      const last = j.messages && j.messages[j.messages.length - 1];
      if (lastMsgCount[j.id] !== undefined && count > lastMsgCount[j.id] && last && last.from !== 'customer') {
        notify(`${j.contractor || 'Your contractor'}: ${last.text}`);
      }
      lastMsgCount[j.id] = count;
    });
  }
  window.addEventListener('storage', (e) => { if (e.key === 'mysubbies_jobs') { checkForNewMessages(); render(); } });
  setInterval(checkForNewMessages, 3000);

  hydrateJobsFromServer().then(render);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
