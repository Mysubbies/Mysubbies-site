<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MySubbies — My Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root {
    /* Navy/gold reskin (Aug 2026), Stage 3 -- see mysubbies-website.html's :root. */
    --ink: #151A26; --black: #14213D; --white: #FFFFFF; --paper: #F7F7F5;
    --stone: #6B7280; --stone-light: #9CA3AF; --line: #E7E7E4; --good: #2F7A50; --warn: #B0592E;
    --accent: #F5A623; --accent-dark: #D98E14; --accent-pale: #FDF0D9;
    --primary-light: #1F335A; --primary-pale: #E7EAF1; --danger: #C0392B;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1, h2 { font-weight:800; letter-spacing:-0.02em; }
  a { color:inherit; text-decoration:none; }
  header { background: var(--black); }
  .navwrap { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { display:flex; align-items:center; gap:9px; }
  .logo-mark { width:28px; height:28px; border-radius:7px; background:#fff; }
  .logo-word { font-weight:800; font-size:19px; color:#fff; }
  .navlinks { display:flex; align-items:center; gap:22px; font-size:13px; }
  @media (max-width:460px) { .navwrap { padding:0 14px; } .navlinks { gap:9px; font-size:11px; } }
  .navlinks a { color:rgba(255,255,255,0.65); }
  .navlinks a.current { color:#fff; font-weight:600; }
  .wrap { max-width:640px; margin:0 auto; padding:32px 24px 80px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer; border:none; }
  .btn-black { background:var(--black); color:#fff; }
  .btn-outline { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn-full { width:100%; }
  input[type=text], input[type=email], input[type=password] { width:100%; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; border:1.5px solid var(--line); border-radius:10px; padding:13px 14px; outline:none; margin-bottom:12px; }
  .loginbox { background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; margin-top:60px; }
  .loginbox h1 { font-size:22px; margin-bottom:8px; }
  .loginbox p { color:var(--stone); font-size:14px; margin-bottom:20px; }
  .whoami { font-size:12px; color:var(--stone-light); margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
  .whoami a { text-decoration:underline; cursor:pointer; }
  h1.pagetitle { font-size:24px; margin-bottom:2px; }
  p.pagesub { color:var(--stone); font-size:13px; margin-bottom:20px; }
  .jobcard { padding:14px; border-radius:14px; border:1px solid var(--line); background:#fff; cursor:pointer; margin-bottom:10px; text-align:left; width:100%; display:block; }
  .jobcard:hover { border-color: var(--black); }
  .pill { font-size:10px; font-weight:700; color:var(--stone); background:var(--paper); padding:2px 7px; border-radius:4px; display:inline-block; }
  .jobtitle { font-size:14px; font-weight:700; margin-top:4px; }
  .jobmeta { font-size:12px; color:var(--stone); margin-top:3px; }
  .empty { text-align:center; padding:60px 20px; color:var(--stone); font-size:14px; }
  /* Job listing table (Aug 2026) -- matches mysubbies-admin-portal.html's
     All Jobs table exactly (same classes/values), so the job list looks
     and reads the same across all three portals. */
  table.jobstable { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  table.jobstable th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--stone); padding:12px 16px; background:var(--paper); }
  table.jobstable td { padding:14px 16px; font-size:13px; border-top:1px solid var(--paper); }
  tr.jobrow { cursor:pointer; }
  tr.jobrow:hover { background:var(--paper); }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-block; }
  .badge-feed { background:#FFF6E5; color:#8A6D2E; }
  .badge-assigned { background:#E9F1F9; color:#2E5E8A; }
  .badge-completed { background:#EAF5EE; color:var(--good); }
  .badge-rejected { background:#FDEDEA; color:var(--warn); }
  .backbtn { font-size:13px; color:var(--stone); background:none; border:none; cursor:pointer; margin-bottom:16px; display:flex; align-items:center; gap:4px; }
  .detailcard { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; }
  .row { display:flex; justify-content:space-between; font-size:14px; padding:9px 0; border-top:1px solid var(--paper); }
  .row:first-child { border-top:none; }
  .row .l { color:var(--stone); }
  .row .r { font-weight:700; }
  .stagebar { display:flex; gap:4px; margin:12px 0; }
  .stage { flex:1; height:6px; border-radius:3px; background:var(--line); }
  .stage.done { background:var(--good); }
  .msgbox { border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:20px; }
  .msgbox h3 { font-size:14px; margin-bottom:12px; }
  .msglist { max-height:260px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .msgbubble { max-width:80%; padding:9px 12px; border-radius:12px; font-size:13px; }
  .msgbubble.mine { align-self:flex-end; background:var(--black); color:#fff; }
  .msgbubble.theirs { align-self:flex-start; background:var(--paper); color:var(--ink); }
  .msgmeta { font-size:10px; color:var(--stone-light); margin-bottom:2px; }
  .msginput { display:flex; gap:8px; }
  .msginput input { margin-bottom:0; flex:1; }
  .notify-banner { font-size:12px; color:var(--stone); background:var(--paper); border-radius:10px; padding:10px 14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
  .notify-banner button { font-size:12px; font-weight:600; background:none; border:none; text-decoration:underline; cursor:pointer; }

  /* Property Profile Phase 2 (added Aug 2026) -- visual language matches the
     approved mockup: navy hero, floating health card, dark Fix Something CTA,
     pastel-circle category grid (own copy of mysubbies-website.html's
     .cc-icon pattern -- self-contained convention, no shared CSS file). */
  .prop-hero { position:relative; border-radius:20px; overflow:hidden; min-height:170px; background:linear-gradient(135deg, var(--black), var(--primary-light)) center/cover; padding:20px; display:flex; flex-direction:column; justify-content:flex-end; color:#fff; }
  .prop-hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,33,61,0.1), rgba(20,33,61,0.8)); pointer-events:none; }
  .prop-hero-content { position:relative; z-index:2; }
  .prop-hero-address { font-size:19px; font-weight:800; }
  .prop-hero-suburb { font-size:12.5px; opacity:0.8; margin-top:2px; }
  .prop-hero-photo-btn { position:absolute; top:14px; right:14px; z-index:3; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.35); color:#fff; font-size:11px; padding:6px 12px; border-radius:999px; cursor:pointer; }
  .prop-health-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin:-26px 10px 20px; position:relative; z-index:4; box-shadow:0 8px 24px rgba(20,33,61,0.1); display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .prop-health-score { font-size:30px; font-weight:800; line-height:1; }
  .prop-health-label { font-size:11.5px; font-weight:700; margin-top:2px; }
  .prop-health-meta { font-size:12px; color:var(--stone); line-height:1.7; text-align:right; }
  .prop-health-disclaimer { font-size:10.5px; color:var(--stone-light); margin-top:16px; line-height:1.4; }
  .prop-fix-cta { background:var(--black); border-radius:16px; padding:16px 18px; display:flex; align-items:center; gap:14px; color:#fff; cursor:pointer; margin-bottom:8px; border:none; width:100%; text-align:left; }
  .prop-fix-cta-icon { width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
  .prop-fix-cta-title { font-weight:700; font-size:14.5px; }
  .prop-fix-cta-sub { font-size:12px; color:rgba(255,255,255,0.65); margin-top:2px; }
  .prop-fix-cta-arrow { margin-left:auto; font-size:18px; }
  .section-head { font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--stone); margin:24px 0 12px; }
  .home-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .home-cat-card { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:13px; cursor:pointer; text-align:left; }
  .home-cat-card.active { border-color:var(--black); }
  .home-cat-icon { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:8px; color:var(--ink); }
  .home-cat-icon.cat-plumbing { background:#DCEAF3; }
  .home-cat-icon.cat-electrical { background:#FCEFC7; }
  .home-cat-icon.cat-gardening-lawn-mowing { background:#D9E8D3; }
  .home-cat-icon.cat-fencing { background:#F5E6C8; }
  .home-cat-name { font-size:13px; font-weight:700; }
  .home-cat-status { font-size:11px; margin-top:2px; }
  .status-good { color:var(--good); }
  .status-warn { color:var(--warn); }
  .status-neutral { color:var(--stone); }
  .maint-card { background:var(--accent-pale); border:1px solid #F0D9A8; border-radius:14px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px; }
  .maint-card-icon { font-size:19px; }
  .maint-card-title { font-weight:700; font-size:13.5px; }
  .maint-card-sub { font-size:11.5px; color:var(--stone); margin-top:2px; }
  .maint-card-price { font-weight:800; font-size:14px; margin-left:auto; text-align:right; white-space:nowrap; }
  .maint-setup-card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .maint-setup-card select { border:1.5px solid var(--line); border-radius:8px; padding:7px 9px; font-family:inherit; font-size:12.5px; margin:6px 4px; }
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MySubbies">

<body>

<header>
  <div class="navwrap">
    <a class="logo" href="mysubbies-website.html">
      <div class="logo-mark"><svg viewBox="0 0 60 60" width="100%" height="100%"><rect x="4" y="4" width="52" height="52" rx="15" fill="#FFFFFF"/><path d="M17 42 V19 L30 33 L43 19 V42" fill="none" stroke="#000000" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="logo-word">MySubbies</div>
    </a>
    <div class="navlinks">
      <a href="mysubbies-website.html">Site</a>
      <a class="current" href="mysubbies-customer-portal.html">My Jobs</a>
    </div>
  </div>
</header>

<div class="wrap" id="app"></div>

<script>
  function getJobs() { return JSON.parse(localStorage.getItem('mysubbies_jobs') || '[]'); }
  function saveJobs(jobs) {
    localStorage.setItem('mysubbies_jobs', JSON.stringify(jobs));
    fetch('/api/sync-jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobs }) }).catch(() => {});
  }
  // Runs once before the first render: pulls this customer's jobs from
  // Supabase and merges them into localStorage, so a job created on another
  // device (or before this browser had a local copy) shows up here too.
  // Local jobs not yet known to the server are left alone — they'll sync up
  // next time anything calls saveJobs().
  async function hydrateJobsFromServer() {
    const email = getCurrentCustomerEmail();
    if (!email) return;
    try {
      const res = await fetch('/api/get-jobs?customerEmail=' + encodeURIComponent(email));
      if (!res.ok) return;
      const { jobs: remoteJobs } = await res.json();
      if (!Array.isArray(remoteJobs) || remoteJobs.length === 0) return;
      const localJobs = getJobs();
      const byId = new Map(localJobs.map(j => [j.id, j]));
      remoteJobs.forEach(rj => { if (rj && rj.id) byId.set(rj.id, rj); });
      localStorage.setItem('mysubbies_jobs', JSON.stringify(Array.from(byId.values())));
    } catch (e) { /* offline or first load — local data still works */ }
  }
  function getCustomers() { return JSON.parse(localStorage.getItem('mysubbies_customers') || '{}'); }
  function saveCustomers(customers) { localStorage.setItem('mysubbies_customers', JSON.stringify(customers)); }
  function getCurrentCustomerEmail() { return localStorage.getItem('mysubbies_customer_email'); }

  // Same publishable/safe-to-expose Supabase key as booking.html and the
  // contractor pages — protected by RLS, not secrecy.
  const SUPABASE_URL = 'https://yloiecuvrejaxxqvjglw.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dxp8_eCHY9nP1xF-LmxfuQ_h427tK3Y';
  const sb = (typeof window.supabase !== 'undefined')
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

  // Same publishable key as mysubbies-booking.html — safe to be
  // client-visible, unlike the secret key used server-side in /api.
  const STRIPE_PUBLISHABLE_KEY = 'pk_test_51U2ob6B25lHD6dwFqx6bGEipaEkk6A74k1eU9F12rF6gPNju9U9vnjZ5jj23z7Zi8IckThWii8kf6MF2tBXjXtSA00pOTmdFUJ';
  const stripe = (typeof Stripe !== 'undefined' && !STRIPE_PUBLISHABLE_KEY.includes('REPLACE_ME')) ? Stripe(STRIPE_PUBLISHABLE_KEY) : null;
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  let selectedJobId = null;
  let showingPaymentHistory = false;
  let showingPropertyProfile = false;
  let jobSearchQuery = '';
  const app = document.getElementById('app');

  function openPaymentHistory() { showingPaymentHistory = true; render(); }
  function closePaymentHistory() { showingPaymentHistory = false; render(); }
  function openPropertyProfile() { showingPropertyProfile = true; render(); }
  function closePropertyProfile() { showingPropertyProfile = false; render(); }

  // General-purpose "Contact MySubbies" inquiry (Aug 2026) -- not tied to
  // any specific job, unlike Report a problem/Request to cancel. Same
  // localStorage-log pattern as mysubbies_disputes. Each inquiry holds a
  // `messages` thread (not just a single message) so admin can actually
  // reply and the customer can keep the conversation going -- the original
  // version only had a "Mark resolved" button on the admin side with no
  // way to respond, which founder feedback flagged as a real gap.
  // Attachments are stored the same way job photos already are elsewhere
  // in this codebase (data URIs in the record itself).
  let inquiryAttachments = [];
  let showingNewInquiry = false;
  function getInquiries() { return JSON.parse(localStorage.getItem('mysubbies_inquiries') || '[]'); }
  function saveInquiries(inq) { localStorage.setItem('mysubbies_inquiries', JSON.stringify(inq)); }

  function openInquiryForm() {
    showingNewInquiry = false;
    inquiryAttachments = [];
    renderInquiryPanel();
  }
  function toggleNewInquiryCompose() {
    showingNewInquiry = !showingNewInquiry;
    inquiryAttachments = [];
    renderInquiryPanel();
  }
  function renderInquiryPanel() {
    const email = getCurrentCustomerEmail();
    const mine = getInquiries().filter(i => i.email === email);
    document.getElementById('inquiryFormWrap').innerHTML = `
      <div class="box" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:13px;font-weight:600;">Contact MySubbies</div>
          <button class="btn btn-outline" style="width:auto;padding:6px 12px;font-size:12px;" onclick="toggleNewInquiryCompose()">${showingNewInquiry ? 'Cancel' : '+ New inquiry'}</button>
        </div>
        <div id="newInquiryComposeWrap"></div>
        ${mine.length === 0 && !showingNewInquiry ? '<div style="font-size:12px;color:var(--stone);margin-top:8px;">No inquiries yet.</div>' : ''}
        ${mine.map(i => inquiryThreadHtml(i, 'customer')).join('')}
      </div>`;
    if (showingNewInquiry) renderNewInquiryCompose();
  }
  function renderNewInquiryCompose() {
    document.getElementById('newInquiryComposeWrap').innerHTML = `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--paper);">
        <textarea id="inquiryMessage" placeholder="What can we help with?" style="width:100%;font-size:13px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;min-height:80px;font-family:inherit;"></textarea>
        <input type="file" id="inquiryFileInput" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" multiple style="display:none;" onchange="onInquiryFileSelected(event)" />
        <button class="btn btn-outline" style="width:auto;padding:8px 14px;font-size:12px;margin-bottom:8px;" onclick="document.getElementById('inquiryFileInput').click()">📎 Attach documents</button>
        <div id="inquiryAttachmentList" style="margin-bottom:8px;"></div>
        <div id="inquiryError" style="color:var(--warn);font-size:12.5px;margin-bottom:8px;display:none;"></div>
        <button class="btn btn-black btn-full" onclick="submitInquiry()">Submit</button>
      </div>`;
  }
  // Shared by all three portals -- myRole is whichever side is viewing
  // ('customer' | 'contractor' | 'admin'), so the same thread renders with
  // the viewer's own messages on the right and everyone else's on the left.
  function inquiryThreadHtml(i, myRole) {
    const msgs = i.messages || [];
    return `
      <div style="border-top:1px solid var(--paper);padding-top:12px;margin-top:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:12px;color:var(--stone);">${new Date(i.createdAt).toLocaleDateString('en-AU')}</span>
          <span class="badge ${i.status === 'open' ? 'badge-feed' : 'badge-completed'}">${i.status}</span>
        </div>
        <div class="msglist" style="max-height:220px;">
          ${msgs.map(m => `
            <div class="msgbubble ${m.from === myRole ? 'mine' : 'theirs'}">
              <div class="msgmeta">${m.from === myRole ? 'You' : (m.from === 'admin' ? 'MySubbies' : escapeHtml(m.authorName || m.from))}</div>
              ${escapeHtml(m.text)}
              ${(m.attachments || []).map(a => `<div style="margin-top:4px;"><a href="${a.dataUrl}" download="${escapeHtml(a.name)}" style="text-decoration:underline;font-size:11px;color:inherit;">📄 ${escapeHtml(a.name)}</a></div>`).join('')}
            </div>`).join('')}
        </div>
        ${i.status === 'open' ? `
          <div class="msginput" style="margin-top:8px;">
            <input type="text" id="inquiryReply_${i.id}" placeholder="Reply…" onkeydown="if(event.key==='Enter') replyToInquiry('${i.id}', '${myRole}')" />
            <button class="btn btn-black" onclick="replyToInquiry('${i.id}', '${myRole}')">Send</button>
          </div>` : ''}
      </div>`;
  }
  function replyToInquiry(id, myRole) {
    const input = document.getElementById('inquiryReply_' + id);
    const text = input.value.trim();
    if (!text) return;
    const inquiries = getInquiries();
    const i = inquiries.find(x => x.id === id);
    if (!i) return;
    i.messages = i.messages || [];
    i.messages.push({ from: myRole, text, createdAt: new Date().toISOString() });
    saveInquiries(inquiries);
    renderInquiryPanel();
  }
  function onInquiryFileSelected(event) {
    const files = Array.from(event.target.files || []).slice(0, 5 - inquiryAttachments.length);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        inquiryAttachments.push({ name: file.name, dataUrl: reader.result });
        renderInquiryAttachmentList();
      };
      reader.readAsDataURL(file);
    });
  }
  function renderInquiryAttachmentList() {
    const wrap = document.getElementById('inquiryAttachmentList');
    if (!wrap) return;
    wrap.innerHTML = inquiryAttachments.map((a, idx) => `
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;">
        <span>📄 ${escapeHtml(a.name)}</span>
        <button onclick="removeInquiryAttachment(${idx})" style="background:none;border:none;color:var(--warn);cursor:pointer;font-size:12px;">Remove</button>
      </div>`).join('');
  }
  function removeInquiryAttachment(idx) {
    inquiryAttachments.splice(idx, 1);
    renderInquiryAttachmentList();
  }
  function submitInquiry() {
    const input = document.getElementById('inquiryMessage');
    const message = input.value.trim();
    const errBox = document.getElementById('inquiryError');
    if (!message) {
      errBox.textContent = 'Please describe what you need help with.';
      errBox.style.display = 'block';
      input.focus();
      return;
    }
    const email = getCurrentCustomerEmail();
    const customers = getCustomers();
    const name = (customers[email] && customers[email].name) || email;
    const inquiries = getInquiries();
    inquiries.unshift({
      id: 'inq_' + Date.now(), role: 'customer', name, email, status: 'open', createdAt: new Date().toISOString(),
      messages: [{ from: 'customer', text: message, attachments: inquiryAttachments, createdAt: new Date().toISOString() }],
    });
    saveInquiries(inquiries);
    showingNewInquiry = false;
    renderInquiryPanel();
  }

  // Job search (all 3 portals, Aug 2026) -- a plain-text filter over
  // category/suburb/id/task names, so a customer with several jobs can find
  // one without scrolling. render() rebuilds the list via innerHTML on
  // every keystroke, same as everywhere else in this codebase, which would
  // normally drop focus/cursor out from under the input -- restored
  // manually here instead.
  function onJobSearchInput(el) {
    const cursorPos = el.selectionStart;
    jobSearchQuery = el.value;
    render();
    const newEl = document.getElementById('jobSearchInput');
    if (newEl) { newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
  }
  function jobMatchesSearch(j, rawQuery) {
    const q = rawQuery.trim().toLowerCase();
    if (!q) return true;
    const haystack = [j.id, j.category, j.suburb, j.contractor, ...(j.items || []).map(i => i.taskName)]
      .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  }
  function jobSearchBoxHtml() {
    return `<input type="text" id="jobSearchInput" value="${escapeHtml(jobSearchQuery)}" oninput="onJobSearchInput(this)" placeholder="Search by suburb, category or job details…" style="width:100%;font-size:14px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:14px;font-family:inherit;" />`;
  }

  // Aggregates real payment data across every job that has a contractor
  // (only those ever get a milestone schedule) by calling the same
  // api/job-payment-schedule.js endpoint the per-job detail view already
  // uses, once per job. No new backend endpoint -- this is the one that
  // already returns the real, backend-calculated milestone amounts/status.
  async function renderPaymentHistory(email) {
    const jobs = getJobs().filter(j => j.customerEmail === email && j.contractor);
    app.innerHTML = `
      <button class="backbtn" onclick="closePaymentHistory()">← Back to my jobs</button>
      <h1 class="pagetitle">Payment history</h1>
      <p class="pagesub">Every payment made across your jobs.</p>
      <div id="paymentHistoryList"><div class="note">Loading…</div></div>
    `;
    const wrap = document.getElementById('paymentHistoryList');
    if (jobs.length === 0) { wrap.innerHTML = '<div class="empty">No payments yet.</div>'; return; }

    const results = await Promise.all(jobs.map(async j => {
      try {
        const res = await fetch('/api/job-payment-schedule?jobId=' + encodeURIComponent(j.id));
        const data = await res.json();
        return { job: j, milestones: (data && data.milestones) || [] };
      } catch (e) { return { job: j, milestones: [] }; }
    }));

    let grandTotalPaidCents = 0;
    let html = '';
    results.forEach(({ job, milestones }) => {
      if (!milestones.length) return;
      const paidCents = milestones.filter(m => m.status === 'paid').reduce((s, m) => s + m.amount_cents, 0);
      grandTotalPaidCents += paidCents;
      html += `
        <button class="jobcard" style="text-align:left;" onclick="selectedJobId='${job.id}'; showingPaymentHistory=false; render();">
          <div class="jobtitle">${escapeHtml(job.category)}</div>
          <div class="jobmeta" style="margin-bottom:8px;">📍 ${escapeHtml(job.suburb)}</div>
          ${milestones.map(m => `
            <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:${m.status === 'paid' ? 'var(--good)' : 'var(--stone)'};">
              <span>${m.status === 'paid' ? '✓' : '○'} ${escapeHtml(m.label)}</span>
              <span>$${(m.amount_cents / 100).toLocaleString()}${m.status === 'paid' ? '' : ' (pending)'}</span>
            </div>`).join('')}
        </button>`;
    });

    if (!html) { wrap.innerHTML = '<div class="empty">No payments yet.</div>'; return; }

    wrap.innerHTML = `
      <div class="box" style="margin-bottom:16px;background:var(--paper);">
        <div style="font-size:12px;color:var(--stone);">Total paid to date</div>
        <div style="font-size:22px;font-weight:800;">$${(grandTotalPaidCents / 100).toLocaleString()}</div>
      </div>
      ${html}
    `;
  }

  // Property Profile (Phase 1, added Aug 2026) -- a permanent, address-keyed
  // timeline of completed work, auto-built server-side by api/sync-jobs.js
  // on every job sync (see supabase/schema_v5_property_profiles.sql).
  // Completion = every paymentSchedule stage ticked in paidStages, same
  // definition used server-side -- jobs.status/'completed' is never
  // actually reached in this codebase, so it can't be used here either.
  //
  // Phase 2 (added Aug 2026) redesigns this to match the founder's approved
  // mockup -- hero, Property Health card, "Your Home" category grid, and
  // Upcoming Maintenance. Scoped to Plumbing/Electrical/Gardening & Lawn
  // Mowing/Fencing per the founder's explicit call. Maintenance reminders are
  // CUSTOMER-SET (mow frequency the customer picks), never a MySubbies-
  // invented interval -- only Gardening & Lawn Mowing has a real recurring
  // priced task on the rate card today (unit:'visit'); Plumbing/Electrical/
  // Fencing show real install history + Report a problem/Book again instead
  // of a fabricated "due" card. See CLAUDE.md and the plan file for the full
  // reasoning.
  const HOME_GRID_CATEGORIES = [
    { label: 'Plumbing', displayName: 'Plumbing', icon: '🔧', slug: 'plumbing' },
    { label: 'Electrical', displayName: 'Electrical', icon: '💡', slug: 'electrical' },
    { label: 'Gardening & Lawn Mowing', displayName: 'Garden', icon: '🌿', slug: 'gardening-lawn-mowing' },
    { label: 'Fencing', displayName: 'Fencing', icon: '🚧', slug: 'fencing' },
  ];
  let propertyCategoryFilter = null;
  let lastPropertyProfiles = [];

  function normalizeAddressLocal(addr) {
    return String(addr || '').trim().toLowerCase().replace(/\s+/g, ' ');
  }

  // Reads the real rate card straight from the same localStorage key
  // mysubbies-website.html seeds -- shared across pages, same pattern every
  // page in this app already relies on for jobs/customers. Never hardcodes a
  // price: if the rate card isn't in localStorage yet (e.g. a customer who's
  // never opened the estimator in this browser), pricing is simply omitted
  // rather than guessed.
  function getLocalRateCard() {
    try { return JSON.parse(localStorage.getItem('mysubbies_ratecard') || '[]'); } catch (e) { return []; }
  }
  function findTaskRate(categoryLabel, taskName) {
    const cat = getLocalRateCard().find(c => c.label === categoryLabel);
    if (!cat) return null;
    const task = (cat.tasks || []).find(t => t.name === taskName && !t.disabled && !t.unavailable);
    return task ? task.rate : null;
  }
  // Only real recurring "visit" mowing tasks, pulled live from the rate card
  // -- if the founder renames/adds/removes a mowing tier, this list follows
  // automatically instead of drifting out of sync with a hardcoded list.
  function getMowingTaskOptions() {
    const cat = getLocalRateCard().find(c => c.label === 'Gardening & Lawn Mowing');
    if (!cat) return [];
    return (cat.tasks || []).filter(t => t.unit === 'visit' && !t.disabled && !t.unavailable && /mowing/i.test(t.name));
  }

  function getUpcomingMaintenanceCards(p) {
    const cards = [];
    const mow = p.maintenancePreferences && p.maintenancePreferences['Gardening & Lawn Mowing'];
    if (mow) {
      const lastMow = p.history.filter(h => h.category === 'Gardening & Lawn Mowing')[0];
      const sinceDate = lastMow ? new Date(lastMow.completedAt) : new Date(mow.setAt);
      const dueDate = new Date(sinceDate.getTime() + mow.intervalWeeks * 7 * 24 * 60 * 60 * 1000);
      if (new Date() >= dueDate) {
        cards.push({
          title: 'Lawn mowing recommended',
          sub: (lastMow ? 'Last completed ' + new Date(lastMow.completedAt).toLocaleDateString('en-AU', { month: 'short', year: 'numeric' }) : 'Reminder set') + ' · Every ' + mow.intervalWeeks + ' weeks',
          price: findTaskRate('Gardening & Lawn Mowing', mow.taskName),
          taskName: mow.taskName, catLabel: 'Gardening & Lawn Mowing', suburb: p.suburb || '',
        });
      }
    }
    return cards;
  }

  // Health score (spec section 12): starts at 100, deducts only for real
  // signals (an unresolved dispute on a job at this property; an overdue
  // customer-set mowing reminder) -- never penalised for data simply not
  // existing yet.
  function computePropertyHealth(p, email) {
    let score = 100;
    const disputes = JSON.parse(localStorage.getItem('mysubbies_disputes') || '[]');
    const jobIdsAtProperty = new Set(getJobs().filter(j => j.customerEmail === email && normalizeAddressLocal(j.address) === normalizeAddressLocal(p.address)).map(j => j.id));
    const openDisputeCount = disputes.filter(d => d.status === 'open' && jobIdsAtProperty.has(d.jobId)).length;
    score -= Math.min(openDisputeCount * 15, 30);
    if (getUpcomingMaintenanceCards(p).length > 0) score -= 10;
    score = Math.max(0, Math.min(100, score));
    let label, color;
    if (score >= 90) { label = 'Excellent'; color = 'var(--good)'; }
    else if (score >= 75) { label = 'Good'; color = 'var(--good)'; }
    else if (score >= 60) { label = 'Needs Attention'; color = 'var(--warn)'; }
    else { label = 'Action Recommended'; color = 'var(--danger)'; }
    return { score, label, color };
  }

  function triggerFixSomething() {
    localStorage.setItem('mysubbies_open_fix_something', '1');
    window.location.href = 'mysubbies-website.html#categories';
  }

  // Reuses bookAgain()'s exact existing cross-page handoff mechanism (below)
  // instead of inventing new plumbing -- mysubbies-website.html's
  // initRebookIfRequested() already rebuilds a fully-priced cart from the
  // live rate card and jumps straight to step 2.
  function bookMaintenanceTask(catLabel, taskName, suburb) {
    localStorage.setItem('mysubbies_rebook_request', JSON.stringify({ items: [{ catLabel, taskName, qty: 1 }], suburb: suburb || '' }));
    window.location.href = 'mysubbies-website.html#estimate';
  }

  function uploadPropertyPhoto(propertyId, inputEl) {
    const file = inputEl.files && inputEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        await fetch('/api/property-profile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ propertyId, photoDataUrl: ev.target.result }) });
      } catch (e) { /* non-critical, photo just won't have saved this time */ }
      const email = getCurrentCustomerEmail();
      if (email) renderPropertyProfile(email);
    };
    reader.readAsDataURL(file);
  }

  async function saveMowingReminder(propertyId) {
    const taskSelect = document.getElementById('mowTaskSelect_' + propertyId);
    const intervalSelect = document.getElementById('mowIntervalSelect_' + propertyId);
    if (!taskSelect || !intervalSelect) return;
    const property = lastPropertyProfiles.find(p => p.propertyId === propertyId);
    const maintenancePreferences = Object.assign({}, property ? property.maintenancePreferences : {}, {
      'Gardening & Lawn Mowing': { taskName: taskSelect.value, intervalWeeks: parseInt(intervalSelect.value, 10), setAt: new Date().toISOString() },
    });
    try {
      await fetch('/api/property-profile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ propertyId, maintenancePreferences }) });
    } catch (e) { /* non-critical, reminder just won't have saved this time */ }
    const email = getCurrentCustomerEmail();
    if (email) renderPropertyProfile(email);
  }

  function setPropertyCategoryFilter(label) {
    propertyCategoryFilter = (propertyCategoryFilter === label) ? null : label;
    const wrap = document.getElementById('propertyProfileList');
    const email = getCurrentCustomerEmail();
    if (wrap && lastPropertyProfiles.length && email) {
      wrap.innerHTML = lastPropertyProfiles.map(p => renderOnePropertyProfile(p, email)).join('<div style="height:32px;"></div>');
    }
  }

  function renderHomeCatCard(c, p) {
    const entries = p.history.filter(h => h.category === c.label);
    let statusText, statusClass;
    if (entries.length === 0) { statusText = 'No jobs yet'; statusClass = 'status-neutral'; }
    else { statusText = 'Last job ' + new Date(entries[0].completedAt).toLocaleDateString('en-AU', { month: 'short', year: 'numeric' }); statusClass = 'status-good'; }
    const active = propertyCategoryFilter === c.label;
    return `
      <button class="home-cat-card${active ? ' active' : ''}" onclick="setPropertyCategoryFilter('${c.label.replace(/'/g, "\\'")}')">
        <div class="home-cat-icon cat-${c.slug}">${c.icon}</div>
        <div class="home-cat-name">${escapeHtml(c.displayName)}</div>
        <div class="home-cat-status ${statusClass}">${entries.length} item${entries.length === 1 ? '' : 's'} · ${statusText}</div>
      </button>`;
  }

  function renderUpcomingMaintenanceSection(p) {
    const cards = getUpcomingMaintenanceCards(p);
    const mow = p.maintenancePreferences && p.maintenancePreferences['Gardening & Lawn Mowing'];
    let inner = cards.map(c => `
      <div class="maint-card">
        <div class="maint-card-icon">🌿</div>
        <div><div class="maint-card-title">${escapeHtml(c.title)}</div><div class="maint-card-sub">${escapeHtml(c.sub)}</div></div>
        <div class="maint-card-price">
          ${c.price != null ? '$' + c.price.toLocaleString() : ''}<br>
          <button class="btn btn-black" style="width:auto;padding:7px 14px;font-size:11.5px;margin-top:6px;" onclick="bookMaintenanceTask('${c.catLabel.replace(/'/g, "\\'")}','${c.taskName.replace(/'/g, "\\'")}','${(c.suburb || '').replace(/'/g, "\\'")}')">Book now</button>
        </div>
      </div>`).join('');
    if (!mow) {
      const options = getMowingTaskOptions();
      if (options.length) {
        inner += `
          <div class="maint-setup-card">
            <div style="font-weight:700;font-size:13px;margin-bottom:4px;">Want a mowing reminder?</div>
            <div style="font-size:12px;color:var(--stone);margin-bottom:4px;">We'll remind you to book again based on how often you tell us to — nothing invented, just what you set.</div>
            <div>
              <select id="mowTaskSelect_${p.propertyId}">${options.map(o => `<option value="${escapeHtml(o.name)}">${escapeHtml(o.name.replace(/ — supply & install/i, ''))} — $${o.rate}</option>`).join('')}</select>
              every
              <select id="mowIntervalSelect_${p.propertyId}"><option value="2">2 weeks</option><option value="3" selected>3 weeks</option><option value="4">4 weeks</option></select>
            </div>
            <button class="btn btn-outline" style="width:auto;padding:7px 14px;font-size:11.5px;margin-top:8px;" onclick="saveMowingReminder('${p.propertyId}')">Save reminder</button>
          </div>`;
      }
    }
    if (!inner) return '';
    return `<div class="section-head">Upcoming Maintenance</div>${inner}`;
  }

  function renderPropertyHistoryList(p) {
    const entries = propertyCategoryFilter ? p.history.filter(h => h.category === propertyCategoryFilter) : p.history;
    if (entries.length === 0) return `<div class="empty">No completed jobs recorded${propertyCategoryFilter ? ' for ' + escapeHtml(propertyCategoryFilter) : ''} yet.</div>`;
    const seenContractors = new Set();
    return entries.map(h => {
      const repeatContractor = h.contractorEmail && seenContractors.has(h.contractorEmail);
      if (h.contractorEmail) seenContractors.add(h.contractorEmail);
      const dateStr = h.completedAt ? new Date(h.completedAt).toLocaleDateString('en-AU', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
      return `
        <button class="jobcard" style="text-align:left;" onclick="selectedJobId='${h.jobId}'; showingPropertyProfile=false; render();">
          <div class="jobtitle">${escapeHtml(h.category)}</div>
          ${h.taskSummary ? `<div class="jobmeta" style="margin-bottom:6px;">${escapeHtml(h.taskSummary)}</div>` : ''}
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--stone);">
            <span>${h.contractorName ? escapeHtml(h.contractorName) : 'Contractor'}${repeatContractor ? ' · <span style="color:var(--good);">worked here before</span>' : ''}${dateStr ? ' · ' + dateStr : ''}</span>
            ${h.amountPaidCents != null ? `<span style="font-weight:700;color:var(--ink);">$${(h.amountPaidCents / 100).toLocaleString()}</span>` : ''}
          </div>
        </button>`;
    }).join('');
  }

  function renderOnePropertyProfile(p, email) {
    const health = computePropertyHealth(p, email);
    const upcomingCount = getUpcomingMaintenanceCards(p).length;
    return `
      <div class="prop-hero" style="${p.photoDataUrl ? `background-image:url('${p.photoDataUrl}');background-size:cover;background-position:center;` : ''}">
        <button class="prop-hero-photo-btn" onclick="document.getElementById('propPhotoInput_${p.propertyId}').click()">📷 ${p.photoDataUrl ? 'Change photo' : 'Add photo'}</button>
        <input type="file" accept="image/*" id="propPhotoInput_${p.propertyId}" style="display:none;" onchange="uploadPropertyPhoto('${p.propertyId}', this)" />
        <div class="prop-hero-content">
          <div class="prop-hero-address">📍 ${escapeHtml(p.address)}</div>
          ${p.suburb ? `<div class="prop-hero-suburb">${escapeHtml(p.suburb)}</div>` : ''}
        </div>
      </div>
      <div class="prop-health-card">
        <div>
          <div class="prop-health-score" style="color:${health.color};">${health.score}%</div>
          <div class="prop-health-label" style="color:${health.color};">${health.label}</div>
        </div>
        <div class="prop-health-meta">
          ${p.history.length} job${p.history.length === 1 ? '' : 's'} recorded<br>
          ${upcomingCount} upcoming reminder${upcomingCount === 1 ? '' : 's'}
        </div>
      </div>
      <button class="prop-fix-cta" onclick="triggerFixSomething()">
        <div class="prop-fix-cta-icon">📷</div>
        <div><div class="prop-fix-cta-title">Something need fixing?</div><div class="prop-fix-cta-sub">Upload a photo and we'll tell you what's wrong and the price.</div></div>
        <div class="prop-fix-cta-arrow">→</div>
      </button>
      <div class="section-head">Your Home</div>
      <div class="home-grid">${HOME_GRID_CATEGORIES.map(c => renderHomeCatCard(c, p)).join('')}</div>
      ${renderUpcomingMaintenanceSection(p)}
      <div class="section-head">History${propertyCategoryFilter ? ' · ' + escapeHtml(propertyCategoryFilter) + ' <a onclick="setPropertyCategoryFilter(null)" style="text-decoration:underline;font-weight:400;text-transform:none;letter-spacing:0;cursor:pointer;">(clear)</a>' : ''}</div>
      ${renderPropertyHistoryList(p)}
      <div class="prop-health-disclaimer">Property Health is based on your MySubbies service and maintenance records and is not a building inspection.</div>`;
  }

  async function renderPropertyProfile(email) {
    app.innerHTML = `
      <button class="backbtn" onclick="closePropertyProfile()">← Back to my jobs</button>
      <div id="propertyProfileList"><div class="empty">Loading…</div></div>
    `;
    const wrap = document.getElementById('propertyProfileList');

    let properties = [];
    try {
      const res = await fetch('/api/property-profile?customerEmail=' + encodeURIComponent(email));
      const data = await res.json();
      properties = (data && data.properties) || [];
    } catch (e) { /* fall through to empty state below */ }

    lastPropertyProfiles = properties;

    if (properties.length === 0) {
      wrap.innerHTML = `<h1 class="pagetitle" style="margin-bottom:10px;">My Property</h1><div class="empty">No property history yet. This builds up automatically each time a job is completed and paid at your address.</div>`;
      return;
    }

    wrap.innerHTML = properties.map(p => renderOnePropertyProfile(p, email)).join('<div style="height:32px;"></div>');
  }

  // Job list table (Aug 2026) -- same markup, classes, badge colours and
  // status labels as jobsTableHtml() in mysubbies-admin-portal.html, so the
  // job list reads identically across all three portals. Only real
  // difference is the columns shown: customers see their own price, not a
  // contractor payout split.
  const JOB_BADGE_CLASS = { feed: 'badge-feed', assigned: 'badge-assigned', completed: 'badge-completed', cancellation_requested: 'badge-rejected', cancelled: 'badge-rejected' };
  const JOB_BADGE_LABEL = { feed: 'Awaiting contractor', assigned: 'Assigned', completed: 'Completed', cancellation_requested: 'Cancellation requested', cancelled: 'Cancelled' };
  function customerJobsTableHtml(jobs) {
    return `
      <table class="jobstable">
        <thead><tr><th>Job</th><th>Suburb</th><th>Contractor</th><th>Status</th><th>Value</th></tr></thead>
        <tbody>
          ${jobs.map(j => `
            <tr class="jobrow" onclick="selectedJobId='${j.id}'; render();">
              <td><strong>${escapeHtml(j.category)}</strong>${j.items && j.items.length > 1 ? `<br><span style="color:var(--stone);font-size:12px;">${j.items.length} items</span>` : ''}</td>
              <td>${escapeHtml(j.suburb)}</td>
              <td>${j.contractor ? escapeHtml(j.contractor) : '—'}</td>
              <td><span class="badge ${JOB_BADGE_CLASS[j.status] || 'badge-feed'}">${JOB_BADGE_LABEL[j.status] || j.status}</span></td>
              <td>$${(j.priceLow || j.basePrice || 0).toLocaleString()}</td>
            </tr>
          `).join('')}

  // Status filter chips (Aug 2026, same pattern as the admin portal's All
  // Jobs) -- replaces the single mixed list + separate cancelled-archive
  // toggle with chips per status, so a customer with several jobs can
  // focus on one bucket instead of scrolling past everything.
  const JOB_STATUS_FILTERS = [
    { key: 'all', label: 'All' },
    { key: 'feed', label: 'Awaiting contractor' },
    { key: 'assigned', label: 'Assigned' },
    { key: 'cancellation_requested', label: 'Cancellation requested' },
    { key: 'completed', label: 'Completed' },
    { key: 'cancelled', label: 'Cancelled' },
  ];
  let jobStatusFilter = 'all';
  function jobStatusFilterChipsHtml(jobs) {
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${JOB_STATUS_FILTERS.map(f => {
        const count = f.key === 'all' ? jobs.length : jobs.filter(j => j.status === f.key).length;
        const active = jobStatusFilter === f.key;
        return `<button onclick="jobStatusFilter='${f.key}'; render();" style="padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid ${active ? 'var(--ink)' : 'var(--line)'};background:${active ? 'var(--ink)' : '#fff'};color:${active ? '#fff' : 'var(--ink)'};cursor:pointer;">${f.label} (${count})</button>`;
      }).join('')}
    </div>`;

  // "Book again" on a completed job -- hands the job's real items (category,
  // task name, quantity) to the estimator via a one-time localStorage key,
  // the same handoff pattern continueToEstimatorFromFs already uses for the
  // AI-classified path. Prices are NOT copied from the old job -- the
  // estimator re-prices every item against the CURRENT rate card (rates may
  // have moved since), matching the site-wide "estimated, not fixed" rule.
  function bookAgain(jobId) {
    const j = getJobs().find(x => x.id === jobId);
    if (!j || !j.items || !j.items.length) return;
    localStorage.setItem('mysubbies_rebook_request', JSON.stringify({
      items: j.items.map(i => ({ catLabel: i.catLabel, taskName: i.taskName, qty: i.qty })),
      suburb: j.suburb || '',
    }));
    window.location.href = 'mysubbies-website.html#estimate';
  }

  function render() {
    const email = getCurrentCustomerEmail();
    if (!email) { renderLogin(); return; }
    if (selectedJobId) { renderDetail(email); return; }
    if (showingPaymentHistory) { renderPaymentHistory(email); return; }
    if (showingPropertyProfile) { renderPropertyProfile(email); return; }

    const allJobs = getJobs().filter(j => j.customerEmail === email);
    const customers = getCustomers();
    const name = customers[email] ? customers[email].name : email;
    const myAccount = customers[email] || {};
    const referredCount = Object.values(customers).filter(c => c.referredBy === myAccount.referralCode).length;

    app.innerHTML = `
      <div class="whoami">Logged in as <strong>${name}</strong> <a onclick="logout()">Log out</a> · <a onclick="openInquiryForm()">Contact MySubbies</a></div>
      <div id="inquiryFormWrap"></div>
      ${notifyBannerHtml()}
      <div class="box" style="margin-bottom:16px;">
        <div style="font-size:13px;font-weight:600;margin-bottom:4px;">Refer a friend</div>
        <div style="font-size:12px;color:var(--stone);margin-bottom:8px;">Share your code — ${referredCount} friend${referredCount===1?'':'s'} referred so far.</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <code style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;flex:1;">${myAccount.referralCode || '—'}</code>
          <button class="btn btn-outline" style="width:auto;padding:8px 14px;font-size:12px;" onclick="copyReferralCode('${myAccount.referralCode || ''}')">Copy</button>
        </div>
      </div>
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <div>
