<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MySubbies tax invoice</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#151a26;font-family:'Plus Jakarta Sans',sans-serif}
.nav{height:64px;background:#fff;border-bottom:1px solid #e7e7e4;display:flex;align-items:center;padding:0 max(20px,calc((100% - 920px)/2));font-weight:800;font-size:19px;color:#14213d}.nav b{color:#ff6a1a}
.wrap{max-width:920px;margin:32px auto;padding:0 20px 60px}.sheet{background:#fff;border:1px solid #e7e7e4;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #14213d12}
.head{background:#14213d;color:#fff;padding:30px;display:flex;justify-content:space-between;gap:18px}.head h1{margin:0 0 6px;font-size:27px}.head p{margin:0;color:#cbd2df;font-size:13px}.amount{text-align:right}.amount strong{font-size:30px}
.body{padding:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8a93a3;font-weight:800;margin-bottom:6px}.value{font-size:13.5px;line-height:1.65}
.card{margin-top:22px;padding:18px;border:1px solid #e7e7e4;border-radius:12px}.card h3{margin:0 0 12px;font-size:15px;color:#14213d}.row{display:flex;justify-content:space-between;gap:18px;padding:7px 0;font-size:13px}.row.total{border-top:1px solid #e7e7e4;margin-top:5px;padding-top:13px;font-weight:800;font-size:16px}
.quote-table{width:100%;border-collapse:collapse;font-size:12.5px}.quote-table th{text-align:left;padding:9px 7px;border-bottom:2px solid #14213d;color:#14213d;font-size:10px;text-transform:uppercase;letter-spacing:.05em}.quote-table td{padding:10px 7px;border-bottom:1px solid #ececea;vertical-align:top}.quote-table .num{text-align:right;white-space:nowrap}
.note{background:#f7f7f5}.bank{background:#fff8ed;border-color:#f3c671}.pay-card{background:#f2f6ff;border-color:#cbd8f5}.pay-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.btn{border:0;border-radius:10px;background:#ff6a1a;color:#151a26;padding:13px 18px;font-weight:800;cursor:pointer;font-family:inherit}.btn.secondary{background:#fff;border:1px solid #d9d9d5}.btn:disabled{opacity:.6;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.section-text{font-size:12.5px;line-height:1.65;white-space:pre-wrap}.muted{color:#6b7280;font-size:12px;line-height:1.55}.error{text-align:center;padding:60px 20px}.success{margin:0 0 18px;padding:13px 16px;background:#eaf5ee;border:1px solid #b9ddc6;border-radius:10px;font-size:13px}.cancelled{margin:0 0 18px;padding:13px 16px;background:#fff8ed;border:1px solid #f3c671;border-radius:10px;font-size:13px}.terms-link{color:#14213d;font-weight:700}
@media(max-width:650px){.head{display:block}.amount{text-align:left;margin-top:18px}.grid,.pay-grid{grid-template-columns:1fr}.body{padding:20px}.quote-table th:nth-child(2),.quote-table td:nth-child(2),.quote-table th:nth-child(3),.quote-table td:nth-child(3){display:none}}
</style>
</head>
<body>
<div class="nav">My<b>Subbies</b></div>
<main class="wrap" id="app"><div class="error">Loading secure invoice…</div></main>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>'$'+((Number(c)||0)/100).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const date=v=>v?new Date(v).toLocaleDateString('en-AU'):'—';
const nl=s=>esc(s||'').replace(/\n/g,'<br>');
let payload;
let invoiceToken;

async function load(){
  const params=new URLSearchParams(location.search);
  invoiceToken=params.get('token');
  if(!invoiceToken){fail('This invoice link is incomplete.');return}
  try{
    const r=await fetch('/api/quotes?invoiceToken='+encodeURIComponent(invoiceToken),{cache:'no-store'});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Invoice unavailable');
    payload=d;render();
  }catch(e){fail(e.message)}
}
function fail(m){document.getElementById('app').innerHTML='<div class="sheet error"><h1>Invoice unavailable</h1><p>'+esc(m)+'</p></div>'}
function quoteRows(q){
  const items=(q&&q.lineItems)||[];
  if(!items.length)return '<p class="muted">No itemised quote lines were stored for this accepted quote.</p>';
  return '<table class="quote-table"><thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th class="num">Quote amount</th></tr></thead><tbody>'+
    items.map(item=>'<tr><td>'+esc(item.description||'Quoted item')+'</td><td>'+esc(item.qty==null?'':item.qty)+'</td><td>'+esc(item.unit||'')+'</td><td class="num">'+money(item.lineTotalCents)+'</td></tr>').join('')+
    '</tbody></table><div class="row"><span>Accepted quote total (inc. GST)</span><strong>'+money(q.totalIncGstCents)+'</strong></div>';
}
function textCard(title,text){
  if(!text)return '';
  return '<div class="card note"><h3>'+esc(title)+'</h3><div class="section-text">'+nl(text)+'</div></div>';
}
function render(){
  const i=payload.invoice,e=payload.issuingEntity||{},c=i.customer||{},p=i.property||{},q=payload.quoteDetails||{},paid=i.paidCents||0,balance=i.balanceCents==null?i.totalIncGstCents:i.balanceCents;
  const params=new URLSearchParams(location.search);
  const paymentState=params.get('payment');
  const paymentNotice=paymentState==='success'?'<div class="success"><strong>Card payment submitted.</strong> Stripe will confirm the payment securely. The balance will update automatically once confirmation is received.</div>':paymentState==='cancelled'?'<div class="cancelled">Card payment was cancelled. No change has been made to the invoice.</div>':'';
  const terms=q.termsText?'<div class="card note"><h3>Terms &amp; conditions</h3><div class="section-text">'+nl(q.termsText)+'</div>'+(q.termsUrl?'<p class="muted" style="margin-bottom:0">Full MySubbies Platform Terms: <a class="terms-link" href="'+esc(q.termsUrl)+'" target="_blank" rel="noopener">View terms</a></p>':'')+'</div>':'';
  document.getElementById('app').innerHTML=
  '<section class="sheet"><div class="head"><div><h1>TAX INVOICE</h1><p>INV-'+esc(i.invoiceNumber)+' · Quote #'+esc(payload.quoteNumber)+' · '+esc(String(i.status||'issued').replace('_',' '))+'</p></div><div class="amount"><span class="muted" style="color:#cbd2df">'+(balance>0?'AMOUNT DUE':'PAID IN FULL')+'</span><br><strong>'+money(balance)+'</strong><br><span class="muted" style="color:#cbd2df">Due '+date(i.dueAt)+'</span></div></div>'+
  '<div class="body">'+paymentNotice+
  '<div class="grid"><div><div class="label">Issued by</div><div class="value"><strong>'+esc(e.legalName)+'</strong><br>ABN '+esc(e.abn)+'<br>'+esc([e.addressLine,e.suburb,e.state,e.postcode].filter(Boolean).join(', '))+'<br>'+esc(e.email||'')+'</div></div><div><div class="label">Bill to</div><div class="value"><strong>'+esc(c.name||c.email)+'</strong><br>'+esc(c.email||'')+'<br>'+esc(c.billingAddress||'')+'<br>'+esc([p.address,p.suburb].filter(Boolean).join(', '))+'</div></div></div>'+
  '<div class="card"><h3>Accepted quote details</h3>'+quoteRows(q)+'<p class="muted" style="margin-bottom:0">These are the items from accepted Quote #'+esc(payload.quoteNumber)+'. They are shown for reference and are not an additional amount payable on this invoice.</p></div>'+
  '<div class="card"><h3>This invoice</h3><div class="row"><span>'+esc(i.description)+'</span><strong>'+money(i.totalIncGstCents)+'</strong></div><div class="row"><span>Subtotal (ex. GST)</span><span>'+money(i.subtotalExGstCents)+'</span></div><div class="row"><span>GST</span><span>'+money(i.gstCents)+'</span></div><div class="row total"><span>Invoice total (inc. GST)</span><span>'+money(i.totalIncGstCents)+'</span></div><div class="row"><span>Payments received</span><strong>'+money(paid)+'</strong></div><div class="row total"><span>Balance remaining</span><span>'+money(balance)+'</span></div></div>'+
  textCard('Scope of works',q.scopeText)+textCard('Inclusions',q.inclusionsText)+textCard('Exclusions',q.exclusionsText)+textCard('Payment terms',q.paymentTermsText)+terms+
  (balance>0?'<div class="pay-grid"><div class="card pay-card"><div class="label">Pay securely by card</div><div class="value"><strong>Credit or debit card</strong><br>Pay the outstanding balance of <strong>'+money(balance)+'</strong> securely through Stripe.</div><div class="actions"><button class="btn" id="payCardBtn" onclick="payByCard()">Pay '+money(balance)+' by card</button></div></div><div class="card bank"><div class="label">Payment by bank transfer</div><div class="value"><strong>'+esc(i.bankAccountName)+'</strong><br>BSB: '+esc(i.bankBsb)+'<br>Account: '+esc(i.bankAccountNumber)+'<br>Reference: INV-'+esc(i.invoiceNumber)+'<br><br><strong>Due: '+date(i.dueAt)+'</strong></div></div></div>':'<div class="card" style="background:#eaf5ee;border-color:#b9ddc6"><strong>✓ Paid in full</strong>'+(i.paidAt?' on '+date(i.paidAt):'')+'</div>')+
  ((i.payments||[]).length?'<div class="card"><h3>Payment history</h3>'+(i.payments||[]).map(payment=>'<div class="row"><span>'+date(payment.receivedAt)+' · '+esc(paymentMethod(payment.method))+(payment.reference?' · '+esc(payment.reference):'')+'</span><span><strong>'+money(payment.amountCents)+'</strong> <button class="btn secondary" style="padding:6px 9px;margin-left:7px" onclick="downloadReceipt(\''+payment.id+'\')">Receipt</button></span></div>').join('')+'</div>':'')+
  '<div class="actions"><button class="btn secondary" onclick="downloadPdf()">Download invoice PDF</button></div><p class="muted">'+(balance>0?'Use INV-'+esc(i.invoiceNumber)+' as your bank-transfer payment reference. ':'')+'Keep this tax invoice and any payment receipts for your records.</p></div></section>';
}
async function payByCard(){
  const btn=document.getElementById('payCardBtn');
  if(btn){btn.disabled=true;btn.textContent='Opening secure payment…'}
  try{
    const r=await fetch('/api/quotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create_invoice_card_checkout',invoiceToken})});
    const d=await r.json();
    if(!r.ok||!d.url)throw new Error(d.error||'Could not start card payment.');
    location.href=d.url;
  }catch(e){if(btn){btn.disabled=false;btn.textContent='Try card payment again'}alert(e.message)}
}
function paymentMethod(method){return({bank_transfer:'Bank transfer',card:'Card',cash:'Cash',finance:'Finance provider',other:'Other'})[method]||method}
function downloadReceipt(paymentId){
  const {jsPDF}=window.jspdf,i=payload.invoice,p=(i.payments||[]).find(item=>item.id===paymentId);if(!p)return;
  const doc=new jsPDF();doc.setFillColor(20,33,61);doc.rect(0,0,210,38,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(23);doc.text('PAYMENT RECEIPT',14,18);doc.setFontSize(10);doc.text('INV-'+i.invoiceNumber+'  |  Quote #'+payload.quoteNumber,14,28);doc.setTextColor(20);doc.setFontSize(11);doc.text('Received by: '+((payload.issuingEntity||{}).legalName||'Mysubbies Holdings Pty Ltd'),14,54);doc.text('Received from: '+((i.customer||{}).name||(i.customer||{}).email||''),14,63);doc.text(['Amount received: '+money(p.amountCents),'Date received: '+date(p.receivedAt),'Payment method: '+paymentMethod(p.method),'Reference: '+(p.reference||'—')],14,82);doc.save('mysubbies-payment-receipt-INV-'+i.invoiceNumber+'.pdf')
}
function downloadPdf(){
  const {jsPDF}=window.jspdf,i=payload.invoice,e=payload.issuingEntity||{},c=i.customer||{},q=payload.quoteDetails||{},doc=new jsPDF();
  let y=0;
  const ensure=(need)=>{if(y+need>282){doc.addPage();y=18}};
  const textBlock=(title,text)=>{if(!text)return;ensure(24);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(title,14,y);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(9);const lines=doc.splitTextToSize(String(text),182);for(const line of lines){ensure(5);doc.text(line,14,y);y+=4.3}y+=4};
  doc.setFillColor(20,33,61);doc.rect(0,0,210,38,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(23);doc.text('TAX INVOICE',14,18);doc.setFontSize(10);doc.text('INV-'+i.invoiceNumber+'  |  Quote #'+payload.quoteNumber,14,28);
  doc.setTextColor(20);doc.setFontSize(10);doc.text(e.legalName||'',14,50);doc.setFont('helvetica','normal');doc.text('ABN '+(e.abn||''),14,56);const entityAddress=[e.addressLine,e.suburb,e.state,e.postcode].filter(Boolean).join(', ');if(entityAddress)doc.text(entityAddress,14,62);
  doc.text('Bill to: '+(c.name||c.email||''),115,50);doc.text(c.email||'',115,56);const customerAddress=c.billingAddress||[i.property&&i.property.address,i.property&&i.property.suburb].filter(Boolean).join(', ');if(customerAddress)doc.text(customerAddress,115,62,{maxWidth:80});
  y=76;doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('ACCEPTED QUOTE DETAILS',14,y);y+=7;doc.setFontSize(8.5);
  (q.lineItems||[]).forEach(item=>{const desc=doc.splitTextToSize(String(item.description||'Quoted item'),125);const h=Math.max(6,desc.length*4.2);ensure(h+2);doc.setFont('helvetica','normal');doc.text(desc,14,y);doc.text(String(item.qty==null?'':item.qty)+' '+String(item.unit||''),145,y);doc.text(money(item.lineTotalCents),196,y,{align:'right'});y+=h;doc.setDrawColor(235);doc.line(14,y,196,y);y+=3});
  ensure(15);doc.setFont('helvetica','bold');doc.text('Accepted quote total',120,y);doc.text(money(q.totalIncGstCents),196,y,{align:'right'});y+=10;
  ensure(42);doc.setDrawColor(220);doc.rect(14,y,182,39);doc.setFontSize(10);doc.text('THIS INVOICE',20,y+9);doc.setFont('helvetica','normal');doc.text(String(i.description||''),20,y+17,{maxWidth:118});doc.text(money(i.totalIncGstCents),190,y+17,{align:'right'});doc.text('Subtotal (ex. GST)',120,y+25);doc.text(money(i.subtotalExGstCents),190,y+25,{align:'right'});doc.text('GST',120,y+31);doc.text(money(i.gstCents),190,y+31,{align:'right'});doc.setFont('helvetica','bold');doc.text('Balance due',120,y+37);doc.text(money(i.balanceCents),190,y+37,{align:'right'});y+=48;
  textBlock('SCOPE OF WORKS',q.scopeText);textBlock('INCLUSIONS',q.inclusionsText);textBlock('EXCLUSIONS',q.exclusionsText);textBlock('PAYMENT TERMS',q.paymentTermsText);textBlock('TERMS & CONDITIONS',q.termsText);
  ensure(38);doc.setFillColor(255,248,237);doc.rect(14,y,182,35,'F');doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('PAYMENT OPTIONS',20,y+9);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(['Card: use the secure invoice link to pay by credit/debit card via Stripe.','Bank: '+i.bankAccountName+' | BSB '+i.bankBsb+' | Account '+i.bankAccountNumber,'Reference: INV-'+i.invoiceNumber+' | Due: '+date(i.dueAt)],20,y+17);doc.save('mysubbies-tax-invoice-INV-'+i.invoiceNumber+'.pdf')
}
load();
</script>
</body>
</html>
