<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MySubbies tax invoice</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#151a26;font-family:'Plus Jakarta Sans',sans-serif}.nav{height:64px;background:#fff;border-bottom:1px solid #e7e7e4;display:flex;align-items:center;padding:0 max(20px,calc((100% - 820px)/2));font-weight:800;font-size:19px;color:#14213d}.nav b{color:#ff6a1a}.wrap{max-width:820px;margin:32px auto;padding:0 20px 60px}.sheet{background:#fff;border:1px solid #e7e7e4;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #14213d12}.head{background:#14213d;color:#fff;padding:28px;display:flex;justify-content:space-between;gap:18px}.head h1{margin:0 0 4px;font-size:27px}.head p{margin:0;color:#cbd2df;font-size:13px}.amount{text-align:right}.amount strong{font-size:28px}.body{padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;font-weight:800;margin-bottom:5px}.value{font-size:13.5px;line-height:1.6}.card{margin-top:22px;padding:18px;border:1px solid #e7e7e4;border-radius:12px}.row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}.row.total{border-top:1px solid #e7e7e4;margin-top:5px;padding-top:13px;font-weight:800;font-size:16px}.bank{background:#fff8ed;border-color:#f3c671}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:10px;background:#ff6a1a;padding:12px 18px;font-weight:800;cursor:pointer}.muted{color:#6b7280;font-size:12px}.error{text-align:center;padding:60px 20px}@media(max-width:560px){.head{display:block}.amount{text-align:left;margin-top:18px}.grid{grid-template-columns:1fr}.body{padding:20px}}</style></head>
<body><div class="nav">My<b>Subbies</b></div><main class="wrap" id="app"><div class="error">Loading secure invoice…</div></main>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>'$'+((c||0)/100).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2}); const date=v=>v?new Date(v).toLocaleDateString('en-AU'):'—'; let payload;
async function load(){const token=new URLSearchParams(location.search).get('token');if(!token){fail('This invoice link is incomplete.');return}try{const r=await fetch('/api/quotes?invoiceToken='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Invoice unavailable');payload=d;render()}catch(e){fail(e.message)}}
function fail(m){document.getElementById('app').innerHTML='<div class="sheet error"><h1>Invoice unavailable</h1><p>'+esc(m)+'</p></div>'}
function render(){const i=payload.invoice,e=payload.issuingEntity||{},c=i.customer||{},p=i.property||{},paid=i.paidCents||0,balance=i.balanceCents==null?i.totalIncGstCents:i.balanceCents;document.getElementById('app').innerHTML=`<section class="sheet"><div class="head"><div><h1>TAX INVOICE</h1><p>INV-${esc(i.invoiceNumber)} · Quote #${esc(payload.quoteNumber)} · ${esc(String(i.status||'issued').replace('_',' '))}</p></div><div class="amount"><span class="muted" style="color:#cbd2df">${balance>0?'AMOUNT DUE':'PAID IN FULL'}</span><br><strong>${money(balance)}</strong></div></div><div class="body"><div class="grid"><div><div class="label">Issued by</div><div class="value"><strong>${esc(e.legalName)}</strong><br>ABN ${esc(e.abn)}<br>${esc([e.addressLine,e.suburb,e.state,e.postcode].filter(Boolean).join(', '))}<br>${esc(e.email||'')}</div></div><div><div class="label">Bill to</div><div class="value"><strong>${esc(c.name||c.email)}</strong><br>${esc(c.email||'')}<br>${esc(c.billingAddress||'')}<br>${esc([p.address,p.suburb].filter(Boolean).join(', '))}</div></div></div><div class="card"><div class="row"><span>${esc(i.description)}</span><strong>${money(i.totalIncGstCents)}</strong></div><div class="row"><span>Subtotal (ex. GST)</span><span>${money(i.subtotalExGstCents)}</span></div><div class="row"><span>GST</span><span>${money(i.gstCents)}</span></div><div class="row total"><span>Total (inc. GST)</span><span>${money(i.totalIncGstCents)}</span></div><div class="row"><span>Payments received</span><strong>${money(paid)}</strong></div><div class="row total"><span>Balance remaining</span><span>${money(balance)}</span></div></div>${balance>0?`<div class="card bank"><div class="label">Payment by bank transfer</div><div class="value"><strong>${esc(i.bankAccountName)}</strong><br>BSB: ${esc(i.bankBsb)}<br>Account: ${esc(i.bankAccountNumber)}<br>Reference: INV-${esc(i.invoiceNumber)}<br><br><strong>Due: ${date(i.dueAt)}</strong></div></div>`:`<div class="card" style="background:#eaf5ee;border-color:#b9ddc6"><strong>✓ Paid in full</strong>${i.paidAt?` on ${date(i.paidAt)}`:''}</div>`}${(i.payments||[]).length?`<div class="card"><div class="label">Payment history</div>${i.payments.map(payment=>`<div class="row"><span>${date(payment.receivedAt)} · ${esc(paymentMethod(payment.method))}${payment.reference?` · ${esc(payment.reference)}`:''}</span><span><strong>${money(payment.amountCents)}</strong> <button class="btn" style="padding:6px 9px;margin-left:7px" onclick="downloadReceipt('${payment.id}')">Receipt</button></span></div>`).join('')}</div>`:''}<div class="actions"><button class="btn" onclick="downloadPdf()">Download invoice PDF</button></div><p class="muted">${balance>0?'Please use the invoice number as your payment reference. ':''}Keep this tax invoice and any payment receipts for your records.</p></div></section>`}
function paymentMethod(method){return({bank_transfer:'Bank transfer',card:'Card',cash:'Cash',finance:'Finance provider',other:'Other'})[method]||method}
function downloadReceipt(paymentId){const {jsPDF}=window.jspdf,i=payload.invoice,p=(i.payments||[]).find(item=>item.id===paymentId);if(!p)return;const doc=new jsPDF();doc.setFillColor(20,33,61);doc.rect(0,0,210,38,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(23);doc.text('PAYMENT RECEIPT',14,18);doc.setFontSize(10);doc.text('INV-'+i.invoiceNumber+'  |  Quote #'+payload.quoteNumber,14,28);doc.setTextColor(20);doc.setFontSize(11);doc.text('Received by: '+((payload.issuingEntity||{}).legalName||'Mysubbies Holdings Pty Ltd'),14,54);doc.text('Received from: '+((i.customer||{}).name||(i.customer||{}).email||''),14,63);doc.autoTable?doc.autoTable({startY:76,head:[['Payment details','Value']],body:[['Amount received',money(p.amountCents)],['Date received',date(p.receivedAt)],['Payment method',paymentMethod(p.method)],['Reference',p.reference||'—']],theme:'grid',headStyles:{fillColor:[20,33,61]}}):doc.text(['Amount received: '+money(p.amountCents),'Date received: '+date(p.receivedAt),'Payment method: '+paymentMethod(p.method),'Reference: '+(p.reference||'—')],14,82);doc.save('mysubbies-payment-receipt-INV-'+i.invoiceNumber+'.pdf')}
function downloadPdf(){const {jsPDF}=window.jspdf,i=payload.invoice,e=payload.issuingEntity||{},c=i.customer||{},doc=new jsPDF();doc.setFillColor(20,33,61);doc.rect(0,0,210,38,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(23);doc.text('TAX INVOICE',14,18);doc.setFontSize(10);doc.text('INV-'+i.invoiceNumber+'  |  Quote #'+payload.quoteNumber,14,28);doc.setTextColor(20);doc.setFontSize(10);doc.text(e.legalName||'',14,51);doc.setFont('helvetica','normal');doc.text('ABN '+(e.abn||''),14,57);doc.text('Bill to: '+(c.name||c.email||''),115,51);doc.text(c.email||'',115,57);doc.setDrawColor(225);doc.rect(14,72,182,44);doc.setFont('helvetica','bold');doc.text(i.description||'',20,84,{maxWidth:125});doc.text(money(i.totalIncGstCents),190,84,{align:'right'});doc.setFont('helvetica','normal');doc.text('Subtotal (ex. GST)',120,97);doc.text(money(i.subtotalExGstCents),190,97,{align:'right'});doc.text('GST',120,104);doc.text(money(i.gstCents),190,104,{align:'right'});doc.setFont('helvetica','bold');doc.text('Total (inc. GST)',120,111);doc.text(money(i.totalIncGstCents),190,111,{align:'right'});doc.setFillColor(255,248,237);doc.rect(14,126,182,47,'F');doc.text('PAYMENT BY BANK TRANSFER',20,138);doc.setFont('helvetica','normal');doc.text(['Account: '+i.bankAccountName,'BSB: '+i.bankBsb,'Account number: '+i.bankAccountNumber,'Reference: INV-'+i.invoiceNumber,'Due: '+date(i.dueAt)],20,147);doc.save('mysubbies-tax-invoice-INV-'+i.invoiceNumber+'.pdf')}
load();
</script></body></html>
